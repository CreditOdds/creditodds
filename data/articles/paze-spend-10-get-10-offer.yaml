content: |
  Every so often a payments company decides the fastest way to get people using its product is to just hand out money. That is exactly what Paze, the online checkout wallet from Early Warning Services (the bank-owned company behind Zelle), is doing right now: **spend $10 or more through Paze checkout at a participating merchant and get a $10 statement credit, up to 10 times per card**. That is up to **$100 back per eligible card**, and the cap is per card, not per person. The offer runs **June 15 through September 10, 2026**.

  If you have never touched Paze before, this is the promotion that makes it worth five minutes of setup. Here is what we confirmed about how it works, where you can use it, and the fine print that matters.

  ## The offer in one paragraph

  Through **September 10, 2026**, each time you make a **single purchase of $10 or more** using Paze checkout at a participating online merchant with an eligible card, you get a **$10 statement credit** on that card. Each card in your Paze wallet can earn the credit **up to 10 times**, for a maximum of **$100 per card**. No activation or enrollment is required; the credit posts automatically to a future billing statement. And because the limit is per card, someone with, say, three eligible cards across participating banks could earn up to $300 in total credits.

  A $10 credit on a $10 purchase is a 100% rebate. There is no rewards-card math on earth that beats that, so while the offer is live, routing small purchases through Paze beats whatever your best cash-back card would have earned on them.

  ## Wait, what is Paze?

  Paze is a **bank-provided online checkout button**, similar in spirit to PayPal or Shop Pay, but run by a consortium of major U.S. banks. Instead of typing your card number into a merchant's site, you pick Paze at checkout, verify your identity, and pay with a card from your bank — the merchant never sees your real card number.

  Three things make it different from other wallets:

  - **There is no app to download and no account to create.** Your eligible cards are preloaded by your bank; you claim the wallet with the email address on file with your bank.
  - **It is online-only.** Paze is for e-commerce checkout. You cannot tap it in a store, and you cannot add it to Apple Pay or Google Pay — it is its own checkout option on merchant websites.
  - **It is not peer-to-peer.** Despite the Zelle lineage, you cannot send money to people with it.

  ## Which cards work: the participating banks

  Paze works with **credit and debit cards issued by participating banks and credit unions**. The institutions currently offering Paze include:

  - **Bank of America**
  - **Capital One**
  - **Chase**
  - **Citi**
  - **Elan Financial Services** (the issuer behind many credit-union and small-bank cards)
  - **PNC**
  - **Star One Credit Union**
  - **Truist**
  - **U.S. Bank**
  - **Wells Fargo**

  Notably absent: **American Express and Discover are not part of Paze**, since they are not owners of Early Warning Services. If your wallet is all Amex, this promotion is not for you — but if you hold even one no-annual-fee Visa or Mastercard from the list above, like a [Chase Freedom Unlimited](/card/chase-freedom-unlimited), [Citi Double Cash](/card/citi-double-cash), or [Wells Fargo Active Cash](/card/wells-fargo-active-cash), it is eligible.

  Remember, the $100 cap is **per card**. Every eligible card that shows up in your Paze wallet gets its own 10 uses.

  ## Where you can use it: top participating merchants

  The $10-back offer applies at participating merchants, and Paze has lined up a genuinely useful roster. Names confirmed in the promotion include:

  | Merchant | Category | Easy $10+ purchase |
  |----------|----------|--------------------|
  | Dunkin' | Quick-service food | Reload or order ahead |
  | Domino's | Quick-service food | One medium pizza |
  | Wendy's | Quick-service food | Online/app order |
  | Sephora | Beauty | Almost anything |
  | Fanatics | Sports merchandise | Team gear |
  | StubHub | Tickets | Event tickets |
  | United Airlines | Travel | Airfare or seat fees |
  | 1-800-Flowers | Gifting | Small arrangement |
  | Harry & David | Gifting | Snack boxes |
  | Newegg | Electronics | Cables, accessories |
  | Cinemark | Entertainment | Movie tickets |

  The full, current list of merchants that accept Paze lives at paze.com, and it is growing — but the table above covers the brands where hitting a $10 minimum is trivial.

  One important update for deal-chasers: early in the promotion, the easiest plays were **third-party gift cards at Newegg and Dunkin' reloads**, and those lanes have largely been closed — Newegg removed Paze as a payment option for gift card purchases specifically. Regular products still work fine. Plan around buying actual things you want, not gift cards.

  ## How to set it up

  This is the part that confuses people, because Paze setup is backwards from every other wallet: **you mostly set it up at checkout, not in advance.**

  1. **Shop at a participating merchant** and get to the payment step.
  2. **Select Paze** as your payment method.
  3. **Enter the email address your bank has on file.** This is how Paze finds your cards — it has to be the email tied to your online banking profile.
  4. **Verify with a one-time code** sent to your phone or email, and accept the terms to activate your wallet.
  5. **Pick your card and pay.** Every eligible card from participating banks tied to that email shows up automatically — no card numbers to type.

  After the first activation, subsequent checkouts are just "select Paze, pick card, confirm."

  ### Managing it from your bank's app

  Your bank's app is where you control which of your cards appear in Paze, and several banks let you get set up there ahead of time. Look under the **digital wallet** section:

  - **Wells Fargo**: open the app, go to the **Digital Wallets** section, and you can add or remove cards from Paze there.
  - **Chase**: eligible Chase cards are automatically available in Paze; you can manage Paze visibility from your card's settings under digital wallet options.
  - **Bank of America, Capital One, Citi, U.S. Bank, PNC, Truist**: each surfaces Paze management inside online banking or the mobile app, typically under digital wallet or card settings, where you can toggle cards in or out of your Paze wallet.

  If a card you expect is not showing up at checkout, the bank app's digital wallet settings are the first place to check — the card may be toggled off, or the email on that account may differ from the one you used to claim your wallet.

  ## The fine print worth knowing

  - **One credit per qualifying transaction, $10 minimum, single purchase.** Two $5 purchases do not combine. There is no bonus for spending more than $10, so the optimal move is ten purchases as close to $10 as practical.
  - **Credits post to a future billing statement**, not instantly. Give it a statement cycle or two before assuming a credit was missed.
  - **Category exclusions apply.** Purchases coded as gambling, pharmacies/drug stores, financial services (including prepaid cards and crypto), guns and ammunition, government fines, medical services, spas, telemarketing/subscription services, and a few other categories do not qualify, regardless of merchant.
  - **Per-card, not per-bank.** Two eligible cards from the same bank each get their own $100 cap.
  - **Debit works too.** The offer covers eligible credit *and* debit cards from participating institutions.

  ## The bottom line

  Bank consortiums do not usually give away money this cleanly. Ten $10-ish purchases at places like Domino's, Dunkin', Sephora, or Cinemark between now and **September 10, 2026** turns into $100 back per card — with no activation, no new app, and no annual fee anywhere in the chain. If you hold several eligible cards across Chase, Citi, Capital One, Bank of America, Wells Fargo, U.S. Bank, PNC, or Truist, this quietly scales into a few hundred dollars for spending you were probably going to do anyway.

  The five-minute version: go order something $10+ from a participating merchant, click Paze at checkout, claim your wallet with your banking email, and let the statement credits roll in. Then check your bank app's digital wallet settings to make sure every eligible card you own is along for the ride.
