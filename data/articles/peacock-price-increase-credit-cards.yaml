social_title: "Peacock Price Hike: Cards That Cover It"
content: |
  Peacock subscribers are getting an email this week with a familiar subject line: "Upcoming Price Increase." Every standalone plan is going up, and this is the fourth Peacock increase in four years. If you are paying for Peacock with a plain cash-back card, the hike is just a bigger bill. If you hold a card with a streaming credit, it may be completely invisible. Here is what is changing, and which credit cards actually cover it.

  ## The new Peacock prices

  Peacock's [price-increase help page](https://www.peacocktv.com/help/article/price-increase) lists the new rates. New subscribers have been paying them since **August 18, 2026**. Existing subscribers move to the new price on their **next billing date on or after September 17, 2026**, or when their current promotional rate ends.

  | Plan | Old monthly | New monthly | Old annual | New annual |
  |------|-------------|-------------|------------|------------|
  | Select | $7.99 | $8.99 | $79.99 | $89.99 |
  | Premium | $10.99 | $12.99 | $109.99 | $129.99 |
  | Premium Plus | $16.99 | $19.99 | $169.99 | $199.99 |

  Add-ons such as STARZ and Regional Sports Networks are staying at their current prices. The Apple TV and Peacock bundles are also going up, to $17.99 for Premium and $22.99 for Premium Plus, with existing bundle subscribers moving over on or after October 1, 2026.

  A quick refresher on the tiers, since the names have shifted over the years: **Select** is the cheapest ad-supported plan with a limited catalog and no live sports. **Premium** is the full ad-supported service, including live sports and the NBC and Bravo libraries. **Premium Plus** is Premium with most ads removed, offline downloads, and a live feed of your local NBC station.

  For someone on the popular Premium plan, the increase is $2 a month, or $24 a year. Premium Plus subscribers pay $3 more a month, or $36 a year. That is the number to keep in mind while reading the rest of this article: the question is whether your card quietly absorbs $24 to $36 a year, or whether you eat it.

  ## Cards with a credit that covers Peacock

  The cleanest way to neutralize a streaming price hike is a card whose statement credit already pays for the subscription. These are the cards in our database with a credit that Peacock qualifies for.

  ### The Platinum Card from American Express: $25 a month

  [The Platinum Card](/card/the-platinum-card) is the obvious one. Its **Digital Entertainment Credit** pays up to **$25 a month, $300 a year**, toward eligible subscriptions, and Peacock is explicitly on the list alongside Disney+, ESPN, Hulu, Paramount+, The New York Times, The Wall Street Journal, and YouTube TV. Enrollment is required, and the credit is use-it-or-lose-it each month.

  At the new prices, $25 a month covers Peacock Premium ($12.99) with $12 to spare, and covers Premium Plus ($19.99) with $5 to spare. In other words, a Platinum cardholder on Premium Plus goes from $16.99 fully covered to $19.99 fully covered and never notices the increase.

  Two things to watch. First, the credit is $25 per month across all eligible providers combined, so if you were already stacking Peacock with, say, Paramount+ to fill the full $25, the higher Peacock price now crowds out part of the other subscription. Second, **as of August 1, 2026, Peacock bundles and add-ons no longer qualify** for the credit. A standalone Peacock plan billed directly by Peacock is fine. The Apple TV and Peacock bundle, or a STARZ add-on tacked onto your Peacock bill, is not. If you want the credit, keep Peacock standalone and pay for it directly with the Platinum.

  ### Bank of America Premium Rewards Elite: $150 a year

  The [Bank of America Premium Rewards Elite](/card/bank-of-america-premium-rewards-elite) carries a **$150 annual Lifestyle Credit** that can be applied to streaming services, along with rideshare and airline purchases. Enrollment is required. That $150 covers a full year of Peacock Premium on the annual plan ($129.99) outright, or the first eleven months of Premium billed monthly. If the rest of your lifestyle spend is light, pointing this credit at Peacock is an easy way to make sure none of it goes unused.

  ### Wyndham Rewards Earner Premier: $100 a year

  The refreshed [Wyndham Rewards Earner Premier](/card/wyndham-rewards-earner-premier-card) includes up to **$100 a year in statement credits on qualifying streaming services**, with no enrollment step. That is enough to cover the Select annual plan ($89.99) completely, or most of a year of Peacock Premium. It will not stretch to Premium Plus on its own, but it takes the sting out of the increase either way.

  ### Truist Enjoy Beyond: $100 a year

  The [Truist Enjoy Beyond](/card/truist-enjoy-beyond) has a **$100 annual Travel Experience Credit** that covers ground transportation, ticket agencies, and streaming services. Same math as the Wyndham card: Select annual is fully covered, and Premium is mostly covered. Since the credit pool is shared with rideshare and ticket purchases, decide up front whether Peacock or your Uber habit gets first claim on it.

  ### U.S. Bank Altitude Go: $15 a year

  The [U.S. Bank Altitude Go](/card/us-bank-altitude-go-visa-signature) pays a **$15 annual streaming credit** after 11 consecutive months of streaming purchases, on top of 2x points on streaming. It is a small credit, but it happens to be almost exactly the size of the Select tier's increase ($12 a year), and the card has no annual fee.

  ## Cards that earn extra on Peacock but do not credit it

  If you do not hold one of the cards above, the next best thing is to make sure the subscription is at least earning a bonus rate. Peacock codes as a streaming purchase, so these cards' streaming categories apply:

  - [Blue Cash Preferred](/card/blue-cash-preferred-card): **6% back** on select U.S. streaming subscriptions. On the new Premium price that is about $9.35 a year back, which is the best pure earn rate on this list.
  - [Wells Fargo Autograph](/card/wells-fargo-autograph): **3x points** on streaming, no annual fee.
  - [Capital One Savor](/card/capital-one-savor): **3% back** on streaming, no annual fee.
  - [Chase Sapphire Preferred](/card/chase-sapphire-preferred): **3x points** on select streaming services, and points transfer to travel partners if that is where you get the most value.

  None of these erase the increase. At best they claw back a few dollars a year. They are the right choice for Peacock only if you do not have a credit card to point at it.

  ## Streaming credits that do not cover Peacock

  This is where people get tripped up. Several cards advertise streaming or entertainment credits that sound like they should help, and do not:

  - The [Chase Sapphire Reserve](/card/chase-sapphire-reserve) credit is for **Apple TV and Apple Music only**. Peacock is not eligible, even if you subscribe through the Apple TV app.
  - The [Blue Cash Everyday](/card/blue-cash-everyday-card) and [Blue Cash Preferred](/card/blue-cash-preferred-card) monthly credits are **Disney+, Hulu, and ESPN+ only**. The Preferred still earns 6% on Peacock, but the $7 credit does not apply.
  - The [PNC Spend Wise](/card/pnc-spend-wise) digital subscription credit covers **Spotify, Netflix, and Disney+**, not Peacock.
  - The Disney Visa cards' streaming bonuses are Disney-owned services only.

  If your plan was to lean on one of those, Peacock is still coming out of your pocket.

  ## Three moves before September 17

  1. **Lock in the annual plan if you are staying.** Current annual subscribers keep their price until renewal, and even at the new rates, Premium annual ($129.99) beats Premium monthly ($155.88 a year) by about $26. If you know you will keep Peacock through the NFL and Premier League seasons, the annual plan is the better hedge regardless of which card you pay with.
  2. **Move the subscription to the right card.** Update the payment method in your Peacock account so the charge lands on the card with the credit. Amex Platinum cardholders also need to enroll in the Digital Entertainment Credit in their benefits dashboard, and should make sure they are on a standalone plan, not a bundle.
  3. **Recheck any bundle.** If you were getting Peacock through the Apple TV bundle to save a few dollars, that bundle now costs $17.99 or $22.99 and no longer qualifies for the Platinum credit. For Platinum cardholders, standalone Peacock on the card is now the cheaper path.

  ## The bottom line

  A $2 or $3 monthly increase is not going to change anyone's budget on its own, but Peacock's price has more than doubled for the ad-supported tier since launch, and there is no reason to think this is the last increase. Cardholders with [The Platinum Card](/card/the-platinum-card), the [Bank of America Premium Rewards Elite](/card/bank-of-america-premium-rewards-elite), the [Wyndham Rewards Earner Premier](/card/wyndham-rewards-earner-premier-card), or the [Truist Enjoy Beyond](/card/truist-enjoy-beyond) can route the bill through a credit and ignore the email entirely. Everyone else should at least make sure the charge is earning 3% to 6% instead of 1%, and consider whether the annual plan is worth locking in before the next round.
