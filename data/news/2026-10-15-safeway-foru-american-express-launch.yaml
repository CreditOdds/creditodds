title: "Safeway Launches forU Amex Card With Imprint"
summary: "Safeway and Imprint launched the Safeway forU American Express card, a no annual fee card issued by First Electronic Bank. It earns 5% back on Albertsons Companies online and app orders, 3% in store on grocery and pharmacy, 3% on gas, dining, utilities and streaming, and 1% on everything else. New cardholders get $50 after $1,000 in spending within 90 days."
