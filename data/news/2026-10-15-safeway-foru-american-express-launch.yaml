body: |
  Safeway has a new co-brand credit card. The **Safeway forU American Express** card launched this week, with fintech **Imprint** running the program and **First Electronic Bank** as the issuer. It has **no annual fee**, and Doctor of Credit reported the launch on **October 14, 2026**.

  ## Rewards

  - **5% back** on online and app orders from Albertsons Companies stores, including pickup and delivery
  - **3% back** on in-store grocery and pharmacy purchases at Albertsons Companies stores, including prescriptions
  - **3% back** on gas, dining, utilities and streaming
  - **1% back** on everything else

  The card's rewards terms say these Albertsons rates apply across the company's participating forU banners, not only Safeway, and the card is also offered under names such as Vons, Albertsons and Jewel-Osco. Rewards are paid automatically as a **statement credit** each billing cycle, so there is nothing to redeem.

  ## Welcome offer

  New cardholders can earn a **$50 statement credit** after spending **$1,000** within **90 days** of opening the account. Purchases at Albertsons Companies stores do not count toward that spending requirement.

  ## Things to know

  The 3% rate on gas, dining, utilities and streaming has no cap listed in the rewards terms, which gives the card some value outside the grocery store. Imprint's FAQ notes that cross-border transactions may be declined, so it is best treated as a card for domestic spending.

