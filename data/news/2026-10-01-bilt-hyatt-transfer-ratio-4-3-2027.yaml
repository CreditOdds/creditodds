body: |
  Bilt Rewards is cutting its World of Hyatt transfer ratio. Beginning **January 1, 2027**, Bilt points will convert to Hyatt at **4:3** rather than **1:1**, meaning **1,000 Bilt points** will yield **750 Hyatt points**.

  In practice, a Hyatt award costing **60,000 points** will take **80,000 Bilt points** to fund, up from 60,000 today.

  ## Who is affected

  The new ratio applies to every Bilt member. There is no exception based on Bilt elite status or on which Bilt card you hold, including the top-tier **Bilt Palladium**.

  ## Timing

  Transfers at the current **1:1** rate remain available through **December 31, 2026**. Members who already plan Hyatt redemptions can move points before year end, though transfers are generally irreversible, so it makes sense to transfer only for a specific booking.

  ## Context

  The move follows the same change at Chase, where Sapphire Preferred and Ink Business Preferred transfers to Hyatt switched to 4:3 on **October 1, 2026**. The Chase Sapphire Reserve kept its 1:1 ratio, which leaves it as the main 1:1 route into Hyatt among the major transferable points programs once Bilt's change takes effect.

