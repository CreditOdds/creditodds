body: |
  American Express opens its first Centurion Lounge in continental Europe at
  Amsterdam Airport Schiphol. Doors open at **6:00 a.m. on September 17, 2026**,
  and the lounge runs daily until **9:30 p.m.**

  The room sits **between Concourses E and F**, the part of Schiphol used for
  non-Schengen and international departures. That placement is the catch worth
  knowing before you plan around it: travelers heading out on an intra-Schengen
  flight will not be able to reach it after security. At roughly **6,000 square
  feet** it is one of the smaller lounges in the network, and Schiphol is one of
  the busiest airports in Europe, so crowding is a fair thing to expect at peak
  banks of departures.

  This is the **33rd Centurion Lounge** globally. Amex already runs a Centurion
  Lounge at London Heathrow, so the Amsterdam location is the first on the
  European mainland rather than the first in Europe outright.

  ## Access and what is inside

  Complimentary access goes to Platinum Card Members and Centurion Members
  traveling on a same day departing flight, the standard rule across the
  Centurion network.

  The design leans local, with work from Dutch artists and floor to ceiling
  windows. There is a full bar, a locally inspired buffet menu, and a Blue Roast
  coffee bar with barista service. Seating covers armchairs, cafe tables, high
  tops, booths and quieter work areas. There are no showers.

  For Platinum holders who connect through Amsterdam, this closes a real gap.
  Schiphol has had limited premium lounge options for Amex cardholders, and until
  now the nearest Centurion Lounge was across the Channel at Heathrow.

