body: |
  Bread Financial and American Express launched the NFL Extra Points American
  Express Credit Card on **August 26, 2026**. The card carries **no annual fee**
  and is issued by Comenity Capital Bank on the American Express network.

  Earning is tiered: **3 percent** back on qualifying NFL and NFL team
  purchases, **2 percent** at grocery stores, on food delivery, at restaurants,
  gyms and sporting goods retailers, and **1 percent** on everything else.
  Rewards can be redeemed for cash back, NFL tickets, merchandise, gift cards or
  league experiences.

  New cardholders earn **$100 cash back** after spending **$500** on purchases
  outside the NFL within the first **90 days** of account opening, paid as a
  statement credit.

  ## Team cards move to Amex

  The launch sits inside a wider multi-year partnership between the NFL and
  American Express. Bread Financial says **18 NFL teams** have now launched
  cards on the American Express network, so the shift reaches team co-brands and
  not only the league-wide product.

  ## Benefits

  Cardholders get a **25 percent** discount on qualifying purchases at
  NFLShop.com plus access to NFL events, ticket presales and memorabilia.
  Special financing is available on NFL ticket purchases over **$250** made at
  NFL team ticket offices, Ticketmaster, SeatGeek or Sports Illustrated Tickets.
  Running on the American Express network also brings Amex Offers, presale
  access, dedicated venue entry, and travel and lifestyle protections.

  Bread Financial has not said whether holders of existing NFL team cards are
  converted automatically or need to apply. The full team lineup is listed at
  nflextrapoints.com.

