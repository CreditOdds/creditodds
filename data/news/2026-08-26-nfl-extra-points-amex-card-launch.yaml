title: "NFL Extra Points Card Launches on Amex"
summary: "Bread Financial and American Express launched the no annual fee NFL Extra Points American Express Credit Card on August 26, 2026. It earns 3 percent back on NFL and NFL team purchases, 2 percent at grocery stores, restaurants, food delivery, gyms and sporting goods, and 1 percent elsewhere, with $100 back after $500 in non-NFL spend within 90 days. Bread says 18 NFL teams now have cards running on the American Express network."
