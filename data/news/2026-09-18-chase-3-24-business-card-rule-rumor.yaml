id: "chase-3-24-business-card-rule-rumor"
date: "2026-09-18"
title: "Rumor: Chase Applies 3/24 to Business Cards"
summary: "Chase reconsideration agents have been telling business card applicants since September 16, 2026 that a new rule denies sole proprietors with three or more new accounts in the past 24 months, down from the long standing 5/24 threshold. Doctor of Credit and Travel on Points have both collected data points citing the same date and the same wording. Chase has not announced any change."
tags:
  - "rumor"
  - "policy-change"
bank: "Chase"
source: "Doctor of Credit"
source_url: "https://www.doctorofcredit.com/has-chase-changed-the-5-24-rule-for-sole-props-3-24-for-sole-props/"
body: |
  Chase applicants who called reconsideration on a denied business card this week say
  agents cited a rule nobody had heard of before: **three or more new accounts in the past
  24 months** is now a decline, rather than the five that Chase has used for years.
  **Chase has not announced this and has not confirmed it**, so treat every number below
  as a report rather than a published policy.

  ## What the data points say

  The reports cluster around one date. Multiple applicants were told the cutoff took
  effect **September 16, 2026**, including people approved at **4/24** who were told the
  approval only went through because they applied before that day. Doctor of Credit logged
  **three denials citing the 3/24 figure between September 14 and September 17**, and
  Travel on Points counted dozens of reports across its own community and elsewhere.

  The evidence is not uniform. Doctor of Credit also recorded one applicant approved at
  4/24 after reconsideration on September 10 and another approved at 3/24 in the days that
  followed, which is hard to square with a hard cutoff. There is also no agreement yet on
  scope. Some reports describe the rule as specific to **sole proprietors**, while others
  suggest it reaches every business application, including LLCs and corporations.

  ## Why it matters

  Chase business cards do not report to personal credit, so the Ink lineup has long been
  the standard way to keep earning without pushing a personal file toward 5/24. Moving the
  bar to three accounts would close that path for a lot of people well before they reach
  the personal limit.

  Doctor of Credit stopped short of calling it official, while noting that front line reps
  are all repeating the same thing. Until Chase publishes something, the safe assumption is
  that a business application at **3/24 or above** now carries real denial risk.

