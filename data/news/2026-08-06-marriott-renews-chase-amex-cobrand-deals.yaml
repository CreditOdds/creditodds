body: |
  Marriott International used its **Q2 2026 earnings call on August 4, 2026** to
  confirm that it has signed new long-term agreements covering its U.S. co-brand
  credit card program with **JPMorgan Chase** and **American Express**. Both
  issuers stay on. The previous set of agreements was signed in **December 2017**,
  and deals of this type typically run 7 to 10 years.

  CEO Anthony Capuano said the new agreements will lead to new and refreshed U.S.
  card products carrying new cardholder benefits. He also set expectations on
  timing: developing and launching refreshed cards takes several quarters, so no
  product announcements are imminent.

  ## What Marriott told investors

  Marriott expects the renewed program to add roughly **$30 million** in card
  revenue through the end of 2026, growing to between **$100 million and $125
  million a year by 2028**. Marriott framed the gain as coming from growth in new
  card accounts and higher spending on the cards.

  ## What it means for current cardholders

  Nothing changes today. Chase still issues the Marriott Bonvoy Bold and Bonvoy
  Boundless, and American Express still issues the Bonvoy Brilliant, Bonvoy Bevy,
  and Bonvoy Business cards. Points, earning rates, annual fees, and benefits all
  stay as they are until Marriott and the issuers announce specific product
  changes.

  The 2017 renewal is the useful precedent for what comes next. That deal was
  announced in December 2017, and the refreshed card lineup did not arrive until
  the following year. Cardholders should expect a similar gap here, with the
  first concrete details on new or reworked Bonvoy cards landing sometime after
  the several quarters of development Capuano described.

