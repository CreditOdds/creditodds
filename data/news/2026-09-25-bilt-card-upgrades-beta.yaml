title: "Bilt Opens Card Upgrades in Beta"
summary: "Bilt began offering product upgrades on its Bilt Card 2.0 lineup on September 18, 2026, as a phased beta for select cardholders. Blue holders may upgrade to Obsidian or Palladium, and Obsidian holders to Palladium, with no new application or hard inquiry. The old annual fee is refunded in full or prorated, and upgrades are limited to one per 12 months."
