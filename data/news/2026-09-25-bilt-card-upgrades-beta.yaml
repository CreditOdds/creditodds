body: |
  Bilt cardholders can now move up to a higher tier card without applying again. Bilt's support site says product upgrades entered **beta on September 18, 2026** for select cardholders and are rolling out in phases, with a wider launch to be announced later.

  ## Which upgrades are allowed

  - [Bilt Blue](/card/bilt-blue) to [Bilt Obsidian](/card/bilt-obsidian) or [Bilt Palladium](/card/bilt-palladium)
  - Bilt Obsidian to Bilt Palladium

  Bilt only lists upgrade paths. Eligibility is set card by card, so a member may see an offer for one card and not the other. The option appears under the Account section of the Bilt Card settings in the app.

  ## How it works

  The change keeps the same account, so there is **no new application and no hard credit inquiry**, and points and account history carry over. The new physical card keeps the same number with a new expiration date and CVV, and new benefits apply as soon as the upgrade completes. Authorized users move to the new card automatically. The credit limit does not change.

  Upgrades are not available until the first statement has closed, and members can make **one upgrade per 12 months**.

  ## Annual fees

  Roughly **45 days** after the upgrade, the new card's full annual fee posts alongside a refund of the old card's fee. The refund is full if the upgrade happens within **30 days** of the old fee posting, and prorated after that. The card anniversary date resets to follow the new fee.

  ## Upgrade bonuses

  Bilt says upgrades can come with a bonus shown in the app at the time of the change. Miles to Memories reported one Obsidian to Palladium offer of **50,000 points plus $100 in Bilt Cash** after $4,000 in spend within 90 days. Offers vary by member, so check the app before upgrading.

