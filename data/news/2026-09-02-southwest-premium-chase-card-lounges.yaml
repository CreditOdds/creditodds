title: "Southwest Plans Lounges and Premium Chase Card"
summary: "Southwest said on September 2, 2026 that it is building its first airport lounges, at Austin, Baltimore, Honolulu and Nashville, with the first guests expected in late 2027. Access will come through a new premium Southwest Rapid Rewards card from Chase launching in 2027. At least seven more lounges are planned after the first four."
