body: |
  Southwest Airlines announced on **September 2, 2026** that it is opening the
  first airport lounges in its history, and that a **new premium Southwest
  Rapid Rewards credit card from Chase** will provide access to them. The
  airline says the card launches in **2027**.

  Construction has already begun on the first four lounges:

  - Austin-Bergstrom International Airport
  - Baltimore/Washington International Thurgood Marshall Airport
  - Daniel K. Inouye International Airport in Honolulu
  - Nashville International Airport

  The first guests are expected in **late 2027**. Southwest says at least
  **seven more** lounges will follow in the years after that, in markets it
  has not yet named.

  ## What Chase brings

  Southwest is building the lounges with Chase, and the press release points
  to the Chase Sapphire Reserve Lounge Network as the model. Southwest
  describes locally inspired dining, high quality amenities and travel
  benefits along the lines of what the Sapphire Reserve lounges offer today.

  ## What is not known yet

  Southwest has not published an annual fee, an earning structure, a welcome
  offer, or guest access rules for the new card, and it has not said how the
  card will sit alongside the existing Southwest Rapid Rewards lineup that
  Chase already issues. Details circulating on message boards about pricing
  and benefits are not confirmed by the airline.

  For current Southwest cardholders, nothing changes today. The Plus, Premier,
  Priority and business cards keep their existing fees and benefits, and the
  lounges are more than a year from opening.

