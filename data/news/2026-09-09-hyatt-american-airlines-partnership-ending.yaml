body: |
  Hyatt and American Airlines announced on **September 9, 2026** that they have mutually decided not to continue the enhanced loyalty relationship between World of Hyatt and AAdvantage. The two programs are winding the arrangement down rather than cutting it off, and both sides published transition dates.

  ## Dates that matter

  Members who want to keep earning across both programs during the wind down have to link their accounts by **11:59:59 p.m. CT on November 15, 2026**. After that:

  - World of Hyatt members can keep earning AAdvantage awards through Milestone Rewards until **December 31, 2026**.
  - AAdvantage members can keep earning World of Hyatt awards through Loyalty Point Rewards until **February 28, 2027**.

  Hyatt says benefits members earn during the current earning year in each program are preserved through the transition.

  ## What survives

  One piece of the relationship continues. AAdvantage members can still choose **500 AAdvantage miles** in place of World of Hyatt points on an eligible Hyatt stay by giving their AAdvantage number at check in.

  ## Why cardholders care

  The link was the main bridge between the two ecosystems. World of Hyatt and World of Hyatt Business cardholders from Chase, along with anyone moving Ultimate Rewards points into Hyatt, used it to push activity toward American. Citi AAdvantage cardholders used it in the other direction to reach Hyatt benefits. Reciprocal status offers between the two programs, which were never formally published but showed up most years, are the clearest casualty. Cardholders who hold status on one side and want to use it on the other have until the November 15 linking deadline to set that up.

