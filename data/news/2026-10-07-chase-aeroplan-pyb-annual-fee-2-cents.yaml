title: "Aeroplan Points Cover Annual Fee at 2 Cents"
summary: "Chase raised the Pay Yourself Back rate for the Air Canada Aeroplan card's annual fee from 1.25 cents to 2 cents per point as of October 4, 2026, according to Doctor of Credit. Covering the new $195 fee now takes 9,750 points instead of 15,600. The 1.25-cent rate on travel purchases is unchanged through December 31, 2026."
