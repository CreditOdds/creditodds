body: |
  Chase announced a new Ultimate Rewards redemption option called Invest Your Points on **September 16, 2026**. Cardholders can redeem points for cash that goes straight into an eligible J.P. Morgan investing account rather than to a statement credit or bank account.

  The option covers the **Chase Sapphire, Chase Freedom and Chase Ink** card families, which is effectively every Ultimate Rewards earning card. Redemptions run through the Chase Mobile app and Chase.com. The money can land in a **J.P. Morgan Self-Directed Investing** account or in a taxable account managed with a J.P. Morgan advisor.

  ## The rate is 1 cent per point

  Points convert at **1 cent per point**. That is the same value Chase already gives for a statement credit or a deposit to a linked bank account, so there is no premium for routing the cash into investments. Doctor of Credit reports that Roth IRA accounts are not eligible.

  Because the rate is flat, anyone who can redeem points for more than 1 cent apiece is better off taking that higher value as cash and moving the money into the investing account themselves. Doctor of Credit makes the same point about Sapphire Reserve holders, whose card offers redemption paths worth more than a straight cent per point.

  The feature is best read as a convenience rather than a new source of value. It removes a step for cardholders who were already cashing out points and moving the money into a brokerage account, and it gives Chase another reason to keep both relationships under one login.

