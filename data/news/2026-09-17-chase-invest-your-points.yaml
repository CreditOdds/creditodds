title: "Chase Points Can Now Fund Investing Accounts"
summary: "Chase announced Invest Your Points on September 16, 2026, letting Sapphire, Freedom and Ink cardholders redeem Ultimate Rewards points for cash deposited into an eligible J.P. Morgan investing account. The rate is 1 cent per point, the same as a statement credit or direct deposit, so there is no bonus for choosing it."
