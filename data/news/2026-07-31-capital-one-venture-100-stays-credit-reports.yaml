body: |
  Treat this one as unconfirmed. Multiple **Capital One Venture Rewards**
  cardholders say they received an email this week announcing a new annual
  **$100 credit** on the card, and Doctor of Credit aggregated the reports on
  **July 31, 2026**. Capital One has not announced the change, and as of this
  writing the credit does not appear on the card's public page.

  ## What the emails say

  Per the reported wording, the credit covers **hotel and vacation rental
  bookings through Capital One Travel**. It renews each year on the
  cardholder's **account anniversary date**, requires **no enrollment**, and
  becomes available within **72 hours** of the notification. Cardholders say it
  can be viewed and applied at checkout.

  ## Why it would matter

  The Venture carries a **$95 annual fee**. A $100 travel credit that renews
  automatically would cover the fee outright for anyone who books a single
  qualifying stay through the portal, which changes the math on holding the
  card long term rather than churning it. It would also narrow the gap between
  the Venture and cards a tier above it.

  Note what the reported credit is not. The Venture already carries a **$50
  experience credit** at Lifestyle Collection hotels and vacation rentals, and
  that is a separate, per stay perk at a limited set of properties. The
  reported $100 credit is described as annual and tied to Capital One Travel
  bookings generally.

  Nothing here is official yet. Until Capital One updates its own benefits
  page or terms, do not count on the credit when deciding whether to keep or
  apply for the card.

