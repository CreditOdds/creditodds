title: "Reports: Venture Adding $100 Stays Credit"
summary: "Unconfirmed: Capital One Venture cardholders report emails saying the $95 card now includes an annual $100 credit for hotel and vacation rental bookings made through Capital One Travel, renewing each cardholder anniversary with no enrollment. Capital One has not published the benefit, and it does not yet appear on the card's page."
