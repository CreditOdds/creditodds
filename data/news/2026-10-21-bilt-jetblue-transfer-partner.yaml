body: |
  Bilt added **JetBlue TrueBlue** as a transfer partner on **October 20, 2026**, making it the program's **27th** transfer partner. Points move at a **1:1 ratio**, so 1,000 Bilt Points become 1,000 TrueBlue points.

  ## How transfers work

  - Members first link their TrueBlue account to their Bilt account in the Bilt app or on the website.
  - Transfers run in increments of **1,000 points**.
  - Members at Blue status need to move at least **2,000 points** per transfer. All other members have a **1,000 point** minimum.
  - Bilt says transfers should post almost instantly, so points can be moved right before booking an award.

  No launch transfer bonus was announced with the partnership.

  ## How it compares

  JetBlue was already reachable from Chase Ultimate Rewards and Wells Fargo Rewards at 1:1, from American Express Membership Rewards at 5:4, from Capital One at 5:3, and from Citi ThankYou at up to 1:1 depending on the card. Bilt's ratio matches the best standard rate among those programs.

  TrueBlue prices awards on JetBlue-operated flights dynamically, so the points needed generally follow the cash fare. TrueBlue points can also be used for flights on select partner airlines, including United, Qatar Airways and Etihad, where pricing does not track the fare and there is no published award chart.

  A Bilt spokesperson said the company plans to do more with JetBlue in the coming months, though no specific promotions have been announced.

