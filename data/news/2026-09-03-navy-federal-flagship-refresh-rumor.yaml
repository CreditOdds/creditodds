body: |
  Navy Federal has not announced anything, but several cardholders say credit
  union representatives have walked them through a refresh of the Visa
  Signature Flagship Travel Rewards card taking effect **September 10, 2026**.
  Doctor of Credit and Danny the Deal Guru both reported the same set of
  changes on September 2 and 3, drawn from those cardholder accounts. Treat the
  details as unconfirmed until Navy Federal publishes them.

  ## What is reportedly changing

  The annual fee would rise from **$49 to $95**. Earning gets more top heavy:
  travel goes from **3x to 4x** points, dining from **2x to 3x**, and
  everything else falls from **2x to 1x**.

  On benefits, the **$139 annual Amazon Prime membership credit** would be
  removed and replaced with a **$100 annual airline statement credit**. The
  Global Entry or TSA PreCheck credit of up to $120 every four years and the
  complimentary GigSky global data plan are both said to stay.

  ## Why it matters

  The Prime credit is the reason a lot of members carry this card. At $49 it
  more than covered the fee on its own, so the card effectively paid for
  itself. Swapping it for a $100 airline credit at a $95 fee narrows that
  margin considerably, and the airline credit is far more restrictive than a
  Prime membership almost everyone already buys.

  The bigger change for everyday spending is the base rate. A flat 2x on all
  purchases with no foreign transaction fee is what made the Flagship a
  reasonable catch all card. At 1x, it only makes sense for members whose
  spending is concentrated in travel and dining.

  If the September 10 date holds, cardholders have about a week to decide
  whether to use the current Prime credit before the terms change.

