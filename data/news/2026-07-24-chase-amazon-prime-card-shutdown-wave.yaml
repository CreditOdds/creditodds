title: "Chase Shuts Down Some Amazon Prime Cards"
summary: "Doctor of Credit reports a wave of Chase Amazon Prime card closures on July 22 and 23. Closure letters cited either inactivity or very large spending combined with credit limit cycling. Other Chase accounts were left open, and affected cardholders have 30 days to redeem remaining rewards."
