body: |
  Doctor of Credit reports that Chase closed a wave of [Amazon Prime Rewards Visa](/card/amazon-prime-rewards-visa-signature-card) accounts on **July 22 and 23**, based on cardholder reports collected from r/CreditCards and private card groups.

  Two reasons appear in the closure notices:

  - **Inactivity**, for cards that had gone unused
  - **Very large spending combined with credit limit cycling**, including one reported case running roughly **$1.2 million** a month through the card

  In the reported cases only the Amazon card was closed. Cardholders' other Chase cards and bank accounts stayed open, and there are no reports of Amazon accounts being affected. Chase has not commented publicly.

  Anyone whose card was closed has **30 days** to redeem unused rewards before they are forfeited, so moving points off the card quickly is the first thing to do.

  The high-spend closures largely involved business purchasing volume run through a personal card, which Chase's cardmember agreement prohibits, and repeatedly paying the card down mid-cycle to spend past the credit limit. Nothing in the reports suggests ordinary cardholders are being reviewed.

  Two practical takeaways apply beyond this card. A card you want to keep should see at least occasional use; a small recurring charge is enough. And business-scale spending belongs on a business card, where the volume is expected and the cardmember agreement allows it.

