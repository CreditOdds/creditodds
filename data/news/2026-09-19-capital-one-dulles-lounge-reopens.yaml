body: |
  Capital One reopened its lounge at Washington Dulles International Airport (IAD) at **11 a.m. ET on September 18, 2026**, ending a months-long stretch in which the main room was closed for infrastructure and ventilation upgrades. Capital One says the work was meant to hold temperature steady in the space year round.

  ## What cardholders get back

  The full **8,500 square foot** lounge is open again, with seating, a coffee bar, a grab-and-go section, a full bar and a buffet carrying both hot and cold items. While the main room was down, eligible visitors were limited to a food counter set up just outside the lounge with some hot options, grab-and-go items and a small amount of cafe style seating.

  ## Who can get in

  Access runs to **Capital One Venture X Rewards**, **Capital One Venture X Business** and **Capital One Venture Rewards** cardholders, and entry requires a departing flight within three hours. Guests cost **$45 per adult** and **$25 per child** ages 2 to 17, with children under 2 free. Cardholders who put **$75,000 or more** on the card in a year get two complimentary guests per visit for the rest of that year and the following calendar year. Authorized users are added for **$125 a year** on Venture X, and $125 per authorized user on Venture X Business.

  ## The wider network

  Capital One opened the Capital One Landing at LaGuardia earlier in 2026 and has announced a 14,000 square foot lounge in Charlotte that will be its eighth location.

