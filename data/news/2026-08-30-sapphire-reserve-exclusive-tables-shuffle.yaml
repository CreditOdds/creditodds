body: |
  Chase quietly rewrote the Sapphire Reserve Exclusive Tables restaurant list on
  **August 28, 2026**, adding **34** outlets and removing **28** others without
  announcing either change. The roster still runs past **400 locations** in more
  than **50 U.S. cities**.

  Exclusive Tables is the platform behind the Sapphire Reserve dining credit.
  Cardholders get a **$150 statement credit** for spending at a listed restaurant
  once between January and June and again between July and December, worth **$300
  a year**. The credit applies to both the Chase Sapphire Reserve and the Chase
  Sapphire Reserve for Business. There is no requirement to book through Chase or
  OpenTable to trigger it, so paying with the card at any participating restaurant
  is enough.

  ## Three markets lost everything

  The removals were not spread evenly. **New Mexico, Salt Lake City and Tulsa** now
  have zero Exclusive Tables restaurants, which leaves cardholders in those markets
  with no local way to earn the credit. Los Angeles lost 5 participating locations
  and Portland, Oregon lost 3.

  ## A 60 day window for existing reservations

  Chase has confirmed a grace period: if a reservation was booked before a
  restaurant came off the list, the benefit still works there for **60 days** after
  the removal. That covers people who planned a meal around the credit before the
  August shuffle, but it does nothing for anyone whose entire metro area was cut.

  Anyone counting on the second half of the year credit should recheck the current
  list before the December 31 deadline, since Chase changes the roster without
  notice and does not publish a change log.

