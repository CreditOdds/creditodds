body: |
  Bilt and Lowe's announced a partnership on **November 10, 2026** that makes
  Lowe's the **exclusive home improvement partner** of Bilt. It adds a new place
  to earn Bilt Points and a new way to spend Bilt Cash.

  ## Earning at Lowe's

  Bilt members who connect a MyLowe's Rewards account, or create one through
  Bilt, earn **1 Bilt Point per dollar** on net eligible purchases at Lowe's.
  The points come from the linked loyalty account, so they are earned on top of
  whatever the payment card earns. Doctor of Credit notes the purchase does not
  have to go on a Bilt card. Online, you need to be signed in to the linked
  MyLowe's Rewards account; in store, give the linked phone number at checkout.
  MyLowe's Rewards perks such as free shipping and member deals still apply.

  Matching an existing MyLowe's Rewards account inside Bilt is listed as
  **coming in December 2026**.

  ## Bilt Cash for HomeCare+

  Members can now buy a **Lowe's HomeCare+** subscription through Bilt using
  Bilt Cash, Bilt Points or a linked card. HomeCare+ renews at **$99 a year**
  and covers annual in-home visits from Lowe's associates for up to seven
  routine maintenance services, plus 5% off products used during those visits
  and Gold MyLowe's Rewards benefits. It is only offered in select zip codes.

  ## What comes next

  The two companies say a curated Lowe's marketplace inside the Bilt app is
  planned for **early 2027**. Full earning terms are posted at
  bilt.com/terms/lowes.

  For Bilt cardholders this works like other recent Bilt partnerships: a modest
  extra earn at a merchant plus one more specific outlet for Bilt Cash, rather
  than a change to the cards' own earning rates.

