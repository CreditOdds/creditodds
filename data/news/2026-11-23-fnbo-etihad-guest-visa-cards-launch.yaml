title: "Etihad and FNBO Launch Two U.S. Credit Cards"
summary: "Etihad Airways and FNBO launched Etihad's first U.S. credit cards on November 20, 2026. The $99 Etihad Guest Visa Signature grants Silver status after a first Etihad purchase, and the $499 Premier version adds Gold status and Priority Pass. Launch bonuses of up to 40,000 and 60,000 miles run through February 3, 2027."
