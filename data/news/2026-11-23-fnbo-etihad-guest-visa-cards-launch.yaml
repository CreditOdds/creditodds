body: |
  Etihad Airways has its first U.S. credit cards. Issued by **FNBO** on Visa Signature, the two cards launched on **November 20, 2026**, according to Doctor of Credit, Upgraded Points and Parade. Neither card charges foreign transaction fees.

  ## Etihad Guest Visa Signature ($99)

  - Earns **3 miles** per dollar on Etihad, **2** on partner airlines and purchases outside the U.S., and **1** elsewhere
  - **Silver** status after your first Etihad purchase within 90 days
  - 1 Tier Mile per dollar, capped at **25,000** a year
  - Launch bonus: **10,000** miles after the first purchase plus **30,000** after **$3,000** in the first 3 billing cycles

  ## Etihad Guest Premier Visa Signature ($499)

  - Earns **5 miles** per dollar on Etihad, **3** on partner airlines, **2** outside the U.S., and **1** elsewhere
  - **Silver** status on approval, upgraded to **Gold** after your first Etihad purchase within 90 days
  - Uncapped Tier Miles at 1 per dollar
  - **Priority Pass** digital membership
  - Global Entry or TSA PreCheck credit of up to **$120** every 48 months
  - Launch bonus: **20,000** miles after the first purchase plus **40,000** after **$7,000** in the first 3 billing cycles

  Status can be kept with card spending: **$20,000** a year (or $3,000 on Etihad) keeps Silver on the $99 card, and **$40,000** (or $8,000 on Etihad) keeps Gold on the Premier.

  Both launch bonuses are available through **February 3, 2027**.

