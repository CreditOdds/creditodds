title: "Sapphire Reserve DoorDash Credit Rises to $15"
summary: "Starting October 1, 2026, Chase Sapphire Reserve cardholders get a $15 monthly DoorDash credit that works on any eligible order, restaurants included. Doctor of Credit reports it takes the place of the current $5 restaurant only promo. The two $10 monthly non-restaurant promos and complimentary DashPass are unchanged."
