body: |
  Chase is adding a **$15 monthly DoorDash credit** to the Sapphire Reserve
  starting **October 1, 2026**. Unlike the card's other DoorDash promos, the
  new credit works on **any eligible DoorDash order**, so restaurant delivery
  counts alongside grocery and retail orders.

  Today the card carries a **$5 monthly promo** limited to restaurant orders.
  Doctor of Credit reports the $15 credit replaces that $5 promo rather than
  stacking on top of it. Upgraded Points described the credit as an addition
  without addressing the $5 promo, so the exact treatment of the smaller
  credit is the one open question. Either way the restaurant credit is worth
  three times what it is now.

  ## What stays the same

  Two **$10 monthly** promos for eligible grocery, retail and other
  non-restaurant orders continue unchanged, as does the complimentary DashPass
  membership. Adding the $15 credit brings the monthly DoorDash total to
  **$35**.

  ## Fine print

  The credits are DoorDash promos, not statement credits. Cardholders have to
  activate the benefit in the DoorDash app and set an eligible Sapphire
  Reserve as the payment method, and unused monthly promos do not roll over.
  DoorDash recently began requiring a **$20 minimum** on pickup orders, which
  narrows one of the cheaper ways to use a small credit.

  Neither Chase nor DoorDash has published updated benefit terms yet. The
  DoorDash help page for Chase cardholders still lists the $5 restaurant promo
  and makes no mention of the October change, so the details above come from
  reporting rather than an issuer announcement.

