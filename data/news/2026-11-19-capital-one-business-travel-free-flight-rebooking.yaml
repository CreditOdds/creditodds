body: |
  Capital One announced on **November 18, 2026** that select Capital One business cardholders now get free flight disruption rebooking on flights booked through **Capital One Business Travel**. The benefit is a limited-time offer for bookings made through the **end of January 2027**, while supplies last.

  ## How it works

  Capital One monitors eligible flights starting 24 hours before departure. If the flight is **canceled** or **delayed more than 3 hours** because of weather, airport operations or air traffic control, the traveler can use a self-service tool to choose a replacement flight on **any airline**. The new flight must go to the same destination or a nearby airport, in the same or a lower fare class, departing the same day or the next day.

  Capital One covers the replacement ticket up to **$5,000 per traveler**, at no cost to the traveler. Live agents are available around the clock.

  ## Who is eligible

  Capital One did not name specific cards. The benefit is added automatically at checkout for eligible travelers, and cardholders can log in to Capital One Business Travel to see whether it applies. The Points Guy lists the Venture X Business and the Spark Cash family among the cards that can access Capital One Business Travel, but noted that holding one of these cards does not guarantee the benefit.

  Only flights booked through Capital One Business Travel qualify. Flights booked directly with an airline or through another site are not covered. Capital One also sells flight disruption assistance as a paid add-on to its other travel customers.

