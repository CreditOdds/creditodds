title: "Citi Strata Bonus Now Once Per Lifetime"
summary: "Citi quietly rewrote the welcome bonus terms on its Strata cards on September 20, 2026. The old language barred a bonus if you had received one in the past 48 months. The new language bars a bonus if you currently have or previously had the card, making each Strata bonus a once per lifetime event."
