body: |
  Citi changed the welcome bonus eligibility language on its Strata cards, spotted on **September 20, 2026**. The rule went from a 48 month waiting period to a lifetime restriction.

  ## The old rule and the new one

  The previous terms said bonus ThankYou points were unavailable if you had received a new account bonus on a Citi Premier or Citi Strata Premier account **in the past 48 months**. The replacement language drops the time window entirely: the bonus is not available if you **currently have or previously had** the account.

  Read literally, that means one welcome bonus per Strata product per person, ever. The change covers the [Citi Strata](/card/citi-strata), the [Citi Strata Premier](/card/citi-strata-premier) and the [Citi Strata Elite](/card/citi-strata-elite).

  ## What is still unclear

  Citi has not announced the change or said when it starts enforcing it, and the terms do not address whether anyone who already earned a Strata bonus under the 48 month rule is grandfathered. The language appeared without notice, so the practical effect on pending applications is unknown.

  Citi's other card families still carry the old style language. The American Airlines cards, for example, continue to use a 48 month window.

  Lifetime language is not new in this market. American Express has used it on personal cards for years, and enforcement there has been inconsistent enough that some applicants report bonuses after long gaps. Whether Citi enforces its version strictly is the open question. Until that is clear, anyone who has held a Strata card should assume a second bonus is off the table.

