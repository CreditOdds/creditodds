body: |
  American Express has changed the terms of the Resy dining credit on The
  Platinum Card and the American Express Gold. As of **August 1, 2026**, a U.S.
  restaurant or other food and beverage business has to be flagged as eligible
  for the Resy Credit on the Resy website or app at the time of purchase for the
  charge to trigger the credit. The terms also say eligibility can change at any
  time.

  The credits themselves are unchanged. Platinum cardholders still get up to
  **$100 per quarter**, or **$400 a year**, and Gold cardholders still get up to
  **$50 semiannually**, or **$100 a year**. Both require enrollment. What is new
  is that the venue has to carry the eligibility badge when you pay.

  ## How many restaurants are affected

  Doctor of Credit reported on the day the change went live that roughly **200
  of about 10,000** locations on Resy were listed without the eligibility badge.
  That is a small share, but the venue list is not fixed and Amex can adjust it.

  American Express addressed the change in a statement in June, saying it added
  a Resy Credit eligible badge to venue pages for clarity at booking and that it
  had not removed venues that were eligible at that point. Amex also said more
  eligible venues would be added later this year as Tock restaurants become
  bookable through Resy.

  ## What cardholders should do

  Check the venue page in the Resy app before you pay. Eligible restaurants now
  display a line confirming the venue qualifies for the Resy Credit. Because the
  status is checked at the time of purchase rather than at booking, a venue that
  showed the badge when you reserved is not guaranteed to still carry it when
  the bill arrives.

