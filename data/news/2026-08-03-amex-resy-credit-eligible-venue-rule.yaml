title: "Amex Resy Credit Now Needs Eligible Badge"
summary: "Effective August 1, 2026, a U.S. restaurant must be marked as eligible for the Resy Credit on Resy at the time of purchase for Platinum and Gold cardholders to get the statement credit. Roughly 200 of about 10,000 listed locations are showing as ineligible so far. Amex says it has not removed any venues that were eligible before."
