body: |
  Chase marked the Sapphire Reserve's tenth anniversary on **September 16, 2026** with a permanent increase to the card's DoorDash benefit and a set of limited time travel offers.

  ## DoorDash credit goes from $5 to $15

  Starting **October 1, 2026**, the monthly DoorDash credit on the Sapphire Reserve rises from **$5** to **$15**. That credit sits alongside the card's existing $10 monthly grocery promotion and $10 monthly retail promotion, so the full monthly DoorDash package is worth up to **$35** for a cardholder who uses all three. Complimentary DashPass membership continues. Chase's anniversary page says the DoorDash benefit now runs through the **end of 2029**, extending a perk that had a nearer term expiration.

  ## Five limited time travel offers

  Chase also added five activation required travel offers worth up to **$1,050** in total:

  | Partner | Spend | Credit | Deadline |
  | --- | --- | --- | --- |
  | IHG Hotels & Resorts | $500 | $125 | Oct. 16 |
  | Miraval and Alila | $1,000 | $250 | Dec. 14 |
  | JSX | $200 | $200 | Dec. 14 |
  | Sixt | $500 | $125 | Dec. 14 |
  | Wander | $1,500 | $350 | Dec. 14 |

  Each offer requires activation, and payment has to be completed by the listed deadline.

  ## Points giveaway

  Separately, Chase is running a contest from **September 16 through November 6, 2026** in which cardholders post about a favorite trip taken since 2016. Ten finalists advance to a public voting phase and each receives **500,000** Ultimate Rewards points, with one winner taking a grand prize of **5.5 million** points.

  The DoorDash increase is the piece that matters past this year. The travel offers and the contest both expire, but the larger monthly credit is a standing change to what the card's **$795** annual fee buys.

