body: |
  Amtrak and Bilt announced on **September 23, 2026** that Bilt Points now
  transfer into Amtrak Guest Rewards. The ratio is **2:1**, so 2,000 Bilt
  Points become 1,000 Amtrak Guest Rewards points.

  Transfers move in **1,000 Bilt Point increments**. Members need a minimum of
  **1,000 Bilt Points** per transfer, while Blue Status members have a higher
  **2,000 point minimum**. Amtrak is the first rail operator in the Bilt
  program and the **26th travel partner** overall, joining a lineup that until
  now has been airlines and hotels.

  ## What the ratio means

  The 2:1 rate is the thing to weigh. Bilt's airline partners generally
  transfer at 1:1, so Amtrak costs twice as many Bilt Points per partner point.
  Amtrak Guest Rewards points are typically valued around 2.6 to 2.7 cents
  each on Acela and Northeast Corridor routes, which is what keeps the math
  from being bad: after halving, the effective return lands near the value of
  a straight 1:1 transfer to a mid tier airline program.

  Amtrak's redemption floor is low, which helps. Award travel starts at **400
  Amtrak Guest Rewards points**, or **200 points** on a Points and Cash
  booking, so a single 1,000 Bilt Point transfer can cover more than one
  short trip.

  The practical use case is topping off. Riders who already earn Amtrak points
  and land short of a specific redemption can now close the gap with rent
  spending rather than buying points. For anyone without an Amtrak balance,
  the 2:1 rate makes this a situational option rather than a default one.

