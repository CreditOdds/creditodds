date: "2026-08-20"
title: "Flying Blue Splits Awards Into Three Fares"
summary: "Starting September 8, 2026, Flying Blue awards on Air France and KLM flights split into Light, Standard and Flex. Business class to Europe runs 60,000 miles for Light, 75,000 for Standard and 110,000 for Flex. Light drops lounge access, changes and refunds. Flying Blue is a transfer partner of Amex, Chase, Citi, Capital One, Bilt and U.S. Bank, so the change reaches most transferable points balances."
tags:
