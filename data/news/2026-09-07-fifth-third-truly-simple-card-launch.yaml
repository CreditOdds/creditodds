body: |
  Fifth Third Bank announced a new no annual fee credit card on **September 1, 2026**. The Truly Simple Credit Card runs on the **Mastercard** network and is built around debt payoff rather than rewards.

  ## The terms

  The card carries a **0% introductory APR for 18 months** that applies to both purchases and balance transfers. After that window the rate becomes a variable **18.49% to 29.49%**, set by the applicant's credit. The annual fee is **$0** and there is **no international transaction fee**, which is unusual on a card aimed at balance transfers.

  Balance transfers carry a fee of **$5 or 4%** of the transferred amount, whichever is greater. That is a percentage point above the 3% that several competing balance transfer cards charge, so on a $5,000 transfer the fee difference works out to about $50.

  ## What it does not do

  The Truly Simple card earns **no points and no cash back**. Fifth Third positions it as a tool for consolidating balances and cutting interest costs, with transfers initiated inside the Fifth Third mobile app and automatic payment tools built in. The bank also says eligible cardholders get more than **$120 in annual value** through Mastercard's Instacart benefit.

  An 18-month runway on both purchases and transfers puts the card in the same range as the longer intro offers on the market, though the strongest balance transfer cards stretch to 21 months. The absence of a foreign transaction fee is the more distinctive piece, since no annual fee cards built for debt payoff usually charge 3% abroad.

