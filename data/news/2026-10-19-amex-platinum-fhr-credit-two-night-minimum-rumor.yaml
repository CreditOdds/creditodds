body: |
  **This change is unconfirmed.** American Express has not announced it, and the details come from a test version of the Amex website.

  On **October 13, 2026**, US Credit Card Guide reported language from an Amex test site saying that Fine Hotels + Resorts bookings will require a **minimum two-night stay** starting **January 1, 2027** in order to qualify for the Platinum Card's hotel credit. One Mile at a Time, View from the Wing and Thrifty Traveler have since covered the leak. Amex test sites have shown upcoming card changes before they were announced in the past.

  ## What would change

  Today, The Platinum Card from American Express offers up to **$600 a year** in hotel credits, split into **two $300 credits**: one for January through June and one for July through December. A one-night prepaid Fine Hotels + Resorts booking currently qualifies, which lets cardholders use each $300 credit on a single night. The Hotel Collection already requires a two-night minimum.

  If the leaked terms take effect, a one-night Fine Hotels + Resorts stay would no longer trigger the credit. The test-site language describes this only as a requirement for the statement credit, and it does not mention any change to other Fine Hotels + Resorts perks on one-night stays.

  The same test-site text also appears to rename the benefit to a "Lodging Credit" that would cover Airbnb Luxe stays, and to add a **$250 annual Airbnb Experiences credit** tied to booking an Airbnb Luxe stay. The reports cover only the personal Platinum Card; nothing has surfaced about the Business Platinum.

  ## What to do now

  Nothing changes in 2026 based on these reports. Cardholders who use one-night stays for the July to December credit can still book one before **December 31, 2026**. We will update this story if Amex publishes new terms.

