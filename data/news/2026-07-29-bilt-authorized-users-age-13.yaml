body: |
  Bilt has spelled out how authorized users work on its [Bilt Card](/card/bilt-blue) lineup, and the notable detail is the age floor. Cardholders can add an authorized user starting at **age 13**.

  Each authorized user gets their own card number, and their spending earns into the primary account's shared Bilt Points balance.

  ## Controls on teen accounts

  Accounts for ages **13 to 17** are managed entirely by the primary cardholder, who can:

  - set **monthly and per-transaction** spending limits
  - choose which merchant categories the card can be used in
  - see every purchase in real time

  Authorized users in that age range do not get virtual cards, and the points they earn go to the primary account.

  ## Adult authorized users

  At **18 and up**, authorized users get virtual card numbers and can choose whether the rewards they earn go to them or to the primary cardholder. They can also make rent and other housing payments directly through the Bilt app and earn on those payments, the same way the primary cardholder does.

  Bilt says credit history reporting for authorized users 18 and over is coming later in **2026**. Teens added at 13 start reporting once they turn 18, which Bilt frames as a head start on a credit file rather than a blank one.

  The feature is reaching members of Bilt's Close Friends community first, with a broader rollout to all cardholders in the coming months. Bilt has not published a fee for adding an authorized user.

