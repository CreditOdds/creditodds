date: "2026-08-23"
title: "Citi Ends Sunoco Card Program October 31"
summary: "Citi is mailing Sunoco Rewards Credit Card holders notice that every account closes on October 31, 2026 because the Citibank credit card program with Sunoco is ending. The card's 5 cents per gallon fuel discount goes with it. Sunoco says a replacement Sunoco Rewards Plus card is coming, but applications are closed and no issuer has been named."
tags:
  - "discontinued"
bank: "Citi"
source: "Sunoco"
source_url: "https://www.sunoco.com/credit-cards"
body: |
  Citi is sending Sunoco Rewards Credit Card holders a letter telling them the
  account will be closed on **October 31, 2026**, because the Citibank, N.A.
  credit card program with Sunoco is ending. Cardholders posted the notice on X
  on **August 15** and again on r/CreditCards on **August 23**, so the mailing
  is still working through the file.

  The letter says the closure hits every accountholder and has nothing to do
  with any individual account or credit standing. No action is required, and a
  closed account cannot be reopened. Anyone carrying a balance keeps getting
  monthly statements under the existing cardholder agreement until the balance
  is paid off.

  ## The fuel discount ends with the card

  The Sunoco Rewards Card's core perk is **5 cents per gallon** off fuel at
  participating Sunoco locations, applied at the pump or as a monthly statement
  credit when the point of sale discount is unavailable. Sunoco's rewards terms
  require the account to stay open and current to earn, so the discount stops
  when the account closes.

  Sunoco has already put up a page for a successor product, the **Sunoco Rewards
  Plus Credit Card**, describing it as coming soon with applications closed and
  a waitlist in place. The marketing copy points to a general purpose card
  rather than a station only store card, promising earnings "everywhere you
  shop" and worldwide acceptance. Sunoco has not said who will issue it, what
  the rewards will be, or when it launches, noting only that details are subject
  to final approval and launch timing.

  Citi's own Sunoco application page is no longer taking new applicants. Existing
  cardholders who use the discount should plan on a gap between October 31 and
  whenever the new card actually ships.

