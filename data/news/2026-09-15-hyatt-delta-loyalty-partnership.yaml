body: |
  Hyatt and Delta Air Lines said on **September 9, 2026** that they are
  forming a long term strategic loyalty collaboration between World of Hyatt
  and Delta SkyMiles. Delta takes the place of American Airlines, which
  confirmed the same day that it is ending its own Hyatt partnership.

  The one benefit Hyatt has confirmed is dual earning. Eligible elite members
  of both programs will be able to earn **World of Hyatt points on qualifying
  Delta airfare** and **Delta miles on qualifying stays at Hyatt properties**.
  Hyatt describes this as one of the most requested benefits from members of
  both programs.

  Almost everything else is still unannounced. Hyatt says the collaboration
  launches "in the coming months" and that enrollment steps, eligibility
  rules, earning rates and additional benefits will be shared later. There is
  no start date, and no detail yet on whether elite status will be recognized
  across the two programs.

  ## What it means for cardholders

  Nothing changes on any credit card today. Chase issues the World of Hyatt
  and World of Hyatt Business cards, and American Express issues the Delta
  SkyMiles lineup, and none of those card agreements have been amended for
  this partnership. What the announcement does affect is where the points
  those cards earn can go. Cardholders who split spending between a Hyatt card
  and a Delta card should hold off on repositioning balances until the earning
  rates are published, since the terms that decide whether dual earning is
  worth chasing are exactly the ones Hyatt has not released.

