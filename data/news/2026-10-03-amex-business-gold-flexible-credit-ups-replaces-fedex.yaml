body: |
  American Express has changed the merchant list on the **Business Gold card's flexible business credit**. As of **October 1, 2026**, shipping purchases at **UPS.com** count toward the credit, and **FedEx is no longer eligible**.

  ## What the credit covers now

  The benefit is still worth up to **$20 in statement credits each month**, or up to **$240 a year**. Amex's card page now lists three eligible merchant groups:

  - **Grubhub** (U.S. purchases)
  - **U.S. office supply stores**
  - **Shipments at UPS.com**

  **Enrollment is still required**, and the credit remains monthly, so unused value does not roll over to the next month.

  ## Who this affects

  Business owners who used the credit for FedEx shipping or FedEx Office purchases will need to move that spend to UPS.com, Grubhub, or an office supply store to keep collecting the full $20 each month. Note that the new wording specifically covers shipments booked at **UPS.com**, so it is worth confirming that in-store purchases at UPS locations trigger the credit before relying on them.

  For cardholders who already ship with UPS, the change makes the credit easier to use without changing habits.

  The Business Gold card carries a **$375 annual fee**. The rest of its credit lineup was not part of this update.

