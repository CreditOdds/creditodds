title: "Amex Business Gold Swaps FedEx Credit for UPS"
summary: "The American Express Business Gold card's up to $20 monthly flexible business credit now covers shipments at UPS.com instead of FedEx, as of October 1, 2026. Grubhub and U.S. office supply store purchases still qualify, and enrollment is still required."
tags:
