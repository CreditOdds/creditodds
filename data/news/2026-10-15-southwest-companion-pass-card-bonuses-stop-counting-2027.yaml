body: |
  Southwest is changing how the Companion Pass is earned, and the biggest effect lands on its Chase co-brand cards. Starting **January 1, 2027**, Companion Pass qualifying points are retired and Companion Pass benefits will be earned through **Tier Qualifying Points (TQPs)** instead.

  ## What stops counting

  Under the new rules, several card-related earnings will still add Rapid Rewards points to your account but will not earn TQPs, so they will not help toward a Companion Pass:

  - New cardmember welcome bonuses
  - Referral bonuses
  - Card anniversary points
  - Bonus points from spend, such as 2x on gas
  - Partner spend, such as hotels and car rentals

  Everyday card spending still helps. Southwest says purchases on a Rapid Rewards credit card will earn **1 TQP for every $1 spent** starting in 2027.

  ## New thresholds

  - **Three Companion Pass trips** (a Milestone Reward): **95,000 TQPs** or **75 qualifying one-way flights**
  - **Unlimited Companion Pass trips** (Platinum status): **140,000 TQPs** or **100 qualifying one-way flights**

  Today, the pass requires 135,000 Companion Pass qualifying points, which a card welcome bonus can cover a large share of.

  ## What stays the same for now

  The current rules apply for the rest of 2026. Members who earn a Companion Pass in 2026 keep unlimited Companion Pass trips through **December 31, 2027**, and members already registered for a Companion Pass promotion will have it honored once they meet its requirements.

