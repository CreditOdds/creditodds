body: |
  Chase announced on **September 21, 2026** that Freedom cardmembers can now
  access Points Boost offers when redeeming through Chase Travel. On select
  hotel bookings, points are worth **up to 10% more** than their standard
  value. Chase says the benefit started that day, so there is no future
  effective date to wait for.

  Points Boost is not new on its own. Chase introduced it with the 2026
  Sapphire refresh, where it replaced flat portal redemption rates with
  rotating offers that lift the value of points on specific properties and
  flights. What changed is which cards can use it. Until this announcement it
  was a premium card feature, and the Freedom Flex carries **no annual fee**.

  ## What it is worth

  Freedom Flex points normally redeem at 1 cent each. A 10% uplift puts an
  eligible hotel booking at roughly **1.1 cents per point**. That is a modest
  gain, and it only applies to select properties in the Chase Travel
  inventory, with the offers refreshing periodically rather than sitting on a
  fixed list.

  It also does not change the better play for cardholders who also hold a
  Sapphire Preferred, Sapphire Reserve or an Ink card. Moving Freedom points
  into one of those accounts still unlocks transfers to airline and hotel
  partners, which regularly beat 1.1 cents. The addition matters most for
  people who hold the Freedom Flex on its own and redeem inside Chase Travel,
  where the alternative was a flat 1 cent.

  The Points Boost change arrived alongside the same refresh that removed cell
  phone protection from the card and dropped its 3% foreign transaction fee.

