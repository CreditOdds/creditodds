body: |
  American Express Travel announced on **August 12, 2026** that **351 new hotels**
  have joined its two premium booking programs, Fine Hotels + Resorts and The Hotel
  Collection. The combined portfolio now sits at **more than 3,400 properties across
  116 countries**. The additions include hotels in Tokyo, Beverly Hills and Lake Como,
  along with less-trafficked spots such as Portugal's Alentejo region, Australia's
  Whitsundays and Merida, Mexico.

  The expansion lands on the program's **35th anniversary**. Fine Hotels + Resorts
  launched in 1991 with 120 hotels.

  ## What cardholders get

  Fine Hotels + Resorts bookings are open to The Platinum Card, The Business Platinum
  Card, the Corporate Platinum Card and both Centurion cards. There is no minimum
  stay. Every FHR booking through Amex Travel carries daily breakfast for two,
  guaranteed **4 p.m. check-out**, room upgrade when available, and a **$100
  on-property credit**.

  The Hotel Collection is open to a wider set: the two Platinum cards, the American
  Express Gold and Business Gold cards, and Centurion. It requires a **two consecutive
  night** minimum and includes a room upgrade plus a $100 on-property credit.

  Both Platinum cards carry **up to $600 a year** in statement credits for eligible
  prepaid bookings in either program, issued as two separate **$300** credits covering
  January through June and July through December. That credit is separate from the
  $100 on-property credit, and it does not roll over, so the larger property list
  mainly matters for cardholders who have been struggling to find an eligible hotel
  in the right city before a half-year window closes.

