title: "Chase Moving Some OG Freedom Cards to Unlimited"
summary: "Chase is notifying some holders of the original Chase Freedom card that their accounts will be converted to Freedom Unlimited by November 20, 2026, according to Doctor of Credit. The 5% rotating categories end with the switch, while existing rewards carry over and the account number stays the same. Cardholders who want to keep rotating categories can ask Chase for a Freedom Flex instead."
