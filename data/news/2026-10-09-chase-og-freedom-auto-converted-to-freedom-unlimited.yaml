body: |
  Chase has started automatically product changing some holders of the original **Chase Freedom** card to the **Chase Freedom Unlimited**. Doctor of Credit reported the change on **October 8, 2026**, citing notices that cardholders shared on Reddit. Chase has not made a public announcement, and not every original Freedom account appears to be included.

  ## What the notice says

  According to the notice, the switch is automatic and will be completed by **November 20, 2026**. Until then, the current card keeps working. After the change:

  - The **5% rotating quarterly categories** end. The card earns Freedom Unlimited's flat rate on everyday purchases instead.
  - Existing rewards move over to the new card automatically.
  - The **account number stays the same**, but the expiration date and security code may change. A new physical card is mailed, and mobile wallets update on their own.

  Because the account itself is not closed, the change should not affect the age of the credit line.

  ## If you want to keep rotating categories

  The original Freedom has been closed to new applicants for years, and its closest current equivalent is the **Chase Freedom Flex**, which carries the same 5% quarterly categories. Doctor of Credit says affected cardholders should be able to call Chase and ask to move to a Freedom Flex instead of Freedom Unlimited. Chase reopened Freedom to Flex product changes in September, so that path is already available. Anyone who received a notice and prefers the Flex should make the request before **November 20**.

  Cardholders who already hold a Freedom Unlimited may also want to weigh whether a second one is useful, or whether the Flex adds more to their lineup. Doctor of Credit notes that Chase has run similar automatic conversions of original Freedom accounts in the past.

