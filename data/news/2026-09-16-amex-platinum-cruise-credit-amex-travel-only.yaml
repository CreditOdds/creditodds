body: |
  American Express has narrowed the booking channel for the Platinum Card's
  cruise benefit. Effective **September 15, 2026**, the Cruise Privileges Program
  onboard credit of **up to $300 per stateroom** applies only to eligible sailings
  booked through American Express Travel, either at AmexTravel.com or by calling
  the number on the back of the card. Cruises booked through an independent travel
  advisor, an online travel agency or any other third party no longer earn the
  credit.

  The remaining program terms are unchanged. The sailing has to be at least **five
  nights** with double occupancy on a participating cruise line, the full cost has
  to go on an eligible Card in the Card Member's name, the Card Member has to
  travel on the booked itinerary, and the benefit is capped at **three staterooms**
  per member per cruise. The credit itself ranges from **$100 to $300** depending
  on the cruise line and the fare booked.

  ## Why it matters

  Luxury cruises are one of the categories where booking through a specialist
  advisor is common, and advisors often layer their own consortium perks on top of
  the Amex credit. Cardholders who work with an advisor now have to choose between
  those perks and the onboard credit rather than stacking them.

  The American Society of Travel Advisors has requested a meeting with American
  Express and asked the company to postpone the change, saying it "limits consumer
  choice, disrupts established advisor-client relationships." American Express had
  not publicly commented on the objection as of the report.

  Anyone holding a cruise deposit made before September 15 should confirm with the
  booking channel whether the credit still attaches to that reservation.

