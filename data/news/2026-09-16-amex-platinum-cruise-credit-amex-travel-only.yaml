title: "Amex Platinum Cruise Credit Needs Amex Travel"
summary: "As of September 15, 2026, the Platinum Card's Cruise Privileges Program onboard credit of up to $300 per stateroom applies only to sailings booked through American Express Travel. Cruises booked with an independent travel advisor, an online travel agency or another third party no longer qualify. The American Society of Travel Advisors has asked Amex to meet and to delay the change."
