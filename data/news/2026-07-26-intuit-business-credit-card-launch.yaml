body: |
  Intuit launched the [Intuit Business](/card/intuit-business) credit card on **July 22, 2026**, a no annual fee World Elite Business Mastercard aimed at small businesses that keep their books in QuickBooks. The card is issued by **WebBank** and is open for applications now.

  Earning is flat and simple. The card pays **2% cash back** on everyday purchases with no stated cap, and **5% cash back** on Intuit products and services, which covers QuickBooks, TurboTax, and Mailchimp subscriptions. Transactional fees such as merchant services are excluded from the 5% rate. Intuit is also running a welcome offer of **$300 cash back after $3,000 in spend in the first three months**.

  ## The accounting hook

  The pitch is the integration rather than the rewards. Card transactions sync natively into QuickBooks, so receipts match to charges without a separate feed or import step. Intuit says approved businesses can go from application to spending in as little as **three minutes**, with a virtual card issued immediately that works online or in a mobile wallet.

  Businesses can issue **unlimited employee cards** at no extra cost, each with its own spending limit, category controls, and real time notifications.

  ## Where it lands

  A flat 2% on everything with no annual fee puts the card in the same tier as the established no fee business cash back cards, and the 5% Intuit category is worth real money to a business already paying for QuickBooks Online and TurboTax every year. A QuickBooks subscription is not required to apply.

