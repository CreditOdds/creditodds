body: |
  Alaska Air Group and Bank of America launched a refreshed **Atmos Rewards Visa Business Card** on **November 18, 2026**. The new version replaces the old one for all new applicants.

  ## Fee

  The annual fee is now a flat **$195** per company, with no charge for employee cards. The old card cost **$70 per company plus $25 per employee card**, so the change raises the cost for most businesses with fewer than five employee cards.

  ## Earning

  - **10x points** on qualifying Alaska and Hawaiian flights booked through Atmos for Business
  - **3x** on other eligible purchases made directly with Alaska or Hawaiian
  - **2x** on eligible dining, a new category
  - **1x** on everything else

  The old 2x categories for gas, EV charging, cable, streaming and local transit are gone.

  ## New benefits

  - **Four Alaska Lounge passes** per calendar year, one per quarter, replacing the $100 discount on Alaska Lounge+ membership
  - Up to **$120** in Global Entry or TSA PreCheck credits every four years
  - Free same-day confirmed flight changes for the primary cardholder
  - A **$50** airport food and drink voucher when a flight is canceled or delayed two or more hours
  - Free points sharing with up to 10 Atmos Rewards members
  - At **$100,000** in annual spend, 10,000 status points and a **50% off** base fare discount; both repeat at **$200,000**

  ## What goes away

  The refreshed card no longer includes the annual **$99 Companion Fare**. The spend-based 50% fare discount is its replacement.

  ## Existing cardholders

  Current cardholders are not moved to the new version and keep their existing benefits and fee. Applications submitted before November 18 are processed under the prior card. Cardholders who want to look at the new benefits can call Bank of America at 1-800-892-3219.

