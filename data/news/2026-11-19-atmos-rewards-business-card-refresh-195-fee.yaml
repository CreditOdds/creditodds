title: "Atmos Business Card Hits $195, Drops Companion"
summary: "Alaska Air Group and Bank of America refreshed the Atmos Rewards Visa Business Card on November 18, 2026. New applicants pay a flat $195 annual fee with free employee cards, earn 10x on qualifying Alaska and Hawaiian flights and get four lounge passes a year, but the $99 Companion Fare is gone. Current cardholders keep their existing card."
