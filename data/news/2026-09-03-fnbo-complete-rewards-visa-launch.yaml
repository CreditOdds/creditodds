body: |
  First National Bank of Omaha has launched the **Complete Rewards Visa
  Signature Card**, a no annual fee rewards card with an unusually high travel
  rate for its price. Doctor of Credit spotted the launch on September 2 and
  the card is live on FNBO's own site.

  ## Earning and welcome offer

  The card earns **5x points on travel**, **3x on streaming services**, **2x on
  fuel** and **1x on everything else**. FNBO lists no spending caps on the
  bonus categories.

  New cardholders get **15,000 bonus points after $500 in spend within the
  first three billing cycles**. FNBO values that at **$150**. The $500
  requirement is low enough that most applicants will clear it without
  planning around it.

  Points can be redeemed for cash back, gift cards, travel or merchandise.
  FNBO's marketing implies a 1 cent per point value on the welcome bonus, but
  the rewards terms are where the redemption rates actually live, so check
  those before assuming every option pays the same.

  ## The catch

  There is a **3% foreign transaction fee**, which is an awkward pairing with a
  5x travel category. Booking flights and hotels from home earns well, but the
  card is the wrong one to carry abroad.

  ## Where it fits

  A 5x travel rate with no annual fee is rare. The comparison points are cards
  like the Bank of America Travel Rewards and the Wells Fargo Autograph, which
  sit at 1.5x to 3x on travel. What FNBO does not offer is a transfer partner
  network, so the ceiling on these points is fixed. This is a card for people
  who want simple cash back style value on travel spending, not for anyone
  chasing outsized redemptions.

