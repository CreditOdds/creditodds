body: |
  Wyndham Rewards switched to a four tier free night award chart on
  **September 15, 2026**. Wyndham's own redemption page now lists
  **5,000, 15,000, 30,000 or 45,000 points** per bedroom per night. The
  previous chart had three tiers at 7,500, 15,000 and 30,000 points.

  Two things changed at the ends of the chart. The entry price drops from
  **7,500 to 5,000 points**, and a new **45,000-point** top tier lands above
  the old 30,000-point ceiling. The cheaper floor does not apply to every
  hotel that used to cost 7,500 points, since some of those properties move
  up to 15,000 instead. The properties most likely to reach 45,000 points are
  the resorts and Wyndham Grand hotels that previously sat at 30,000.

  ## What it means for Earner cardholders

  All four Wyndham Rewards Earner cards from Barclays earn points that now buy
  less at the top of the chart. The Earner Premier's **25% redemption
  discount** brings a 45,000-point night down to **33,750 points**, and the
  10% discount on the Earner and Earner Plus brings it to **40,500 points**.

  The annual free night certificates do not stretch to the new tier. The
  Earner Premier's free night covers a stay worth up to **30,000 points** and
  the Earner Plus certificate covers up to **15,000 points**, so a 45,000-point
  hotel sits outside both. The 15,000-point tier is unchanged, which leaves the
  Earner Plus anniversary award of 15,000 points still good for one night at
  that level.

