title: "Wyndham Adds 45,000-Point Award Night Tier"
summary: "Wyndham Rewards moved from three free night award tiers to four on September 15, 2026. The chart now runs 5,000, 15,000, 30,000 and 45,000 points per bedroom, replacing the old 7,500 floor with 5,000 and adding a 45,000-point top tier for the chain's most expensive properties."
