body: |
  PenFed Credit Union announced the **PenFed Defender Rewards Visa Signature** card on **October 8, 2026**. The no annual fee card is built around spending common in military households, including a bonus at base commissaries and exchanges.

  ## Earning rates

  - **5X points** on gas at the pump and at EV charging stations
  - **3X points** at supermarkets, restaurants and streaming services
  - **3X points** at sporting goods stores
  - **3X points** at military commissaries and exchange stores
  - **1X points** on everything else

  PenFed's announcement does not mention caps on the bonus categories.

  ## Fees and welcome offer

  The card has a **$0 annual fee** and **no foreign transaction fees**. New cardholders earn **15,000 bonus points** after spending **$1,500** in the first **90 days**. Applicants can choose between two new card designs with military-themed imagery.

  ## What to know

  PenFed did not publish a point value in its announcement. When the card was first previewed in July, Doctor of Credit estimated points at less than 1 cent each when redeemed for gift cards, which would put the real return on gas closer to 4% than 5%. Check PenFed's redemption options before treating the multipliers as cash back percentages.

  The card requires PenFed membership. Service members and many government employees can join for free, and others can qualify through a one-time donation to a partner military charity. PenFed says thousands of people joined a waitlist for the card ahead of launch, so availability may still be rolling out. The Defender Rewards joins the **Power Cash Rewards** and **Pathfinder Rewards** in PenFed's Visa Signature lineup.

