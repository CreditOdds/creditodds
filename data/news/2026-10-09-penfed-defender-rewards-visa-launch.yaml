title: "PenFed Launches Defender Rewards Visa Card"
summary: "PenFed Credit Union announced the Defender Rewards Visa Signature on October 8, 2026, a $0 annual fee card aimed at military members. It earns 5X points on gas and EV charging, 3X at supermarkets, restaurants, streaming, sporting goods stores and military commissaries and exchanges, and 1X elsewhere, with no foreign transaction fees. New cardholders get 15,000 bonus points after spending $1,500 in 90 days."
