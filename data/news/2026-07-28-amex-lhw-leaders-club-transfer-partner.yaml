body: |
  American Express added **Leaders Club**, the loyalty program of Leading Hotels
  of the World, as a Membership Rewards transfer partner on **July 28, 2026**.
  The addition takes the hotel side of the program from three options to four,
  alongside Marriott Bonvoy, Hilton Honors, and Choice Privileges.

  Points transfer at a **4:1** ratio. That means **1,000 Membership Rewards
  points convert to 250 Leaders Club points**, the smallest increment available.
  The ratio looks unfavorable next to the 1:1 Marriott Bonvoy and Choice
  Privileges rates and the 1:2 Hilton Honors rate, but Leaders Club points carry
  far more value per point, so the comparison does not translate directly.

  ## How the ratio compares to Citi

  Citi ThankYou has transferred to Leaders Club at **5:1** for years, so Amex's
  4:1 rate produces more Leaders Club points per point transferred. Citi runs
  periodic transfer bonuses on the partnership, which can close or reverse that
  gap while one is live.

  Leaders Club points are generally valued at roughly **8 cents each** toward
  the cost of a stay. At the 4:1 ratio that works out to about **2 cents per
  Membership Rewards point**, a strong figure for a hotel transfer. Leading
  Hotels of the World is a collection of independent luxury properties in about
  80 countries, including hotels that cannot be booked through any of the large
  chain programs.

  Two cautions apply. Award stays booked with Leaders Club points can carry
  taxes and fees that do not appear until the final checkout screen, so the
  effective value per point can land below the headline number. And the
  collection is small, so availability at any given property is limited.

  Platinum Card and Business Platinum Card members already receive complimentary
  Leaders Club Sterling status through a separate Amex benefit, which layers
  breakfast and upgrade priority on top of an award stay.

