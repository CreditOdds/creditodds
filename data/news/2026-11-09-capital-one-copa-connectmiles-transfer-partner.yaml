title: "Capital One Adds Copa Transfers at 2:1.5 Rate"
summary: "Capital One added Copa Airlines ConnectMiles as a transfer partner, first reported on November 2, 2026. Miles move at 2:1.5, so 1,000 Capital One miles become 750 ConnectMiles. A 30% launch bonus lifts that to 975 ConnectMiles per 1,000 miles through December 1, 2026. Citi ThankYou points from annual-fee cards such as the Strata Premier transfer to Copa at 1:1; Citi's no-annual-fee cards get 1,000:700."
