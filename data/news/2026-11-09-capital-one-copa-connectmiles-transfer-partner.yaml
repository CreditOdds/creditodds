body: |
  Capital One added **Copa Airlines ConnectMiles** to its list of airline transfer partners, a change first reported on **November 2, 2026**. Unlike most of Capital One's partners, the new one does not transfer at 1:1. Miles move at a **2:1.5** ratio, so **1,000 Capital One miles** become **750 ConnectMiles**. The minimum transfer is 1,000 miles, according to Frequent Miler, which first reported the addition.

  To mark the launch, Capital One is running a **30% transfer bonus** through **11:59 p.m. Eastern on December 1, 2026**. With the bonus, 1,000 Capital One miles land as **975 ConnectMiles**, still a little short of 1:1.

  ## How it compares

  Copa has been a popular addition across the major programs this fall. Citi added ConnectMiles as a ThankYou transfer partner in late October at **1:1** for annual-fee cards such as the Strata Premier and Strata Elite, so those cardholders get a better rate than Capital One's bonus-boosted 0.975. Citi's no-annual-fee cards, including the Citi Strata, transfer at 1,000:700. Rove Miles also transfers to Copa at 1:1. For Capital One cardholders the appeal is access to Copa's ConnectMiles program and its Star Alliance partner awards, rather than the exchange rate itself.

  ## Who this affects

  The partner applies to Capital One cards that earn transferable miles, such as the Venture X and Venture Rewards cards. The bonus applies to transfers completed before the deadline.

  Even with the bonus, 2:1.5 is a weak baseline, and the 30% boost disappears on December 2. Cardholders with a specific Copa award in mind should price it before the deadline; everyone else loses nothing by waiting to see whether Capital One improves the rate.

