body: |
  Fidelity has told existing Rewards Visa Signature cardholders that it is
  swapping two benefits for two others, with the removals taking effect on
  **January 1, 2027**.

  ## What is going away

  **Purchase Security** ends on January 1, 2027. It currently covers new retail
  purchases for the first **90 days** against theft, fire, vandalism and certain
  water or weather damage, capped at **$500 per claim** and **$50,000 per
  cardholder**.

  **Lost Luggage Reimbursement** ends on the same date. It currently covers
  checked and carry-on bags up to **$3,000** when the common carrier ticket is
  charged to the card.

  ## What is being added

  Cardholders get **emergency medical and dental coverage** worth up to
  **$2,500** for expenses from a sickness or accidental injury on a trip booked
  with the card.

  They also get one complimentary year of **National Car Rental Emerald Club
  Executive level membership**, which requires enrollment by **December 31,
  2026**. Because it runs a year from enrollment rather than renewing, it works
  more like a one time offer than a standing perk.

  ## What is not changing

  The no annual fee card keeps its unlimited **2% cash back**, no foreign
  transaction fees, the Auto Rental Collision Damage Waiver up to **$75,000**,
  and up to **$100** in reward points toward Global Entry or TSA PreCheck once
  every four years.

  The net effect is a shift away from purchase and baggage protection toward
  travel coverage. Cardholders who lean on Purchase Security for electronics or
  other big ticket buys have until the end of the year before that coverage
  stops.

