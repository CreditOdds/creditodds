title: "Fidelity Visa Drops Two Perks, Adds Two"
summary: "Fidelity has notified Rewards Visa Signature cardholders that Purchase Security and Lost Luggage Reimbursement come off the card on January 1, 2027. Replacing them are up to $2,500 in emergency medical and dental coverage on trips booked with the card, plus one complimentary year of National Car Rental Emerald Club Executive status for cardholders who enroll by December 31, 2026."
