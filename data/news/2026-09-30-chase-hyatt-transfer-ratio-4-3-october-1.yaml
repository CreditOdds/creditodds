body: |
  The last day to move Chase Ultimate Rewards points into World of Hyatt at a full 1:1 ratio on a Sapphire Preferred or Ink Business Preferred is **September 30, 2026**. On **October 1, 2026**, the transfer ratio for those cards drops to **4:3**, so every 4 Chase points become 3 Hyatt points.

  Chase announced the change on **June 15, 2026**. New applicants approved on or after that date have been transferring at 4:3 from day one. Cardholders who opened their accounts before June 15 were grandfathered at 1:1 through the end of September, and that window closes this week.

  ## Which cards are affected

  The 4:3 ratio applies to the **Chase Sapphire Preferred**, the **Ink Business Preferred**, and the legacy Ink Plus and Corporate Flex cards that are no longer open to new applicants. The **Chase Sapphire Reserve** and **Sapphire Reserve for Business** keep the 1:1 ratio, so points pooled onto one of those cards still move to Hyatt at full value.

  ## What the math looks like

  Transfers must be made in **1,000 point increments**. Under the new ratio, a 20,000 point Hyatt award needs 26,667 Ultimate Rewards points, which rounds up to a **27,000 point** transfer. A 60,000 point Hyatt redemption that used to cost 60,000 Chase points will cost **80,000** after the change, an increase of about a third.

  ## What to do before the deadline

  If you hold a Sapphire Preferred or Ink Preferred and have a Hyatt stay in mind, transferring the points you need before October 1 locks in the old ratio. Hyatt points do not expire as long as the account sees activity every 24 months, so speculative transfers for a planned stay carry limited risk. Cardholders who also hold a Sapphire Reserve can instead move Ultimate Rewards to that card and transfer from there at 1:1 after the change takes effect.

