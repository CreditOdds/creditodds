title: "Chase Hyatt Transfers Drop to 4:3 on October 1"
summary: "Starting October 1, 2026, Chase Sapphire Preferred and Ink Business Preferred cardholders who opened their accounts before June 15 will transfer Ultimate Rewards to World of Hyatt at 4:3 instead of 1:1. Sapphire Reserve and Sapphire Reserve for Business keep the 1:1 ratio. Transfers still run in 1,000 point increments."
