summary: "U.S. Bank launched the Business Essentials Visa and Business Essentials Plus Visa Signature on September 28, 2026. Both earn a flat 2% cash back, rising to 2.5% and 3.5% with qualifying business checking balances. The no annual fee Essentials offers $500 after $5,000 in 150 days, and the $295 Plus adds 5% on its top category up to $200,000 a year with a $1,000 bonus after $15,000."
