title: "Samsung Launches Galaxy Card With Barclays"
summary: "Samsung and Barclays launched the Samsung Galaxy Card, Samsung's first US credit card. The no-annual-fee Visa earns 5% back on Samsung purchases, 3% on everything bought through Samsung Wallet, 2% on streaming, and 1% elsewhere. Applications opened July 22 on Samsung.com and at Samsung retail stores."
