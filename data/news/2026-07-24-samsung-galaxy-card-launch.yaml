source_url: "https://www.prnewswire.com/news-releases/samsung-launches-its-first-credit-card-in-the-us--a-mobile-wallet-experience-that-turns-everyday-spending-into-cash-rewards-302829997.html"
body: |
  Samsung is now in the credit card business. The **Samsung Galaxy Card**, announced **July 20** with Barclays, is Samsung's first credit card in the US. Applications opened **July 22** at Samsung.com and at Samsung retail stores.

  The card is issued by **Barclays** on the **Visa** network and carries **no annual fee**. Rewards come as cash back:

  - **5%** on purchases made directly from Samsung, in store or online
  - **3%** on purchases made using Samsung Wallet
  - **2%** on streaming services such as Netflix, Disney+, and Spotify
  - **1%** on everything else

  New cardholders can earn a **$200** cash rewards bonus after **$2,000** in purchases in the first **90 days**. Paying for the Samsung VIP Advantage membership with the card also takes 20% off that membership.

  The card is provisioned straight into Samsung Wallet at approval, and Samsung is positioning it as a wallet-first product for Galaxy owners, the same play Apple made with the [Apple Card](/card/apple-card).

  The **3% Samsung Wallet rate** is the number that matters for everyday spending. Samsung Wallet taps anywhere contactless Visa is accepted, so for someone carrying a Galaxy phone this behaves like a 3% card on most in-person spending, with no annual fee attached. That beats the flat 2% cards most people use as their default, though rewards redeem as cash rewards through Barclays rather than as a simple statement credit, and the terms behind "eligible purchases" are worth reading once Barclays publishes the full cardmember agreement.

  We will add the Galaxy Card to our card database once the full public terms are out.

