body: |
  Spirit Airlines cardholders finally have an answer. Bank of America has begun
  emailing them that their Spirit Airlines Mastercard accounts are being
  converted to the **Bank of America Customized Cash Rewards Mastercard**, the
  bank's no annual fee cash back card. Spirit ceased operations on **May 2,
  2026**, which left the co-brand without an airline behind it.

  ## What carries over

  The conversion is a product change on the existing account, not a new
  application. Bank of America says the **account number, APR and credit line**
  do not change, and the balance and transaction history move automatically.
  Notably, the converted card keeps **no foreign transaction fees**, which the
  standard Customized Cash Rewards does not normally offer.

  Cardholders are being mailed a replacement card and told to keep using the
  current one until it arrives. Expiration dates and CVV codes may change, so
  recurring charges and digital wallets need updating after activation.

  ## What changes

  Earning moves from Spirit points to cash back. The Customized Cash Rewards
  pays **3%** in one category you select from a list that includes gas, online
  shopping, dining, travel, drug stores and home improvement, plus **2%** at
  grocery stores and wholesale clubs. Those bonus rates apply to a combined
  **$2,500** in spending each quarter, then drop to **1%**. Everything else
  earns **1%**.

  Some converted accounts are also being targeted with extra cash back on all
  purchases through **September 30, 2026**. Check your own email rather than
  assuming the offer applies, since the targeting appears selective.

