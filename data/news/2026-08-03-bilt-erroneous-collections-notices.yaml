body: |
  Bilt confirmed on **August 1, 2026** that some cardholders were sent to
  collections by mistake. Affected users received notices from the collections
  agency **Tate and Kirlin** claiming unpaid debt, and some saw the adverse
  action reported to the credit bureaus.

  A Bilt spokesperson acknowledged that a small number of customers received
  unexpected collections notices, said the company is in contact with the
  agency responsible, and said the erroneous reports would be deleted
  immediately. Bilt expects the credit bureaus to update affected reports
  within **2 to 5 business days**.

  ## Which cards are affected

  The reports trace back to the original Bilt Mastercard issued by **Evolve
  Bank**, the beta version of the card given out before **March 2022**. The
  later Wells Fargo version of the Bilt Mastercard and the Cardless version
  are not affected.

  ## What cardholders should do

  The damage is not cosmetic for everyone. One cardholder reported a
  **60 point** credit score drop while in the middle of a home purchase
  approval. Anyone who held the early Evolve issued card should pull their
  credit reports from all three bureaus and confirm the collections entry is
  gone once the 2 to 5 business day window passes. If it is still there,
  dispute it directly with the bureau and keep the Bilt statement on file.

  Cardholders who took a measurable financial hit, such as a denied loan or a
  worse mortgage rate tied to the drop, should document the timeline and the
  scores before and after. Bilt has not published a public notice or said how
  many accounts were caught up in the error.

