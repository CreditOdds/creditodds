title: "Bilt Sends Some Cardholders to Collections"
summary: "Bilt confirmed on August 1, 2026 that a small number of cardholders received collections notices from Tate and Kirlin in error. The reports hit holders of the original Evolve Bank version of the Bilt Mastercard issued before March 2022. Bilt says the erroneous reports are being deleted and credit bureaus should update within 2 to 5 business days."
