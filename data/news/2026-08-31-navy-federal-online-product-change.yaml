body: |
  Navy Federal Credit Union has added an automated credit card product change
  tool to its website, letting members switch card products without calling in.
  Doctor of Credit reported the feature on **August 31, 2026**.

  The path is Log in, then Accounts, then select the credit card, then Manage
  Cards or Card Management, then Card Benefits, then Credit Card Product Change.
  The tool is browser only right now. It does not appear in the Navy Federal
  mobile app.

  ## What you can switch to

  Most members are shown three targets:

  - **More Rewards American Express**
  - **GO REWARDS**
  - **cashRewards**

  ## The one year rule

  The product change section only surfaces options once the account is at least
  **one year old**. Members with a newer card see no choices at all.

  Product changes have been available at Navy Federal for a long time, so this
  is a change in how the request is made rather than a new capability. That
  still matters for anyone who wants to move off a card without opening a new
  account or sitting in a phone queue, since a product change keeps the account
  age and the credit line intact.

