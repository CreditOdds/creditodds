title: "Citi to Buy Kard for Card Offers"
summary: "Citi's U.S. Consumer Cards business said on August 13, 2026 that it has agreed to acquire Kard Financial, a merchant-funded rewards and commerce media platform. Citi says the deal will bring more personalized offers to its 70 million cardmembers. Financial terms were not disclosed and the deal still needs to clear customary closing conditions."
