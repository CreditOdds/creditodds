body: |
  Citi announced on **August 13, 2026** that its U.S. Consumer Cards business has
  agreed to acquire **Kard Financial, Inc.**, a commerce media and rewards platform.
  The deal is subject to customary closing conditions, and Citi did not disclose
  financial terms, saying the transaction is not material to its results.

  Kard runs a platform that connects banks and fintechs with merchants through
  transaction data and merchant-funded rewards. Its system matches spending
  patterns to relevant offers, the same basic mechanism behind card-linked offer
  programs such as Citi Merchant Offers, Amex Offers and Chase Offers.

  ## What it means for cardholders

  Citi cited **70 million cardmembers** across its general-purpose and store cards
  as of December 31, 2025. Citi executive Abhinav Anand framed the deal around
  helping customers "get more value from their everyday spending," and Kard chief
  executive Ben Mackinnon pointed to reaching those 70 million cardmembers.

  Nothing changes on any Citi card today. There is no announced change to earning
  rates, annual fees, or ThankYou Points, and Citi has not said when Kard's
  technology will appear inside its apps or how the current Citi Merchant Offers
  experience will differ. What the announcement signals is where Citi is putting
  its money: merchant-funded offers rather than richer baseline earning rates.

  For cardholders, the practical read is to keep checking the Merchant Offers tab
  in the Citi app and on citi.com, since that is the surface most likely to change
  once the acquisition closes. Citi gave no expected closing date.

