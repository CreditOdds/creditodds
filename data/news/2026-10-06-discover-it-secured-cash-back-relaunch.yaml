body: |
  Capital One is taking applications for the Discover it Secured card again. The card relaunched on **October 5, 2026** under the name **Discover it Secured Cash Back Credit Card**, after applications were paused on **June 2, 2026** during the move of Discover's card business to Capital One.

  ## Lower deposits for some applicants

  The biggest change is the security deposit. Discover now asks for a refundable deposit of **$49, $99 or $200**, depending on creditworthiness, and every approved applicant gets a credit line of at least **$200**. That means some applicants can open a $200 line while putting down far less than $200. No credit score is required to apply.

  ## Rewards and fees

  The earning structure follows the old card:

  - **5% cash back** on rotating quarterly categories, with activation required
  - **1% cash back** on all other purchases
  - **Cashback Match** at the end of the first year, which matches all cash back earned in that year dollar for dollar
  - **$0 annual fee**

  ## Graduating to an unsecured card

  Cardholders with a positive payment history can earn back their deposit and move up to the unsecured **Discover it Cash Back** card. Discover does not state a fixed timeline for that review on the product page.

  The card is issued by Capital One, which now runs Discover as one of its brands. Applications are open on Discover's website.

