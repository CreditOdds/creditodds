title: "Capital One Relaunches Discover it Secured"
summary: "Capital One reopened applications for the Discover it Secured card on October 5, 2026, now called the Discover it Secured Cash Back Credit Card. Refundable deposits start at $49 for a credit line of at least $200, with no annual fee, 5% rotating categories and first-year Cashback Match. Applications had been paused since June 2, 2026."
