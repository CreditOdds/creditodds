body: |
  American Express is adding a new benefit to **The Business Platinum Card**: a complimentary membership to **ZO by Tishman Speyer**, a network of members' lounges and coworking spaces. The benefit starts on **October 22, 2026**, according to details the Amex PR team shared with Doctor of Credit.

  ## What the membership includes

  - **Unlimited access to ZO Clubhouse** lounges, plus **4 guest day passes per week** at Clubhouse locations.
  - **4 complimentary day passes per month** to U.S. ZO Studio coworking locations. Studio visits must be reserved ahead of time in the ZO app or on the ZO website.
  - **Up to $500 in statement credits** per eligible card account each calendar year, usable toward event space bookings at ZO or Studio locations and/or a ZO Dining Club membership, when paid with an eligible Amex card.

  ## Where it works

  ZO has **20+ locations across six U.S. cities**: New York, Boston, Washington, D.C., Chicago, San Francisco and Los Angeles.

  ## How to activate

  Cardholders do not need to enroll in the benefit with American Express. Instead, they activate their ZO membership online or through the ZO app before their first visit. Card Members also get a dedicated ZO website and app experience that lists participating spaces and explains how to earn the statement credits.

  Amex has not stated an end date for the benefit or a retail value for the membership.

