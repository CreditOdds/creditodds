title: "Uber One Cuts Ride Credits From 6% to 5%"
summary: "Uber is emailing Uber One members that eligible rides will earn 5% in Uber One credits instead of 6% in the coming weeks. The same notice adds one extra adult and household teens to a membership at no cost. Amex Platinum covers the membership with a credit of up to $10 a month, and Apple Card carries a six month Uber One trial."
