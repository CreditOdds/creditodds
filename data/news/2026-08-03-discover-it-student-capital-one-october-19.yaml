body: |
  Capital One sent an email on **August 2, 2026** telling Discover it Student
  cardholders that their accounts move to the Capital One website and app on
  **October 19, 2026**. Student cards were held back from the earlier wave of
  Discover accounts that transitioned on **July 27, 2026**, so this is a
  separate cutover with its own date.

  ## What changes

  The account management surface is the change. After October 19, cardholders
  sign in through Capital One rather than Discover to see statements, make
  payments, and manage the account.

  ## What stays the same

  Capital One says the Discover brand is not going away and the card stays on
  the **Discover network**. The email confirms the physical card, the card
  number, and the APRs do not change, and the card keeps its **no annual fee**
  structure. The rewards program carries over as well, including **5 percent**
  cash back in rotating quarterly categories on up to **$1,500** in purchases
  each quarter. Existing rewards balances move with the account, and customer
  service stays available around the clock.

  ## One thing to note

  The delayed timing has a cost for this group. Capital One ran a $100 per
  card Paze promotion tied to the migration that has already ended, so student
  cardholders waiting until October cannot claim it.

  Cardholders should confirm that autopay and any saved payment details carry
  over correctly after the switch, and watch for a Capital One login setup
  prompt in October.

