body: |
  First National Bank of Omaha has launched the **Complete Rewards Visa Signature Card**, a
  no annual fee rewards card that went live on **September 2, 2026**.

  The earning structure is unusually top heavy for a card with no annual fee. FNBO's own
  product page lists **5x points per $1 on travel**, **3x on streaming services**, **2x on
  fuel** and **1x on everything else**. A 5x travel rate with no annual fee is rare, and it
  sits above what most no fee travel cards from larger issuers pay on the same spending.

  The welcome offer is **15,000 bonus points after $500 in spend within the first three
  billing cycles**. FNBO values that at **$150**. Points can be redeemed for cash back, gift
  cards, travel or merchandise, and the bank has not published a firm cent per point figure
  for every redemption path.

  ## The catch

  The card charges a **3% foreign transaction fee**, according to Doctor of Credit. That is
  a meaningful limitation on a product whose headline category is travel, since any purchase
  billed outside the United States gives back part of the 5x return. Cardholders who want
  the 5x rate will get the most out of it on travel booked domestically in dollars.

  The $500 spend threshold is low compared with the bonuses on most travel cards, which
  makes the offer easy to complete, but the bonus itself is small. The reason to look at
  this card is the ongoing 5x travel rate rather than the sign up bonus.

