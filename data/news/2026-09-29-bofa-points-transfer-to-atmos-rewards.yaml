body: |
  Alaska Airlines announced at its investor and media day on **September 29, 2026** that customers holding eligible **Bank of America** card products will be able to transfer their points into **Atmos Rewards** starting in **2027**.

  Alaska did not say which Bank of America cards will qualify or what the transfer ratio will be. Bank of America's own rewards programs do not currently offer airline transfer partners, so this would be a new redemption path for its cardholders. Alaska also said it plans to add transfers from other financial institutions over time.

  ## Business card refresh in late 2026

  Alaska also plans to refresh the **Atmos Rewards Visa Business Card**, issued by Bank of America, in **late 2026**. Benefits named so far:

  - **10x** points on eligible purchases made through Atmos Rewards for Business
  - Lounge passes
  - Free same day confirmed flight changes

  Full details are expected later this fall. Alaska has not announced a new annual fee or welcome offer for the refreshed card.

  ## Debit card coming in early 2027

  Separately, Atmos Rewards will launch a **debit card** in **early 2027** that earns both Atmos points and status points. Alaska lists flight and onboard purchase discounts, free points sharing and no foreign transaction fees among its features. Preregistration is open at atmosrewards.com/debit.

  None of these changes are live yet. We will update when Alaska and Bank of America publish the full terms.

