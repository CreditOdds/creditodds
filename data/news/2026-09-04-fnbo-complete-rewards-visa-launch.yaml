body: |
  First National Bank of Omaha has added a general-purpose rewards card to its own lineup. The **Complete Rewards Visa Signature** went live on **September 2, 2026** with **no annual fee**.

  ## Earning Structure

  - **5x points** per dollar on travel
  - **3x points** per dollar on streaming services
  - **2x points** per dollar on fuel
  - **1x point** per dollar on everything else

  The welcome offer is **15,000 bonus points after $500 in purchases within the first three billing cycles**. FNBO values those points at **$150**, which puts the baseline redemption rate at 1 cent per point. Points can go toward cash back, gift cards, travel, or merchandise.

  ## The Catch for a Travel Card

  The card charges a **3% foreign transaction fee**. A 5x travel rate is the strongest earning rate on the card, but the fee makes it a poor choice for spending abroad, so the travel category is really aimed at flights, hotels, and rentals booked at home in dollars. FNBO has not published a cap on bonus earning in the offer page itself and points to its rewards terms for limits, so anyone planning heavy travel spending should read those terms before applying.

  As a Visa Signature product it includes the standard network package: zero liability protection, emergency card replacement, and pay-per-use roadside dispatch.

  ## Where It Fits

  FNBO is better known in the rewards world for co-brand products such as the Amtrak Guest Rewards cards. A self-branded card earning 5x on travel with no annual fee is a more aggressive move than the bank's usual proprietary lineup, though the 3% foreign transaction fee and an ordinary 1 cent per point redemption rate keep it short of the no-fee travel cards from the largest issuers.

