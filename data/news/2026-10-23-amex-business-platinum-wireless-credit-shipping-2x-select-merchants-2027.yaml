title: "Business Platinum Narrows Wireless, Shipping"
summary: "Starting February 17, 2027, The Business Platinum Card from American Express will limit its $10 monthly wireless credit to 11 named carriers, including Verizon, AT&T and T-Mobile. Its 2x points on U.S. shipping will only apply to purchases made directly with UPS, FedEx, USPS, Auctane, DHL, Worldwide Express and Old Dominion Freight Line."
