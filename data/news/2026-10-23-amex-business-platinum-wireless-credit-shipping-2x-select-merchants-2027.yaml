body: |
  American Express is narrowing two benefits on **The Business Platinum Card** to named merchants only, effective **February 17, 2027**. The Amex card page now flags both the wireless credit and the 2x shipping category with "select merchants only," and the merchant lists were reported by DansDeals on October 22, 2026.

  ## Wireless credit

  The card pays up to **$10 a month** (up to **$120 a year**) in statement credits for wireless phone service bought directly from a U.S. provider, with enrollment required. Starting February 17, the credit will only cover service from **Verizon, AT&T, T-Mobile, Frontier, Comcast, Charter, Spectrum Mobile, UScellular, Optimum, Ultra Mobile and Mint Mobile**.

  ## 2x on shipping

  The card earns **2x Membership Rewards points** at U.S. shipping providers, part of a group of 2x categories capped at **$2 million** in combined purchases per calendar year. After the change, shipping purchases will only earn 2x when made directly with **UPS, FedEx, the United States Postal Service, Auctane, DHL, Worldwide Express or Old Dominion Freight Line**.

  ## Who is affected

  Cardholders who pay for phone service through a carrier outside the list will lose the monthly credit, and businesses that ship through freight brokers, resellers or smaller carriers may see that spending fall to 1x. The other 2x categories, construction and hardware suppliers, electronics and software providers, and purchases of $5,000 or more, are not shown as changing.

  A similar change hits the **Business Gold** card on the same date, where wireless and advertising purchases will need to come from named merchants to earn 4x.

