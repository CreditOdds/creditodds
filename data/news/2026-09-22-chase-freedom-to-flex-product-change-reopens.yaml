title: "Chase Reopens Freedom to Flex Product Change"
summary: "Chase is again allowing product changes from the original Chase Freedom, a Visa, to the Chase Freedom Flex, a Mastercard. Chase suspended Visa to Mastercard product changes last year. Doctor of Credit reported the reversal on September 22, 2026, days after the Freedom Flex refresh went live."
