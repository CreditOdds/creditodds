body: |
  American Airlines announced on **August 3, 2026** that it is restructuring
  Admirals Club membership pricing effective **August 23, 2026**. General
  AAdvantage members currently pay **$850** a year, with discounted rates for
  elites reaching as low as **$750**. Every one of those numbers goes up.

  ## The new pricing

  A traditional membership will be priced by AAdvantage status: **$1,400** for
  general members, **$1,350** for Gold, **$1,300** for Platinum, **$1,250** for
  Platinum Pro, and **$1,200** for Executive Platinum. For a general member
  renewing, that is roughly a **75 percent** increase. The traditional
  membership keeps what it covers today, including unlimited entry when flying
  an eligible same-day American flight, complimentary guest access, and
  admission to partner lounges.

  Alongside it, American is adding a **single membership** at **$750** a year
  or **75,000** AAdvantage miles. It is cheaper, but narrower: it admits the
  member only, with no guest privileges and no partner lounge access.

  ## Household memberships are going away

  The household option, which let members add a partner, is being retired.
  Existing memberships stay valid through their current term. Anyone renewing
  on or after **October 3, 2026** has to pick between the traditional and
  single tiers at the new prices.

  ## What it means for cardholders

  The change lands on the same date as the annual fee increase on the Citi
  AAdvantage Executive World Elite Mastercard, which moves from **$595** to
  **$695** on August 23. That card still comes with a full Admirals Club
  membership, so at $695 it undercuts the $1,400 cash price by a wide margin
  and is now the cheapest route to a membership with guest and partner lounge
  access. Cardholders weighing the higher annual fee should factor that gap in
  before deciding at renewal.

