title: "Barclays Launches Carnival Rewards Mastercard"
summary: "Carnival Cruise Line and Barclays launched the no annual fee Carnival Rewards Mastercard on September 1, 2026. It earns up to 6X on eligible Carnival purchases, 2X at restaurants and grocery stores, and 1X elsewhere, with a 50,000 point welcome bonus after $1,000 in spend in 90 days. Existing Carnival World Mastercard holders move to the new product during their next billing cycle."
