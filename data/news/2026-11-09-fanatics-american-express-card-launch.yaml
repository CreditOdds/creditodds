title: "Fanatics and Amex Unveil No-Fee Sports Card"
summary: "Fanatics announced the Fanatics American Express Card on November 9, 2026. The no-annual-fee card earns 5% FanCash at Fanatics brands, 8% or more in the Fanatics app, 5% on tickets and select streaming, and 2% everywhere else. U.S. fans can join a waitlist now, with application invitations starting later in 2026. Membership Rewards points now transfer to FanCash at 1,000 points for $10."
