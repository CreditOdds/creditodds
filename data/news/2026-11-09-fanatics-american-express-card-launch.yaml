body: |
  Fanatics unveiled the **Fanatics American Express Card** on **November 9, 2026**. The card was built with American Express and Imprint, runs on the American Express network, and carries **no annual fee**. Starting today, fans in the U.S. can join a waitlist. Fanatics says invitations to apply will go out starting later this year.

  ## Earning

  Rewards are paid in FanCash, the currency used across Fanatics properties:

  - **5%** FanCash on purchases across the Fanatics ecosystem, including Fanatics.com, Lids, Mitchell & Ness, Fanatics Collect, Fanatics Live and Topps.com
  - **8% or more** on purchases made in the Fanatics app
  - **5%** on tickets and select streaming services
  - **2%** on everything else

  New cardmembers get **$100 FanCash** after spending **$1,000** in the first 90 days, plus another **$100 FanCash** for spending at least $500 a month for 12 consecutive months.

  ## Design and perks

  Cardmembers pick from more than **500 trading-card designs** featuring NBA, NFL, UFC and WWE athletes, with more leagues promised later. Other perks include quarterly early access to select Topps releases, Fanatics Fest floor access, and Fanatics ONE status with 2,500 tier points at opening and each year after. Amex network protections, Amex Offers and Amex Experiences also apply.

  Fanatics also previewed a Championship Challenge: once it launches, cardmembers who correctly predict all four MLB, NBA, NFL and NHL champions get a shot at up to **$100,000** of annual card spending back.

  ## Membership Rewards transfers

  The more immediate change for existing Amex cardholders is a new transfer partner. As of **November 9**, eligible U.S. Membership Rewards members with American Express-issued cards can move points into FanCash at **1,000 points for $10**, a flat 1 cent per point. Fanatics is the first sports transfer partner in the Membership Rewards program.

  The press release does not name the issuing bank. Imprint, the fintech that also powers the Safeway forU American Express card, is named as a build partner. Full earning caps and terms were not published with the announcement.

