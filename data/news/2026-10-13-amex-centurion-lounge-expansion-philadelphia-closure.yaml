body: |
  American Express announced four Centurion Lounge projects on **October 8, 2026**, and the one that affects travelers soonest is a closure. The **Philadelphia (PHL)** lounge shuts for renovation on **October 16, 2026** and is expected to reopen by the **end of 2027**. When it returns it will span two floors and roughly **12,000 square feet**, close to double its current size.

  ## Newark slips to 2027

  The planned **Newark (EWR) Terminal A** lounge, previously expected in 2026, is now slated to open in **2027**. Amex enlarged the design from about 18,000 square feet to more than **30,000 square feet** across two floors, which would make it the largest Centurion Lounge in the network. Once open, Amex would have a lounge at all three major New York area airports.

  ## Houston and London

  - **Houston (IAH):** the existing lounge grows from about 8,000 to more than **23,000 square feet**, with completion targeted for **2028**.
  - **London Heathrow (LHR):** a second Heathrow lounge of about **9,000 square feet** is planned for Terminal 5 in **2028**, alongside the current Terminal 3 location.

  ## Who gets in

  Access rules are unchanged. The Platinum Card, Business Platinum, Corporate Platinum and Centurion members get complimentary entry with a same-day boarding pass, within three hours of departure or five hours on a connection. Delta SkyMiles Reserve and Reserve Business cardholders get in only when flying a same-day Delta flight booked with a U.S.-issued Amex card. Guest policies vary by card.

  Platinum cardholders who connect through Philadelphia should plan on no Centurion Lounge there for roughly a year starting October 16.

