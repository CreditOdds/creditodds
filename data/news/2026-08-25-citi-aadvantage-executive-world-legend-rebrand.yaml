summary: "Citi has rebranded the AAdvantage Executive World Elite Mastercard as the AAdvantage Executive World Legend Mastercard and raised the annual fee from $595 to $695. The refresh adds up to $500 a year in American Airlines Vacations credits, up to $100 back on inflight and Admirals Club purchases, and Omni Hotels Champion Status, while dropping the Grubhub credit for new cardmembers. A limited time offer of 125,000 miles after $15,000 in five months is live."
