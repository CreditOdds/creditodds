title: "Amex Card Now Opens Priority Pass Lounges"
summary: "Priority Pass has started letting members whose membership comes from an American Express card enter most participating lounges by presenting the physical Amex card, with no Priority Pass membership card needed. Notices went out to members in mid August 2026. Physical Priority Pass cards tied to Amex memberships keep working until they expire, after which entry runs through the Digital Membership Card or the Amex card itself."
