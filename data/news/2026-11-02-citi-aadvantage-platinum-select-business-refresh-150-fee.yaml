body: |
  Citi and American Airlines announced a refresh of two mid-tier AAdvantage cards on **October 27, 2026**. The changes take effect on **January 24, 2027**, and the annual fee on both cards rises from **$99 to $150**. The first-year fee waiver stays in place. Existing cardholders pay the new fee at their first renewal after January 24.

  ## Platinum Select World Elite Mastercard

  - **3x** miles on eligible AAdvantage Hotels and AAdvantage Cars bookings (new)
  - **2x** on select streaming services and on eligible Rides and Rails purchases (new)
  - **2x** at gas stations now also covers EV charging
  - Up to **$100 per calendar year** in statement credits for inflight purchases such as food, drinks and Wi-Fi, replacing the old 25% inflight discount
  - Up to **$120** every four years for Global Entry or TSA PreCheck
  - Complimentary **Walmart+** membership and **50% off** an annual FOX One subscription
  - The American Airlines flight discount after **$20,000** in cardmember-year spend and renewal rises from **$125 to $150**

  The 2x on American Airlines purchases and restaurants, the free first checked bag and preferred boarding carry over.

  ## Business World Elite Mastercard

  - **3x** on eligible AAdvantage Hotels and AAdvantage Cars bookings (new)
  - **2x** in one category you choose: U.S. shipping, office supply stores or U.S. advertising, changeable each quarter
  - The same **$100** yearly inflight credit replacing the 25% inflight discount
  - Up to **$120** every four years for Global Entry or TSA PreCheck
  - **25% off** a Melio subscription plan

  The existing 2x categories, the **$99 companion certificate** after $30,000 in spend and renewal, and the free first checked bag remain.

  For cardholders who use the inflight credit, the $51 fee increase is largely offset. Those who mainly keep the card for the free checked bag will pay more starting with their 2027 renewal.

