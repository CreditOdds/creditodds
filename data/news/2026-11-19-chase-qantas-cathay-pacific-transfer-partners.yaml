body: |
  Chase has added two new airline programs to Ultimate Rewards: **Qantas Frequent Flyer** and **Cathay Pacific Asia Miles**. The additions were reported by The Points Guy and Doctor of Credit on **November 18, 2026**. Eligible Chase cardmembers can now transfer Ultimate Rewards points to both programs at a **1:1** ratio.

  ## Why it matters

  Both airlines belong to the Oneworld alliance. Before this change, Chase's Oneworld options were mostly the Avios programs it already partners with. Qantas and Asia Miles give Chase cardholders two more programs for booking Oneworld award seats.

  The 1:1 rate for Asia Miles stands out. Earlier in 2026, American Express cut its Membership Rewards transfer rate to Cathay Pacific from 1:1 to 5:4, so Chase now offers the better rate of the two.

  ## What to know before transferring

  Neither source named a launch transfer bonus. Doctor of Credit expects both programs to run transfer bonuses at some point, so there is little reason to move points speculatively. Transfers to airline programs generally cannot be reversed, so it makes sense to find award space first and transfer only what you need.

  Ultimate Rewards points that can be transferred to partners are earned on cards such as the Chase Sapphire Preferred, Chase Sapphire Reserve and Ink Business Preferred.

