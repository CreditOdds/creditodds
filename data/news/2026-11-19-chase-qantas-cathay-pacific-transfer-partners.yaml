title: "Chase Adds Qantas and Cathay Pacific Transfers"
summary: "Chase added Qantas Frequent Flyer and Cathay Pacific Asia Miles as Ultimate Rewards transfer partners, reported on November 18, 2026. Eligible cardmembers can move points to both programs at a 1:1 ratio."
