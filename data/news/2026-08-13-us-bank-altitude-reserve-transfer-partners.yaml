title: "US Bank Adds Its First Transfer Partners"
summary: "U.S. Bank turned on airline and hotel point transfers for Altitude Reserve cardholders on August 12, 2026, launching with Flying Blue, Qantas, Ethiopian Sheba Rewards and Accor. Within a day Flying Blue and Qantas were pulled, leaving Accor and Ethiopian and a banner promising more partners soon."
