body: |
  U.S. Bank points became transferable to outside loyalty programs for the first
  time on **August 12, 2026**. The option is live only on the **U.S. Bank Altitude
  Reserve Visa Infinite**, reached by signing in, selecting the card, and choosing
  the loyalty reward transfer option under rewards.

  ## The launch lineup

  U.S. Bank opened with four partners:

  - **Air France KLM Flying Blue**, 1:1
  - **Qantas Frequent Flyer**, 1:1
  - **Ethiopian Sheba Rewards**, 1:1
  - **ALL Accor**, 2:1

  ## Two partners disappeared within a day

  By August 12, Flying Blue and Qantas were gone from the transfer page, which now
  shows only **Accor and Ethiopian Sheba Rewards** plus a note that more partners
  are coming. U.S. Bank has not explained the removal. Doctor of Credit and
  Frequent Miler both reported cardholders hitting errors when trying to move
  points to Flying Blue, which points to an IT problem rather than a deliberate
  cut, but nothing has been confirmed either way.

  ## What it means

  Transfers had been promised since mid 2025 and the launch date kept slipping,
  so the feature arriving at all is the news. The catch is that the card carrying
  it stopped accepting new applications, so this only helps existing Altitude
  Reserve holders for now. Two partners is also a thin roster next to Chase,
  Amex, Citi and Capital One, and U.S. Bank's own Korean Air relationship did not
  make the launch list. Anyone sitting on a large Altitude Reserve balance should
  watch the transfer page before committing to an award plan, since the roster
  has already changed once in 24 hours.

