body: |
  The Venmo Credit Card has a new rewards structure. Doctor of Credit reported the change on **September 25, 2026**, and Venmo's own card page now shows the new rates.

  ## What changed

  The old card picked your categories for you. Each statement period it paid **3%** on your highest spend category and **2%** on your second highest, chosen from eight buckets that included groceries, gas, travel, transportation, bills and utilities, and health and beauty. Everything else earned 1%.

  The new card uses fixed categories instead:

  - **3%** on dining and entertainment
  - **3%** on Pay with Venmo purchases, such as online checkout with Venmo, payments to business profiles, and goods and services payments
  - An extra **1%**, for up to **4%**, on dining and entertainment purchases you split in the Venmo app when friends pay you back within 30 days
  - **1%** on everything else

  Venmo's page now lists groceries, wholesale clubs, travel, and bills and utilities in the 1% tier. The 2% second category is gone.

  ## Who is affected

  According to Doctor of Credit, **existing cardholders are keeping the old structure for now**. Venmo has not said how long that will last. The card still has **no annual fee** and no signup bonus.

  ## What it means

  For cardholders whose top category was dining, little changes. For anyone who relied on the card for groceries, especially at wholesale clubs and superstores that the old grocery bucket covered, the new version cuts that rate from 3% to 1%.

