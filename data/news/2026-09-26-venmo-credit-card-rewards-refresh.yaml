title: "Venmo Card Drops Top Category for Fixed 3%"
summary: "The Venmo Credit Card has replaced its automatic 3% top category and 2% second category with fixed 3% rates on dining, entertainment and Pay with Venmo purchases, plus an extra 1% on split dining and entertainment bills. Groceries, gas and travel now earn 1%. Doctor of Credit reported the change on September 25, 2026 and says existing cardholders keep the old structure for now."
