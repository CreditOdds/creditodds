body: |
  Bilt announced a set of program changes for 2027 on **October 27, 2026**. The biggest one for cardholders: Bilt is retiring **Flexible Bilt Cash mode**, the option that earns **4% back in Bilt Cash** on everyday card spending.

  ## Who keeps the 4% option

  According to Doctor of Credit and The Points Guy, anyone who holds a Bilt card or is approved by **December 31, 2026** can keep the 4% option. New cardholders approved in 2027 will not have it. Existing cardholders who want to keep it must opt out of the new benefits in the card settings of the Bilt app before their card anniversary. Bilt says those who opt out keep their eligible annual credits but cannot switch between the 4% mode and housing-only mode.

  Under the new setup, every cardholder earns **up to 1.25x** points on rent or mortgage payments. Points multipliers on everyday purchases do not change.

  ## Bilt Cash and annual credits

  - Bilt Cash now expires at the end of the month **12 months** after it is earned, replacing the old December 31 expiration with a $100 rollover. This took effect immediately and applies to existing balances.
  - **Palladium:** the $200 Bilt Cash credit and $400 hotel credit become a single **$600 Bilt Cash** credit each year.
  - **Obsidian:** the $100 Bilt Travel hotel credit becomes **$100 of Bilt Cash** each year.
  - Annual Bilt Cash credits will be deposited on the **card account anniversary** instead of January 1.
  - Starting **January 1, 2027**, Bilt Cash used on Bilt Hotel bookings is capped per booking at $50 for Blue and Silver members, $100 for Gold and Platinum, and $200 for eligible Palladium cardholders.

  Bilt also said product upgrades are now available in the Bilt app, and a new Daily Rewards program with prize drawings launches on **January 15, 2027**.

