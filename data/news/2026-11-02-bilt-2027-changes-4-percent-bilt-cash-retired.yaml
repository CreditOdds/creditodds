title: "Bilt Retires 4% Bilt Cash for New Cards"
summary: "Bilt announced on October 27, 2026 that it is retiring the option to earn 4% back in Bilt Cash on everyday card spend for cardholders approved in 2027. Bilt Cash now expires 12 months after it is earned, and Palladium's $200 Bilt Cash and $400 hotel credits become one $600 Bilt Cash credit paid on the card anniversary."
