summary: "Chase marketing material surfaced in a Kayak demo link shows the Aeroplan card earning 3x at grocery stores and on dining only through December 31, 2026, then dropping to 2x. Separately, cardholders have reported a new $100 annual Air Canada statement credit, issued as $50 twice a year. Chase has not announced either change."
