body: |
  The Chase Aeroplan card looks set for a refresh that trades an earning cut for a new
  statement credit. **None of this is confirmed by Chase**, so treat the specifics as
  unconfirmed until the issuer publishes updated terms.

  ## What the leak shows

  Card terms found in a Kayak demo link say the card will **earn 3x points at grocery
  stores and on dining through December 31, 2026, then 2x** on both categories. Chase's
  live Aeroplan page still advertises 3x on groceries, 3x on dining and 3x on purchases
  made directly with Air Canada, with no expiration language attached, which is what makes
  the demo wording notable.

  Separately, cardholders have reported a new **$100 annual Air Canada statement credit**
  appearing on their accounts, structured as **$50 twice a year**. Doctor of Credit,
  TravelUpdate and Danny the Deal Guru have all covered the same set of findings.

  ## Why it matters

  Groceries and dining are the reason many people carry this card. It is a $95 airline
  card whose best categories are not airline specific, and that is unusual. Cutting both
  from 3x to 2x is a **33% reduction** on the two categories most cardholders use every
  week.

  Whether the $100 credit offsets that depends on how much someone spends. A cardholder
  putting $1,000 a month across groceries and dining loses 12,000 points a year under the
  new rate, which is worth more than $100 to most people who value Aeroplan points at more
  than a cent each. Someone who spends less, or who flies Air Canada often enough to use
  the credit easily, may come out ahead.

  Doctor of Credit noted that leaks like this usually arrive with a copy of an internal
  email, and that did not happen here. The timing of any change has not been reported.

