body: |
  Bilt announced a partnership with Equinox on **August 19, 2026**, adding the
  gym chain as a place to spend Bilt Cash and opening a new member offer to
  people who join through Bilt.

  ## What Bilt Cash now buys

  Members can redeem Bilt Cash toward Equinox spa treatments, personal training
  sessions and Studio Pilates. The redemption is capped at **twice per year**,
  and the amount depends on Bilt Rewards status tier:

  - Blue: **$75** per redemption
  - Silver: **$100** per redemption
  - Gold and Platinum: **$150** per redemption

  At the top tier that works out to up to **$300 a year** in Bilt Cash pointed at
  Equinox, and at the entry tier $150 a year.

  ## New member offer and concierge

  People who are not already Equinox members can enroll through the Bilt app,
  through Bilt Neighborhood Concierge, or directly with Equinox and receive
  **10,000 Bilt Points**, one complimentary personal training session and one
  complimentary 50 minute spa service. Existing members can upgrade their
  Equinox membership inside the Bilt app.

  Bilt Neighborhood Concierge also picks up Equinox, so members can browse class
  schedules and book spa services through it rather than going to Equinox
  directly.

  ## Context

  This is the second Bilt Cash outlet to go live in a month. Bilt turned on
  Blade helicopter bookings inside its app on August 13, 2026, another
  redemption option the program had listed but not shipped. Equinox follows the
  same pattern of attaching Bilt Cash to a specific merchant rather than raising
  the underlying redemption value.

