body: |
  Navy Federal has added a premium travel card above its existing Flagship product and is raising the annual fee on the older card at the same time.

  The new **Flagship Premier Visa Signature** carries a **$95** annual fee and earns **4X** points on travel, **3X** on dining and **1X** on everything else. It comes with a **$100** annual airline credit for purchases made directly with airlines, statement credits of up to **$120** for Global Entry or TSA PreCheck, and a complimentary GigSky global mobile data plan. There is no foreign transaction fee, no balance transfer fee and no cash advance fee. Navy Federal lists the variable APR at **15.74% to 18.00%** and an opening offer of **50,000** bonus points after **$4,000** in purchases in the first 90 days.

  ## What happens to Flagship Rewards holders

  The annual fee on the Visa Signature Flagship Rewards card goes from **$49** to **$95** effective **November 2, 2026**. Navy Federal says the increase applies whether a cardholder upgrades to the new product or keeps the current one, and that current benefits remain available for anyone who stays.

  Moving to Flagship Premier is optional and takes no application or credit check. Cardholders who upgrade trade the Amazon Prime statement credit, which Navy Federal values at **$139**, for the **$100** airline credit. Travel earning rises from 3X to 4X and dining from 2X to 3X, while all other purchases drop from 2X to **1X**. The Global Entry and TSA PreCheck credit is on both versions.

  Navy Federal membership is limited to service members, veterans, Department of Defense civilians and contractors, and their families.

