summary: "Navy Federal has launched the Flagship Premier Visa Signature, a $95 metal travel card earning 4X on travel, 3X on dining and 1X elsewhere, with a $100 annual airline credit and up to $120 back for Global Entry or TSA PreCheck. Separately, the annual fee on the existing Visa Signature Flagship Rewards card rises from $49 to $95 on November 2, 2026, whether or not the holder upgrades."
