body: |
  Chase and IHG announced on **October 1, 2026** a new top-tier hotel card, the **IHG One Rewards Premier Select**, along with updates to all three existing IHG cards.

  ## IHG One Rewards Premier Select

  The new card carries a **$350 annual fee**. Benefits listed by Chase:

  - **Anniversary Free Night** worth up to **60,000 points**
  - Up to **$300 a year in Food & Beverage Rewards** at IHG hotels
  - **$200 annual airline statement credit** plus up to **$50 in United TravelBank Cash**
  - **Automatic Platinum Elite** status and **20 Elite Night Credits** each calendar year
  - Fourth reward night free on four-night award stays
  - Earning of up to **28x** at IHG, **6x** on dining and travel, and **3x** elsewhere

  The launch offer is **200,000 bonus points** after **$5,000** in spending in the first 3 months, available through **November 18**.

  ## Changes to the existing cards

  - **IHG One Rewards Premier**: annual fee rises from **$99 to $150**. It adds up to **$100 a year** in Food & Beverage Rewards, a **$100 airline credit**, and **15 Elite Night Credits** each year, and the anniversary night cap rises to **50,000 points**. Automatic status is now listed as **Gold Elite**, down from Platinum.
  - **IHG One Rewards Business** (formerly Premier Business): annual fee rises from **$99 to $200**. New perks include up to **$100** in Food & Beverage Rewards, a **$100 airline credit**, a **$100 Expensify credit**, and **15 Elite Night Credits**. It keeps automatic Platinum Elite and gets a **50,000-point** anniversary night cap.
  - **IHG One Rewards** (formerly Traveler): still **no annual fee**. Grocery joins dining and gas at **3x**, and it now comes with **5 Elite Night Credits** each year.

  Chase says existing cardholders will see the new annual fees in **2027** and will be notified this month with their specific effective dates.

