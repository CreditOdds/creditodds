body: |
  Chase has told Sapphire Reserve for Business cardholders about two changes to the card, one that adds value and one that takes some away.

  ## The Edit credit doubles in 2027

  Starting **January 1, 2027**, the annual statement credit for stays booked through The Edit by Chase Travel goes from **$500 to $1,000**. The structure changes too: instead of two credits of up to **$250** each, cardholders get **four** of them spread across the year.

  The terms attached to the credit are not changing. It still applies only to prepaid stays of **two nights or longer** at participating The Edit properties booked through Chase Travel. Using all four credits therefore means booking at least eight nights a year at those hotels. The Edit bookings also carry daily breakfast for two, a **$100** property credit per stay, and room upgrades and early check-in or late checkout when available.

  ## Advertising bonus gets a cap

  From **November 15, 2026**, the card's **3X** rate on social media and search engine advertising is capped at **$1 million** in eligible spending per account anniversary year. Spending past that cap earns **1X**. The cap did not exist before, so this is a reduction on paper, though the threshold is far above what most small businesses put through the category.

  The **$795** annual fee is unchanged, and neither change applies to the personal Chase Sapphire Reserve.

