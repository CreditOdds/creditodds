body: |
  Kroger has a co-brand credit card again. The new Kroger Rewards Mastercard
  went live on **September 23, 2026**, with fintech **Imprint** running the
  program and **First Bank & Trust** as the issuing bank. It has **no annual
  fee**.

  The launch fills the gap left by U.S. Bank, which stopped taking Kroger card
  applications in **May 2026** and has been converting existing Kroger
  cardholders to its Smartly Visa this fall.

  ## Earning

  - **5x points** on Kroger pickup and delivery orders
  - **4x points** at Kroger fuel centers
  - **3x points** on in-store Kroger purchases
  - **2x points** on dining, utilities and travel
  - **1x point** on everything else

  Points go toward dollars off groceries or savings at the pump.

  ## Perks and welcome offer

  Cardholders get a complimentary **Boost Essential** membership, Kroger's
  delivery subscription tier, plus a **$10 birthday reward** each year.

  New cardholders earn a **$100 Kroger reward** after spending **$750**
  outside of Kroger channels within **90 days** of opening the account. That
  reward, like the birthday credit, can only be used on eligible grocery
  purchases.

  Kroger is also advertising a limited time **$0 balance transfer fee**. Doctor
  of Credit notes the card does not come with a 0% intro APR period, so a
  transferred balance still accrues interest at the regular rate.

  ## What it means for former cardholders

  People whose old U.S. Bank Kroger card was converted to the Smartly Visa can
  apply for the new card, but it is a separate account with a new issuer and
  a new credit check. The application page offers a pre-approval check with no
  impact to your credit report before you commit.

