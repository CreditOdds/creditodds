title: "Kroger Relaunches Its Card With Imprint"
summary: "Kroger launched a new no annual fee Mastercard on September 23, 2026, run by Imprint and issued by First Bank & Trust. It earns up to 5x points on Kroger pickup and delivery, 4x on Kroger fuel, 3x in Kroger stores and 2x on dining, utilities and travel, and includes a free Boost Essential membership. It replaces the U.S. Bank Kroger cards that closed to applicants in May."
