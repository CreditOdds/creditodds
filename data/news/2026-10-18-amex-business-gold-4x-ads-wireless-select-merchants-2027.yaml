body: |
  American Express has updated the offer terms for the **Business Gold** card so that two of its 4x categories, advertising and wireless phone service, will only count purchases at specific merchants. The change takes effect on **February 17, 2027**.

  ## How the 4x works today

  The Business Gold earns **4x Membership Rewards points** in the two eligible categories where a business spends the most each billing cycle, up to **$150,000** in combined purchases per calendar year. Advertising in select media and U.S. wireless telephone service are two of those eligible categories today, with broad merchant coverage.

  ## What changes in 2027

  **Advertising** (online, TV and radio) will only earn 4x when bought directly from **Meta, Google, Amazon, Microsoft, GoDaddy or Yelp**.

  **Wireless** monthly service will only earn 4x at **Verizon, AT&T, T-Mobile, Frontier, Comcast, Charter, Spectrum Mobile, UScellular, Optimum, Ultra Mobile and Mint Mobile**.

  Both categories still require U.S.-located providers. Spending outside the named merchants will no longer count toward the 4x categories after the effective date.

  ## What is not changing

  Doctor of Credit's report does not indicate any change to the other eligible 4x categories: U.S. electronic goods retailers and software and cloud providers, U.S. restaurants, U.S. gas stations, and transit. The $150,000 annual cap is also not reported as changing.

  ## Who is affected

  Businesses that put ad spend through smaller platforms, agencies or other media buyers, or that pay for phone service through carriers outside the list, may see that spending drop out of the 4x tier starting in February. Cardholders who already advertise mainly on the large platforms and use a major carrier should see little difference.

  The change follows an update earlier this month that swapped FedEx for UPS in the card's monthly flexible business credit.

