title: "Amex Business Gold Narrows 4x Ads and Wireless"
summary: "Starting February 17, 2027, the American Express Business Gold card will only earn 4x on advertising and wireless at a named list of merchants. Ads must be bought directly from Meta, Google, Amazon, Microsoft, GoDaddy or Yelp, and wireless bills must come from carriers such as Verizon, AT&T and T-Mobile."
