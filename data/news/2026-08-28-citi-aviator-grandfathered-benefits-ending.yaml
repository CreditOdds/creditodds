title: "Citi Cuts Converted Aviator Card Perks Oct 25"
summary: "Statement notices going out to former Barclays AAdvantage Aviator cardholders say the benefits Citi let them keep after the April 2026 conversion end on October 25, 2026. Aviator Red converts on the Citi AAdvantage Platinum Select lose a $25 annual Wi-Fi credit, and Aviator Silver converts on the Citi AAdvantage Globe lose 2X miles on hotels and car rentals, a $25 daily food and beverage credit, and a $50 annual Wi-Fi credit."
