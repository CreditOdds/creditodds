body: |
  Citi is telling former Barclays AAdvantage Aviator cardholders that the perks
  it carried over during the conversion stop on **October 25, 2026**. The notice
  is appearing on cardholders' latest statements rather than in a separate
  announcement.

  When Citi became the exclusive issuer of AAdvantage cards on **April 24, 2026**,
  Aviator Red accounts moved to the Citi AAdvantage Platinum Select World Elite
  Mastercard and Aviator Silver accounts moved to the Citi AAdvantage Globe.
  Citi let both groups temporarily keep several Barclays benefits that the Citi
  products do not normally carry. That grace period is what is ending.

  ## What former Aviator Red cardholders lose

  The **$25** annual Wi-Fi credit goes away. The American Airlines Companion
  Certificate is also being retired, though cardholders can earn it one final
  time at their next cardmembership anniversary.

  ## What former Aviator Silver cardholders lose

  The Globe conversions have a longer list: **2X** AAdvantage miles on hotels,
  **2X** miles on car rentals, a **$25** daily food and beverage credit, and a
  **$50** annual Wi-Fi credit. Hotel and car rental spending drops to the
  standard **1X** mile per dollar after the cutoff. These cardholders also get
  one last shot at the Companion Certificate, and they stay eligible for up to
  **15,000** additional Loyalty Points through the status qualification period
  ending **February 28, 2027**.

  Companion Certificates already earned stay valid through their original
  expiration dates, so certificates in hand are not affected. Cardholders who
  were holding on to a converted account mainly for the Barclays era benefits
  have roughly two months to decide whether the annual fee still pencils out.

