body: |
  Chase announced the refresh on **September 10, 2026**, renaming the product the Chase Air Canada Aeroplan Card and raising the annual fee from **$95** to **$195**. The new benefits apply to new and existing cardmembers right away. Existing cardmembers will not be charged the higher fee until **December 1, 2026** at the earliest, depending on their renewal date.

  ## What the card adds

  Every primary cardmember now gets **automatic Aeroplan 25K status** with no spending requirement. That status previously took **$15,000** in annual spend to reach. It includes priority check-in, Zone 2 boarding and **5 eUpgrade credits** each year.

  The card also adds a **15% discount** on eligible Air Canada award redemptions, applied to one-way itineraries that include at least one Air Canada operated flight, plus up to **$100** a year in Air Canada statement credits issued as two **$50** semi-annual credits. Only one $50 credit is available for the remainder of 2026.

  Chase says Air Canada purchases can earn up to **5X** in total, combining 3X from the card with 2X earned as a 25K member.

  ## What changes on January 1, 2027

  Chase lists the new earning structure as **3X** on travel including Air Canada purchases, **2X** on dining and at gas stations, and **1X** on other purchases. Existing cardmembers keep their current categories, including **3X** on groceries and dining, along with the monthly bonus points structure, through **December 31, 2026**.

  One perk ends on that same date for everyone. The **10% bonus** on Ultimate Rewards transfers of 50,000 or more points to Aeroplan, which was capped at 25,000 bonus points a year, stops on **December 31, 2026**. Pay Yourself Back stays on the card.

