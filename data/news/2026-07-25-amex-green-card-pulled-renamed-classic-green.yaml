body: |
  American Express has pulled the **Green Card** from its website. As of **July 23, 2026**, the card's application pages return errors and existing referral links went inactive within hours, so new applicants can no longer sign up. The card no longer appears anywhere in Amex's current consumer lineup.

  The removal lines up with a name change Amex has already told cardholders about. Existing Green Card accounts will be renamed the **American Express Classic Green Card** effective **August 20, 2026**. Amex began notifying cardholders of the rename earlier this summer through in-account messages.

  ## What is confirmed

  Two things are certain right now: the Green Card is unavailable to new applicants, and the existing product will carry the "Classic Green" name starting August 20. Current cardholders keep their accounts, and Amex has not announced any changes to the annual fee, earning rates, or benefits. People who already hold another Amex card can still downgrade into the Green Card for now.

  ## What is not

  Amex has not said why the card disappeared or whether a new version is coming. The "Classic" label has fueled speculation that a refreshed Green Card with updated benefits and earning rates could launch later in 2026, echoing the pattern Amex used when it revamped the Platinum. None of that is official. Until Amex publishes new terms or a new card, the refresh talk stays unconfirmed.

  If you were planning to apply for the Green Card, that option is gone for now. Existing holders do not need to do anything; the rename is automatic.

