body: |
  The first wave of Discover credit card accounts moves onto Capital One's
  systems on **July 27, 2026**. Discover emailed affected cardholders that they
  will manage their account through the Capital One app and website starting
  that day, as [reported by Doctor of
  Credit](https://www.doctorofcredit.com/discover-cards-will-transition-to-capital-one-website-app-on-july-27-2026/).
  Capital One says accounts move in waves **throughout 2026 and early 2027**, so
  not every cardholder switches at once.

  ## What stays the same

  Capital One's transition FAQ says the Discover brand and network are not going
  away. Primary cardholders keep their current card and card number, and earning
  rates, rewards balances, the **5%** rotating bonus categories, APRs, credit
  limits, and the **$0** annual fee all carry over. The change is not reported to
  the credit bureaus as a new account, so the original account open date is
  preserved.

  ## What changes

  Account servicing moves from Discover.com to Capital One. Authorized users and
  joint account holders receive new cards with their own 16-digit numbers, all
  tied to the same account. Apple Pay recurring subscriptions may need to be set
  up again, and Pay with Rewards through Apple Pay is not available on Capital
  One's side.

  Redemption rules shift too. Rewards can no longer be applied to a minimum
  payment, the gift card redemption minimum rises to **$25**, and statement
  credit and direct deposit are added as options.

  Cardholders also pick up Capital One perks: up to **15%** back through Capital
  One Offers, **5%** back on hotels, vacation rentals, and rental cars booked
  through Capital One Travel, and **5%** back on Capital One Entertainment
  tickets.

  Capital One says no action is needed before it reaches out with sign-in
  instructions.

