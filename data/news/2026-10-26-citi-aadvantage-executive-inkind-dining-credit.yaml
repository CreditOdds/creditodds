body: |
  The **Citi AAdvantage Executive World Legend Mastercard** now includes up to **$200 a year** in dining credits through **inKind**. A Citi spokesperson confirmed the benefit to View from the Wing on **October 25, 2026**, saying it applies to eligible Executive cardmembers starting that day.

  ## How the credit works

  The credit is split into two halves each calendar year:

  - **$100** for January through June
  - **$100** for July through December

  Because the benefit launched in the second half of the year, the first **$100** is available now and runs through **December 31, 2026**.

  To use it, download the inKind app, add the Executive card to your account, and select the dining credit when paying the check at a participating restaurant. A reservation through inKind is not required. Doctor of Credit reports no minimum spend requirement and says the credit can be spread across more than one visit.

  ## Rollout

  Some cardholders reported the $100 showing up as soon as they linked their card, while others said it had not appeared yet, so availability may still be rolling out. Citi describes the credit as available to "eligible" cardmembers without defining eligibility.

  The card carries a **$695** annual fee following its refresh earlier this year.

