body: |
  Resy launched **Resy Rewards** on **November 17, 2026**. The program gives U.S. Card Members with a Membership Rewards eligible American Express card **four additional points per eligible dollar** at participating Resy restaurants.

  ## How it works

  1. Enroll an eligible card in Resy Rewards.
  2. Book a Resy Rewards reservation from the **Rewards tab in the Resy iOS app**.
  3. Dine and pay the bill with the enrolled card.

  The extra points are on top of what the card already earns. Resy says the American Express Gold Card can reach **up to 8x** points per eligible dollar at these restaurants. The Business Gold Card also earns the four additional points on top of its own earning.

  ## Where it works

  Resy Rewards is launching first in **New York City**, with participating restaurants including Carne Mare, Le Crocodile, Hearth, Kiko, OPTO and Le Pavillon. Resy plans to expand to more U.S. cities in **2027** and to add select Tock venues.

  The launch announcement mentions only the iOS app, so Android users may not be able to book Resy Rewards reservations yet. Resy did not say whether Platinum Card members can use the program alongside the Platinum Resy dining credit.

