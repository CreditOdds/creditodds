body: |
  Citi added **Copa Airlines ConnectMiles** as a ThankYou Rewards transfer partner on **October 25, 2026**, according to Frequent Miler and Doctor of Credit. Transfers were reported as effective immediately.

  ## Transfer ratios

  The rate depends on which card holds the points:

  - **1:1** (1,000 points to 1,000 miles): Citi Strata Elite, Citi Strata Premier, and the legacy Prestige.
  - **1,000:700** (1,000 points to 700 miles): Citi Strata, Citi Double Cash, Citi Custom Cash and the older ThankYou Preferred.

  Several AT&T cards issued by Citi are also included, split along the same annual fee lines. Neither report listed a minimum transfer amount or a processing time.

  ## Why it matters

  ConnectMiles is Copa's loyalty program, based in Panama. Frequent Miler points to awards on Emirates without carrier-imposed surcharges, plus a free stopover on round-trip awards, as the main uses. The addition comes shortly after the Rove Miles loyalty program added Copa as a partner.

