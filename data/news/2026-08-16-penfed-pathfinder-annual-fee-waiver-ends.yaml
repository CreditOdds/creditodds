title: "PenFed Ends Pathfinder Annual Fee Waiver"
summary: "PenFed is mailing Pathfinder Rewards Visa Signature cardholders notice that the $95 annual fee can no longer be waived, effective September 28, 2026. The waiver had made the card free for Honors Advantage members, meaning military members and Access America checking customers. The same notice raises late fees to as much as $35."
