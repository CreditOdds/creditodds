body: |
  Peacock subscribers are receiving an "Upcoming Price Increase" email this week. Every
  standalone plan is going up, the fourth Peacock increase in four years. New subscribers
  have paid the new rates since **August 18, 2026**. Existing subscribers move over on their
  **next billing date on or after September 17, 2026**, or when a promotional rate ends.

  | Plan | Old monthly | New monthly | Old annual | New annual |
  |------|-------------|-------------|------------|------------|
  | Select | $7.99 | $8.99 | $79.99 | $89.99 |
  | Premium | $10.99 | $12.99 | $109.99 | $129.99 |
  | Premium Plus | $16.99 | $19.99 | $169.99 | $199.99 |

  Add-ons such as STARZ and Regional Sports Networks stay at their current prices. The Apple
  TV and Peacock bundles rise to $17.99 for Premium and $22.99 for Premium Plus, with
  existing bundle subscribers moving on or after October 1, 2026.

  For the popular Premium plan the increase is **$24 a year**. Premium Plus subscribers pay
  **$36 more a year**.

  ## Cards with a credit that covers Peacock

  [The Platinum Card](/card/the-platinum-card) from American Express pays up to **$25 a
  month** through its Digital Entertainment Credit, and Peacock is explicitly eligible
  alongside Disney+, ESPN, Hulu, Paramount+, The New York Times, The Wall Street Journal,
  and YouTube TV. At the new prices, $25 covers Premium ($12.99) with $12 to spare and
  Premium Plus ($19.99) with $5 to spare, so enrolled cardholders will not see the increase.
  Two cautions: the $25 is shared across all eligible providers each month, and
  [as of August 1, 2026, Peacock bundles and add-ons no longer qualify](/news/amex-platinum-peacock-add-ons-ineligible).
  Keep Peacock on a standalone plan billed directly by Peacock to get the credit.

  The [Bank of America Premium Rewards Elite](/card/bank-of-america-premium-rewards-elite)
  has a **$150 annual Lifestyle Credit** that applies to streaming, rideshare, and airline
  purchases after enrollment. It covers a full year of Premium on the annual plan ($129.99).

  The [Wyndham Rewards Earner Premier](/card/wyndham-rewards-earner-premier-card) includes
  up to **$100 a year** in statement credits on qualifying streaming services, enough for
  the Select annual plan ($89.99) or most of a year of Premium.

  The [Truist Enjoy Beyond](/card/truist-enjoy-beyond) carries a **$100 annual credit** for
  ground transportation, ticket agencies, and streaming services. Same math as the Wyndham
  card, but the pool is shared with rideshare and ticket spend.

  The [US Bank Altitude Go](/card/us-bank-altitude-go-visa-signature) pays a **$15 annual
  streaming credit** after 11 consecutive months of streaming purchases, plus 2x points on
  streaming, with no annual fee.

  ## Cards that earn a bonus but do not credit it

  Peacock codes as streaming, so the [Blue Cash Preferred](/card/blue-cash-preferred-card)
  earns 6% back, and the [Wells Fargo Autograph](/card/wells-fargo-autograph),
  [Capital One Savor](/card/capital-one-savor), and [Chase Sapphire Preferred](/card/chase-sapphire-preferred)
  each earn 3x or 3%. None of these erase the increase; at best they return a few dollars a year.

  ## Streaming credits that do not cover Peacock

  The [Chase Sapphire Reserve](/card/chase-sapphire-reserve) credit is for Apple TV and
  Apple Music only. The [Blue Cash Everyday](/card/blue-cash-everyday-card) and Blue Cash
  Preferred monthly credits cover Disney+, Hulu, and ESPN+ only. The
  [PNC Spend Wise](/card/pnc-spend-wise) digital subscription credit covers Spotify, Netflix,
  and Disney+. None of them apply to Peacock.

  ## What to do before September 17

  Current annual subscribers keep their price until renewal, and even at the new rates
  Premium annual ($129.99) beats Premium monthly ($155.88 a year) by about $26. Cardholders
  with one of the credit cards above should move the Peacock charge to that card, and
  Platinum cardholders should confirm they are enrolled in the Digital Entertainment Credit
  and on a standalone plan rather than the Apple TV bundle, which no longer qualifies.
