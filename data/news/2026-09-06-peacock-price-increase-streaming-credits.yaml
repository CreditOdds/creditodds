title: "Peacock Raises Prices on Every Plan"
summary: "Peacock is raising Premium from $10.99 to $12.99 a month and Premium Plus from $16.99 to $19.99, with Select going from $7.99 to $8.99. Existing subscribers move to the new prices on their next billing date on or after September 17, 2026. The Amex Platinum's $25 monthly Digital Entertainment Credit still covers either tier, and several other cards carry streaming credits that absorb the increase."
