body: |
  American Express has folded Tock into Resy. As of **August 11, 2026**, Tock
  restaurants, wineries and dining experiences show up inside the Resy app and
  website, bringing the combined platform to more than **25,000 venues**. Amex
  bought Resy in 2019 and acquired Tock last year.

  ## The credit part starts September 15

  Tock venues listed on Resy do not earn the Resy Credit yet. Amex says
  **hundreds of U.S. Tock venues become Resy Credit eligible on September 15,
  2026**, across major markets, with more added on a rolling basis. Eligibility
  is shown on each venue page, so check for the badge before booking. That badge
  requirement took effect August 1 and applies to every Resy listing, not just
  the new Tock ones.

  ## Which cards this touches

  - **The Platinum Card**: up to **$100 per quarter**, up to $400 a year
  - **American Express Gold**: up to **$50 twice a year**, up to $100 a year
  - **Delta SkyMiles Platinum** and **Platinum Business**: up to $10 a month
  - **Delta SkyMiles Reserve** and **Reserve Business**: up to $20 a month

  Enrollment is required on all of them.

  ## Timing note

  September 15 leaves Platinum cardholders roughly two weeks to spend the third
  quarter credit at a newly eligible Tock venue before it resets on October 1.
  Wineries and ticketed dining experiences were largely absent from Resy before
  this, so the practical win is a wider set of places to burn a credit that has
  been easy to waste.

