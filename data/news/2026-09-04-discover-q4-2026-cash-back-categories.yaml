title: "Discover Adds Utilities to Q4 5% Lineup"
summary: "Discover has set its Q4 2026 rotating categories for October through December: restaurants, entertainment, and utilities. Utilities and entertainment are both new to the calendar this year. The 5% rate applies to up to $1,500 in combined purchases after activation, which opened September 1, 2026, and is not retroactive."
