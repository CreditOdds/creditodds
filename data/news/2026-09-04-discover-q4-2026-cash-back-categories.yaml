body: |
  Discover has published its rotating 5% cash back categories for the fourth quarter of 2026. From **October 1 through December 31**, eligible cardholders earn **5% back on restaurants, entertainment, and utilities** on up to **$1,500 in combined purchases**, then 1% after that. The cap works out to a maximum of **$75 in bonus cash back** for the quarter.

  ## What Counts

  **Restaurants.** Full-service restaurants, cafes, cafeterias, fast food, and caterers, including takeout and delivery. Restaurants inside hotels and other larger venues often code to the venue instead and will not earn the bonus.

  **Entertainment.** Movie theaters, concert and theatrical promoters, professional and semi-professional live sports events, amusement parks, tourist attractions, zoos, aquariums, dance halls, pool halls, and bowling alleys. Streaming subscriptions are not part of this category.

  **Utilities.** Residential electricity, natural gas, and water service, plus internet, cable, satellite TV, and phone service paid online.

  ## Why This Quarter Stands Out

  Utilities and entertainment are both new additions to Discover's calendar for 2026. Recurring household bills are usually a 1% category on almost every cash back card, so routing electricity, water, internet, and phone payments through the card for three months is the unusual part of this quarter. Households that pay a few hundred dollars a month in utilities can fill a meaningful share of the $1,500 cap without changing any spending habits.

  ## Activation Is Required and Not Retroactive

  Activation opened **September 1, 2026** and stays open through the end of the quarter. Discover does not apply the bonus rate retroactively, so any restaurant, entertainment, or utility purchase made before you activate earns only 1%. Activating now, well before October 1, avoids losing the first weeks of the quarter.

  The same calendar covers the Discover it Cash Back, Discover it for Students, and NHL Discover it cards. New cardholders in their first year still get Cashback Match, which doubles everything earned over the first 12 months and effectively makes this quarter's categories worth 10%.

  Chase has not yet announced Q4 categories for the Freedom Flex.

