body: |
  Chase has emailed **IHG One Rewards Premier Business** cardholders about an upcoming improvement to the card's anniversary free night certificate. Beginning in **2027**, certificates issued on the card will be valid at IHG properties that cost **up to 50,000 points per night**, an increase from the current **40,000 point** cap.

  ## What the change covers

  The cutoff is the issue date, not the redemption date. Anniversary free nights **awarded through December 31, 2026** stay capped at properties costing 40,000 points or less, even if the cardholder redeems them well into 2027. Certificates awarded from 2027 onward carry the higher 50,000 point cap.

  The existing rules otherwise stay in place. Cardholders can still **add points from their own IHG One Rewards balance** to book a property that prices above the certificate cap, and each certificate must be redeemed and the stay completed **within 12 months of issue**.

  ## Personal card not included

  The updated terms apply to the business card only. Chase has not announced the same increase for the personal IHG One Rewards Premier card, which keeps its 40,000 point anniversary night for now.

  The IHG One Rewards Premier Business card carries a **$99 annual fee**, so a certificate cap that clears more of IHG's mid-tier and upper-tier properties makes the renewal math easier. The 10,000 point increase brings more full-service Crowne Plaza, Kimpton, and Hotel Indigo properties into range without topping up from a points balance.

