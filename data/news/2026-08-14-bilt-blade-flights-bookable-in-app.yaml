body: |
  Bilt has made Blade flights bookable directly in the Bilt app, closing out a
  redemption option the program had listed as coming soon since it introduced Bilt
  Cash. The Points Guy reported the change live on **August 13, 2026**.

  Members can now pay for a Blade seat with **Bilt Points, Bilt Cash, or a combination
  of both**. Bilt Cash is capped at **$350 per seat**, and the benefit is limited to
  **two Blade flights per calendar year** per member. The cash portion applies to the
  seat fare only, so add-ons such as luggage fees are not covered. If the fare runs
  past $350, the balance can be paid with points or a regular payment method.

  ## Where the cap actually lands

  The $350 ceiling matters because Blade fares vary widely by route. Scheduled
  helicopter transfers between Manhattan and **JFK or Newark** commonly start around
  **$200 to $250** a seat, which the Bilt Cash allowance covers outright. Longer runs
  are a different story: Hamptons flights start near **$795** a seat, so Bilt Cash
  would cover under half.

  The redemption is most immediately useful to new **Bilt Palladium** cardholders,
  whose welcome offer includes **$300 in Bilt Cash**. That is enough to cover close to
  a full airport transfer on day one.

  Bilt has not published an expiration for the partnership, and the two-flight annual
  limit resets on the calendar year rather than the cardholder anniversary.

