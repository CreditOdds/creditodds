body: |
  Bilt turned on Blacklane bookings inside its app on **August 21, 2026**.
  Members can now reserve the chauffeur service through the Bilt Travel Portal
  or Bilt Neighborhood Concierge and apply Bilt Cash to the fare at checkout.

  ## What members get

  The Bilt Cash cap depends on Bilt Rewards status tier and runs on a calendar
  year:

  - Blue and Silver: up to **$50** a year
  - Gold: up to **$100** a year
  - Platinum: up to **$150** a year

  Rides booked through Bilt also earn **1 Bilt Point per dollar**. A Bilt credit
  card is not required to pay for the ride. Members can link another card and
  still pull the Bilt Cash credit, which matters for anyone trying to stack the
  booking against a separate card credit.

  Bilt Points can be spent on Blacklane fares directly, but the checkout rate
  works out to roughly **0.7 cents per point**, well below what the points fetch
  through Bilt's airline and hotel transfer partners.

  ## Listed since February, shipped now

  Blacklane appeared on the Bilt Cash redemption list Bilt published in early
  2026 with a February 1 start, alongside Lyft, Walgreens and the Bilt Travel
  Portal. The booking path did not actually exist in the app until now, the same
  gap that held up Blade helicopter redemptions until Bilt shipped those on
  August 13.

  This is the third Bilt Cash outlet to go live in nine days, after Blade on
  August 13 and Equinox on August 19.

