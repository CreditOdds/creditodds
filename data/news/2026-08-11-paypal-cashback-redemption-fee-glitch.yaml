title: "PayPal Card Cashback Redemption Fee Fixed"
summary: "PayPal credit cardholders who redeemed rewards to their PayPal balance were charged an undisclosed fee matching PayPal's 3.49% plus $0.49 merchant pricing. Doctor of Credit flagged the problem on August 11, 2026 and reported the same day that it has been fixed. Cardholders should check recent redemptions and call PayPal for a refund, though some report automatic reversals."
