body: |
  American Express and Airbnb announced an exclusive partnership on **October 22, 2026** that puts **more than 1 million Airbnb listings** on AmexTravel.com and the Amex Travel app. Bookings are prepaid through Amex Travel, and the stay itself is then managed in the Airbnb app.

  ## Earning on Airbnb bookings

  - **The Platinum Card** and **The Business Platinum Card**: **5x** Membership Rewards points on prepaid Airbnb bookings made through Amex Travel.
  - Other cards enrolled in Membership Rewards: **2x** on the same bookings.
  - The Consumer Classic Green card keeps its 3x on travel booked directly with third-party sites, which includes Airbnb.

  ## Platinum credit changes

  The **$600 Hotel Credit** is now called the **$600 Lodging Credit**. It still pays up to **$300 semi-annually**, and prepaid **Airbnb Luxe** bookings of **two nights or more** made through Amex Travel now qualify alongside Fine Hotels + Resorts and The Hotel Collection.

  Platinum cardholders also get a new **$250 Airbnb Experiences credit**. It unlocks once a year after the card is used for a prepaid Airbnb Luxe booking through Amex Travel. After that booking is confirmed, eligible Airbnb Experiences bought directly from Airbnb earn statement credits of up to $250 for the rest of that calendar year. Experiences that send the buyer to a third-party site to pay do not count.

  ## Two-night minimum for Fine Hotels + Resorts

  Amex's lodging credit page now confirms the rule first spotted on a test site earlier this month: starting **January 1, 2027**, Fine Hotels + Resorts bookings must be for **at least two nights** to qualify for the $600 Lodging Credit. The Hotel Collection already required two nights.

  To book Airbnb stays through Amex Travel, cardholders must first link an Airbnb account in the same name to their Amex online account.

