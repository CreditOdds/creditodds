title: "Amex Platinum Adds Airbnb Credit and 5x Points"
summary: "American Express added over 1 million Airbnb listings to Amex Travel on October 22, 2026. Platinum and Business Platinum cardholders earn 5x on prepaid Airbnb bookings there, can use the renamed $600 Lodging Credit on Airbnb Luxe stays of two nights or more, and unlock a new $250 Airbnb Experiences credit. Starting January 1, 2027, Fine Hotels + Resorts bookings also need a two-night minimum for the credit."
