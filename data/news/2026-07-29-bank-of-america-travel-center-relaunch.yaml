body: |
  Bank of America launched a rebuilt version of its Travel Center on **July 28, 2026**. The booking platform is now powered by **Rocket Travel by Agoda**, the Booking.com owned travel technology arm, and it replaces the bank's previous portal.

  ## What is new

  - **Inventory:** roughly **1 million** bookable options, including more than **500,000 properties**, flights from over **170 airlines**, more than **170 car rental companies**, and over **400,000 activities**.
  - **Split payments:** a single booking can now combine card rewards with a credit or debit card payment instead of forcing an all points or all cash choice.
  - **Mix and match flights:** round trips can pair one airline on the outbound leg with a different airline on the return.
  - **Better hotel detail:** listings now show amenities, images, and guest reviews, with filtering by timing, price, and amenity.

  ## Which cards get what

  Access depends on the card. [Premium Rewards](/card/bank-of-america-premium-rewards) and [Premium Rewards Elite](/card/bank-of-america-premium-rewards-elite) cardholders can book with rewards, a card payment, or both, through the mobile app and Online Banking. BankAmericard Rewards accounts also get rewards redemption through Online Banking. [Travel Rewards](/card/bank-of-america-travel-rewards), Customized Cash Rewards, and Unlimited Cash Rewards holders can pay with their card through Online Banking or Erica.

  One detail worth knowing before you book: a reservation paid entirely with points does not earn rewards on that transaction, so splitting the payment is the only way to earn on a portal booking.

  The relaunch closes some distance between Bank of America and the Chase Travel and Amex Travel portals, though pricing on the new inventory is what will decide whether the points are worth spending there.

