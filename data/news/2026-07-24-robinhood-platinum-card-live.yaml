body: |
  Robinhood's second credit card is now reaching wallets. The [Robinhood Platinum](/card/robinhood-platinum) went live for invited users on **July 22**, carrying a **$695 annual fee** and **no signup bonus**.

  Earning is concentrated in dining and Robinhood's own travel portal:

  - **5%** back on dining, on the first **$50,000** per year
  - **10%** back on hotels and car rentals booked through the Robinhood travel portal
  - **5%** back on flights booked through the portal
  - **1%** back on everything else

  The case for the fee rests on the credit stack: up to **$700** a year in hotel credits ($250 each half year plus a $100 on-property credit), **$300** a year toward flights ($150 each half year), **$250** in dining credits ($20 a month, $30 in January), **$120** a year in DoorDash credits with a DashPass membership, up to **$250** toward Waymo rides, and a Global Entry or TSA PreCheck credit every four years. Robinhood also bundles subscriptions it values at several hundred dollars, including Robinhood Gold, WHOOP, Function Health, and an Amazon health membership.

  Most of those credits are monthly or semiannual coupons, and the biggest ones only pay out through Robinhood's travel portal. Whether the card clears its $695 fee depends on how naturally that booking pattern fits trips you were already taking.

  The rollout is invitation-based for now, so applications are not yet open to everyone. We will update our [card page](/card/robinhood-platinum) as availability widens and terms firm up.

