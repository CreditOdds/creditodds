title: "Robinhood Platinum Opens to Invited Users"
summary: "Robinhood began issuing its $695 Platinum Card to invited users on July 22. The card earns 5% back on dining (first $50,000 per year), 10% on hotels and 5% on flights booked through Robinhood's travel portal, and 1% elsewhere, with no signup bonus. An annual credit stack including $700 in hotel credits and $300 in flight credits does the heavy lifting against the fee."
