title: "Capital One Venture Adds $100 Stays Credit"
summary: "Capital One is emailing Venture cardholders that the $95 card now carries an annual $100 credit for hotel and vacation rental bookings through Capital One Travel. The credit renews on the cardholder anniversary date and needs no enrollment. Capital One has not published the change, and it has not reached every cardholder yet."
