body: |
  Capital One is notifying Venture Rewards cardholders by email that their card
  now includes an annual **$100 stays credit** for hotel and vacation rental
  bookings made through Capital One Travel. The email says the credit renews
  each year on the cardholder's anniversary date, requires **no enrollment**,
  and becomes available within **72 hours** of the notice. It can be viewed and
  applied at checkout.

  The Venture Rewards charges a **$95 annual fee**, so a credit that size covers
  the fee outright for anyone who books a hotel or vacation rental through
  Capital One Travel once a year.

  ## The rollout is still in progress

  Capital One has not put out an announcement, and the benefit does not yet
  appear on the card's public page or in Capital One's online benefits listing.
  Reports collected by Doctor of Credit and Frequent Miler come from cardholders
  who received the email, and it is not clear whether every Venture account is
  getting it or only part of the base so far. Cardholders who have not seen the
  email should check their account before counting on the credit.

  ## Context

  The move follows Chase raising the Sapphire Preferred's hotel credit from $50
  to $100 without touching that card's annual fee. Both credits are tied to the
  issuer's own booking portal, which is the point: the credit only pays out if
  the booking runs through Capital One Travel, where Venture cards also earn 5X
  miles on hotels and vacation rentals.

