title: "Citi Expands Curated Table for Strata Elite"
summary: "Citi and Mastercard are running three Curated Table events this fall for Citi Strata Elite cardmembers: New York on September 9, Austin on October 21, and Miami on December 2. Tickets start at $100 and sell first come, first served."
