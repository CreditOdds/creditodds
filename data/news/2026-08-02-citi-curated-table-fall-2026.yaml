body: |
  Citi and Mastercard are expanding The Curated Table, an invitation-limited dining
  and experiences series for **Citi Strata Elite** cardmembers, to three events this
  fall. Citi announced the schedule on **July 30, 2026**.

  The fall lineup covers three cities:

  - **September 9, 2026** in New York, built around fashion, pairing immersive
    ateliers with a Christian Siriano runway show and a culinary program from
    Michael and Bryan Voltaggio.
  - **October 21, 2026** in Austin, Texas, timed to Formula 1 weekend and centered
    on the McLaren Mastercard Formula 1 Team, including a driver appearance.
  - **December 2, 2026** in Miami, ahead of Art Basel, combining dining, music and
    art around a featured artist.

  Tickets start at **$100** and are sold on a first come, first served basis through
  priceless.com/CuratedTable. Citi says a limited number of premium packages pair a
  Curated Table seat with added access at the September fashion event.

  ## What it does not change

  This is an access perk, not a revision to the card's published benefits.
  Cardmembers still pay for tickets, and the announcement leaves the Strata Elite's
  annual fee, statement credits and earning rates untouched. The value is the
  eligibility gate, since seats are capped and sold only to qualifying cardmembers.

  Citi has not published a single fixed on-sale date beyond the first come, first
  served terms, so Strata Elite holders who want a seat at any of the three events
  should watch priceless.com/CuratedTable rather than wait for a reminder.

