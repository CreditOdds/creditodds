our_take: >
  The Reflect is built for one job: 21 months of 0% intro APR on both
  purchases and qualifying balance transfers, with no annual fee. That runway
  is long enough to make it one of our top 0% APR picks, and it gives you
  close to two years to pay down existing debt or spread out a big purchase
  without interest piling up. The tradeoff is that the card earns no rewards
  at all, so there is no cash back or points to keep it in rotation once the
  intro period ends and the regular 17.49% to 28.24% APR kicks in. Cell phone
  protection of up to $600 per claim, with a $25 deductible, is the only
  ongoing perk, and the foreign transaction fee makes it a poor travel
  companion. Open it for the 0% window, stick to a payoff plan, and plan on a
  different card for everyday spending.
