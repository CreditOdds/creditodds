our_take: >
  The Reflect is a pure intro-APR play: 21 months of 0% on both purchases and
  balance transfers, with no annual fee, which is long enough to land it at #3
  on our Best 0% APR list. That runway makes it a strong pick if you need to
  pay down existing debt or spread out a large purchase over nearly two years
  without interest. The tradeoff is that the card earns no rewards at all, so
  once the intro window closes, the regular APR of 17.49% to 28.24% applies
  and there is little reason to keep swiping it. It also charges a foreign
  transaction fee, so leave it at home when you travel abroad. Cell phone
  protection of up to $600 per claim, with a $25 deductible, is the lone
  ongoing perk.
