our_take: >
  The Reflect is a single-purpose card and it is honest about it: 21 months of
  0% intro APR on purchases and on qualifying balance transfers, with no
  annual fee, which is enough runway to clear a real balance or spread a large
  purchase over nearly two years. That length is why it lands at #3 on our
  Best 0% APR list. The tradeoff is total, because this card earns no rewards
  at all, so there is nothing to fall back on once the intro window closes and
  the rate resets into the 17.49% to 28.24% range. Cell phone protection of up
  to $600 when you pay your bill with the card is the lone ongoing perk, and
  it comes with a $25 deductible and a two-claim annual limit. It also charges
  a foreign transaction fee, so leave it home when you travel abroad. Open it
  with a payoff plan and expect to retire it when the plan is done.
