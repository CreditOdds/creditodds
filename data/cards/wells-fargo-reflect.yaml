our_take: >
  The Reflect is a pure balance-transfer play: 21 months of 0% intro APR on
  purchases and qualifying balance transfers, with no annual fee. That long
  runway puts it at #3 on our Best 0% APR list and makes it a strong choice if
  your goal is to pay down existing debt or spread a large purchase out
  interest-free. The tradeoff is that it earns no rewards, so once the intro
  period ends there's little reason to keep using it. It also charges foreign
  transaction fees, so leave it at home when you travel abroad. Cell phone
  protection of up to $600 per claim, with a $25 deductible and up to two
  claims every 12 months, is the only ongoing perk. Open it for the 0% window,
  stick to a payoff plan, and use a rewards card for spending after that.
