name: "Bilt Palladium"
bank: "Bilt"
slug: "bilt-palladium"
image: "bilt_palladium.png"
accepting_applications: true
apply_link: https://www.biltrewards.com/card/apply
foreign_transaction_fee: false
network: "mastercard"
our_take: >
  The Bilt Palladium is the only Bilt card with a 2x base rate on everyday
  spending, which, alongside up to 1.25x on rent and mortgage payments with no
  transaction fee, makes it the strongest option for renters who put
  everything on one card. The $495 annual fee is steep, but the card returns a
  $400 Bilt Travel hotel credit in two $200 halves, $200 in annual Bilt Cash,
  and Priority Pass lounge access. Portal bookings earn 4x on hotels and 3x on
  flights, and Lyft earns 4x once linked. The tradeoff is that much of that
  value lives inside Bilt's own ecosystem: the hotel credit requires portal
  bookings, and Bilt Cash is a separate currency used mainly for point
  accelerators rather than cash back. The welcome offer of 50,000 points plus
  $300 in Bilt Cash after $4,000 in spend over three months softens year one.
