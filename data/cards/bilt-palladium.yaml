name: "Bilt Palladium"
bank: "Bilt"
slug: "bilt-palladium"
image: "bilt_palladium.png"
accepting_applications: true
apply_link: https://www.biltrewards.com/card/apply
foreign_transaction_fee: false
network: "mastercard"
our_take: >
  The Bilt Palladium is the only card in the Bilt lineup that earns a
  meaningful flat rate, 2x points on everyday spend, on top of fee-free rent
  and mortgage payments that earn up to 1.25x. That combination, plus 4x on
  hotels and 3x on flights booked through Bilt Travel and Priority Pass lounge
  access, earns it a spot at #13 on our Best Travel Credit Cards list. The
  $495 annual fee is steep, and covering it depends on using the $400 in Bilt
  Travel hotel credits, split into two $200 statement credits, and the $200
  annual Bilt Cash award. If you don't book hotels through Bilt's portal, much
  of that value evaporates. The welcome offer is 50,000 points plus $300 Bilt
  Cash after $4,000 in spend over three months, and hitting that spend
  excluding rent also unlocks Gold Status. The rent multiplier floats each
  billing cycle based on your other spending, and the intro rate is a fixed
  10% on purchases for 12 billing cycles rather than a 0% window, so judge
  this card on its ongoing earning and credits.
