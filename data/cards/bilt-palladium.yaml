name: "Bilt Palladium"
bank: "Bilt"
slug: "bilt-palladium"
image: "bilt_palladium.png"
accepting_applications: true
apply_link: https://www.biltrewards.com/card/apply
foreign_transaction_fee: false
network: "mastercard"
our_take: >
  Palladium is the only card in the Bilt lineup that pairs the rent earning
  with a genuinely strong base rate: 2x on all everyday spend, alongside 4x on
  Bilt Travel hotels, 3x on Bilt Travel flights, 4x on Lyft, and up to 1.25x
  on rent or mortgage with no transaction fee. The credits are what carry the
  $495 annual fee: $400 a year in hotel credits, issued as two $200 statement
  credits for Bilt Travel bookings, plus $200 in annual Bilt Cash with up to
  $100 rolling over, and Priority Pass lounge access. New cardholders get
  50,000 points plus $300 in Bilt Cash after $4,000 in three months, with Gold
  Status on the same $4,000 of non-housing spend in the first 90 days, which
  is why it lands at #13 on our Best Travel Credit Cards list. The honest
  catch is that the hotel credits only pay out through Bilt's own travel
  portal, so if you book hotels elsewhere a large share of the fee simply does
  not come back. The rent rate is also a ceiling, set each cycle from your
  everyday spend relative to the housing payment, and the intro APR is a fixed
  10% for 12 billing cycles rather than 0%.
