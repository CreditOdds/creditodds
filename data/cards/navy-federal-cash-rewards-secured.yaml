our_take: >
  The cashRewards Secured is a credit-building card that still pays 1% cash
  back on everything, with no annual fee and no foreign transaction fee. Its
  most useful feature is the clear upgrade path: you can become eligible for a
  credit limit increase after 3 months without adding to your deposit, and
  Navy Federal reviews the account monthly for an upgrade to the unsecured
  cashRewards card starting at 6 months, returning your deposit when it
  graduates. The tradeoff is the $200 minimum security deposit and a flat 18%
  APR, so carrying a balance undercuts the whole point of building credit.
  Navy Federal also does not charge cash advance fees, though small ATM fees
  apply outside its own branches and ATMs. For anyone starting out or
  rebuilding credit, it is a sensible first card with a defined route to
  something better.
