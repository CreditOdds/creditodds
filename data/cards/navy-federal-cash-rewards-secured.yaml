our_take: >
  The cashRewards Secured is a credit-building card that still earns
  something: 1% cash back on every purchase, with no annual fee and no foreign
  transaction fees. Its most useful feature is the upgrade path, with a
  possible credit limit increase after 3 months without adding to your deposit
  and monthly reviews starting at 6 months for a move to the unsecured
  cashRewards card, at which point your deposit (minimum $200) is returned.
  The tradeoff is an 18% APR and a flat, unremarkable earn rate, so carrying a
  balance would quickly outweigh any rewards. Navy Federal also does not
  charge a cash advance fee, though ATM fees apply outside its own branches
  and ATMs. Use it to build a payment history, pay it in full each month and
  aim for the upgrade.
