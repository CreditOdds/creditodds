our_take: >
  The cashRewards Secured is a solid credit builder for Navy Federal members
  because it has a clear path to an unsecured card. After 3 months you can
  qualify for a higher credit limit without adding to your deposit, and
  starting at 6 months Navy Federal reviews the account every month for an
  upgrade to the unsecured cashRewards card, returning your deposit (minimum
  $200) when you're upgraded. It has no annual fee and no foreign transaction
  fee, and it earns a flat 1% cash back, which is uncommon for a secured card.
  The catch is the 18% APR, which is lower than many secured cards charge but
  still adds up quickly if you carry a balance. Use it for small purchases you
  pay off in full, and treat it as a 6-month step toward an unsecured card,
  not a card to keep long term.
