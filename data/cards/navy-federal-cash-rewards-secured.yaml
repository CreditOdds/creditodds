our_take: >
  The cashRewards Secured is a straightforward credit builder for Navy Federal
  members, with no annual fee and a $200 minimum security deposit. Its
  strongest feature is the clear upgrade path: you can be eligible for a
  credit limit increase after 3 months without adding to the deposit, and
  starting at 6 months the account is reviewed monthly for an upgrade to the
  unsecured cashRewards card, with your deposit returned when it graduates. It
  also earns 1% cash back on everything, which is more than many secured cards
  offer. The tradeoff is that 1% is the only earn rate and the APR is a fixed
  18%, so carrying a balance will cost you more than the rewards return. Use
  it to establish a payment history, pay it in full each month, and aim to
  graduate to the unsecured version.
