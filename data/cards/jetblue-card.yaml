our_take: >
  The no-annual-fee JetBlue card is a low-commitment way to earn TrueBlue
  points, with 3x on JetBlue purchases and 2x on dining and groceries. The
  10,000-point signup bonus after $1,000 in spending over three months is
  small, and the 12-month 0% intro APR on balance transfers is a modest
  secondary perk. The real catch is how little it does for travelers: there is
  no free checked bag, and the only ongoing benefit is 50% off inflight
  purchases on JetBlue-operated flights. Everything outside its bonus
  categories earns just 1x, so it is hard to justify as a primary card. It
  ranks 16th on our Best Airline Credit Cards list, and occasional JetBlue
  flyers who want no fee will find it fine, but anyone checking bags should
  look at the JetBlue Plus instead.
benefits:
