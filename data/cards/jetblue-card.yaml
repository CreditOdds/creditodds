our_take: >
  The no-annual-fee JetBlue card lets occasional JetBlue flyers earn TrueBlue
  points without paying a fee, at 3 points per dollar on JetBlue purchases and
  2 per dollar on dining and groceries. It ranks #16 on our Best Airline
  Credit Cards list, which reflects that it's a starter card rather than a top
  choice. The welcome bonus is small at 10,000 points after $1,000 in
  spending, and everything else earns just 1 point per dollar. The tradeoff
  with the free version is the perks: you get 50% off inflight purchases but
  no free checked bag, which is the main reason to choose the $99 JetBlue Plus
  instead. There's also a 0% intro APR on balance transfers for 12 months and
  no foreign transaction fee. If you check a bag even once or twice a year,
  the paid card probably makes more sense.
