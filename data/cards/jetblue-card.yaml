our_take: >
  The JetBlue card is a no-annual-fee entry point to TrueBlue, earning 3
  points per dollar on JetBlue purchases and 2 per dollar on dining and
  groceries, and it earns our Best No-Fee badge on the Best Airline Credit
  Cards list. It also offers a 0% intro APR on balance transfers for 12 months
  and no foreign transaction fees. The catch is that the perks are thin: the
  only ongoing benefit is 50% off inflight purchases, with no free checked bag
  or anniversary bonus. The signup bonus is also small at 10,000 points after
  $1,000 in spending in the first three months, and the base rate on
  everything else is just 1 point per dollar. It suits occasional JetBlue
  flyers who want to earn points without a fee, while frequent flyers will
  likely get more from the Plus.
benefits:
  - name: "50% Off Inflight Purchases"
    value: 50
    value_unit: "percent"
    description: "50% savings on eligible inflight purchases on JetBlue-operated flights"
    frequency: "per_purchase"
    category: "travel"
    enrollment_required: false
