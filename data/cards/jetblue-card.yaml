our_take: >
  The no-fee JetBlue card is a light-touch way to collect TrueBlue points: 3x
  on JetBlue purchases, 2x at restaurants and grocery stores, and 1x
  elsewhere, with no annual fee and no foreign transaction fees. Our Best
  Airline Credit Cards list names it the best no-fee pick in the category,
  which is a fair description of its role. The 12 months of 0% intro APR on
  balance transfers is an unusual extra for an airline card and may matter
  more to some applicants than the rewards do. Be realistic about the rest,
  though: the signup bonus is only 10,000 points after $1,000 in three months,
  and the sole ongoing perk is 50% off eligible inflight food, drinks, and
  Wi-Fi. A free checked bag isn't among its benefits, so anyone who checks
  luggage on more than the occasional trip will outgrow this card quickly.
benefits:
  - name: "50% Off Inflight Purchases"
    value: 50
    value_unit: "percent"
    description: "50% savings on eligible inflight purchases on JetBlue-operated flights"
    frequency: "per_purchase"
    category: "travel"
    enrollment_required: false
