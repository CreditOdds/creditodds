our_take: >
  The cashRewards Plus is a simple flat-rate card: 2% cash back on everything
  with no annual fee and no foreign transaction fee. The catch is that you
  cannot apply for it directly; it is issued from the standard cashRewards
  application only when Navy Federal approves a credit limit of $5,000 or
  more, and lower limits get the 1.5% version instead. The 12-month 1.99%
  intro APR on balance transfers is unusually friendly because Navy Federal
  charges no balance transfer fees, and the regular APR range of 14.15% to 18%
  is low for a rewards card. New cardholders can earn a $250 bonus after
  spending $2,500 in the first 3 months, an offer that runs through January 3,
  2027. If you qualify for the higher limit, it is a strong set-and-forget
  card for all your spending.
