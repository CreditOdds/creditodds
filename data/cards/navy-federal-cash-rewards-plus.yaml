our_take: >
  The cashRewards Plus earns a flat 2% cash back on everything with no annual
  fee and no foreign transaction fees, which puts it among the better simple
  cash back cards for anyone eligible for Navy Federal membership. The catch
  is that you cannot apply for it directly: it is issued on the cashRewards
  application only when you are approved for a credit limit of $5,000 or more,
  while lower limits get the 1.5% version. New cardholders can earn a $250
  bonus after spending $2,500 within 3 months, an offer valid for applications
  through January 3, 2027. A 1.99% intro balance transfer rate for 12 months
  with no balance transfer fee is a genuinely useful extra, and regular APRs
  of 14.15% to 18% are lower than most bank cards. Beyond rental car collision
  damage waiver coverage, the perks are minimal, but a no-fee 2% card does not
  need many.
