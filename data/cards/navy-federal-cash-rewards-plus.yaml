our_take: >
  The cashRewards Plus is a straightforward flat-rate card: 2% cash back on
  everything with no annual fee and no foreign transaction fees. The catch is
  that you cannot apply for it directly: it is issued through the regular
  cashRewards application only when you are approved for a credit limit of
  $5,000 or more, and lower limits get the 1.5% cashRewards instead. Beyond
  the rewards, it offers a 1.99% intro APR on balance transfers for 12 months
  with no balance transfer fees, a combination that makes paying down existing
  debt cheaper than on most cards. The regular APR range of 14.15% to 18% is
  also lower than typical. Add a $250 bonus after $2,500 in spending in the
  first 3 months, and it is a simple, low-cost keeper if you qualify for the
  higher limit.
