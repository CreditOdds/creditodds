our_take: >
  The cashRewards Plus is a simple 2% flat cash-back card with no annual fee
  and no foreign transaction fee, and for Navy Federal members that makes it
  an easy everyday choice. You can't apply for it directly: it is issued when
  your cashRewards application is approved for a credit limit of $5,000 or
  more, and lower limits get the regular 1.5% version instead. There is a $250
  bonus after $2,500 in spending within 3 months. Navy Federal also offers a
  1.99% intro APR on balance transfers for 12 months and charges no balance
  transfer fee, a rare combination. The tradeoff is that there are no bonus
  categories and few extras beyond rental car collision damage waiver
  coverage, so this card works as a steady base for your spending, not as a
  way to maximize rewards.
