our_take: >
  U.S. Bank is no longer accepting new applications for the Altitude Reserve,
  so this take is mainly for existing cardholders deciding whether to keep it.
  The core math still works for many: the $400 annual fee is offset by a $325
  annual travel credit, leaving an effective cost of $75 before counting
  unlimited Priority Pass Select lounge access and up to $100 toward Global
  Entry or TSA PreCheck every five years. The catch is that the travel credit
  applies to travel purchases made with a mobile wallet, so you need to pay
  that way to capture it. If you fly often enough to use the lounges and
  reliably spend on travel through a mobile wallet, it remains worth holding.
  If not, the fee is hard to justify, and you cannot reapply later if you
  close it.
