our_take: >
  The Altitude Reserve is no longer accepting applications, so this verdict
  matters mainly for existing cardholders deciding whether to keep it. For
  them, the $325 annual travel credit covers most of the $400 annual fee, but
  only on travel purchases made with a mobile wallet, so check that your
  bookings actually qualify. Unlimited Priority Pass lounge access and a
  Global Entry or TSA PreCheck credit of up to $100 every five years round out
  the core perks. The real question at renewal is whether the lounge access
  and whatever you earn on spend are worth the remaining $75 or so net cost
  after the credit. If you rarely fly or can't route travel through a mobile
  wallet, the math turns against keeping it.
