our_take: >
  The Altitude Reserve's pitch is its $325 annual travel credit, which is
  generous enough to cut the $400 annual fee down to $75 in practice, and it
  stacks with unlimited Priority Pass Select lounge access and a $100 Global
  Entry or TSA PreCheck credit every five years. The catch is the fine print
  on that credit: it only applies to travel purchases paid through a mobile
  wallet, so you have to change how you pay to collect it. The bigger catch is
  that U.S. Bank is no longer accepting applications for this card, so it is
  only relevant if you already hold it. If you do, the math still works as
  long as you use the full travel credit each year and get real value out of
  the lounge access. If you don't, there is no way in right now.
