our_take: >
  U.S. Bank is no longer accepting applications for the Altitude Reserve, so
  this card only matters if you already carry it. For existing cardholders,
  the core math is a $325 annual travel credit against the $400 annual fee,
  which cuts the effective cost to $75 a year, but that credit applies only to
  travel purchases made with a mobile wallet. On top of that you get unlimited
  Priority Pass lounge access and up to $100 toward Global Entry or TSA
  PreCheck every five years. If you travel often enough to use the lounge
  membership and can route travel spend through a mobile wallet to capture the
  credit, keeping it is easy to justify. If not, the fee is hard to defend,
  and since you cannot reapply once it is gone, weigh that before closing it.
