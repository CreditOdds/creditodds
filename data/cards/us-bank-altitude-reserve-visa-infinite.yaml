our_take: >
  U.S. Bank is no longer accepting new applications for the Altitude Reserve,
  so this take is for existing cardholders deciding whether to keep it. The
  card's $400 annual fee is largely offset by a $325 annual travel credit,
  though that credit applies only to travel purchases paid with a mobile
  wallet, so it pays to route bookings through Apple Pay or a similar wallet.
  Unlimited Priority Pass lounge access and up to a $100 Global Entry or TSA
  PreCheck credit every five years add real value for frequent travelers. The
  math is simple: if you use the full travel credit each year, your net cost
  is about $75 for the lounge access and other perks. If your travel has
  slowed and you would not otherwise spend that credit, the fee is harder to
  justify, and since you cannot reapply once it is gone, weigh that before
  closing it.
