our_take: >
  The Navy Federal Platinum is built for one job: paying down debt cheaply. It
  offers a 0.99% intro APR on balance transfers for 12 months, Navy Federal
  charges no balance transfer fees, and the regular APR starts as low as
  10.24%. That combination means moving a balance here can cost very little,
  and the low ongoing rate softens the blow if you don't clear it in a year.
  The tradeoff is that this card earns no rewards at all, so there's little
  reason to use it for everyday spending once the debt is gone. There's no
  annual fee and no foreign transaction fee, plus rental car collision
  coverage and travel assistance as minor extras. Open it to consolidate and
  pay off a balance, not to earn anything back.

