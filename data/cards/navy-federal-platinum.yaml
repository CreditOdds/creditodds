our_take: >
  The Navy Federal Platinum is built for paying down debt rather than earning
  rewards: it offers a 0.99% intro APR on balance transfers for 12 months,
  charges no balance transfer fees, and has no annual fee. Its regular APR
  starts as low as 10.24% and tops out at 18%, which is unusually low and
  means the card stays useful even after the intro period ends. The tradeoff
  is that it earns no rewards at all, so there is no reason to put everyday
  spending on it. Rental car collision damage coverage and travel and
  emergency assistance are the only ongoing perks. Open it to move
  high-interest balances and keep costs down, and use a rewards card for your
  regular purchases.

