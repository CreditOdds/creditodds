our_take: >
  The Platinum is built for one job: moving a balance without paying to do it.
  Navy Federal charges no balance transfer fee at all, and the card pairs that
  with a 0.99% intro APR for 12 months on transfers, which means a year of
  near-free carry and none of the usual 3% to 5% skimmed off the top.
  Afterward the standard rate of 10.24% to 18% is low enough that an
  unfinished payoff does not become punishing, which is the real difference
  between this and a typical 0% card. Be clear about the tradeoff: there are
  no rewards here whatsoever, and the annual fee is $0 precisely because there
  is nothing else to pay for. A rental car collision damage waiver and 24/7
  travel and emergency assistance are the only extras. Open it to clear debt
  cheaply, not to spend on.

