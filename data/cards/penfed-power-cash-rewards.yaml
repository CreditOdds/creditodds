our_take: >
  The PenFed Power Cash Rewards Visa Signature is one of the simplest paths
  to 2% cash back on everything with no annual fee, provided you qualify for
  PenFed's Honors Advantage program through military service or by opening an
  Access America checking account; without it the card earns 1.5%. PenFed
  membership itself is open to anyone with a $5 savings deposit. The $100
  bonus after $1,500 in spend is modest but easy to hit, and the 17.99%
  variable APR is notably lower than most rewards cards, a common credit
  union advantage. A 0% intro rate on balance transfers for 12 months adds
  utility, though a transfer fee applies. If you do not want the checking
  account requirement, flat 2% alternatives like the Citi Double Cash earn
  the same rate with no strings.
