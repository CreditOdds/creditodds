our_take: >
  The Ink Business Premier earns 2% cash back on everything, rising to 2.5% on
  purchases of $5,000 or more, which makes it a fit for businesses that put
  large invoices and supplier payments on a card. Travel booked through Chase
  Travel earns 5%, and the $1,000 bonus after $10,000 in spend over three
  months is sizable if you can hit that threshold. The tradeoff is the $195
  annual fee: at a 2% base rate you need meaningful annual spend before the
  card beats no-fee flat-rate options, and it offers no intro APR. In return
  you get cell phone protection up to $1,000 per claim, purchase protection,
  extended warranty, primary rental car coverage when renting for business,
  free employee cards, and no foreign transaction fee. Treat the 5% on Lyft
  rides through September 2027 as a small extra.
