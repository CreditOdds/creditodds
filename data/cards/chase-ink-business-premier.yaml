our_take: >
  The Ink Business Premier is a flat-rate business card for big spenders: 2%
  cash back on everything, rising to 2.5% on purchases of $5,000 or more, plus
  5% on travel booked through Chase Travel. The $1,000 bonus after $10,000 in
  spending within three months is sizable but needs a real budget to unlock.
  The tradeoff is the $195 annual fee, which is steep for a cash back card
  with no category bonuses, so it only makes sense if your business regularly
  puts large transactions on plastic. It does come with solid protections,
  including cell phone protection, purchase protection up to $10,000 per item,
  extended warranty, and primary rental car coverage for business rentals,
  plus no foreign transaction fee and free employee cards. Smaller businesses
  will likely do better with a no-fee option.
