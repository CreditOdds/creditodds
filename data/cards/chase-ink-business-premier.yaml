our_take: >
  The Ink Business Premier is a flat-rate business card that earns 2% cash
  back on everyday purchases and 2.5% on single purchases of $5,000 or more,
  which suits businesses that regularly pay large invoices on a card. Travel
  booked through Chase Travel earns 5%, and the $1,000 signup bonus after
  $10,000 in spend over three months is substantial if your spending can reach
  that threshold. You also get cell phone protection, purchase protection up
  to $10,000 per item, extended warranty, primary rental car coverage for
  business rentals, free employee cards, and no foreign transaction fees. The
  catch is the $195 annual fee, which a no-fee flat-rate card avoids entirely,
  so the math only works if your volume or large-ticket purchases are high
  enough for that extra half percent to cover it.
