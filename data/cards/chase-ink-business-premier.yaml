our_take: >
  The Premier's pitch is its base rate: 2% cash back on everything with no
  categories to track, rising to 2.5% on any single purchase of $5,000 or
  more, which is where a business with large invoices earns back the $195
  annual fee. Travel booked through Chase Travel earns 5%, and there are no
  foreign transaction fees. The protections are unusually complete for a cash
  back card: up to $1,000 per cell phone claim, purchase protection up to
  $10,000 per item, an extra year of extended warranty, primary rental
  coverage up to $60,000 on business rentals, and employee cards at no cost.
  The $1,000 bonus asks for $10,000 of spend in three months, a higher bar
  than the no-fee Ink cards set. Note there is no intro APR and the regular
  rate runs 17.74% to 28.49%, so this is built for a business that pays in
  full every month.
