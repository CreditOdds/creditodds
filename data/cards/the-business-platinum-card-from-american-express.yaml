our_take: >
  The Business Platinum's headline right now is its signup bonus, recently
  raised from 200,000 to 300,000 points after $20,000 in spend within three
  months, one of the largest offers we track. Beyond that, it earns 5x on
  flights and prepaid hotels booked through Amex Travel and 2x on eligible
  U.S. construction, hardware, electronics, software and cloud, and shipping
  purchases, or on any single purchase of $5,000 or more, up to $2 million per
  year. Travelers get Centurion and Priority Pass lounge access, 10 Delta Sky
  Club visits a year, Marriott Bonvoy Gold status, and 35% points back on Pay
  with Points flights through Amex Travel. The catch is the $895 annual fee,
  which you only offset by working through a long list of enrollment-based
  credits for ChatGPT, Indeed, Adobe, Dell, Hilton, wireless service, CLEAR,
  and Amex Travel hotels, several of which come with spending thresholds or
  quarterly limits. Ordinary spend earns just 1x, so this card pays off for
  businesses that travel often and will actually use most of those credits.
