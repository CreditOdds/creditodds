our_take: >
  The companion certificate is the reason to carry this one: it arrives every
  year after renewal with no spend requirement and covers a round-trip Delta
  Main fare within the U.S. or to Mexico, the Caribbean, or Central America,
  which can outrun the $350 annual fee by itself if you actually use it. It
  ranks #4 on our Best Airline Credit Cards list as our Best Premium pick, and
  the supporting benefits are substantial: $150 in Delta Stays credit, up to
  $10 a month each in Resy dining and rideshare credits, a Global Entry or TSA
  PreCheck credit every four years, a $2,500 MQD headstart toward Medallion
  status, and MQD Boost at $1 per $20 spent. Earning is respectable at 3x on
  Delta purchases and direct hotel bookings and 2x on dining and U.S.
  supermarkets, but everything else is 1x. The welcome offer is currently as
  high as 90,000 miles after $4,000 in six months, down from a 100,000 run
  that ended in July, and offers vary by applicant. The honest caveat is that
  the fee only pencils out if you redeem the companion certificate and use the
  monthly credits, since several require enrollment and expire unused.
