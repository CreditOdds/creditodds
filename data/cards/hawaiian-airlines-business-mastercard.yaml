our_take: >
  The Hawaiian Airlines Business Mastercard's strongest selling point is its
  50,000-mile welcome offer after $4,000 in spend within 3 months, a solid
  haul for a $99 annual fee. Ongoing earn is 3 miles per dollar on Hawaiian
  Airlines and Alaska Airlines purchases only, 2 miles on gas, dining, and
  office supplies, and 1 mile on everything else, with no foreign transaction
  fees. Heavy spenders get extra value from the annual spend bonuses: 20,000
  Atmos Rewards points after $50,000 in a calendar year, or 40,000 after
  $100,000. The tradeoff is that outside those airline purchases the earn
  rates are ordinary, so this only makes sense if your business flies Hawaiian
  or Alaska often enough to use the miles. The one-time 50% off companion
  discount for roundtrip main cabin travel is a nice extra but won't justify
  the fee on its own.

