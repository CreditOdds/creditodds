our_take: >
  The Hawaiian Airlines Business Mastercard opens with 50,000 bonus miles
  after $4,000 of spending in three months, an easy target for most businesses
  and the clearest reason to apply. Beyond the bonus it earns 3x on Hawaiian
  Airlines and Alaska Airlines purchases only, with 2x at gas, dining, and
  office supplies, and 1x on everything else, so day-to-day business spending
  is not especially well paid. The $99 annual fee is a real commitment, and
  the annual spend bonuses that might offset it are set high: 20,000 Atmos
  Rewards points at $50,000 of calendar-year purchases, or 40,000 points at
  $100,000 instead. A one-time 50% off companion discount for roundtrip main
  cabin travel is a nice first-year sweetener, but it is one time only. There
  is no foreign transaction fee, which helps on Pacific routes, but the card
  only makes sense if your business actually flies Hawaiian or Alaska with
  some regularity.

