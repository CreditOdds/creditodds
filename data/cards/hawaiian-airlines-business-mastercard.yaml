our_take: >
  Barclays stopped accepting new applications for the Hawaiian Airlines
  Business Mastercard in October 2026, so this one is now relevant only to
  existing cardholders. For them, the core earning is 3 points per dollar on
  Hawaiian Airlines and Alaska Airlines purchases, 2x on gas, dining, and
  office supplies, and 1x on everything else. The bigger lever is annual
  spend: $50,000 in a calendar year adds 20,000 bonus Atmos Rewards points,
  and $100,000 or more brings 40,000 instead. The $99 annual fee is reasonable
  for a business that flies those airlines, but the 1x base rate makes it a
  poor home for general spending if you won't hit the spend tiers. Keep it if
  you fly Hawaiian or Alaska regularly and route enough business spend through
  it to reach a bonus tier.

