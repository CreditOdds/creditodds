our_take: >
  The Business Gold earns 4 points per dollar automatically in your top 2
  spending categories each billing cycle from 6 eligible ones, including U.S.
  advertising, electronics retailers and software/cloud providers,
  restaurants, gas stations, transit, and wireless service, which suits
  businesses whose biggest costs shift month to month. That 4x applies on up
  to $150,000 a year combined before dropping to 1x, and flights and prepaid
  hotels booked through AmexTravel.com earn 3x. The $375 annual fee is
  substantial, and offsetting it depends on enrollment-required credits: up to
  $20 a month for Grubhub, office supply stores, and UPS shipping, $300 in
  ChatGPT credits, a monthly Walmart+ membership credit, and up to $150 back
  on Squarespace. Those add up to more than the fee on paper, but only if your
  business already uses those services. The welcome offer reaches as high as
  200,000 Membership Rewards points after $15,000 in 3 months, though Amex
  notes your actual offer may be lower. It is a strong choice for a business
  with steady spend in its eligible categories, and an expensive one if the
  credits go unused.
