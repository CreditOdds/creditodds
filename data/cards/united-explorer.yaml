our_take: >
  The Explorer is the sensible middle of United's personal lineup: a $150
  annual fee bought back quickly by a free first checked bag on United
  flights, two United Club one-time passes a year, and a $120 Global Entry,
  TSA PreCheck, or NEXUS credit every four years. It earns 3 miles per dollar
  on eligible United purchases, 2 on dining and hotels, and 1 on everything
  else, so it rewards United loyalty without asking you to route all your
  spending through it. Chase trimmed the welcome offer from 60,000 to 50,000
  miles in May 2026, and the current bonus is 50,000 after $3,000 in three
  months, plus 10,000 more for adding an authorized user in that window. The
  pile of smaller credits for United Hotels, rideshare, Avis and Budget,
  Instacart, and JSX looks generous on paper, but most arrive monthly, several
  need annual opt-in, and the Instacart credit ends after December 31, 2027,
  so only count the ones you will genuinely use. It sits eighth on our Best
  Airline Credit Cards list, and for an occasional United flyer the bag waiver
  alone usually settles the math.
