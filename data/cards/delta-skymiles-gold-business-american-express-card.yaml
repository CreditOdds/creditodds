our_take: >
  The Delta Gold Business is the entry point for small business owners who fly
  Delta, and its main draw right now is a 90,000-mile welcome offer after
  $6,000 in spending within six months, which ends 2026-11-04. That offer has
  bounced between 60,000 and 90,000 miles in recent months, so applying while
  it sits at the high end matters. For the $150 annual fee you get a free
  first checked bag on Delta worldwide and a second on domestic flights for up
  to 9 travelers on a reservation, plus Main Cabin 1 boarding and 15% off
  award flights. Earning is modest: 2x on Delta purchases, restaurants, and
  U.S. shipping and select advertising (capped at $50,000 a year each), with
  1x on everything else. The up to $150 Delta Stays credit helps offset the
  fee, but the $200 Delta Flight Credit requires $10,000 in calendar-year
  spending and the rideshare credit only starts after your first renewal. It
  fits a business that flies Delta regularly and checks bags, not one looking
  for strong everyday rewards.
