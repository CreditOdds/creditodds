foreign_transaction_fee: false
network: "amex"
our_take: >
  The Delta Gold Business is a sensible entry point for a small business that
  flies Delta, with a free first checked bag for you and up to 8 companions,
  Main Cabin 1 priority boarding, and a 90,000-mile welcome offer after $6,000
  in spend over 6 months that ends 2026-11-04. That bonus has swung between
  60,000 and 90,000 miles several times recently, so the current high is worth
  grabbing if you were already planning to apply. Earning is 2x on Delta
  purchases, restaurants worldwide, and U.S. shipping (capped at $50,000 a
  year), with 1x on everything else, which is fine but not compelling for $150
  a year. The up to $150 Delta Stays credit can cover the fee on its own if
  you book prepaid hotels through delta.com, while the $200 Delta Flight
  Credit requires $10,000 in calendar-year spend and the rideshare credit only
  starts after your first renewal. Treat it as a bag-fee and perks card for
  Delta flyers, not a primary business earner.
