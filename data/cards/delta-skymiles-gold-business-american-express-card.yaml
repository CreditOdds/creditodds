our_take: >
  The Delta Gold Business pairs a strong current welcome offer, 90,000 miles
  after $6,000 in spend over 6 months, with the same practical Delta perks as
  the personal version: first checked bag free on Delta flights for you and up
  to 8 companions, priority boarding, and 15% off award flights. That offer
  has bounced between 60,000 and 90,000 miles several times since July and is
  set to end November 4, 2026, so timing matters if you want the higher
  number. For a $150 annual fee, the up to $150 Delta Stays credit can offset
  most of the cost if you book hotels through delta.com anyway. Ongoing
  earning is ordinary at 2 miles per dollar on Delta, restaurants, and U.S.
  shipping (shipping capped at $50,000 a year), with 1 mile on everything
  else. Pick it if your business flies Delta often enough to use the bag
  benefit, but don't expect it to compete as a primary spending card.
