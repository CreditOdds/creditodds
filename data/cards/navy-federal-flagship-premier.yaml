our_take: >
  The Flagship Premier is Navy Federal's new travel card, and its strongest
  pitch is the earn rate: 4 points per dollar on travel and 3 on dining, plus
  a 50,000-point bonus worth $500 after $4,000 in spending within three months
  for accounts opened through 1/3/2027. The $95 annual fee is easy to offset
  if you fly at all, since the $100 annual airline credit kicks in after just
  $100 of eligible airline purchases, and there's a Global Entry or TSA
  PreCheck credit of up to $120 every four years on top. The catch is the 1
  point per dollar on everything else, which makes this a card for travel and
  restaurant spending rather than an everyday workhorse. No foreign
  transaction fees, rental car collision coverage, and Navy Federal's lack of
  balance transfer and cash advance fees round it out. If your travel and
  dining spend is meaningful, this is a solid, low-friction travel card for
  members.
