our_take: >
  The Flagship Premier pairs 4 points per dollar on travel and 3 on dining
  with a 50,000-point welcome offer worth $500 after $4,000 in spending over
  three months, available for accounts opened through January 3, 2027. The $95
  annual fee is easy to offset if you use the $100 annual airline credit,
  which posts once you spend $100 or more on eligible airline purchases, and
  the card adds a Global Entry or TSA PreCheck credit of up to $120 every four
  years. No foreign transaction fees, rental car collision coverage, and
  travel accident insurance round out a sensible travel kit. The catch is the
  1 point per dollar on everything else, so purchases outside travel and
  dining earn little and you will want a stronger catch-all card alongside it.
  Navy Federal's lack of balance transfer and cash advance fees is a rare
  bonus, but this card earns its keep for members who travel and eat out
  regularly.
