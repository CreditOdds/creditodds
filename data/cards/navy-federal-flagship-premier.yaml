our_take: >
  The Flagship Premier pairs 4 points per dollar on travel and 3 on dining
  with a $100 annual airline credit, which by itself covers most of the $95
  annual fee once you spend $100 on eligible airline purchases. Add the
  current 50,000-point bonus, worth $500 after $4,000 in spending in the first
  three months for accounts opened through 1/3/2027, and the first year is
  easy to justify. A Global Entry or TSA PreCheck credit of up to $120 every
  four years and no foreign transaction fees round it out for people who
  actually travel. The catch is the 1 point per dollar on everything outside
  travel and dining, so this works best as a category card paired with
  something stronger for everyday spending. If you don't fly at least once a
  year, the airline credit goes unused and the fee gets much harder to defend.
