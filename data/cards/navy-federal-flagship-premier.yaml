our_take: >
  Released in September 2026, the Flagship Premier is Navy Federal's more
  category-driven travel card: 4 points per dollar on travel and 3 on dining
  for a $95 annual fee, with no foreign transaction fee. The opening offer is
  50,000 points, described as worth $500, after $4,000 in purchases in three
  months, and it is limited to accounts opened between September 10, 2026 and
  January 3, 2027. Recurring credits cover most of the fee if you fly at all,
  with $100 back each year after $100 in eligible airline purchases and up to
  $120 for Global Entry or TSA PreCheck every four years. The weak spot is the
  base rate of 1 point per dollar on everything outside travel and dining,
  which means this card should take a slice of your spending rather than all
  of it. The 15.74% to 18% APR range plus no balance transfer fees and no cash
  advance fees make it unusually forgiving for a travel card, and the 3GB
  GigSky data plan is a small extra for international trips.
