our_take: >
  The Flagship Premier earns 4 points per dollar on travel and 3 on dining,
  and for a $95 annual fee it pays back much of its cost through a $100 annual
  airline credit that triggers after you spend $100 on eligible airline
  purchases with the card. Add the 50,000-point welcome bonus, worth $500
  after $4,000 in spend over three months, and the first year is clearly in
  your favor if you travel even occasionally. The catch is that everything
  outside travel and dining earns just 1 point per dollar, so this is a card
  for your trips and restaurant tabs, not your everyday spending. Up to $120
  toward Global Entry or TSA PreCheck every four years, no foreign transaction
  fees, and rental car collision coverage round out a solid travel kit. Navy
  Federal also charges no balance transfer or cash advance fees, and its
  regular APR tops out at 18%, which is low for a rewards card if you ever
  carry a balance.
