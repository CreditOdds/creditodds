our_take: >
  The Secured Visa Platinum is one of the more affordable ways to build
  credit: no annual fee, no foreign transaction fees, and a regular APR range
  of 11.4% to 21.4%, well below what many secured cards charge. That lower
  rate offers some cushion if you occasionally carry a balance while
  establishing your history, though paying in full is still the goal. The
  catch is that the card earns no rewards, so its value is entirely in the
  credit history it helps you build, and like any secured card it requires a
  deposit. Visa acceptance makes it easy to use almost anywhere. Use it to
  build a track record, then move on to a rewards card once your credit is
  established.
