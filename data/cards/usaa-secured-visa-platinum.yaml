our_take: >
  The USAA Secured Visa Platinum is a solid credit-building tool for USAA
  members: no annual fee, no foreign transaction fee, and a regular APR range
  of 11.4% to 21.4%, which is unusually low for a secured card. That lower
  rate makes it more forgiving than most secured cards if you occasionally
  carry a balance while you rebuild. Running on the Visa network also means
  it's accepted nearly everywhere. The tradeoff is that it earns no rewards,
  and like any secured card it requires a deposit to back your credit line.
  Use it to build a track record of on-time payments, then plan to graduate to
  a rewards card once your score improves.
