our_take: >
  The Diamond Preferred is built almost entirely around its balance transfer
  offer: 21 months of 0% intro APR on balance transfers with no annual fee,
  which is why it ranks among our best 0% APR cards. That long runway makes it
  a solid tool if you are carrying high-interest debt and want close to two
  years to pay it down without interest piling up. Purchases get a shorter
  12-month 0% window, so it is less compelling if you mainly want to finance
  new spending. The real tradeoff is that the card earns no rewards at all and
  charges foreign transaction fees, so there is little reason to use it once
  the intro period ends. Open it for the transfer, stick to a payoff plan, and
  plan to let it sit in a drawer afterward.
