our_take: >
  The Diamond Preferred is a straightforward balance-transfer card: 21 months
  of 0% intro APR on balance transfers with no annual fee, one of the longer
  runways available and enough to land it on our Best 0% APR list. That makes
  it a solid tool if you are carrying debt on another card and want close to
  two years to pay it down interest-free. Purchases get a shorter 12-month 0%
  window, so it is less suited to financing a big new purchase than to
  clearing an existing balance. The card earns no rewards and charges foreign
  transaction fees, so once the intro period ends there is little reason to
  keep using it. Open it for the transfer, stick to a payoff plan, and expect
  it to become a sock-drawer card afterward.
