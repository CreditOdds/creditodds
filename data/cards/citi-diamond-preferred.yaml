our_take: >
  The Diamond Preferred is a balance transfer card and very little else: 21
  months of 0% intro APR on balance transfers, 12 months on purchases, and no
  annual fee. That transfer window is among the longest on the market and is
  the entire reason to open the card, which is why it sits at #5 on our Best
  0% APR Credit Cards list. Be clear about what you give up, though: the card
  earns no rewards at all, and it charges foreign transaction fees, so it is a
  poor companion abroad. After the intro period the regular APR runs 16.49% to
  27.24%, which means the payoff plan needs to finish inside the 21 months to
  be worth it. Open it to clear a balance, then expect it to sit unused.
