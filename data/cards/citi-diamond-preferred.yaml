our_take: >
  The Diamond Preferred is a balance transfer card first and last: 21 months
  of 0% intro APR on balance transfers, with no annual fee. That is one of the
  longer transfer runways available, which is why it ranks #5 on our Best 0%
  APR Credit Cards list, and it gives you close to two years to pay down
  existing debt without interest. Purchases get a shorter 12 months at 0%, so
  it is less suited to financing a big new expense than to clearing an old
  one. The tradeoff is that the card earns no rewards at all, and it charges a
  foreign transaction fee, so there is little reason to use it once the intro
  window closes. Open it for the transfer, make a payoff plan that fits inside
  21 months, and keep a rewards card for everyday spending.
