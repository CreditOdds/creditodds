our_take: >
  The Diamond Preferred is built for one job: 21 months of 0% intro APR on
  balance transfers, one of the longer payoff runways available, with no
  annual fee. That makes it a strong choice if you are carrying high-interest
  debt and want close to two years to pay it down without interest piling up.
  Purchases get a shorter 12-month 0% window, so it is less suited to
  financing a big new purchase than to clearing an existing balance. The
  tradeoff is that the card earns no rewards and charges a foreign transaction
  fee, so once the intro period ends there is little reason to keep using it.
  Open it for the balance transfer window, stick to a payoff plan, and plan to
  move your everyday spending elsewhere.
