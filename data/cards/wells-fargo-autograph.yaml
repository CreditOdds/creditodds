our_take: >
  The Autograph earns 3x points across six categories that cover most of a
  normal month: dining, travel, gas, transit, streaming, and phone plans, all
  for no annual fee. That breadth is why it takes the Best No-Fee badge at #5
  on our Best Travel list, and it also lands at #9 for cash back and #10 for
  dining and groceries. You also get 12 months of 0% intro APR on purchases,
  no foreign transaction fee, and up to $600 per claim in cell phone
  protection when you pay your bill with the card. The signup bonus is modest
  at 20,000 points after $1,000 in three months, and the 1x rate on everything
  outside those six categories means groceries and general shopping are better
  off on a flat-rate card. Carry it for the categories, pair it with something
  that handles the rest.
