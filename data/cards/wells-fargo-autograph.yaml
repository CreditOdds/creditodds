our_take: >
  The Autograph is one of the broadest no-fee earners around, paying 3x points
  on dining, travel, gas, transit, streaming, and phone plans. That spread
  covers a big share of most people's everyday spending, which is why it ranks
  #2 on our Best Travel Credit Cards list as the best no-fee pick. It also
  skips foreign transaction fees and adds 12 months of 0% intro APR on
  purchases, plus cell phone protection of up to $600 per claim when you pay
  your bill with the card. The welcome bonus is modest at 20,000 points after
  $1,000 in spending in the first three months. The main gap is groceries and
  general purchases, which earn just 1x, so pairing it with a flat-rate card
  makes sense for everything outside its bonus categories.
