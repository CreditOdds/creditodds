our_take: >
  The Autograph earns 3x points across a broad set of everyday categories,
  including dining, travel, gas, transit, streaming, and phone plans, with no
  annual fee. That breadth is rare for a free card and is why it earns the
  Best No-Fee badge on our Best Travel Credit Cards list. It also comes with
  12 months of 0% intro APR on purchases, no foreign transaction fee, and cell
  phone protection up to $600 per claim. The tradeoff is that groceries and
  everything else earn only 1x, so it pairs best with a flat-rate card for the
  rest of your spending. The welcome offer is modest at 20,000 points after
  $1,000 in spending in the first 3 months.
