our_take: >
  The Autograph earns 3x points on a broad set of everyday categories, dining,
  travel, gas, transit, streaming, and phone plans, with no annual fee and no
  foreign transaction fees. That breadth is why it carries the Best No-Fee
  badge on our Best Travel Credit Cards list, where it ranks #8. New
  cardholders get 20,000 bonus points after $1,000 in spending in the first 3
  months, plus 12 months of 0% intro APR on purchases. Cell phone protection
  of up to $600 per claim when you pay your phone bill with the card rounds
  out the package. The tradeoff is the 1x rate on everything else, including
  groceries, so pair it with a flat-rate card for non-bonus spending. For a
  no-fee card, few cover this many common categories at 3x.
