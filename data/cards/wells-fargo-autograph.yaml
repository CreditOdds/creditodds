our_take: >
  The Autograph earns 3x points across a wide spread of everyday categories
  with no annual fee: dining, travel, gas, transit, streaming, and phone
  plans. That breadth, plus no foreign transaction fees, is why it earns the
  Best No-Fee badge on our Best Travel Credit Cards list. New cardholders also
  get a 20,000-point bonus after $1,000 in spending in the first three months
  and 12 months of 0% intro APR on purchases. The gap is groceries: they
  aren't a bonus category, so supermarket spending and everything else earns
  just 1x. Cell phone protection of up to $600 per claim when you pay your
  phone bill with the card rounds things out. It's an easy first rewards card
  or a no-fee companion to a flat-rate card, as long as you know where the 3x
  stops.
