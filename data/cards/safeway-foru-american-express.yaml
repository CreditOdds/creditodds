our_take: >
  If you shop at Safeway or another Albertsons Companies banner like Vons,
  Jewel-Osco or ACME, this no-annual-fee card pays 5% back on online and app
  grocery orders through those banners and 3% on in-store grocery and pharmacy
  purchases there. It also earns 3% on gas, dining, utilities and streaming,
  which is a broad set of everyday categories for a free card, and there are
  no foreign transaction fees. The catch is that the top rates only apply at
  Albertsons-family stores, so a regular Kroger or Costco shopper gets none of
  the grocery value, and everything outside the bonus categories earns just
  1%. The $50 signup bonus is modest, and purchases at Albertsons stores do
  not count toward its $1,000 spend requirement. Amex Offers and Amex
  Experiences are minor extras. It makes sense mainly as a loyal Albertsons
  shopper's grocery card.
