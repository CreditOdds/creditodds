our_take: >
  The Bank of America Premium Rewards earns a steady 1.5 points per dollar on
  everything and 2 points on travel and dining, which makes it a sensible
  everyday card for someone who wants a travel-leaning rewards card without
  juggling categories. The $95 annual fee is largely covered by a $100 annual
  airline incidental credit for things like baggage fees and seat upgrades,
  and there is also a Global Entry or TSA PreCheck credit of up to $100 every
  four years. New cardholders get 60,000 points after $4,000 in purchases in
  the first three months, and there are no foreign transaction fees. The
  tradeoff is that the earn rates are modest, so it rarely outpaces a strong
  category card where you spend the most. It works best if you will use the
  airline credit every year, which effectively makes it a no-fee card.
