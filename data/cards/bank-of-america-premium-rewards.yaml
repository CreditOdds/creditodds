our_take: >
  The Premium Rewards is a straightforward travel card: 2 points per dollar on
  travel and dining and 1.5 points on everything else, so even uncategorized
  spending earns more than the typical 1x. For a $95 annual fee you also get a
  $100 airline incidental credit each year, which can effectively offset the
  fee if you regularly pay for bags or seat upgrades, plus up to $100 toward
  Global Entry or TSA PreCheck every four years. The 60,000-point welcome
  bonus requires $4,000 in spend within three months, and there are no foreign
  transaction fees. The tradeoff is that the earn rates are solid but not
  exceptional, and the card offers few perks beyond the airline credit. It
  fits best for someone who wants a simple, flat-leaning travel card and will
  use that incidental credit every year.
