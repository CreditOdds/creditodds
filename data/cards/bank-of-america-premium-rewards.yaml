our_take: >
  The Bank of America Premium Rewards is a straightforward travel card that
  earns 2 points per dollar on travel and dining and 1.5 points on everything
  else, a strong base rate for a card with a $95 annual fee. A $100 annual
  airline incidental credit for things like seat upgrades and baggage fees can
  effectively cover the fee on its own, and you also get up to $100 toward
  Global Entry or TSA PreCheck every four years. The welcome offer of 60,000
  points after $4,000 in purchases within three months is a useful kickstart,
  and there are no foreign transaction fees. The tradeoff is that there are no
  premium travel perks like lounge access, and the bonus categories top out at
  2 points. It is a good fit for someone who wants solid flat-rate earning and
  simple travel credits without a high fee.
