our_take: >
  This is the sensible middle of Bank of America's travel lineup: $95 a year
  buys 2x points on travel and dining, 1.5x on everything else, and no foreign
  transaction fees, which is a genuinely flat, high floor for a card in this
  price range. Two credits do most of the work on the fee, $100 a year toward
  airline incidentals like seat upgrades and baggage, and up to $100 back on
  Global Entry or TSA PreCheck every four years. The 60,000-point bonus after
  $4,000 in three months is a solid opening, and the 1.5x base rate means you
  are not punished for putting non-category spend on it. The catch is there is
  nothing beyond that: no lounge access, no elevated portal rates, and the
  multipliers top out at 2x, so heavy diners or travelers will out-earn this
  card elsewhere. It is a good one-card option for someone who wants steady
  earning without managing categories.
