our_take: >
  The Premium Rewards offers a solid flat earn for a $95 card: 2 points per
  dollar on travel and dining and 1.5 points per dollar on everything else,
  with no foreign transaction fees. A $100 annual airline incidental credit
  can effectively offset the fee on its own if you regularly pay for bags or
  seat upgrades, and there is up to $100 toward Global Entry or TSA PreCheck
  every four years. New cardholders can earn 60,000 points after $4,000 in
  spend within 3 months. The catch is that the earn rates are modest compared
  with travel cards that offer higher multipliers in bonus categories, and the
  benefit list is short beyond the airline credit. It is a reasonable pick if
  you want a simple travel card with a low effective cost, but it will not win
  on raw earning.
