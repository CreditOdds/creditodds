our_take: >
  The Freedom Rise is built for people starting out with credit, offering a
  flat 1.5% cash back on everything with no annual fee and no categories to
  manage. A $25 statement credit for enrolling in automatic payments within
  the first three months and staying enrolled for 90 days rewards good habits
  from day one, and six months of complimentary DashPass is a small bonus.
  Qualifying Lyft rides earn 2% through September 30, 2027. The tradeoffs are
  that there is no signup bonus and the card charges foreign transaction fees,
  so it is a poor choice for use abroad. Treat it as a simple, low-maintenance
  way to build a credit history before graduating to a card with richer
  rewards.
