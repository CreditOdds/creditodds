our_take: >
  The Chase Freedom Rise, formerly the Chase Freedom Student, is a simple no
  annual fee card that earns a flat 1.5% cash back on everything, with no
  categories to track. Enrolling in automatic payments within the first three
  months and staying enrolled for 90 days earns a $25 statement credit, and
  qualifying Lyft rides earn 2% through September 30, 2027. There is no
  traditional signup bonus, and six months of complimentary DashPass is the
  only other perk. The main drawback is the foreign transaction fee, which
  makes it a poor fit for spending abroad. For domestic spending, it is an
  easy, low-maintenance card that earns a respectable flat rate.
