our_take: >
  The Freedom Rise is built for people starting out with credit: no annual fee
  and a flat 1.5% cash back on everything, so there are no categories to learn
  while you build a history. Lyft rides earn 2% through September 30, 2027, a
  limited-time promo that only applies at Lyft. There is no traditional signup
  bonus, but a $25 statement credit for enrolling in automatic payments within
  the first three months rewards the habit that matters most for a new credit
  file. The catch is a foreign transaction fee, so it is a poor choice for
  studying abroad or international travel. Six months of DashPass is a minor
  extra, and the real value here is a simple, fee-free first Chase card that
  can grow into a stronger lineup later.
