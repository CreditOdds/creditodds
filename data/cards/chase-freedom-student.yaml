our_take: >
  The Freedom Rise is a starter card designed to get someone their first Chase
  account: a flat 1.5% cash back on everything, no annual fee, and nothing to
  activate. The opening push is 3% on dining, including takeout and eligible
  delivery, on the first $6,000 of dining spend in your first 6 months, after
  which that rate settles permanently at the standard 1.5%. Qualifying Lyft
  rides earn 2% through September 30, 2027, a half point over the base rate
  that applies to Lyft specifically and not to transit in general. A $25
  statement credit for enrolling in automatic payments within the first 3
  months and staying enrolled 90 days is small but easy money, and 6 months of
  DashPass comes along with it. Be clear-eyed about the 18.24% to 27.74% APR
  and the foreign transaction fees: this is a card for building history on
  domestic spend you pay off in full, not for carrying a balance or taking
  abroad.
