our_take: >
  U.S. Bank stopped accepting new applications for the Shopper Cash Rewards in
  July 2026, so this take is mainly for current cardholders. Its standout
  feature is 6% cash back at two retailers you choose each quarter, such as
  Amazon, Apple, Costco, Target, or Walmart, on up to $1,500 in combined
  spend, plus 3% on one everyday category (gas, wholesale clubs, or utilities)
  and 1.5% on everything else. That's strong if your spending concentrates at
  a couple of big retailers, but the 6% applies only at the retailers you
  pick, not to online shopping in general. The $95 annual fee after the first
  year means you need to use the bonus slots consistently to come out ahead,
  and the foreign transaction fee limits it abroad. If you're shopping for
  something new, the Cash+ keeps you with U.S. Bank with no annual fee, while
  a flat 2% card like the Wells Fargo Active Cash removes the quarterly
  picking entirely.
apply_link: https://www.usbank.com/credit-cards/shopper-cash-rewards-visa-signature-credit-card.html
foreign_transaction_fee: true
