name: "US Bank Shopper Cash Rewards"
bank: "U.S. Bank"
slug: "us-bank-shopper"
image: "us-bank-shopper.png"
accepting_applications: false
# Reused verbatim from data/news/2026-07-21-us-bank-shopper-cash-rewards-discontinued.yaml
replacement_cards:
  - slug: "blue-cash-everyday-card"
    reason: "3% on U.S. online retail up to $6,000 a year, covering the Shopper's core use with no annual fee."
  - slug: "us-bank-cash-plus-visa-signature"
    reason: "Keeps the rewards with U.S. Bank: two 5% categories of your choosing each quarter, no annual fee."
  - slug: "wells-fargo-active-cash"
    reason: "Flat 2% on everything with no annual fee, and nothing to pick or track each quarter."
annual_fee: 95
annual_fee_intro:
  value: 0
  months: 12
tags:
  - cashback
  - shopping
reward_type: "cashback"
rewards:
  - category: online_shopping
    value: 6
    unit: percent
    mode: user_choice
    choices: 2
    note: "Choose 2 retailers each quarter (Amazon, Apple, Costco, Target, Walmart, etc.), up to $1,500 combined. Earns at chosen retailers in-store, online, or by phone — not generic online shopping."
    spend_cap: 1500
    cap_period: quarterly
    rate_after_cap: 1.5
    # Bonus is gated to a fixed list of partner retailers chosen quarterly,
    # NOT generic online shopping. Excluded from category matching so the
    # card doesn't falsely surface for arbitrary online stores. We surface
    # it via `also_earns` on the specific stores where it actually applies.
    merchant_specific: true
  - category: selected_categories
    value: 3
    unit: percent
    choices: 1
    eligible_categories: [gas, wholesale_clubs, utilities]
    note: "Choose 1 everyday category each quarter, up to $1,500"
  - category: hotels_car_portal
    value: 5.5
    unit: percent
    note: "Hotel and car reservations booked in the Travel Center"
  - category: everything_else
    value: 1.5
    unit: percent
signup_bonus:
  value: 250
  type: cash
  spend_requirement: 2000
  timeframe_months: 4
apr:
  regular:
    min: 18.74
    max: 28.74
benefits:
  - name: "First-Year Annual Fee Waiver"
    value: 95
    description: "$0 annual fee for the first year, then $95"
    frequency: "one_time"
    category: "rewards"
    enrollment_required: false
  - name: "Cell Phone Protection"
    value: 0
    description: "Up to $600 per claim ($25 deductible, 2 claims per 12 months) when you pay your monthly cell phone bill with the card"
    frequency: "per_claim"
    category: "telecom"
    enrollment_required: false
our_take: >
  U.S. Bank stopped accepting applications for the Shopper Cash Rewards in
  July 2026, so this is now a card you can keep but not open. If you already
  carry one, the value is concentrated in the 6% rate at two retailers you
  choose each quarter, which earns only at those chosen merchants and only on
  the first $1,500 combined before dropping to 1.5%. Around that sit 3% on one
  everyday category you pick each quarter, also capped at $1,500, 5.5% on
  hotel and car reservations booked in the Travel Center, and 1.5% on
  everything else. All of it has to clear a $95 annual fee once the first-year
  waiver ends, which means using both quarterly picks consistently rather than
  letting the card sit. If you are looking for a replacement, the Blue Cash
  Everyday, U.S. Bank Cash+, and Wells Fargo Active Cash each cover part of
  what this card did without the fee.
apply_link: https://www.usbank.com/credit-cards/shopper-cash-rewards-visa-signature-credit-card.html
foreign_transaction_fee: true
network: "visa"
