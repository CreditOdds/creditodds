our_take: >
  U.S. Bank stopped accepting new applications for the Shopper Cash Rewards in
  July, so this card is now only relevant to people who already hold it. For
  current cardholders, the appeal is 6% cash back at two retailers you choose
  each quarter, such as Amazon, Costco, Target, or Walmart, plus 3% on one
  everyday category of gas, wholesale clubs, or utilities. Both rates are
  capped at $1,500 per quarter, and the 6% applies only at the retailers you
  pick, not to online shopping in general. The catch is the $95 annual fee
  after the first year, which you need to earn back on capped categories,
  while everything else earns 1.5%. If you use the 6% picks heavily, it can
  still justify the fee; if not, no-fee alternatives like the U.S. Bank Cash+
  or a flat 2% card may serve you better.
apply_link: https://www.usbank.com/credit-cards/shopper-cash-rewards-visa-signature-credit-card.html
foreign_transaction_fee: true
network: "visa"
