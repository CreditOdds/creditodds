our_take: >
  The Air France KLM Visa Signature earns more on ordinary spending than most
  airline cards, with 1.5 Flying Blue miles per dollar on everything outside
  its bonus categories and 3 miles per dollar on dining and on Air France,
  KLM, and other SkyTeam purchases. The 50,000-mile welcome bonus after $2,000
  in spend within three months is easy to reach and comes with 100 Experience
  Points toward Flying Blue elite status. Keeping it is easy to justify for
  loyal flyers: 5,000 anniversary miles once you spend $50 in the year, plus
  20 to 160 XP annually depending on how much you charge. The tradeoff is the
  $89 annual fee and the fact that every mile is locked into Flying Blue, so
  the value depends entirely on flying Air France, KLM, or their partners.
  Visa Signature travel protections and no foreign transaction fees round it
  out for people who fly SkyTeam regularly.
