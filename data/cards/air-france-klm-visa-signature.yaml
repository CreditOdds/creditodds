our_take: >
  The Air France KLM Visa Signature earns a respectable 1.5 Flying Blue miles
  per dollar on everyday spending, which is better than most airline cards,
  plus 3 per dollar on Air France, KLM, and SkyTeam purchases and on dining.
  The $89 annual fee is partly offset by 5,000 anniversary miles once you
  spend at least $50 in the account year, and the 50,000-mile bonus after
  $2,000 in spending in the first three months comes with 100 Experience
  Points toward elite status. Flying Blue members chasing status get extra
  value from the annual XP, which rises to 160 total at $25,000 in spending.
  The catch is that the value is tied to Flying Blue, so it only pays off if
  you actually fly Air France, KLM, or their partners. If you do, it is a
  solid keeper card; if not, a flexible travel card will serve you better.
