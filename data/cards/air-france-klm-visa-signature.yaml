our_take: >
  The Air France KLM card earns 3 Flying Blue miles per dollar on Air France,
  KLM, and SkyTeam purchases and at restaurants, with a 1.5 mile base rate
  that beats most airline cards on everyday spending. The welcome offer of
  50,000 miles plus 100 XP toward elite status after $2,000 in spending within
  three months is easy to reach. At $89 a year, the 5,000 anniversary miles
  you earn after spending just $50 help offset the fee, and miles stay active
  as long as the account is open. The real catch is that it only pays off if
  you fly SkyTeam and redeem through Flying Blue, and the annual XP boost
  needs $15,000 to $25,000 in spending to become meaningful. Visa Signature
  protections like trip delay, baggage delay, and cell phone coverage, plus no
  foreign transaction fees, make it a reasonable travel companion for loyal
  Air France or KLM flyers.
