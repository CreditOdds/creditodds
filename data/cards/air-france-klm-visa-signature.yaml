our_take: >
  The Air France KLM Visa Signature earns 50,000 Flying Blue miles plus 100
  Experience Points after just $2,000 in three months, one of the lower
  spending requirements you will find on an airline card with an $89 annual
  fee. It also earns better than most co-brands away from the airline: 1.5x on
  everything else, 3x on dining, and 3x on Air France, KLM, and other SkyTeam
  airline purchases, with no foreign transaction fee. The elite status angle
  is the real differentiator, since the card grants 20 XP each anniversary,
  rising to 100 XP total at $15,000 of annual spend and 160 XP at $25,000,
  which is only worth chasing if you are actually pushing for Flying Blue
  status. Otherwise the ongoing value is thin: 5,000 anniversary miles after
  $50 of spend, miles that stay active while the account is open, and the
  standard Visa Signature protections. Carry it if you fly SkyTeam often
  enough to use the miles, not as a general travel card.
