our_take: >
  The Cash+ is one of the more flexible no-annual-fee cash back cards because
  you pick your own 5% categories: two choices each quarter from a list that
  includes fast food, streaming, home utilities, cell phone providers, and
  department stores, on up to $2,000 in combined spending per quarter. You
  also choose one everyday 2% category from groceries, gas, or dining, and
  prepaid travel booked through the U.S. Bank Travel Rewards Center earns 5%.
  The tradeoffs are real: everything outside your picks earns 1%, spending
  past the $2,000 quarterly cap drops to 1%, and you have to remember to
  re-select categories every quarter or you lose the boost. The signup bonus
  was recently trimmed from $250 to $200 after $1,000 in spending in three
  months, and there is a foreign transaction fee, so keep it home. A 15 month
  0% intro APR on both purchases and balance transfers rounds it out.
