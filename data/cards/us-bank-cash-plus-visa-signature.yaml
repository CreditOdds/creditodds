our_take: >
  The Cash+ lets you pick where you earn: 5% cash back on two categories you
  choose each quarter from a list that includes cell phone providers, home
  utilities, TV, internet and streaming, fast food, and department stores,
  plus 2% on one everyday category of groceries, gas and EV charging, or
  restaurants. Few no-annual-fee cards offer 5% on bills like utilities and
  phone service, which is where this card earns its spot. The catch is the 5%
  applies to just $2,000 in combined quarterly spend before dropping to 1%,
  and you have to remember to choose your categories every quarter. U.S. Bank
  also recently trimmed the signup bonus from $250 to $200 after $1,000 in
  spend, though 15 months of 0% intro APR on purchases and balance transfers
  remains a useful bonus. Everything else earns only 1% and there is a foreign
  transaction fee, so pair it with a flat-rate card for general spending.
