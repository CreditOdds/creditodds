our_take: >
  The Citi Simplicity is built around one thing: 18 months of 0% intro APR on
  both purchases and balance transfers, with no annual fee. That runway lands
  it at #4 on our list of the best 0% APR cards and makes it a sensible tool
  for paying down existing debt or spreading out a large purchase over a year
  and a half. The catch is that it earns no rewards at all, so once the intro
  period ends there is little reason to reach for it. After the promo, the
  regular APR runs 17.49% to 28.24%, which is why a firm payoff plan matters
  here. It also charges foreign transaction fees, so it is not a travel card.
  Open it for the interest-free window, clear the balance before month 18, and
  keep a rewards card for everyday spending.
