our_take: >
  The Citi Simplicity is built for one job: giving you 18 months of 0% intro
  APR on both purchases and balance transfers, with no annual fee. That runway
  is long enough to make real progress on existing debt or to spread out a
  large purchase interest-free, which is why it ranks #4 on our list of the
  best 0% APR cards. The catch is that there is nothing to keep it relevant
  afterward, since the card earns no rewards at all. Once the intro period
  ends, the regular APR runs from 17.49% to 28.24%, and the foreign
  transaction fee makes it a poor travel companion. Open it for the 0% window,
  stick to a payoff plan that clears the balance within 18 months, and don't
  expect it to earn a spot in your everyday rotation.
