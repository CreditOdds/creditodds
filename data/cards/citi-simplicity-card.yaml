our_take: >
  The Simplicity is a straightforward debt paydown card: 18 months of 0% intro
  APR on both purchases and balance transfers, with no annual fee. Having the
  same window on both sides is genuinely useful if you are consolidating a
  balance and also need to float a purchase, and it is enough to put the card
  at #4 on our Best 0% APR Credit Cards list. The tradeoff is that it earns
  nothing at all, so there is no cash back or points to keep it in rotation
  once the promo ends. It also charges foreign transaction fees, which rules
  it out for travel spending. The regular APR runs 17.49% to 28.24% afterward,
  so build the payoff schedule around the 18 months rather than assuming you
  can stretch past it.
