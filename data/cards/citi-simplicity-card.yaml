our_take: >
  The Simplicity is a pure financing card: 18 months of 0% intro APR on both
  purchases and balance transfers, with no annual fee. That runway is long
  enough to make a real dent in existing debt or spread out a large purchase.
  The catch is that there is nothing to keep it relevant afterward, since it
  earns no rewards and the regular APR runs 17.49% to 28.24%. It also charges
  a foreign transaction fee, so leave it home when you travel. Open it for the
  0% window, pay the balance down on a schedule, and plan to use a rewards
  card for everyday spending.
