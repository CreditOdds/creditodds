our_take: >
  The Citi Simplicity is a dedicated payoff card: 18 months of 0% intro APR on
  both purchases and balance transfers, with no annual fee. That runway makes
  it a solid option if you are consolidating existing debt or spreading out a
  large purchase over a year and a half, and it ranks #4 on our Best 0% APR
  Credit Cards list. The tradeoff is that it earns no rewards at all, so once
  the intro window closes there is little reason to keep using it, and the
  regular APR of 17.49% to 28.24% applies to anything still unpaid. It also
  charges a foreign transaction fee, so leave it home when you travel. Open it
  for the 0% period, follow a firm payoff plan, and look elsewhere for an
  everyday card.
