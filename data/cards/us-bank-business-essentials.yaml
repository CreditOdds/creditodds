our_take: >
  The Business Essentials is a simple flat-rate business card: 2% cash back on
  everything with no annual fee and nothing to track. If your business banks
  with U.S. Bank and holds $10,000 or more in qualifying business checking,
  that rate rises to 2.5% on the first $10,000 in purchases each billing
  cycle, which is a strong return for a no-fee card. Prepaid hotels and car
  rentals booked in the U.S. Bank Travel Center earn 6%, and a 0% intro APR on
  purchases for 12 months helps with startup costs or a large equipment buy.
  The $500 signup bonus requires $5,000 in spend within 150 days, which is
  achievable for most active businesses. The main drawback is a foreign
  transaction fee, so it is a poor fit for overseas purchases or travel.
