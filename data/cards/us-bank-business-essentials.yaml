our_take: >
  The Business Essentials is a straightforward no annual fee card: 2% cash
  back on every purchase with no categories to track, which already beats the
  1.5% flat rate on most business cards in its class. Keep $10,000 or more in
  a qualifying U.S. Bank business checking account and the rate rises to
  2.5%, but only on the first $10,000 of spending each billing cycle, so the
  boost tops out at $50 a month. The welcome offer is $500 after $5,000 in
  spending within 150 days, and purchases get a 0% intro APR for the first 12
  billing cycles before a 16.99% to 27.99% variable rate. Prepaid hotels and
  car rentals booked in the U.S. Bank Travel Center earn 6%. The catch is a 3%
  foreign transaction fee, so it is a card for domestic spending only.
