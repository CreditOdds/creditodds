our_take: >
  The Business Essentials is a straightforward no-annual-fee business card
  that earns 2% cash back on everything, with no categories to track. If you
  keep $10,000 or more in qualifying U.S. Bank business checking, the rate
  rises to 2.5% on the first $10,000 in purchases each billing cycle, which
  rewards businesses already banking with U.S. Bank. The $500 bonus after
  $5,000 in 150 days and a 12-month 0% intro APR on purchases are useful for a
  newer business financing early expenses. The catch is the foreign
  transaction fee, which makes it a poor choice for international spending,
  and outside of 6% on prepaid hotels and car rentals booked through the U.S.
  Bank Travel Center there are no bonus categories. For simple domestic
  spending, it is a clean, low-maintenance pick.
