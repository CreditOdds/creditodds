our_take: >
  The Plus is the cheapest way to get Southwest card perks, with a $99 annual
  fee that buys a free first checked bag for you and up to eight companions on
  the same reservation, complimentary Standard seat selection within 48 hours
  of departure when available, and a 10,000-point Companion Pass boost each
  year. Chase recently cut the signup bonus from 80,000 to 50,000 points,
  though the $1,000 spend requirement remains easy to hit. Earning is modest:
  2 points per dollar on Southwest purchases and on gas and groceries (up to
  $5,000 a year combined), and 1 point on everything else. The 3,000
  anniversary points are thinner than on the pricier Southwest cards, and
  DashPass and up to $120 in Instacart credits require enrollment. It makes
  the most sense for occasional Southwest flyers who will use the bag benefit
  at least once or twice a year.
