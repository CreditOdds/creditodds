our_take: >
  This no-annual-fee card is a light way to earn Amtrak points if you ride the
  train a few times a year: 2x points on Amtrak travel, including onboard
  purchases, 2x on dining, and 1x on everything else, with no foreign
  transaction fee. Ongoing extras include 10% back on onboard food and drinks
  and 5% of your points returned when you redeem them for Amtrak travel. The
  welcome offer was recently trimmed from 20,000 to 15,000 points after $1,000
  in spend over the first three billing cycles, with another 5,000 points for
  adding an authorized user. The tradeoff is focus: the 2x Amtrak rate applies
  only to Amtrak, and the points are most useful if you redeem them on Amtrak.
  If rail is not a regular part of your travel, a general cash back card will
  do more for you.
