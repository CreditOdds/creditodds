our_take: >
  If you ride Amtrak more than a couple of times a year, the no annual fee
  Guest Rewards card is an easy add: 2 points per dollar on Amtrak travel,
  including onboard purchases, plus 2 points per dollar on dining and no
  foreign transaction fee. FNBO recently trimmed the signup bonus from 20,000
  points to 15,000 after $1,000 in the first three billing cycles, which takes
  some shine off the opening offer without changing the ongoing value.
  Everyday earning is where it thins out, since anything outside Amtrak and
  restaurants brings just 1 point per dollar, so treat this as a supplement to
  a stronger all-purpose card rather than a replacement for one. The 10%
  statement credit on onboard food and beverage and the 5% of points back when
  you redeem for Amtrak travel are small but genuinely repeat every trip. At
  $0 a year, the card does not have to do much to justify staying in your
  wallet.
