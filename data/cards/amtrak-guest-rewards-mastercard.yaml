our_take: >
  This no-annual-fee card makes sense mainly for occasional Amtrak riders: it
  earns 2x points on Amtrak travel, including onboard purchases, 2x on dining,
  and 1x on everything else, with no foreign transaction fees. Small perks add
  up for regular train trips, including a 10% statement credit on onboard food
  and drink and 5% of your points back when you redeem them for Amtrak travel.
  The welcome offer was recently cut from 20,000 to 15,000 points after $1,000
  in spend in the first three billing cycles, which makes the card less
  attractive to open right now. The bigger limitation is that the 2x Amtrak
  rate applies only at Amtrak, so anyone who rarely rides the train will find
  little here beyond 2x dining. Treat it as a modest card for train trips and
  restaurant spending rather than an everyday earner.
