our_take: >
  The no-fee Amtrak Guest Rewards Mastercard is the casual rider's version of
  the Preferred card: 2x points on Amtrak and dining, 1x everywhere else,
  with a welcome offer of up to 20,000 points that goes a long way given how
  valuable Amtrak points are toward train travel. What it lacks are the
  Preferred card's trip extras, meaning no companion coupon, no upgrade
  coupon, no lounge pass, and no tier qualifying points toward status, and
  the onboard food and beverage rebate drops to 10%. That makes the choice
  simple: if you ride Amtrak a few times a year or more, the $99 Preferred
  pays for itself through the coupons alone, while this card suits someone
  who takes the train once or twice a year and wants to earn points without
  a fee.
