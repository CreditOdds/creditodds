our_take: >
  This no-fee card is a simple way for occasional Amtrak riders to earn toward
  train travel: 2 points per dollar on Amtrak purchases, including onboard
  spending, 2 points on dining, and 1 point on everything else. You also get
  10% back on onboard food and drinks and 5% of your points back when you
  redeem them for Amtrak travel, with no foreign transaction fees. The signup
  bonus was recently cut from 20,000 to 15,000 points after $1,000 in spend
  over the first three billing cycles, so the welcome offer is now modest. The
  bigger limitation is that the points are really only worth chasing if Amtrak
  is your main way to travel, and a 2x rate on Amtrak and dining is easy to
  match elsewhere. Consider it if you ride the rails a few times a year and
  want a fee-free card tied to that habit.
