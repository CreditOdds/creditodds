our_take: >
  The Credit One Bank Platinum Rewards Visa occupies an awkward middle rung
  in Credit One's lineup: it earns the same 1% back on gas, groceries,
  mobile phone, and TV services as the no-annual-fee version, yet charges a
  $39 fee for the privilege. Longtime readers may remember this name
  attached to a $95 card with 5% categories; that structure now belongs to
  the Platinum X5, and this card's rewards were cut to 1%, so the fee buys
  essentially nothing beyond slightly broader approval odds for
  average-credit applicants. The 29.74% APR is standard for the issuer and
  best never carried. If Credit One approves you for this card, ask whether
  the no-fee Platinum Rewards Visa is attainable instead; the answer is
  usually yes, and it is simply the better product.
