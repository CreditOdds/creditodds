our_take: >
  U.S. Bank stopped accepting new applications for the Split at the end of
  September 2026, so this take is mainly for people who already carry it. The
  card's one real feature is its 3-month interest-free payment plans, which
  apply automatically with no interest or fees to any purchase of $100 or
  more. That works like a built-in buy now, pay later option, useful for
  spreading out a mid-sized expense over a few months without paying extra.
  The tradeoff is that there are no rewards on everyday spending at all, and
  the card charges a foreign transaction fee. If you have one, it is worth
  keeping for the occasional larger purchase you want to split, but it will
  not earn its spot on day-to-day spending.
