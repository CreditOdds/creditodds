our_take: >
  U.S. Bank recently stopped accepting new applications for the Split, so this
  take is mainly for people who already carry it. The card's one real trick is
  built-in installment financing: any purchase of $100 or more can go on a
  3-month payment plan with no interest and no fees, and there's no annual
  fee. That makes it a reasonable tool for spreading a mid-sized purchase over
  a few statements without paying for the privilege. The catch is that it does
  nothing else: there's no cash back or points on everyday spending, and it
  charges a foreign transaction fee, so it's a poor travel card too. If you
  already have it, keep it for the occasional interest-free split, but don't
  rely on it as a primary card.
