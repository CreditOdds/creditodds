our_take: >
  U.S. Bank stopped accepting new applications for the Split as of late
  September 2026, so this card is now only relevant if you already have one in
  your wallet. Its whole pitch is built-in installment financing: purchases of
  $100 or more can go on 3-month payment plans with no interest or fees, and
  there is no annual fee. That is genuinely handy for spreading out a larger
  purchase over a few months without paying for the privilege. The tradeoff is
  that the card earns no rewards at all, so every dollar you put on it outside
  those plans earns nothing back. It also charges a foreign transaction fee.
  If you hold it, treat it as a short-term financing tool and use a rewards
  card for everything else.
