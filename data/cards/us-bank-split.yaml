our_take: >
  The Split is built around one feature: any purchase of $100 or more can be
  paid off over three months with no interest and no fees, on a card with no
  annual fee. That is a genuinely useful structure if you make occasional
  larger purchases and want a predictable payoff schedule instead of carrying
  a revolving balance. What you give up is everything else. The card earns no
  rewards at all, so there is no cash back or points accruing on anything you
  buy, and there is a foreign transaction fee on top of that. Carry it as a
  financing tool for specific purchases, not as a card you reach for by
  default.
