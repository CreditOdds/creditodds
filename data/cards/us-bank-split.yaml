our_take: >
  U.S. Bank stopped accepting new applications for the Split as of late
  September 2026, so this card is only relevant if you already have it. Its
  whole pitch was built around one feature: purchases of $100 or more can be
  paid off over 3 months with no interest or fees. That structure works well
  for spreading out a larger purchase without paying anything extra, as long
  as you stick to the three month schedule. The tradeoff is that the card
  earns no rewards at all, and it charges foreign transaction fees, so there
  is little reason to use it for everyday spending or travel. If you hold one,
  treat it as a no annual fee tool for occasional big purchases rather than a
  primary card.
