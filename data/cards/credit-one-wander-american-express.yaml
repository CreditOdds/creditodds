our_take: >
  The Credit One Bank Wander American Express is the rare travel rewards
  card aimed at average-credit applicants, with 10x points on hotels and car
  rentals booked through Credit One's travel partner and 5x on flights,
  dining, and gas. Points redeem for statement credits, gift cards, and
  travel, so treat the multipliers as roughly cash-back percentages rather
  than transferable currency. The $95 annual fee needs about $1,900 a year
  in 5x spending to break even, which frequent drivers and diners can hit,
  and there is currently no signup bonus to help. As with every Credit One
  card, the 29.74% APR means this only works paid in full. If your credit
  qualifies you for a mainstream travel card, start there; if not, Wander is
  one of the few travel options that will say yes.
