our_take: >
  The Ink Business Cash pays 5% back at office supply stores and on internet,
  cable, and phone services, plus 2% at gas stations and restaurants, all with
  no annual fee. For a small business with steady spending on those bills,
  that is a strong return, along with 12 months of 0% intro APR on purchases.
  The catch is the caps: the 5% categories share a $25,000 annual limit, the
  2% categories share their own $25,000 limit, and everything else earns just
  1%. Chase also recently trimmed the signup bonus from $1,000 to $750, which
  now takes $6,000 in spending in the first 3 months. Add the foreign
  transaction fee, and this is a card for domestic operating expenses in its
  bonus categories, not a catchall.
