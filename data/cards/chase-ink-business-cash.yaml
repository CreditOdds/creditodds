our_take: >
  For a business card with no annual fee, 5% back on office supply stores plus
  internet, cable, and phone service is a strong everyday rate, and it runs on
  a combined $25,000 of annual spend before falling to 1%. Chase raised the
  signup bonus from $750 to $1,000 in June, now payable after $8,000 of spend
  in four months, and pairs it with 12 months of 0% intro APR on purchases for
  anyone financing startup costs. Gas stations and restaurants add 2% under
  their own combined $25,000 cap. The ceilings are the real catch: past them
  everything earns 1%, and the card charges foreign transaction fees, so
  overseas spending belongs on a different card. The regular APR of 16.74% to
  24.74% is reasonable, but not a reason to carry a balance past the intro
  period.
