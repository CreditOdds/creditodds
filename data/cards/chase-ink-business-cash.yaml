our_take: >
  The Ink Business Cash is built for businesses with steady office overhead:
  5% back at office supply stores and on internet, cable, and phone services,
  plus 2% at gas stations and restaurants, all with no annual fee. The catch
  is the caps, since each of those tiers is limited to $25,000 a year before
  dropping to 1%, and everything else earns only 1% from the start. That makes
  it a strong category card but a weak one for general spending. The signup
  bonus is back to $750 after $6,000 in spending within three months, after a
  brief bump to $1,000 that ended in September. A 12-month 0% intro APR on
  purchases helps if you are financing equipment or startup costs, while the
  Lyft promo and three months of Instacart+ are small extras.
