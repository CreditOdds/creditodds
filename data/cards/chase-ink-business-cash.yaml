our_take: >
  The Ink Business Cash pays 5% at office supply stores and on internet,
  cable, and phone services, which makes it one of the strongest no-fee picks
  for a small business with real overhead in those categories. That 5% applies
  to a combined $25,000 a year before dropping to 1%, and gas and restaurants
  earn 2% on a separate combined $25,000. The signup bonus was recently cut
  from $1,000 to $750, still earned after $6,000 in spend over three months,
  and there is a 12-month 0% intro APR on purchases. The catch is a 1% base
  rate on everything outside those categories, plus a foreign transaction fee,
  so it works best alongside a flat-rate card rather than as your only
  business card. The 5% on Lyft through September 2027 and a three-month
  Instacart+ trial are minor extras.
