our_take: >
  The Ink Business Cash is built for businesses with steady office overhead:
  5% cash back at office supply stores and on internet, cable, and phone
  services, plus 2% at gas stations and restaurants, all with no annual fee.
  Each of those tiers is capped at $25,000 in combined spend per year before
  dropping to 1%, so it rewards a modest business best and loses its edge at
  higher volumes. Chase recently cut the signup bonus from $1,000 to $750,
  which still requires $6,000 in spend over three months. Twelve months of 0%
  intro APR on purchases helps if you need to float equipment or startup
  costs. The real tradeoff is the 1% base rate on everything else and a
  foreign transaction fee, so pair it with a flat-rate card for uncategorized
  spending and keep it off international purchases.
