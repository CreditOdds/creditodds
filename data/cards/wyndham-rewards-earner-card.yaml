our_take: >
  The Wyndham Rewards Earner is a no-annual-fee way to earn Wyndham points,
  with 5 points per dollar at Hotels by Wyndham and 3x on dining and
  groceries, excluding Target and Walmart. The welcome offer totals 75,000
  points, but 45,000 of those require spending $500 at Hotels by Wyndham
  within 180 days, with the remaining 30,000 coming after $1,000 in purchases
  in the first 90 days. Automatic Gold status and a 10% discount on points for
  free nights are nice touches for occasional Wyndham guests, and a 0% intro
  APR on balance transfers for 15 months adds some flexibility. The catch is
  that the ongoing perks are modest: the 7,500-point anniversary bonus only
  arrives if you spend $15,000 in a year, and everything outside the bonus
  categories earns 1x. It is a sensible fee-free starter card for Wyndham
  loyalists, but heavier travelers will get more from the paid versions.
