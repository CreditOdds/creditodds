our_take: >
  The Wyndham Rewards Earner is the no-annual-fee entry point to the program,
  earning 5 points per dollar at Hotels by Wyndham and 3x on dining and
  groceries, with Target and Walmart excluded from the grocery rate. The
  75,000-point signup bonus is approachable, but 45,000 of it requires $500 in
  spend at Hotels by Wyndham within 180 days, on top of $1,000 in general
  spend in the first 90 days. Automatic Gold status and a 10% discount on
  points for free nights are nice extras, and a 15-month 0% intro APR on
  balance transfers adds some flexibility. The catch is that the ongoing value
  is modest: the 7,500-point anniversary bonus requires $15,000 in annual
  spend, and everything else earns 1x. It fits travelers who stay at Wyndham
  occasionally and want to collect points without paying a fee.
