our_take: >
  The United Gateway is the no-annual-fee entry point into United's card
  lineup, earning 2 miles per dollar on eligible United purchases, gas, and
  transit, and 1 mile on everything else. It carries the Best No-Fee badge on
  our Best Airline Credit Cards list, and it opens with 30,000 bonus miles
  after spending $1,000 in the first 3 months, plus 10,000 more for adding an
  authorized user. A 12 month 0% intro APR on purchases adds a little
  flexibility, and there is no foreign transaction fee. The catch is that the
  most useful perks are gated: two free checked bags and a 10% discount on
  award flights only unlock after you spend $10,000 in a calendar year. Beyond
  that, the only standing perk is 25% back on United inflight purchases, so
  this suits occasional United flyers who want to collect miles without paying
  a fee.
