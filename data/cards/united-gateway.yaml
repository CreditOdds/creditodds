our_take: >
  The Gateway is the no-annual-fee entry point to United's card lineup,
  earning 2 miles per dollar on eligible United purchases, gas, and transit
  and 1 on everything else, with a 30,000-mile bonus after $1,000 in spend in
  the first 3 months plus 10,000 for adding an authorized user. It also offers
  a 12-month 0% intro APR on purchases and no foreign transaction fee, and it
  earns the Best No-Fee badge on our Best Airline Credit Cards list. The catch
  is that its most useful travel perks are locked behind heavy spending: two
  free checked bags and 10% off award flights only kick in after $10,000 in
  purchases in a calendar year. Without that spend, the only ongoing perk is
  25% back on United inflight food, drinks, and Wi-Fi. It suits occasional
  United flyers who want to collect miles without a fee, but regular travelers
  will get more from a card that includes a free checked bag from day one.
