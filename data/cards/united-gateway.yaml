our_take: >
  The United Gateway is the no-annual-fee way into United's card lineup, and
  it carries the Best No-Fee badge on our Best Airline Credit Cards list. It
  earns 2 miles per dollar on eligible United purchases, gas, and transit,
  offers a 30,000-mile signup bonus after just $1,000 in spending in 3 months,
  and adds 12 months of 0% intro APR on purchases. The catch is that the
  travel perks most people want from an airline card are gated: two free
  checked bags and 10% off award flights only kick in after $10,000 in
  spending in a calendar year. Outside the bonus categories it earns 1 mile
  per dollar, and there is no intro APR on balance transfers. It suits
  occasional United flyers who want to collect miles without paying a fee,
  while anyone who checks bags regularly should look at the Explorer instead.
