our_take: >
  Citi no longer accepts applications for the AT&T Access, so it is a legacy
  account rather than a card you can add to your wallet now. If you still hold
  one, there is no annual fee and therefore no ongoing cost to leaving it
  open, and it continues to earn points. With the card closed to new
  customers, though, there is no reason to build a strategy around it, and
  anyone looking for a new points card will need to shop Citi's current lineup
  instead. Keep it open if the account age is helping your credit profile, and
  look elsewhere for your next application.

