our_take: >
  The Credit One Bank Platinum Rewards Visa with No Annual Fee is the
  cheapest way into Credit One's unsecured lineup, and for that reason it is
  the one to pick over the fee-charging Platinum variants if you qualify.
  Rewards are limited to 1% back on gas, groceries, mobile phone, and
  internet, cable, and satellite TV services, with nothing earned on other
  purchases, and the usual exclusions apply at warehouse clubs, Walmart,
  Target, and drugstores. Note that this card once earned 2% in these
  categories and now earns 1%, so older reviews overstate it. With no annual
  fee the card costs nothing to hold, but the 29.74% APR makes carrying a
  balance expensive. It is a reasonable average-credit stepping stone;
  mainstream no-fee cards from major issuers remain better once your score
  allows.
