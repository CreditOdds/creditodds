    frequency: "monthly"
    category: "dining"
    enrollment_required: true
    merchants:
      - dunkin
  - name: "Resy Credit"
    value: 100
    description: "Up to $50 semiannually at U.S. Resy restaurants and other eligible Resy purchases"
    frequency: "semi_annual"
    category: "dining"
    enrollment_required: true
  - name: "Hertz Elite Status"
    value: 0
