our_take: >
  The Gold is built for people who spend heavily on food: 4 points per dollar
  at restaurants on up to $50,000 a year and 4 points at U.S. supermarkets on
  up to $25,000, plus 3 points on flights and 5 points on hotels, prepaid car
  rentals, and cruises booked through Amex Travel. That earning power is why
  it sits near the top of our dining and groceries rankings, and the current
  100,000-point welcome offer after $8,000 in spend over six months is a
  strong head start. The catch is the $325 annual fee, which leans on a stack
  of monthly credits to justify itself: $10 a month in Uber Cash, $10 a month
  at Grubhub and a handful of other merchants, up to $7 a month at Dunkin',
  and up to $50 twice a year at Resy. Those credits require enrollment and
  only pay off if you already use those specific merchants, so be honest about
  which ones you will actually redeem. Everything outside the bonus categories
  earns just 1 point per dollar, so this works best alongside a solid
  catch-all card.
annual_fee: 325
benefits:
