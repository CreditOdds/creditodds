    frequency: "monthly"
    category: "dining"
    enrollment_required: true
    merchants:
      - dunkin
  - name: "Resy Credit"
    value: 100
    description: "Up to $50 semiannually at U.S. Resy restaurants and other eligible Resy purchases"
    frequency: "semi_annual"
    category: "dining"
    enrollment_required: true
  - name: "Hertz Elite Status"
    value: 0
    description: "Complimentary Hertz elite status for Amex Gold cardholders"
    frequency: "ongoing"
    category: "car_rental"
    enrollment_required: true
  - name: "The Hotel Collection Credit"
    value: 100
