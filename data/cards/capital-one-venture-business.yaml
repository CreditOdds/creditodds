our_take: >
  Capital One Venture Business pairs a flat 2x miles on every purchase with 5x
  on hotels, vacation rentals, and rental cars booked through Capital One
  Business Travel, for a $95 annual fee. The signup bonus is 100,000 miles
  after $10,000 of spend in the first 3 months, down from the 150,000 it
  briefly ran in June but still well above the 75,000 it started at. Two $50
  annual credits, one for Capital One Business Travel bookings and one for
  qualifying software and advertising purchases, cover the fee outright if you
  use both, and there is up to $120 back on Global Entry or TSA PreCheck every
  four years. The limitation is that the 5x rate lives entirely inside Capital
  One Business Travel, so away from that portal this is a 2x card and nothing
  more. At a 24.49% APR it is a poor place to carry a balance, and the $10,000
  spend requirement rules out the smallest operations.
