our_take: >
  The Venture Business is a simple flat-rate travel card for a business: 2
  miles per dollar on every purchase, plus 5 miles on hotels, vacation
  rentals, and rental cars booked through Capital One Business Travel, with no
  foreign transaction fees. The welcome offer has been volatile, jumping from
  75,000 to 150,000 miles in June before settling at 100,000 miles in July,
  and earning it takes $10,000 in spend within 3 months, so it suits a
  business with real monthly volume. The $95 annual fee is partly offset by a
  $50 Business Travel credit and up to $50 a year in software and advertising
  credits, though both require spending in specific places to use. A Global
  Entry or TSA PreCheck credit every four years and free employee cards that
  earn miles on your account round out the package. If your business wants
  uncomplicated 2x earning on everything without managing bonus categories, it
  fits; if you want lounges or richer travel credits, look higher up the
  lineup.
