our_take: >
  The Venture Business is a simple flat-rate earner for small businesses: 2
  miles per dollar on everything, with 5x on hotels, vacation rentals, and
  rental cars booked through Capital One Business Travel, no foreign
  transaction fees, and free employee cards whose spending feeds your miles.
  Note that the welcome offer was recently cut from 150,000 to 100,000 miles,
  and it still asks for $10,000 in spend within 3 months, so it fits
  businesses with real monthly volume. The $95 annual fee is partly offset by
  a $50 Business Travel credit and up to $50 a year in software and
  advertising credits, though both require spending in specific places to
  collect. Add the up to $120 Global Entry or TSA PreCheck credit every four
  years and it is an easy card to justify if you would rather not track
  categories. The tradeoff is that outside the travel portal there are no
  bonus categories, so heavy spenders in areas like advertising or shipping
  may earn more elsewhere.
