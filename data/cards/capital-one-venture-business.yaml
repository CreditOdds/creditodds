our_take: >
  The Venture Business is built for owners who want a simple flat earn: 2
  miles per dollar on everything, with 5x on hotels, vacation rentals, and
  rental cars booked through Capital One Business Travel, and no foreign
  transaction fees. The welcome offer was recently cut from 150,000 to 100,000
  miles, and it now takes $10,000 in spend within 3 months to earn it, so it
  fits a business with real monthly volume. Against the $95 annual fee, the
  $50 Business Travel credit and up to $50 in software and advertising credits
  can cover the cost on their own if you use both. Free employee cards that
  earn miles on the primary account help pool rewards quickly. The catch is
  that the best extras, including the travel credit and the 5x rate, run
  through Capital One's own booking portal, so outside of that this is a
  straightforward 2x card.
