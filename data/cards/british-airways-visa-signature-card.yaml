our_take: >
  The British Airways Visa Signature is built for travelers who fly British
  Airways, Aer Lingus, or Iberia, earning 3 Avios per dollar on those flights
  and 2 per dollar on hotels booked directly. Its standout perk is the Travel
  Together Ticket, a companion ticket (or a 50% Avios discount when flying
  solo) earned after $30,000 in calendar-year spending, plus up to three
  annual statement credits worth up to $600 against taxes and carrier charges
  on British Airways reward flights. New cardholders can earn 75,000 Avios
  after spending $5,000 in three months, and there is no foreign transaction
  fee. The tradeoff is that the best value requires heavy spending and loyalty
  to one airline group, while everyday purchases earn just 1x. It ranks #2 on
  our Best Airline Credit Cards list, and for frequent transatlantic flyers
  the $95 annual fee is easy to justify.
apply_link: https://creditcards.chase.com/travel-credit-cards/british-airways
