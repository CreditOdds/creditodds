our_take: >
  The British Airways Visa Signature is built for travelers who already fly
  British Airways or its partners and want to stretch Avios further. It opens
  with 75,000 Avios after $5,000 in spend within three months, and earns 3
  Avios per dollar on British Airways, Aer Lingus, and Iberia flights, 2 per
  dollar on hotels booked directly, and 1 per dollar on everything else. The
  standout value is the reward flight statement credit: up to three credits a
  year, $100 each on Economy or Premium Economy or $200 each on Business or
  First, toward the taxes and carrier charges on British Airways reward
  flights, which can easily outweigh the $95 annual fee. The catch is that the
  Travel Together Ticket requires $30,000 in spending in a calendar year, and
  the everyday earn rate is only 1x, so this is not a card for general
  spending. Add in 2,500 anniversary Avios, no foreign transaction fees, and
  solid baggage coverage, and it earns its #6 spot on our Best Airline Credit
  Cards list for regular BA flyers.
apply_link: https://creditcards.chase.com/travel-credit-cards/british-airways
