our_take: >
  The Citi Secured Mastercard is a straightforward credit builder: no annual
  fee and a big-bank name on your credit report, which is why it ranks #4 on
  our list of the best secured cards. It does exactly one job, giving you a
  card to use lightly and pay on time while your history grows. The tradeoff
  is that it offers nothing beyond that: there are no rewards of any kind, and
  the 25.99% APR is steep if you ever carry a balance. It also charges foreign
  transaction fees, so leave it home when you travel abroad. Use it to
  establish a track record, pay it in full every month, and plan to graduate
  to a rewards card once your score can support one.
