our_take: >
  The Citi Secured Mastercard is a straightforward credit-building tool from a
  major bank: no annual fee, a single 25.99% APR, and nothing complicated to
  manage while you establish a payment history. That simplicity is why it
  lands at #4 on our Best Secured Credit Cards list. The catch is that it is a
  builder and nothing more: it earns no rewards, carries no intro APR offer,
  and charges a foreign transaction fee, so it is a poor choice for travel or
  everyday value. Pay the balance in full each month so the 25.99% rate never
  comes into play. Use it to build a record of on-time payments, then plan to
  move on to a rewards card once your credit can support one.
