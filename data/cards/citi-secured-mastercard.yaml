our_take: >
  The Citi Secured Mastercard is a straightforward credit-building tool from a
  major bank, with no annual fee, which is exactly what you want when the goal
  is establishing or repairing a credit history without paying for the
  privilege. It lands at #4 on our list of the best secured cards, and its
  value comes from building a track record of on-time payments rather than
  anything you earn along the way. The tradeoff is that it offers nothing
  else: there are no rewards of any kind, and the 25.99% APR is steep enough
  that carrying a balance would quickly undo the point of the card. It also
  charges a foreign transaction fee, so leave it at home when traveling
  abroad. Use it for small recurring purchases, pay it off in full every
  month, and plan to graduate to a rewards card once your score is in better
  shape.
