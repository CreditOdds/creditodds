our_take: >
  The H-E-B Visa Signature is a straightforward pick for regular H-E-B
  shoppers: 5% cash back on H-E-B and Central Market own-brand products, in
  store and on heb.com, plus Favor delivery orders, with no annual fee. Note
  that the 5% applies to own-brand items, not every grocery purchase, and
  excludes pharmacy prescriptions, fuel, gift cards, and in-store restaurants.
  Everything else earns 1.5%, a respectable base rate, and there's no foreign
  transaction fee, so it can travel too. The regular APR tops out at 35.99%,
  which makes carrying a balance expensive. If you live near an H-E-B and buy
  its store brands often, it earns its spot; otherwise the 1.5% base alone
  isn't a reason to choose it.
