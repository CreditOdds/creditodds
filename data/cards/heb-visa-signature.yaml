our_take: >
  The H-E-B Visa Signature is a strong no-annual-fee pick for regular H-E-B
  shoppers, earning 5% back on H-E-B and Central Market own-brand products
  in-store and on heb.com, plus Favor delivery orders. Be clear on the limits
  of that 5%: it applies only to own-brand items, not your whole grocery bill,
  and it excludes pharmacy prescriptions, fuel, gift cards, and in-store
  restaurants. Everything else earns a flat 1.5%, which is decent for a store
  card but trails the best flat-rate cards on the market. Cash back never
  expires, and there's no foreign transaction fee, but the regular APR can
  reach 35.99%, so it's only a good deal if you pay in full. If you fill your
  cart with H-E-B brand products every week, it earns its spot; otherwise a
  general cash back card will do more for you.
