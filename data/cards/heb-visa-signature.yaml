our_take: >
  If you do most of your grocery shopping at H-E-B, this card's 5% back is the
  strongest reason to carry it, covering H-E-B and Central Market own-brand
  products in-store and on heb.com as well as Favor delivery orders. Read that
  limit carefully, because it is narrower than a grocery category: the 5%
  applies to own-brand products at those stores only, and pharmacy
  prescriptions, fuel, gift cards, and in-store restaurants are excluded, so a
  typical H-E-B basket will earn the top rate on only part of the total.
  Everything else earns a flat 1.5%, which is respectable for a no-annual-fee
  card and means it is not useless away from the store. Cash back never
  expires for the life of the account, and there is no foreign transaction
  fee. The APR runs as high as 35.99%, so this is a card to pay off in full
  every month.
