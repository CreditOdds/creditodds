our_take: >
  The H-E-B Visa Signature is a straightforward pick for loyal H-E-B shoppers:
  5% cash back on H-E-B and Central Market own-brand products, in-store and on
  heb.com, plus Favor delivery orders, with no annual fee. Read that fine
  print carefully, though, because the 5% applies only to own-brand items at
  H-E-B, not your whole grocery bill, and it excludes pharmacy prescriptions,
  fuel, gift cards, and in-store restaurants. Everything else earns 1.5% cash
  back, a respectable base rate for a store card, and there are no foreign
  transaction fees. Earned cash back never expires for the life of the
  account, and Visa Signature perks like concierge and roadside dispatch are
  minor extras. With a regular APR that can reach 35.99%, this is a card to
  pay in full each month, ideally paired with a stronger card for spending
  outside H-E-B.
