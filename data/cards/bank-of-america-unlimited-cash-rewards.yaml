our_take: >
  The Unlimited Cash Rewards keeps things simple with 1.5% cash back on every
  purchase and no annual fee, so there are no categories or caps to track.
  Bank of America recently raised the welcome offer from $200 to $250, earned
  after $1,000 in spend within 3 months, and 15 months of 0% intro APR on
  purchases and balance transfers gives it extra appeal for a large purchase
  or debt payoff. The tradeoff is that 1.5% is a modest flat rate, and
  cardholders willing to manage bonus categories can earn more elsewhere. It
  also charges foreign transaction fees, so it is not a card to take overseas.
  It works well as a set-and-forget everyday card or as a baseline alongside a
  card with stronger category rewards.
