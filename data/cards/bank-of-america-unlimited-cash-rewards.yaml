our_take: >
  The Unlimited Cash Rewards earns a flat 1.5% cash back on every purchase
  with no annual fee and no categories to track. Bank of America recently
  raised the welcome bonus from $200 to $250 after $1,000 in spend within
  three months, and the card adds 15 months of 0% intro APR on purchases and
  balance transfers. That combination makes it a reasonable pick if you want a
  simple card that can also float a purchase or a balance for over a year. The
  catch is that 1.5% is a middle-of-the-road flat rate, and there are no bonus
  categories to boost it. It also charges foreign transaction fees, so leave
  it at home when you travel internationally.
