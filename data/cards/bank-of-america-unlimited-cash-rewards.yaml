our_take: >
  The Bank of America Unlimited Cash Rewards is a straightforward flat-rate
  card: 1.5% cash back on every purchase with no annual fee and no categories
  to track. Its welcome offer recently rose from $200 to $250, earned after
  $1,000 in purchases in the first three months, and it adds 15 months of 0%
  intro APR on both purchases and balance transfers. That combination makes it
  a reasonable first cash back card or a simple catch-all for spending that
  does not fit anywhere else. The tradeoff is that 1.5% is a modest flat rate,
  and foreign transaction fees make it a poor choice for purchases abroad.
  Take it for the bonus and intro APR, and pair it with a category card if you
  want to earn more on your biggest expenses.
