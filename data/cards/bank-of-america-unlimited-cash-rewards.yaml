our_take: >
  Bank of America raised the signup bonus from $200 to $250 in August, and
  after $1,000 of spend in the first three months that is a strong return for
  a card with no annual fee. The rest is deliberately plain: a flat 1.5% back
  on everything, with no categories to activate or caps to track. A 15-month
  0% intro APR on both purchases and balance transfers gives it real utility
  beyond rewards if you are carrying a balance. The weaknesses are that 1.5%
  is below what several no-fee flat-rate cards pay, and the card charges
  foreign transaction fees, which rules it out for travel abroad. It works as
  a simple catch-all for domestic spending, especially if you bank with Bank
  of America already.
