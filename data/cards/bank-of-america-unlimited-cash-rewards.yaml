our_take: >
  The Unlimited Cash Rewards is a no-annual-fee, flat-rate card that earns
  1.5% cash back on every purchase with no categories or caps to track. Its
  signup bonus recently rose from $200 to $250 after $1,000 in purchases
  within three months, and new cardholders also get 15 months of 0% intro APR
  on purchases and balance transfers. That combination makes it a decent
  all-purpose card for someone who wants simplicity and a short interest-free
  window. The catch is that 1.5% is a modest flat rate, so it is outearned by
  cards that pay more on everyday spending, and the foreign transaction fee
  makes it a poor travel companion. Use it as a set-and-forget card for
  purchases outside your bonus categories elsewhere.
