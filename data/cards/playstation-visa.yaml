our_take: >
  The PlayStation Visa is built for gamers: 5 points per dollar on
  PlayStation, PlayStation Direct, and Sony Store purchases, plus 3 points on
  streaming, cable, and internet subscriptions and 2 points on dining and
  groceries, with no annual fee. The $100 statement credit after just $500 in
  purchases within 60 days is an easy bonus to earn. Heavy spenders can also
  unlock a 12-month PlayStation Plus Premium membership, but only after $6,000
  in purchases in a calendar year, which is a high bar for a perk most players
  would otherwise buy for far less. The tradeoff is that everything else earns
  just 1 point per dollar, the card charges foreign transaction fees, and its
  points are most naturally redeemed for PlayStation Store codes. If you spend
  regularly in the PlayStation ecosystem it earns its spot, but outside of
  that, a general cash back card will serve you better.
