our_take: >
  The PlayStation Visa makes the most sense for dedicated PlayStation players:
  it earns 5 points per dollar on PlayStation, PlayStation Direct, and Sony
  Store purchases, and those points can go back into PlayStation Store codes
  and digital gift cards. It also earns 3 points per dollar on streaming,
  cable, and internet subscriptions and 2 points on dining and groceries, all
  with no annual fee, and the $100 statement credit after just $500 in
  purchases within 60 days is an easy bonus to hit. The 12-month PlayStation
  Plus Premium membership is a nice extra, but it takes $6,000 in purchases in
  a calendar year to unlock, which is a lot of spending on a card that earns
  only 1 point per dollar outside its categories. It also charges a foreign
  transaction fee and carries an APR of up to 31.74%, so pay it in full and
  leave it home when you travel. Keep it for gaming and subscriptions, and put
  general spending on something stronger.
