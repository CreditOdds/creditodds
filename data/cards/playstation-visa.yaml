our_take: >
  The PlayStation Visa makes the most sense for dedicated PlayStation players:
  it earns 5 points per dollar on PlayStation, PlayStation Direct, and Sony
  Store purchases, with no annual fee. The secondary categories are
  respectable too, at 3 points per dollar on streaming, cable, and internet
  subscriptions and 2 points per dollar on dining and groceries. A $100
  statement credit after $500 in purchases within 60 days is an easy bonus to
  earn. The tradeoffs are a 1 point per dollar base rate on everything else, a
  foreign transaction fee that rules it out abroad, and a regular APR that can
  reach 31.74%. The 12-month PlayStation Plus Premium membership requires
  $6,000 in purchases in a calendar year, so treat it as a perk for heavy
  spenders rather than a reason to apply.
