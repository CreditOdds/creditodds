our_take: >
  For anyone who spends regularly on PlayStation, this card earns 5 points per
  dollar at PlayStation, PlayStation Direct and the Sony Store, and 3x on
  streaming, cable and internet subscriptions, all with no annual fee. Points
  redeem for PlayStation Store codes and digital gift cards, and spending
  $6,000 in a calendar year triggers a 12-month PlayStation Plus Premium
  membership, which is a real benefit if you were paying for it anyway. Dining
  and groceries at 2x give it some everyday use, but everything else is 1x, so
  it is a companion card rather than a daily driver. The $100 statement credit
  after $500 in 60 days is one of the easier opening offers to clear. Watch
  the fine print though: there is a foreign transaction fee, and the regular
  APR runs 17.74% to 31.74%, which would erase the rewards fast if you carried
  a balance.
