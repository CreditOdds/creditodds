our_take: >
  The Choice Privileges Select is built for loyal Choice Hotels guests, and
  its strongest feature is the 30,000-point anniversary bonus, worth about
  three reward nights a year at participating properties, which covers the $95
  annual fee for most regulars. Earning is also strong: 10x at participating
  Choice Hotels and 5x on gas, groceries, home improvement, and phone plans,
  plus a 60,000-point signup bonus after $3,000 in spending in the first three
  months. Automatic Platinum Elite status, with 25% bonus points on stays and
  room upgrades when available, a one-time Global Entry or TSA PreCheck credit
  of up to $120, and no foreign transaction fees round it out. The tradeoff is
  that all of that value is locked into the Choice program, so if you rarely
  stay at Choice properties, the points and status are worth much less.
  Everything outside the bonus categories earns 1x. If you already book Choice
  stays, it's one of the clearer cases where a $95 fee pays for itself.
