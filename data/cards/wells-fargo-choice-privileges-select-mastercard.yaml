our_take: >
  The Choice Privileges Select is built for loyal Choice Hotels guests: 10x
  points at participating Choice properties and 5x on gas, groceries, home
  improvement, and phone plans, for a $95 annual fee. The standout perk is
  30,000 bonus points every anniversary year, which on its own can justify the
  fee if you redeem at Choice hotels. Automatic Platinum Elite status, a
  Global Entry or TSA PreCheck credit of up to $120, and no foreign
  transaction fees add to the package, along with a 60,000-point welcome bonus
  after $3,000 in spending in the first three months. The tradeoff is
  concentration: every point lives in one hotel program, and everything
  outside the bonus categories earns just 1x. If you rarely stay with Choice,
  the anniversary bonus loses most of its value and the fee is hard to
  justify.
