reward_type: "miles"
our_take: >
  The Iberia Visa Signature's main draw is its 75,000 Avios signup bonus after
  $5,000 in spending in the first three months, a large haul for a card with a
  $95 annual fee and no foreign transaction fees. Ongoing earning is narrower:
  3 Avios per dollar applies only to flights on Iberia, British Airways, and
  Aer Lingus, 2 per dollar on hotels booked directly, and just 1 per dollar on
  everything else, which is a weak base rate for general spending. The
  headline perk, a companion voucher worth up to $1,000, requires $30,000 in
  spending in a calendar year, so most cardholders will never see it. The
  2,500 anniversary Avios, 10% off Iberia flights booked through the
  cardmember site, and baggage delay and lost luggage coverage are useful
  extras but modest. This card makes the most sense if you already fly Iberia
  or its partners and want the bonus; otherwise it is hard to justify as an
  everyday card.
