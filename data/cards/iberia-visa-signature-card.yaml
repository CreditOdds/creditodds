name: "Iberia Visa Signature"
bank: "Chase"
slug: "iberia-visa-signature-card"
accepting_applications: true
image: "iberia-plus.png"
annual_fee: 95
foreign_transaction_fee: false
network: "visa"
reward_type: "miles"
our_take: >
  The pull here is the 75,000 mile signup bonus after $5,000 in three months,
  paired with a $95 annual fee and no foreign transaction fees, which is a
  reasonable trade if Iberia, British Airways, or Aer Lingus are already in
  your travel rotation. Beyond the bonus the earn chart is narrow: 3x applies
  only to flights on those three airlines, 2x to hotels booked directly, and
  everything else sits at 1x, so this is not a card for everyday spending. The
  companion voucher worth up to $1,000 reads like the headline perk, but it
  takes $30,000 of purchases in a calendar year to unlock, which is a lot of
  1x spending to push through. Baggage delay and lost luggage coverage, plus
  10% off Iberia flights booked through the cardmember site, round things out.
  Earn the bonus, put it toward transatlantic awards, and reassess each year
  whether the $95 still earns its place.
tags:
  - airline
  - travel
rewards:
  - category: airlines
    value: 3
    unit: points_per_dollar
    note: "Iberia, British Airways, and Aer Lingus flights"
    merchant_gate: [british-airways]
  - category: hotels
    value: 2
    unit: points_per_dollar
    note: "Hotels booked directly"
  - category: everything_else
    value: 1
    unit: points_per_dollar
signup_bonus:
  value: 75000
  type: miles
  spend_requirement: 5000
  timeframe_months: 3
apr:
  regular:
    min: 19.24
    max: 27.74
benefits:
  - name: "Iberia Companion Voucher"
    value: 0
    description: "Companion voucher worth up to $1,000 for two tickets on the same Iberia flight when you spend $30,000 in a calendar year"
    frequency: "annual"
    category: "travel"
    enrollment_required: false
  - name: "10% Flight Discount"
    description: "10% off Iberia flights when booking via the designated cardmember website"
    frequency: "per_purchase"
    category: "travel"
    enrollment_required: false
  - name: "DashPass Membership"
    description: "Complimentary DashPass for at least one year when activated by Dec 31, 2027"
    frequency: "annual"
    category: "rewards"
    enrollment_required: true
    merchants:
      - doordash
  - name: "Baggage Delay Insurance"
    description: "Reimbursement up to $100 per day for up to 3 days for essential purchases when baggage is delayed over 6 hours"
    category: "travel"
    enrollment_required: false
  - name: "Lost Luggage Reimbursement"
    description: "Reimbursement up to $3,000 per covered traveler for lost, damaged, or stolen checked or carry-on baggage during a covered trip"
    category: "travel"
    enrollment_required: false
  - name: "Purchase Protection"
    description: "Coverage for eligible new purchases for 120 days from purchase against damage or theft up to $500 per item"
    category: "protection"
    enrollment_required: false
apply_link: https://creditcards.chase.com/travel-credit-cards/avios/iberia
