our_take: >
  The case for the Iberia Visa Signature is the 75,000 Avios bonus after
  $5,000 of spend in the first three months, a lot of currency for a $95
  annual fee. Earning is narrow, though: the 3x rate applies only to Iberia,
  British Airways, and Aer Lingus flights, hotels booked directly earn 2x, and
  everything else sits at 1x, so this is a card you pull out for a specific
  set of purchases rather than daily spend. The headline companion voucher,
  worth up to $1,000 toward two tickets on the same Iberia flight, requires
  $30,000 of spend in a calendar year, which is out of reach for most people
  earning 1x on the rest of their purchases. The realistic perks are smaller:
  2,500 bonus Avios each account anniversary, 10% off Iberia flights booked
  through the cardmember site, and no foreign transaction fees. Take the bonus
  if Iberia or its partner airlines are actually in your travel plans, then
  decide at renewal whether $95 still earns its place.
