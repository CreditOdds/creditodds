our_take: >
  The Iberia Visa Signature earns its keep with a 75,000 Avios signup bonus
  after $5,000 in spending over three months, a large haul of miles for a $95
  annual fee. Day to day it earns 3x on Iberia, British Airways, and Aer
  Lingus flights and 2x on hotels booked directly, plus 2,500 bonus Avios each
  account anniversary and 10% off Iberia flights booked through the cardmember
  website. The headline perk, a companion voucher worth up to $1,000 for two
  tickets on the same Iberia flight, only unlocks after $30,000 in
  calendar-year spending, which is a tall order for a card that earns just 1x
  on everything else. That flat 1x base makes it a poor home for general
  spending, so it fits best as a bonus grab and a flight card for travelers
  who already route through Iberia. No foreign transaction fee, baggage delay
  coverage, and lost luggage reimbursement are useful extras on the road.
