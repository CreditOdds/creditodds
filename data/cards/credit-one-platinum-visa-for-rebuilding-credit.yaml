our_take: >
  The Credit One Bank Platinum Visa for Rebuilding Credit is one of the most
  widely held subprime cards in the country, and its economics deserve a
  clear-eyed look before applying. The $75 first-year fee is billed at
  account opening and comes straight out of your credit line, so a $300
  limit starts as roughly $225 of usable credit, and from year two the fee
  rises to $99, charged at $8.25 per month. Rewards are a token 1% on gas,
  groceries, phone, and TV services, and the 29.74% APR punishes any carried
  balance. What you get in exchange is unsecured approval odds with damaged
  credit and reporting to all three bureaus. If you can spare a deposit, a
  no-fee secured card, including Credit One's own, builds credit at a
  fraction of the cost.
