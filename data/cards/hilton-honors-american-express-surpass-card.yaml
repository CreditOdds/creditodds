our_take: >
  The Surpass is the middle tier of the Hilton lineup, pairing complimentary
  Gold status with strong everyday earning: 6 points per dollar at U.S.
  restaurants, U.S. supermarkets, and U.S. gas stations, 4 points on eligible
  U.S. online retail, and 12 points at Hilton. The welcome offer is 130,000
  points plus a Free Night Reward after $3,000 in spend within six months, a
  low bar for a bonus that size. The $150 annual fee is offset by up to $200 a
  year in Hilton credits, but those come as $50 per quarter, so you need
  regular Hilton charges to capture them. Free nights aren't automatic either:
  you earn one after $15,000 in calendar-year spend, and Diamond status takes
  $40,000. It's a good fit for Hilton loyalists who will put real spending on
  the card, while occasional guests may do better with the no-fee version.
