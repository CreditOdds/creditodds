our_take: >
  The Hilton Honors Surpass is the sweet spot of the Hilton lineup for regular
  guests: Gold status out of the box, 6 points per dollar at U.S. restaurants,
  supermarkets, and gas stations, and 12 points at Hilton hotels and resorts.
  The welcome offer of 130,000 points plus a Free Night Reward after $3,000 in
  spend within 6 months is generous for the spend required. The $150 annual
  fee is covered by up to $200 a year in Hilton credits, paid out at $50 per
  quarter, if you stay or spend at Hilton properties often enough to use them.
  A Free Night Reward after $15,000 in calendar-year purchases and Diamond
  status at $40,000 reward heavier spenders. The catch is that all of this
  only pays off inside the Hilton ecosystem, and the 3x base rate on
  everything else is ordinary in value, so occasional travelers may be better
  off with a flexible-points card.
