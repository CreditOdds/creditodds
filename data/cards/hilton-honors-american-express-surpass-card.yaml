our_take: >
  The Hilton Honors American Express Surpass is the sweet spot of the Hilton
  lineup for most travelers, earning 12 points per dollar at Hilton hotels and
  resorts and 6 points at U.S. restaurants, supermarkets, and gas stations for
  a $150 annual fee. The welcome offer of 130,000 points plus a Free Night
  Reward after $3,000 in spend within six months is generous for the spending
  required. Up to $200 a year in Hilton credits, paid as $50 per quarter, can
  cover most of the fee if you stay or spend at Hilton properties regularly,
  and Gold status comes standard. The catch is that the Free Night Reward
  requires $15,000 in purchases in a calendar year, and Diamond status takes
  $40,000, so the bigger perks are earned rather than given. If you stay at
  Hilton a few times a year and can use the quarterly credits, it's a strong
  value; otherwise the no-fee Hilton card may be enough.
