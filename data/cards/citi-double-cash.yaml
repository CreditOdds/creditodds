our_take: >
  The Double Cash earns a flat 2% on everything, paid as 1% when you buy and
  1% when you pay it off, with no annual fee and no categories to track. That
  simplicity is the point, and it is why the card holds #3 on our Best Cash
  Back Credit Cards list: for spending that falls outside every other card's
  bonus categories, 2% is a solid floor. There is also 5% back on hotels, car
  rentals and attractions booked through the Citi Travel portal, though portal
  booking carries the usual tradeoffs in price and flexibility. New
  cardholders get $200 after $1,500 in six months plus 18 months of 0% intro
  APR on balance transfers, but note that the intro rate does not extend to
  purchases. The one real drawback is the foreign transaction fee, so keep a
  different card for trips abroad.
