our_take: >
  The Double Cash is the simplest strong cash back card around: 2% on
  everything, earned as 1% when you buy and 1% when you pay, with no annual
  fee and no categories to track. That flat rate is why it carries the Best
  Value badge on our cash back list, and it pairs well with category cards as
  the default for everything else. You also get 5% on hotels, car rentals, and
  attractions booked through the Citi Travel portal, a $200 bonus after $1,500
  in spend over 6 months, and 18 months of 0% intro APR on balance transfers.
  The catches are that there is no intro APR on purchases and it charges
  foreign transaction fees, so leave it home when traveling abroad. For anyone
  who wants one reliable everyday card without fuss, it is hard to beat.
