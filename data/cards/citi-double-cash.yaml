our_take: >
  The Double Cash earns a flat 2% on every purchase, 1% when you buy and 1%
  when you pay, with no annual fee and no categories to track. That simplicity
  is why it ranks #3 on our Best Cash Back Credit Cards list with the Best
  Value badge. There is also 5% on hotels, car rentals, and attractions booked
  through the Citi Travel portal, and a $200 bonus after $1,500 in spending
  within 6 months. The 18 months of 0% intro APR on balance transfers is a
  useful extra if you are carrying debt, though purchases get no intro period.
  The catches are modest: the foreign transaction fee makes it a poor choice
  abroad, and category cards will beat 2% on dining or groceries if you are
  willing to juggle them. As a default card for everything that does not earn
  a bonus elsewhere, it is hard to improve on.
