our_take: >
  The Double Cash remains one of the simplest strong cash back cards
  available: a flat 2% on everything, earned as 1% when you buy and 1% when
  you pay, with no annual fee and no categories to track. That makes it a
  natural default card for everyday spending and a good fit on our list of the
  best cash back cards. It adds 5% on hotels, car rentals, and attractions
  booked through the Citi Travel portal, a $200 bonus after $1,500 in spend
  within six months, and 18 months of 0% intro APR on balance transfers for
  anyone consolidating debt. The catches are modest but real: there is no
  purchase intro APR, no bonus categories that beat 2% outside the portal, and
  foreign transaction fees make it a poor choice for spending abroad. For most
  people it works best as the catch-all card behind a few category
  specialists.
