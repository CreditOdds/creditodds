our_take: >
  The Double Cash earns a flat 2% on everything, 1% when you buy and 1% when
  you pay, with no annual fee and no categories to track, which is why it is
  our Best Value pick among cash back cards. It also earns 5% on hotels, car
  rentals, and attractions booked through the Citi Travel portal, and new
  cardholders can earn a $200 bonus after $1,500 in spending within six
  months. An 18-month 0% intro APR on balance transfers adds flexibility if
  you are carrying a balance from another card, though there is no intro rate
  on new purchases. The main catch is the foreign transaction fee, which makes
  it a poor choice for spending abroad, and you only collect the full 2% once
  you pay your bill. As a simple, durable everyday card or a base to pair with
  category cards, it is hard to beat.
