name: "Blue Cash Preferred"
bank: "American Express"
slug: "blue-cash-preferred-card"
image: "amex_blue_cash_preferred.png"
accepting_applications: true
apply_link: https://www.americanexpress.com/us/credit-cards/card/blue-cash-preferred/
foreign_transaction_fee: true
network: "amex"
our_take: >
  6% back at U.S. supermarkets is the whole argument for the Blue Cash
  Preferred, and it is enough to put the card at #1 on our Best Credit Cards
  for Dining and Groceries list. That rate applies to the first $6,000 of
  supermarket spending each year, worth up to $360 back, then falls to 1%, so
  a household spending about $500 a month on groceries extracts the full value
  and no more. Select U.S. streaming subscriptions also earn 6%, with 3% on
  U.S. gas stations and on transit including rideshare, taxis, parking, tolls,
  trains, and buses. The catch is the $95 annual fee: you need roughly $1,600
  of supermarket spending a year before the 6% rate even covers it, and the
  card charges foreign transaction fees on top. The $300 bonus after $3,000 in
  six months, 12 months of 0% intro APR, and the $7 monthly Disney Bundle
  credit make year one easy, but check your grocery habits before each
  renewal.
