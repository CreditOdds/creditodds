our_take: >
  The Blue Cash Preferred tops our Best Credit Cards for Dining and Groceries
  list on the strength of 6% cash back at U.S. supermarkets, along with 6% on
  select U.S. streaming subscriptions, 3% on transit, and 3% at U.S. gas
  stations. For a family with a big grocery bill, that 6% rate can easily earn
  back the $95 annual fee. The catch is that the grocery rate is capped at
  $6,000 in spending per year, after which it drops to 1%, and everything
  outside the bonus categories also earns just 1%. A $300 welcome offer after
  $3,000 in spend within six months and a 12-month 0% intro APR on purchases
  and balance transfers sweeten the first year. The $84 annual Disney Bundle
  credit and purchase, return, and extended warranty protections are useful
  extras, though the foreign transaction fee rules it out for travel abroad.
annual_fee: 95
