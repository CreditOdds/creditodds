name: "Blue Cash Preferred"
bank: "American Express"
slug: "blue-cash-preferred-card"
image: "amex_blue_cash_preferred.png"
accepting_applications: true
apply_link: https://www.americanexpress.com/us/credit-cards/card/blue-cash-preferred/
foreign_transaction_fee: true
network: "amex"
our_take: >
  The Blue Cash Preferred earns 6% cash back at U.S. supermarkets, one of the
  highest grocery rates available, and it tops our Best Credit Cards for
  Dining and Groceries list as the Best Overall pick. It also earns 6% on
  select U.S. streaming subscriptions and 3% on transit and U.S. gas stations.
  The tradeoff is a $95 annual fee and a $6,000 yearly cap on the 6% grocery
  rate, after which it drops to 1%, so the card pays off best for households
  that spend heavily on groceries. Spending outside the bonus categories earns
  only 1%, and the foreign transaction fee rules it out for travel abroad. The
  $300 bonus after $3,000 in spend over six months, an 18-month 0% intro APR
  on purchases, and an up to $84 annual Disney Bundle credit (enrollment
  required) all help offset the fee.
annual_fee: 95
