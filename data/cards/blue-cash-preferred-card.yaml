our_take: >
  The Blue Cash Preferred is the card to beat for grocery spending: 6% cash
  back at U.S. supermarkets is the headline, and it's why the card ranks #1 as
  Best Overall on our Best Credit Cards for Dining and Groceries list. It adds
  6% on select U.S. streaming subscriptions and 3% on transit and U.S. gas
  stations, along with a 0% intro APR on purchases for 18 months. The catch is
  the $95 annual fee and the $6,000 annual cap on the 6% grocery rate, after
  which supermarket spending drops to 1%. Maxing the grocery category alone
  earns $360 a year, so the card pays off easily for families who shop
  heavily, but light spenders may come out ahead with a no-fee alternative.
  The $300 welcome bonus after $3,000 in six months, the up to $7 monthly
  Disney Bundle credit, and return protection are useful extras, while the
  foreign transaction fee makes it a poor travel companion.
