our_take: >
  The business version of the Reserve leans on credits a company can actually
  use: $400 a year toward ZipRecruiter, $200 toward Google Workspace, $300 in
  automatic travel credit, and up to $500 through The Edit by Chase Travel,
  which together approach the $795 annual fee before any travel perk is
  counted. The welcome offer is currently elevated to 200,000 points against a
  standard 150,000, but it demands $30,000 of spend in six months, so it only
  makes sense if that volume was already going on a card. Earning is
  top-heavy: 8x on Chase Travel, 4x on hotels and flights booked directly, 3x
  on search and social media advertising, and 1x on everything else, which
  means you will want a second card for general spending. Free employee cards
  with individual limits, primary rental coverage, cell phone protection up to
  $1,000 per claim, and Priority Pass plus Sapphire Lounge access fill out the
  rest. Keep in mind that several of the best credits, ZipRecruiter and Google
  Workspace among them, are dated through the end of 2027, so treat them as
  current value rather than permanent.
