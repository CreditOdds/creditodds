our_take: >
  The Fidelity Rewards Visa Signature earns a flat 2% cash back on everything
  with no annual fee, which puts it among the simplest high-rate cards around,
  as long as you deposit those rewards into an eligible Fidelity account. That
  condition is the real catch: if you do not already invest or save with
  Fidelity, or do not want to open an account there, the card loses its main
  appeal. The card also recently dropped its $150 signup bonus, so there is no
  longer an upfront reward to sweeten the application. On the plus side, there
  is no foreign transaction fee and up to $100 in reward points toward a
  Global Entry or TSA PreCheck application every 5 years. For Fidelity
  customers it is an easy, set-and-forget pick for all their spending.
benefits:
  - name: "Global Entry or TSA PreCheck Credit"
    value: 100
    description: "Up to $100 in Reward Points (worth $100 toward the application fee) when you apply for Global Entry or TSA PreCheck."
