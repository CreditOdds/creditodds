our_take: >
  The pitch is one clean number: 2% back on every purchase, with no categories
  to track and no annual fee, provided you deposit the rewards into an
  eligible Fidelity account. That makes it a legitimate everyday default card
  for anyone who already banks or invests with Fidelity, and the lack of a
  foreign transaction fee means it travels well too. There's also a Global
  Entry or TSA PreCheck credit worth up to $100 in Reward Points toward the
  application fee, available every 5 years. Two caveats: the 2% is tied to
  that Fidelity deposit, so the card is much less interesting if you don't
  want a Fidelity account, and the signup bonus was removed in July 2026, so
  there's no upfront sweetener to earn anymore. With a regular APR of 16.49%
  to 26.49% and no intro APR offer, this is a card to pay in full and hold for
  the flat rate, not to finance with.
