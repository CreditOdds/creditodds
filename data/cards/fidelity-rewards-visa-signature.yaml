our_take: >
  The Fidelity Rewards Visa Signature earns a straightforward 2% back on every
  purchase with no annual fee, which puts it among the strongest flat-rate
  cards for anyone already investing with Fidelity. The key condition is that
  the 2% rate applies when rewards are deposited into an eligible Fidelity
  account, so it suits savers who want their cash back flowing into a
  brokerage, retirement, or cash management account. The card recently dropped
  its $150 signup bonus, so there is no longer an upfront incentive to open
  it. Beyond the flat rate, you get up to $100 toward Global Entry or TSA
  PreCheck every five years and no foreign transaction fee. If you do not want
  a Fidelity account, look at other 2% cards instead.
