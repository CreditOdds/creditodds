our_take: >
  The Fidelity Rewards Visa Signature earns a flat 2% cash back on every
  purchase with no annual fee, which puts it among the simplest strong earners
  available, provided you are a Fidelity customer. The 2% rate applies only
  when rewards are deposited into an eligible Fidelity account, so it suits
  people who already invest there or are happy to open an account to collect
  the cash. The card recently dropped its $150 signup bonus, so there is no
  upfront reward to sweeten the application anymore. No foreign transaction
  fee and up to $100 in reward points toward Global Entry or TSA PreCheck
  every 5 years are useful extras. If you want flexible cash back that lands
  anywhere, look elsewhere, but for Fidelity users this is a solid
  set-and-forget card.
