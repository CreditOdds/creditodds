our_take: >
  The Altitude Connect is a rare no-annual-fee travel card that earns 4 points
  per dollar on both travel and gas, plus 5 points on prepaid hotels and car
  rentals booked through the U.S. Bank portal. Add no foreign transaction
  fees, a 12-month Priority Pass Select membership, and up to $100 toward
  Global Entry or TSA PreCheck every five years, and it covers a lot of ground
  for a $0 card. The catch is that the 4x gas rate is capped at $1,000 a
  quarter before dropping to 1x, and groceries, dining, and streaming earn a
  more ordinary 2x, with everything else at 1x. The lounge membership is also
  a first-year perk, not an ongoing one. The 20,000-point bonus after $1,000
  in three months is modest, but the 15-month 0% intro APR on purchases and
  balance transfers is a useful extra if you have a big expense coming up.

