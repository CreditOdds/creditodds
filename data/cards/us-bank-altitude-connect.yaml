our_take: >
  The Altitude Connect pairs genuinely useful travel earning with no annual
  fee: 4x points on travel, 4x on gas and EV charging, and 5x on prepaid
  hotels and car rentals booked through U.S. Bank's portal. It adds perks you
  rarely see at this price, including a complimentary 12-month Priority Pass
  Select membership, up to $100 toward Global Entry or TSA PreCheck every five
  years, and no foreign transaction fees. A 0% intro APR on purchases and
  balance transfers for 15 months and a 20,000-point bonus after $1,000 in
  spend round out the first year. The catch is the gas rate is capped at
  $1,000 per quarter before it falls to 1x, and the Priority Pass membership
  lasts only 12 months, so the lounge access is a first-year perk rather than
  an ongoing one. Groceries, dining, and streaming earn 2x and everything else
  1x, which makes this a good fee-free travel and commuting card rather than
  an all-purpose one.

