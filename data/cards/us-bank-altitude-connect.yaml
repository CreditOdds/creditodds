our_take: >
  The Altitude Connect packs a lot of travel earning into a no-annual-fee
  card: 4 points per dollar on travel, 5 on hotels and car rentals booked
  through the U.S. Bank portal, and 2 on groceries, dining, and streaming. It
  also earns 4 points per dollar on gas and EV charging, though only on the
  first $1,000 each quarter before dropping to 1. A Global Entry or TSA
  PreCheck credit of up to $100, a complimentary 12-month Priority Pass Select
  membership, and no foreign transaction fees are unusual extras at this
  price. The 15-month 0% intro APR on purchases and balance transfers adds
  flexibility, and the 20,000-point bonus after $1,000 in spend is easy to
  reach. The tradeoff is that everything else earns just 1 point per dollar
  and the lounge membership lasts only a year, so the card shines for frequent
  travelers and drivers rather than as a catchall.

