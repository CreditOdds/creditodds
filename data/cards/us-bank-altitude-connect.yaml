our_take: >
  The Altitude Connect is a genuinely unusual no-annual-fee travel card,
  because it hands you two perks that normally come with a fee: a Priority
  Pass Select membership good for 12 months of lounge access and up to $100
  back for Global Entry or TSA PreCheck every five years. Earning is
  aggressive as well, at 5 points per dollar on hotels and car rentals booked
  through the U.S. Bank travel portal, 4 on other travel, 4 on gas and EV
  charging, and 2 on groceries, dining, and streaming. Watch the gas cap: that
  4x rate applies to the first $1,000 each quarter and then falls to 1 point
  per dollar, the same as the base rate. The signup bonus is small at 20,000
  points after $1,000 in three months, and the lounge membership is a one-time
  12 months rather than a standing benefit, so plan to get your value from it
  in the first year. With no foreign transaction fee and a 0% intro APR for 15
  months on purchases and balance transfers, it is a low-risk card to keep
  open indefinitely.

