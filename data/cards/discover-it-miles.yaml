our_take: >
  The Discover it Miles is about as simple as a travel card gets: a flat 1.5
  miles per dollar on every purchase, no annual fee, and no foreign
  transaction fee. It also comes with a 0% intro APR for 15 months on both
  purchases and balance transfers, which makes it useful for financing a big
  purchase or paying down debt. The tradeoff is that there are no bonus
  categories and no travel perks to speak of, so the earning ceiling is low
  compared with cards that reward dining, groceries, or travel at higher
  rates. Think of it as a no-fuss, no-fee card for travelers who don't want to
  track categories, not as a points-maximizing tool.
