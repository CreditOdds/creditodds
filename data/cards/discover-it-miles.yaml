our_take: >
  The Discover it Miles keeps things simple: a flat 1.5 miles per dollar on
  every purchase with no annual fee and no foreign transaction fee. It also
  offers a 15-month 0% intro APR on both purchases and balance transfers,
  which makes it useful for financing a large purchase or paying down debt
  while still earning on new spending. The catch is that 1.5x is a modest
  rate, and there are no bonus categories, travel partners, or listed travel
  perks to push the value higher. Despite the miles branding, it works more
  like a basic flat-rate rewards card than a true travel card. It suits
  someone who wants an easy, no-fee card for everyday spending and
  international trips, but heavy travelers will likely want something with
  stronger earning or perks.
