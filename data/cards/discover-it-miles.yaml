our_take: >
  The Discover it Miles keeps things simple: a flat 1.5 miles per dollar on
  every purchase, no annual fee, and no foreign transaction fee. It also pairs
  that earn rate with 15 months of 0% intro APR on both purchases and balance
  transfers, a useful window if you want to finance a purchase or pay down
  debt while still earning. The tradeoff is that 1.5x is the ceiling: there
  are no bonus categories, so heavy spenders on dining, groceries, or travel
  will earn more elsewhere. Despite the travel branding, it offers no travel
  perks beyond skipping foreign transaction fees. It works best as a
  low-maintenance, no-fee card for someone who wants steady earning and an
  intro APR runway without tracking categories.
