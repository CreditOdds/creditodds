our_take: >
  The Discover it Miles keeps things simple: a flat 1.5x miles on every
  purchase with no annual fee and no foreign transaction fee, so there are no
  categories to track or activate. It also comes with 0% intro APR on
  purchases and balance transfers for 15 months, which makes it useful for
  spreading out a larger purchase or paying down existing debt. The tradeoff
  is that 1.5x is a modest flat rate and the card offers no airline or hotel
  perks, so it competes on simplicity rather than travel value. It makes the
  most sense as a low-maintenance everyday card for someone who wants no fees
  and a long intro APR, not for anyone chasing premium travel rewards.
