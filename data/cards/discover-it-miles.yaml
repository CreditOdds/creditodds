our_take: >
  This is a simple flat-rate travel card: 1.5 miles per dollar on every
  purchase, no annual fee, and no foreign transaction fee, so there's nothing
  to track or activate. It also comes with a 0% intro APR for 15 months on
  purchases and balance transfers, which is a long runway for a card that
  doesn't charge to hold it. The tradeoff is that the flat 1.5x is the entire
  rewards program: there are no bonus categories, so heavy spenders in dining,
  groceries, or travel will out-earn this card elsewhere. Discover acceptance
  abroad is also worth thinking about before you rely on it as a travel card,
  even with the fee waived. It's a reasonable no-fuss option if you want one
  card, one rate, and no annual fee.
