our_take: >
  The Quicksilver's appeal is its simplicity: a flat 1.5% cash back on every
  purchase with no annual fee, no categories to track, and no foreign
  transaction fee. New cardholders also get a $200 cash bonus after spending
  $500 in the first 3 months, an easy bar to clear, plus 15 months of 0% intro
  APR on purchases and balance transfers. That combination is why it ranks #6
  on our Best Cash Back Credit Cards list. The tradeoff is that 1.5% is a
  modest flat rate, and the only boosted category is 5% on hotels and rental
  cars booked through Capital One's travel portal. The price drop protection
  and price match guarantee only help if you book travel through that portal,
  so treat them as minor extras.
