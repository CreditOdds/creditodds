our_take: >
  The Quicksilver's appeal is simplicity: a flat 1.5% cash back on every
  purchase with no annual fee and no categories to track, plus 5% on hotels
  and rental cars booked through Capital One Travel. New cardholders can earn
  a $200 bonus after spending $500 in the first 3 months, one of the easier
  thresholds around, and a 15-month 0% intro APR on purchases and balance
  transfers adds flexibility for a large purchase or payoff plan. No foreign
  transaction fees makes it a reasonable card to take abroad. The honest catch
  is that 1.5% is a modest flat rate, so if you want maximum return on
  everyday spending, a 2% flat card or a category card will outearn it. Treat
  the Capital One Travel price drop and price match protections as minor
  extras.
