our_take: >
  The Quicksilver is about as simple as cash back gets: an unlimited 1.5% on
  every purchase with no annual fee, plus 5% on hotels and rental cars booked
  through Capital One Travel. New cardholders can earn a $200 bonus after $500
  in spending within 3 months, a low bar, and a 15-month 0% intro APR on
  purchases and balance transfers adds real value for a big purchase or a debt
  payoff. That combination earns it the #5 spot on our Best Cash Back Credit
  Cards list. The catch is that 1.5% is a modest flat rate, so if you want the
  most from everyday spending, a card with stronger categories or a higher
  flat rate will beat it. Price Drop Protection and the Price Match Guarantee
  on Capital One Travel bookings are minor extras, and no foreign transaction
  fee makes it an easy card to take abroad.
