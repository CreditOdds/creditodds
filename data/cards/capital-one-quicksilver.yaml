our_take: >
  The Quicksilver's appeal is simplicity: a flat 1.5% cash back on every
  purchase, 5% on hotels and rental cars booked through Capital One Travel,
  and no annual fee or foreign transaction fee. New cardholders can earn a
  $200 bonus after spending just $500 in the first 3 months, one of the easier
  thresholds around, and 15 months of 0% intro APR on purchases and balance
  transfers adds real flexibility. That combination earns it the #8 spot on
  our Best Cash Back Credit Cards list. The tradeoff is that 1.5% is a modest
  flat rate, so if your spending clusters in dining or groceries a category
  card will likely earn more. Think of it as a dependable, low-maintenance
  everyday card rather than a maximizer's tool.
