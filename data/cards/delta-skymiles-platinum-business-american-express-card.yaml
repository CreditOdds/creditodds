our_take: >
  The Delta Platinum Business is currently pushing a 100,000-mile welcome
  offer after $8,000 in spending within six months, up from 70,000 in late
  August and set to end 2026-11-04. Beyond that, the yearly Companion
  Certificate is the reason to keep it: a round-trip Main Cabin companion fare
  within the 48 contiguous states and to the Caribbean or Central America,
  with $22 to $250 in taxes and fees. Status seekers get a $2,500 MQD
  Headstart each year and $1 MQD per $20 spent, and the up to $200 Delta Stays
  credit, $10 monthly Resy credit, and $10 monthly rideshare credit can chip
  away at the $350 annual fee if they fit your habits. Earning is 3x on Delta
  and direct hotel purchases, 1.5x on transit, U.S. shipping, and single
  purchases of $5,000 or more (up to $100,000 a year combined), and 1x on
  everything else. That makes it a better perk card than a spending card. It
  is a good fit for a business owner who flies Delta often enough to use the
  companion fare and free checked bags every year.
