our_take: >
  Amex raised this card's welcome offer to 100,000 miles after $8,000 of spend
  in six months in late August, up from 70,000, and that offer runs through
  November 4, 2026, which makes the timing unusually favorable. Against the
  $350 annual fee you get an annual companion certificate after renewal good
  for a round-trip Main Cabin fare in the 48 states or to the Caribbean or
  Central America, up to $200 back on Delta Stays bookings, and up to $10 a
  month each in Resy and rideshare credits. Business spending earns 3x on
  Delta and direct hotel bookings and 1.5x on transit, U.S. shipping, and
  single purchases of $5,000 or more, though those share a combined $100,000
  annual cap before dropping to 1x. Free checked bags for the cardmember and
  up to eight companions, Zone 5 boarding, a $2,500 MQD headstart, and cell
  phone protection up to $800 per claim round it out. The catch is that the
  base rate is 1x and most of the credit value requires enrollment and
  specific booking channels, so this pays off for a Delta-committed business
  and poorly for anyone else.
