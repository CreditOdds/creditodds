our_take: >
  GO REWARDS earns 3 points per dollar on dining and 2 on gas with no annual
  fee, which makes it a sensible everyday card for a Navy Federal member who
  spends most at restaurants and the pump. A 0.99% intro APR on purchases for
  six months offers a short cushion on new spending, and Navy Federal charges
  no balance transfer fees. The catch is that there is no signup bonus, and
  everything outside dining and gas earns just 1 point per dollar, so it does
  little for groceries or general spending. The regular APR range of 13.49% to
  18% is low for a rewards card, which is a genuine advantage if you sometimes
  carry a balance. No foreign transaction fees and rental car collision
  coverage are useful extras, but this is a modest card best paired with
  something that earns more on everyday purchases.
