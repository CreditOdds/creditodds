our_take: >
  The GO REWARDS is a no-annual-fee everyday card that earns 3 points per
  dollar on dining, 2 on gas, and 1 on everything else. That makes it a
  reasonable fit for Navy Federal members who spend heavily at restaurants and
  the pump and want a card with no fee and no foreign transaction fees. The
  0.99% intro APR on purchases for 6 months is a modest cushion rather than a
  true 0% runway, and Navy Federal's lack of balance transfer fees is a
  genuine plus if you're moving debt. The tradeoff is that there's no signup
  bonus listed and the 1x base rate is weak, so outside of dining and gas this
  card falls behind flat-rate options. Treat it as a solid dining and gas
  companion card rather than your only card.
