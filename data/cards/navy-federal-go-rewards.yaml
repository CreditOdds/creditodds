our_take: >
  The GO REWARDS earns 3 points per dollar on dining and 2 points on gas with
  no annual fee, which makes it a reasonable everyday card for Navy Federal
  members who eat out and drive often. A 0.99% intro APR on purchases for 6
  months softens the cost of a near-term purchase, and Navy Federal charges no
  balance transfer fees. The catch is that everything outside dining and gas
  earns just 1 point per dollar, and there is no signup bonus to give you a
  head start. No foreign transaction fees and rental car collision damage
  coverage are useful extras. It works best as a dining and gas specialist
  paired with a stronger flat-rate card for everything else.
