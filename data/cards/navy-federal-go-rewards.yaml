our_take: >
  GO REWARDS pays 3 points per dollar on dining and 2 on gas with no annual
  fee, covering two categories most people spend in every week without asking
  for anything back. It also carries the lowest starting rate of the Navy
  Federal cards here at 13.49% to 18%, plus a 0.99% intro APR on purchases for
  the first six months, so a planned purchase can be spread out cheaply. The
  limits are worth naming: everything outside dining and gas earns 1 point per
  dollar, and there is no signup bonus at all, so there is no quick value to
  capture up front. Benefits are thin beyond rental car collision damage
  coverage and the absence of balance transfer fees. It is a sensible low-rate
  everyday card for a Navy Federal member who eats out often, not one that
  will outearn a dedicated dining card.
