our_take: >
  The GO REWARDS earns 3 points per dollar on dining and 2 on gas with no
  annual fee, which is a decent everyday setup for someone who eats out and
  drives a lot. New cardholders also get a 0.99% intro APR on purchases for
  six months, a short but useful cushion for a planned purchase. The weak spot
  is everything else, which earns just 1 point per dollar, and there's no
  signup bonus listed to give you a head start. No foreign transaction fees,
  no balance transfer fees, and rental car collision damage waiver coverage
  are welcome extras. It's a fine starter or companion card for Navy Federal
  members, but anyone with big grocery or general spending will want a second
  card to cover those gaps.
