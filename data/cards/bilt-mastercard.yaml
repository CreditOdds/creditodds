our_take: >
  The original Bilt Mastercard issued by Wells Fargo is no longer accepting
  applications, so there is no way to open one today. If you were drawn to it
  for rewards on rent, the Bilt Blue is Bilt's current no-annual-fee card,
  still earning up to 1.25x on rent along with 3x on Bilt Travel hotels and 3x
  on Lyft. Wells Fargo moved many existing Bilt holders into the Autograph,
  which has no annual fee and earns 3x on dining, travel, gas, transit,
  streaming, and phone plans, a better fit if your spending is broad rather
  than rent-heavy. For a step up, the $95 Bilt Obsidian keeps the rent earning
  and lets you pick 3x on dining or groceries, with added travel rates. Treat
  this page as a pointer to those cards rather than a product you can apply
  for.