our_take: >
  The original Bilt Mastercard is closed: Wells Fargo no longer accepts
  applications for it, so this page is now a record rather than a
  recommendation. If you came here for the rent earning, Bilt Blue is the
  current no-fee replacement, keeping up to 1.25x on rent along with 3x on
  Bilt Travel hotels and 3x on Lyft. Existing holders were largely moved into
  the Wells Fargo Autograph, which earns 3x on dining, travel, gas, transit,
  streaming, and phone bills with no annual fee. If you want more than the
  no-fee version offers, Bilt Obsidian is the $95 step up, adding a choice of
  3x dining or groceries and elevated travel rates on top of the same rent
  earning. There is nothing to do here but pick the successor that matches
  your spending.