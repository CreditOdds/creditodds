our_take: >
  The original Bilt Mastercard from Wells Fargo is no longer open to new
  applicants, so there is no reason to plan around it today. Its role as the
  no-fee card for earning points on rent has passed to the Bilt Blue, which
  still earns up to 1.25x on rent plus 3x on Bilt Travel hotels and 3x on
  Lyft. If you want more from your everyday spending, the $95 Bilt Obsidian
  keeps the rent earning and adds a 3x dining or groceries category with
  travel rates on top. Wells Fargo moved many existing holders into the
  Autograph, a no-fee card with 3x on dining, travel, gas, transit, streaming,
  and phone plans, which is the better fit if rent rewards were never the main
  draw.