our_take: >
  The original Wells Fargo issued Bilt Mastercard is no longer accepting
  applications, so this page is mainly useful as a pointer to where to go
  next. If what you liked was earning points on rent with no annual fee, the
  Bilt Blue is the direct successor: rent still earns up to 1.25x, plus 3x on
  hotels booked through Bilt Travel and 3x on Lyft. If you would rather have
  broad everyday earning, the Wells Fargo Autograph, the card Wells Fargo
  moved many Bilt holders into, pays 3x on dining, travel, gas, transit,
  streaming, and phone with no annual fee. And if you spend heavily on dining
  or groceries, the $95 Bilt Obsidian lets you pick one of those as a 3x
  category while keeping the rent earning and adding travel rates. Pick the
  replacement that matches how you actually spend rather than defaulting to
  the closest name.