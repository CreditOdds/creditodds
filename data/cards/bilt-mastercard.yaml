our_take: >
  The original Bilt Mastercard, issued by Wells Fargo, is no longer accepting
  applications, so there is no way to open one today. Its legacy was making
  rent a rewards category with no annual fee, and that idea lives on in Bilt's
  newer lineup. If you want the closest replacement, the no-fee Bilt Blue
  still earns up to 1.25x on rent along with 3x on Bilt Travel hotels and
  Lyft. Wells Fargo moved many existing holders into the Autograph, which
  earns 3x on dining, travel, gas, transit, streaming, and phone with no
  annual fee. And if you are willing to pay $95, the Bilt Obsidian keeps the
  rent earning and adds a choice of 3x dining or groceries plus stronger
  travel rates.