our_take: >
  The cashRewards gives Navy Federal members 1.5% cash back on everything with
  no annual fee and no foreign transaction fee. Getting approved for a limit
  of $5,000 or more is the best outcome, because Navy Federal then issues the
  card as cashRewards Plus, which earns 2%. There is a $250 bonus after $2,500
  in spending within 3 months. The 1.99% intro APR on balance transfers for 12
  months, with no balance transfer fee, makes it a cheap way to move existing
  debt. The downside is that 1.5% is only an average flat rate, with no bonus
  categories and few ongoing perks beyond rental car collision damage waiver
  coverage. It's a dependable default card, but if your limit comes in under
  $5,000, you'll be earning less than the best flat-rate cards pay.
apply_link: https://www.navyfederal.org/loans-cards/credit-cards/cash-rewards.html
