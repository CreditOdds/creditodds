our_take: >
  The cashRewards is a simple no-annual-fee card earning a flat 1.5% cash back
  on everything, with no foreign transaction fees and a $250 bonus after
  $2,500 in spending in the first 3 months. Its more distinctive strength is
  borrowing cost: a 1.99% intro APR on balance transfers for 12 months with no
  balance transfer fees, plus a regular APR range of 14.15% to 18% that is
  lower than typical. The catch is that 1.5% is merely average for a flat-rate
  card, though if you are approved for a limit of $5,000 or more you are
  issued the cashRewards Plus at 2% instead. Rental car collision damage
  waiver coverage is the main ongoing perk. It is a sensible choice for
  consolidating debt cheaply, but not one to pick for maximizing rewards.
apply_link: https://www.navyfederal.org/loans-cards/credit-cards/cash-rewards.html
