our_take: >
  The Ink Business Preferred earns 3x points on a genuinely business-shaped
  set of categories: travel, shipping, internet, cable and phone service, and
  advertising on search engines and social media, on up to $150,000 combined
  each year. For a $95 annual fee that is a lot of runway, and the 100,000
  point signup bonus after $8,000 in three months ranks #4 on our Best Signup
  Bonuses list. No foreign transaction fees and primary rental coverage on
  business rentals make it reasonable to travel with, and cell phone
  protection pays up to $1,000 per claim when you put the monthly bill on the
  card. The tradeoff is that everything outside those categories earns a flat
  1x, so a business with mostly general spending will do better on a flat-rate
  card. There is no intro APR offer here either, so treat it as a rewards card
  rather than a financing one.
