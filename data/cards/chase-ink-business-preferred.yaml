our_take: >
  The Ink Business Preferred earns 3 points per dollar on travel, shipping,
  internet, cable, and phone services, and advertising on search engines and
  social media, which lines up neatly with how many small businesses actually
  spend. The 100,000 point signup bonus after $8,000 in spending in the first
  3 months is the main draw and lands it on our list of top signup bonuses,
  though that spending bar is steep for a smaller operation. The $95 annual
  fee is easy to justify if your bills land in the bonus categories, but the
  3x rate is capped at $150,000 in combined purchases per year and everything
  else earns just 1 point per dollar. Cell phone protection of up to $1,000
  per claim when you pay your phone bill with the card and primary rental car
  coverage for business rentals are genuinely useful extras, and there is no
  foreign transaction fee.
benefits:
  - name: "Cell Phone Protection"
