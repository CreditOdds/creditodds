our_take: >
  The Ink Business Preferred's headline is its signup bonus: 100,000 points
  after $8,000 in spending within three months, good for #4 on our Best Credit
  Card Signup Bonuses list. Ongoing, it earns 3 points per dollar on travel,
  shipping, internet, cable, and phone services, and search and social media
  advertising, on up to $150,000 in combined spending a year, which covers a
  lot of ground for an ad-heavy or e-commerce business. The $95 annual fee is
  modest, and there is no foreign transaction fee. The catch is that
  everything outside those categories earns just 1 point per dollar, so it
  works best alongside a flat-rate card for general spending. Cell phone
  protection when you pay your phone bill with the card and primary rental car
  coverage for business rentals are useful ongoing perks.
