our_take: >
  The Ink Business Preferred earns 3 points per dollar on travel, shipping,
  internet, cable, and phone services, and search engine and social media
  advertising, on up to $150,000 in combined spend per year, a cap generous
  enough to cover most small businesses. The signup bonus is 100,000 points
  after $8,000 in spend over three months. For a $95 annual fee you also get
  practical protections: cell phone coverage up to $1,000 per claim when you
  pay your phone bill with the card, and primary rental car coverage when
  renting for business. The catch is that everything outside those categories
  earns just 1 point per dollar, so it pays off only if a meaningful share of
  your spend falls into the 3x buckets. There's no foreign transaction fee,
  and the DashPass membership and 5x on Lyft rides through September 2027 are
  minor extras.
benefits:
