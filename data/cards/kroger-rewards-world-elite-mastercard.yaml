rewards:
  # The 5% is on mobile wallet spend generally, not just Kroger Pay inside a
  # store, which is what made this card worth holding for anyone who tapped to
  # pay everywhere. Kroger Pay counts toward the same $3,000 calendar-year cap.
  - category: mobile_wallet
    value: 5
    unit: percent
    note: "Mobile wallet and Kroger Pay purchases; $3,000 calendar-year cap, then 1%"
    spend_cap: 3000
    cap_period: annual
    rate_after_cap: 1
  # Kroger Family of Companies stores only, so this must not match generic
  # grocery-store queries: the card paid 1% at a supermarket it did not own.
  - category: groceries
    value: 2
    unit: percent
    merchant_specific: true
    note: "Purchases inside Kroger Family of Companies stores only (Kroger, Harris Teeter, Ralphs, Fred Meyer, King Soopers, QFC, Smith's, Fry's, Dillons, Pick 'n Save, Mariano's and the other banners); excludes fuel centers"
  - category: everything_else
    value: 1
    unit: percent
benefits:
  - name: "Kroger fuel discount"
    value: 0
    description: "An extra 5 cents per gallon off at Kroger Family of Companies Fuel Centers on top of earned fuel points, rising to 25 cents per gallon after $6,000 in calendar-year spend when redeeming at least 100 fuel points."
    category: "shopping"
  - name: "Boost Essential membership"
    value: 0
    description: "Complimentary Kroger Boost Essential membership, which includes free grocery delivery on qualifying orders and doubled fuel points."
    category: "shopping"
our_take: >
  This card is no longer accepting applications, so it is worth understanding
  only if you already hold one. Its best rate was 5% back on mobile wallet and
  Kroger Pay purchases, which earned that rate only when you actually paid
  through a mobile wallet and was capped at $3,000 of calendar-year spend
  before dropping to 1%. Purchases made inside Kroger Family of Companies
  stores, including Harris Teeter, Ralphs, Fred Meyer, and the other banners,
  earned 2%, fuel centers excluded, and everything else earned a flat 1%,
  which is the card's true base rate. The fuel discount and complimentary
  Boost Essential membership are still useful if you shop these stores weekly,
  but there is no annual fee to justify keeping it open beyond that. If you
  are shopping for a replacement, the Blue Cash Preferred pays 6% at U.S.
  supermarkets on the first $6,000 a year, or the U.S. Bank Cash+ keeps the
  rewards with the same issuer through two 5% categories you choose each
  quarter with no annual fee.
