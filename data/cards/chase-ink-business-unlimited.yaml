our_take: >
  The Ink Business Unlimited is the simplest card in Chase's business lineup:
  a flat 1.5% back on every purchase, no categories, no caps, and no annual
  fee. Chase raised the signup bonus from $750 to $1,000 in June, earned after
  $8,000 of spend in four months, which is a strong return on a card that
  costs nothing to keep. Twelve months of 0% intro APR on purchases gives a
  new business room to finance equipment before the regular 16.74% to 24.74%
  rate applies. The limit is what you would expect from a flat-rate card:
  nothing earns above 1.5%, so heavy office supply, phone, or advertising
  spend does better on the Ink Business Cash or Ink Business Preferred. It
  also charges foreign transaction fees, which rules it out for purchases
  abroad.
