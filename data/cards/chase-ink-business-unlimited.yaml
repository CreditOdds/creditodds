our_take: >
  The Ink Business Unlimited keeps things simple: a flat 1.5% back on every
  purchase with no annual fee and no categories to track. That makes it an
  easy default card for business spending that does not fit a bonus category,
  and the 12 months of 0% intro APR on purchases helps if you need to finance
  equipment or startup costs. Chase recently cut the signup bonus from $1,000
  to $750, which now requires $6,000 in spending in the first 3 months, so the
  welcome offer is less compelling than it was. The bigger catch is that 1.5%
  is just an average rate, and the card charges a foreign transaction fee, so
  it is a weak choice for overseas purchases. It works best as a simple
  companion to a card with stronger bonus categories.
