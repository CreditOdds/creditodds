our_take: >
  The Ink Business Unlimited is the simplest card in Chase's business lineup:
  a flat 1.5% back on every purchase, no categories, no caps, and no annual
  fee. The signup bonus is $750 after $6,000 of spend in the first three
  months, a solid return on a card that costs nothing to keep. Twelve months
  of 0% intro APR on purchases gives a new business room to finance equipment
  before the regular 16.74% to 24.74% rate applies. The limit is what you
  would expect from a flat-rate card: nothing earns above 1.5%, so heavy
  office supply, phone, or advertising spend does better on the Ink Business
  Cash or Ink Business Preferred. It also charges foreign transaction fees,
  which rules it out for purchases abroad.
