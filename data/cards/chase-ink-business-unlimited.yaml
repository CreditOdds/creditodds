our_take: >
  The Ink Business Unlimited keeps things simple: 1.5% cash back on every
  purchase with no annual fee and no categories to track, which suits
  businesses whose spending doesn't cluster in any particular area. Chase
  recently trimmed the signup bonus from $1,000 to $750, still earned after
  $6,000 in spend over three months. Twelve months of 0% intro APR on
  purchases gives you room to finance equipment or startup costs without
  interest. The tradeoff is that a flat 1.5% is a modest rate, and the card
  charges a foreign transaction fee, so it's a poor choice for international
  spending. Treat the 5% on Lyft rides through September 2027 and the
  three-month Instacart+ membership as minor extras.
