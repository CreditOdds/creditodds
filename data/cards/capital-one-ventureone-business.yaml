our_take: >
  The VentureOne Business gives a small business a no-annual-fee way to earn
  travel miles, with 1.5 miles per dollar on everything and 5 miles on hotels,
  vacation rentals, and rental cars booked through Capital One Business
  Travel. Miles can transfer to more than 15 airline and hotel programs or be
  redeemed as a statement credit for travel, so they are more flexible than a
  basic cash back card. The welcome offer of 50,000 miles after $4,500 in
  spend within 3 months is reasonable for a fee-free card. The catch is the
  1.5x base rate trails the 2x you would get on the Venture Business, so a
  business with heavy spending may come out ahead paying a fee. Free employee
  cards, no foreign transaction fees, Hertz Five Star status, and secondary
  rental car coverage are handy but modest extras.
