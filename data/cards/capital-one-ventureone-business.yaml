our_take: >
  The VentureOne Business is a no-annual-fee way for a small business to earn
  transferable miles, with 1.5 miles per dollar on everything and 5 miles on
  hotels, vacation rentals, and rental cars booked through Capital One
  Business Travel. Miles can move to more than 15 airline and hotel programs,
  which gives them more upside than plain cash back, and there are no foreign
  transaction fees. The welcome offer is 50,000 miles after $4,500 in spend
  within 3 months, a reasonable target for most businesses. The tradeoff is
  the base rate: 1.5x trails the 2x on the Venture Business, so a business
  spending heavily should run the numbers on whether the $95 upgrade pays for
  itself. Free employee cards, Hertz Five Star status, secondary rental car
  coverage, and extended warranty are useful extras rather than reasons to
  apply.
