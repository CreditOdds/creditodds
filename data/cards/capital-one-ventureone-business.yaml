our_take: >
  VentureOne Business earns 1.5x miles on every purchase with no annual fee,
  plus 5x on hotels, vacation rentals, and rental cars booked through Capital
  One Business Travel, and those miles transfer to more than 15 airline and
  hotel programs. That transfer access on a card that costs nothing to keep is
  the real argument for it, since most free business cards leave you with cash
  back only. The signup bonus is 50,000 miles after $4,500 of spend in the
  first 3 months, a reachable target for a small operation. The tradeoff is
  the earn rate: 1.5x sits half a point behind the $95 Venture Business, so
  once your spending is steady the fee card usually wins on math. Free
  employee cards, secondary rental car coverage, and Hertz Five Star status
  fill out a card that is easy to keep in the drawer for years.
