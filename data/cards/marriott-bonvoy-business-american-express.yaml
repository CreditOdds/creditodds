our_take: >
  The Marriott Bonvoy Business card makes the most sense for a business owner
  who stays with Marriott and wants solid everyday earning: 6x at Marriott
  Bonvoy hotels, 4x at restaurants worldwide, U.S. gas stations, U.S. wireless
  phone services and U.S. shipping, and 2x on everything else. The $125 annual
  fee is largely offset by the Free Night Award after each renewal, valid at
  properties up to 35,000 points, and a second free night is possible after
  $60,000 in calendar-year spending. Complimentary Gold Elite status, 15 Elite
  Night Credits a year and a 7% discount on eligible standard-rate Marriott
  bookings add to the case. The catch is the welcome bonus: 125,000 points
  requires $9,000 in spending within 6 months, a steep bar for a smaller
  business. If you rarely stay at Marriott, the points and the free night lose
  most of their appeal.
