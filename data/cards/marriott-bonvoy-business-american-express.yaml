our_take: >
  For business owners who stay at Marriott, this card delivers the most for
  its $125 annual fee: an annual Free Night Award worth up to 35,000 points
  after renewal, Gold Elite status, and 15 Elite Night Credits. It earns 6x at
  Marriott Bonvoy hotels, 4x at restaurants worldwide, U.S. gas stations, U.S.
  wireless phone services and U.S. shipping, and 2x on everything else, with
  no spending caps on the 4x categories. You also get 7% off eligible
  standard-rate bookings made directly with Marriott. To earn the
  125,000-point welcome offer, you need $9,000 in spending within 6 months,
  which is a high bar for a small business. The tradeoff is that every point
  stays inside Marriott Bonvoy, and the second Free Night Award requires
  $60,000 in yearly spending, so most cardholders will get only one.
