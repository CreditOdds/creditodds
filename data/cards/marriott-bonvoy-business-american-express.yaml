our_take: >
  The Marriott Bonvoy Business card is one of the more useful hotel cards for
  small business owners, pairing 6x at Marriott Bonvoy hotels with 4x at
  restaurants worldwide, U.S. gas stations, U.S. wireless phone services, and
  U.S. shipping providers. The $125 annual fee is largely covered by a Free
  Night Award each year at renewal worth up to 35,000 points, and a second one
  is available after $60,000 in calendar-year spend. Gold Elite status, 15
  Elite Night Credits a year, and a 7% discount on eligible standard-rate
  Marriott bookings add ongoing value for frequent guests. The welcome offer
  of 125,000 points requires $9,000 in spend within 6 months, a meaningful bar
  for a smaller business. It earns 2x on everything else, so it is a solid fit
  if your business spends in its 4x categories and you stay with Marriott
  regularly.
