our_take: >
  The Credit One Bank Premier American Express, formerly just the Credit One
  American Express card, earns an unlimited 1% cash back on all purchases
  and rides the Amex network for Retail Protection and American Express
  Offers. The annual fee runs from $0 to $39 depending on creditworthiness,
  which immediately undercuts the modest rewards for anyone actually charged
  it: you need $3,900 in annual spend just to break even on a $39 fee. The
  29.74% APR is punishing, so this only makes sense paid in full. It is a
  serviceable stepping stone for average-credit applicants who want a
  rewards card and Amex perks, but Credit One's own no-fee Omni card and
  most major-issuer starter cards beat it whenever they are attainable.
