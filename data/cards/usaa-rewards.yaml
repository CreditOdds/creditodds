our_take: >
  The USAA Rewards card is a no-annual-fee points card that earns 2 points per
  dollar on dining and gas and 1 point on everything else. For a USAA member
  who wants a basic card with a little extra on two common categories, it's a
  straightforward fit, and no foreign transaction fee makes it usable abroad.
  The catch is that the earn rates are modest: there's no signup bonus listed,
  and 2x in just two categories is easy to beat with other no-fee cards. Its
  regular APR range starting at 13.4% is relatively low, which could matter if
  you sometimes carry a balance. Think of it as a simple, low-cost starter
  rewards card rather than one to build a strategy around.

