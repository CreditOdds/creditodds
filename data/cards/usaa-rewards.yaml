our_take: >
  USAA Rewards earns 2 points per dollar on dining and gas and 1 point per
  dollar on everything else, with no annual fee and no foreign transaction
  fee. That last detail is the quiet strength here: a free card you can use
  abroad without a surcharge is worth keeping in the drawer even if it is not
  your main earner. The rates themselves are modest, though, and 2x on two
  categories is a floor that plenty of no-fee cards match or beat, especially
  on dining. There is no signup bonus and no intro APR window, so nothing up
  front sweetens the decision. The regular APR spans 13.4% to 27.4%, and the
  low end of that range is better than most, but this is still a card to pay
  in full rather than finance on.

