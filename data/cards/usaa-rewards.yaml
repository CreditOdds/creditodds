our_take: >
  The USAA Rewards card earns 2 points per dollar on dining and gas and 1
  point per dollar on everything else, with no annual fee and no foreign
  transaction fee. That makes it a low-commitment option if most of your
  spending goes to eating out and filling up. The catch is that the earn rates
  are modest, and there is no signup bonus to give you a head start. Plenty of
  no-fee cards now pay more on these same categories, or a flat 2% on
  everything. It works as a simple, fee-free card, but it is hard to call it a
  standout earner.

