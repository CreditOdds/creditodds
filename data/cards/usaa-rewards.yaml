our_take: >
  The USAA Rewards card is a modest no-annual-fee option that earns 2 points
  per dollar on dining and gas and 1 point on everything else. That is a
  reasonable fit for members whose spending leans toward restaurants and
  fill-ups, and the lack of a foreign transaction fee makes it usable overseas
  too. The catch is that 2x in just two categories with a 1x base is thin
  compared with flat-rate cards that pay more on every purchase. There is also
  no signup bonus or intro APR to sweeten the start. It works as a simple
  starter rewards card, but most members can earn more elsewhere once their
  credit allows.

