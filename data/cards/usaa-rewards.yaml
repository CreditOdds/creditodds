our_take: >
  The USAA Rewards card offers 2 points per dollar on dining and gas with no
  annual fee, which covers two of the most common everyday spending
  categories. It also skips foreign transaction fees, so it travels well. The
  catch is that everything else earns just 1 point per dollar, and there is no
  signup bonus to give it an early boost. That makes it a modest earner
  compared with no fee cards that pay a higher flat rate on all purchases. It
  fits best as a dining and gas card paired with a stronger everyday earner,
  rather than as your only card.

