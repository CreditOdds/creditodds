our_take: >
  The Graphite Business Cash Unlimited is built for businesses with very large
  card spend: unlimited 2% cash back on eligible purchases plus 5% on flights
  and prepaid hotels booked through American Express Travel. The welcome offer
  matches that profile, paying $1,500 in cash back but only after $50,000 in
  spend within six months, which is out of reach for most small businesses.
  The $295 annual fee is the central tradeoff, since you need about $14,750 a
  year in non-travel spend just for the 2% earn to cover it, and plenty of
  no-fee cards also pay a flat 2%. The other notable perk, up to $2,400 in
  statement credits for American Express One AP monthly fees, only kicks in
  after $250,000 in eligible purchases in a calendar year. If your company
  charges six figures a year and books travel through Amex, the math can work;
  otherwise a no-fee 2% card is the simpler choice.
