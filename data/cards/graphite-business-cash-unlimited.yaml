our_take: >
  The Graphite Business Cash Unlimited is built for businesses with very large
  spend: a flat 2% cash back on eligible purchases plus a $1,500 bonus after
  $50,000 in spending within six months. Flights and prepaid hotels booked
  through American Express Travel earn 5%, and there's no foreign transaction
  fee. The catch is the $295 annual fee on a 2% card, because you need roughly
  $15,000 a year in spend at 2% just to earn back the fee. Its distinctive
  perk, up to $2,400 in statement credits for American Express One AP monthly
  fees, only unlocks after $250,000 in eligible purchases in a calendar year.
  That makes it a fit for companies with six-figure card volume that use or
  want One AP, and a hard sell for everyone else.
