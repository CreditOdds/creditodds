our_take: >
  The PayPal Cashback Mastercard earns 3% back whenever you pay through PayPal
  checkout, online or with an in-store QR code, and a flat 1.5% everywhere
  else, all with no annual fee. That makes it a sensible pick for someone who
  already uses PayPal for most online shopping and wants a simple card that
  never earns less than 1.5%. The 3% only applies when the purchase actually
  runs through PayPal, so how much you gain depends entirely on how many of
  your merchants accept it. There's no signup bonus, a foreign transaction fee
  applies, and the APR can reach 33.24%, so it's a poor choice for travel
  abroad or carrying a balance. For heavy PayPal users who pay in full, it's a
  solid everyday card.
