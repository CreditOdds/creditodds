our_take: >
  The PayPal Cashback Mastercard earns a solid 1.5% back on everything with no
  annual fee, and that rate climbs to 3% when you pay through PayPal checkout,
  whether online or with an in-store QR code. If you already route a lot of
  online shopping through PayPal, that 3% is a meaningful bump over a typical
  flat-rate card. The catch is that the higher rate depends entirely on PayPal
  being an option at checkout, so your real return is closer to 1.5% for most
  everyday purchases. There is no signup bonus, foreign transaction fees make
  it a poor choice abroad, and the regular APR can reach 33.24%, so it only
  makes sense if you pay in full. It works best as a simple cash back card for
  heavy PayPal users who want the rewards to stay inside that ecosystem.
