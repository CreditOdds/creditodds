our_take: >
  The PayPal Cashback Mastercard earns a flat 1.5% back anywhere with no
  annual fee, and that rate rises to 3% when you pay through PayPal checkout,
  either online or in store with a QR code. That makes it a strong fit for
  people who already use PayPal at checkout often, since the higher rate
  covers a wide range of merchants that accept it. The catch is that the 3%
  applies only to PayPal checkout purchases, so your real base rate is 1.5%,
  which trails the best flat-rate cards. There is no signup bonus or intro
  APR, the regular APR can reach 33.24%, and the card charges a foreign
  transaction fee, so leave it at home when traveling abroad. It earns its
  place for heavy PayPal users and is otherwise an ordinary flat-rate card.
