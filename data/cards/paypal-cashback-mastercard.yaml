our_take: >
  The PayPal Cashback Mastercard's main appeal is a solid 1.5% back on
  everything with no annual fee, which rises to 3% when you pay through PayPal
  checkout, either online or with an in-store QR code. If you already route a
  lot of purchases through PayPal, that 3% rate can add up, and the 1.5% floor
  means the card never earns less than a basic flat-rate card. The catch is
  that the 3% applies only to purchases paid via PayPal, not to online
  shopping in general, so its value depends entirely on how often your
  favorite merchants offer PayPal checkout. There's no signup bonus listed, a
  foreign transaction fee rules it out for travel abroad, and the APR runs as
  high as 33.24%, so carrying a balance would quickly erase the rewards.
