our_take: >
  The appeal here is a 1.5% floor on everything with no annual fee, stepping
  up to 3% when you check out through PayPal, either online or with the
  in-store QR code. That makes it a decent fit if PayPal is already how you
  pay for most of your online shopping, since the 3% applies only to PayPal
  checkout and reverts to 1.5% anywhere you use the card directly. The problem
  is the 1.5% base has been the market floor for years, so unless you are
  genuinely funneling spending through PayPal, this does not beat a flat 2%
  card. It also carries a foreign transaction fee, which rules it out for
  travel, and the regular APR runs from 18.49% all the way to 33.24%. Treat it
  as a PayPal-specific card, not a general-purpose one.
