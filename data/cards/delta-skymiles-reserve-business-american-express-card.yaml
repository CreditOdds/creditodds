our_take: >
  The Delta Reserve Business's headline right now is a 200,000-mile welcome
  offer after $20,000 in spending within six months, up from 80,000 in late
  August and ending 2026-11-04. That is a large bonus, but the spending
  requirement is high enough that only businesses with real monthly expenses
  should chase it. The ongoing case rests on lounge access (15 Delta Sky Club
  visits per Medallion Year, unlimited after $75,000 in annual purchases, plus
  Centurion Lounges when flying Delta on a ticket bought with the card) and a
  flexible annual Companion Certificate valid up to Delta First within the 48
  contiguous states and to the Caribbean or Central America. The $650 annual
  fee is steep, and earning is limited to 3x on Delta, 1.5x on transit, U.S.
  shipping, and U.S. office supply stores, and 1x on everything else until you
  pass $150,000 in a calendar year. Credits including up to $250 for Delta
  Stays, $240 at Resy, and $120 for rideshares help offset the cost if you use
  them. It makes the most sense for a business owner who flies Delta often,
  values status through the $2,500 MQD Headstart and $1 MQD per $10 spent, and
  will put serious spending on the card.
