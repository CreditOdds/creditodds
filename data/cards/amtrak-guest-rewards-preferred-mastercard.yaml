our_take: >
  The Preferred is the card for frequent Amtrak riders, earning 3 points per
  dollar on Amtrak travel and onboard purchases, plus 2 points on dining,
  other travel, and other transit and rideshare. The perks are what separate
  it from the no-fee version: each account anniversary brings a round-trip
  companion coupon, a one-class upgrade coupon, and a single-day station
  lounge pass, along with 20% back on onboard food and drinks and 1,000 Tier
  Qualifying Points toward Amtrak status for every $5,000 spent. The tradeoff
  is a $99 annual fee, which only makes sense if you will actually use the
  companion and upgrade coupons. The signup bonus was also recently trimmed
  from 30,000 to 25,000 points after $1,500 in spend over three billing
  cycles. If you ride Amtrak regularly, one companion trip a year can cover
  the fee; if not, the no-fee version or a general travel card is the better
  fit.
