our_take: >
  The Preferred version is built around its anniversary coupons: a round-trip
  companion coupon, a one-class upgrade coupon, and a single-day station
  lounge pass arrive at account opening and again each year, which is the
  clearest path past the $99 annual fee. Earning is broader too, at 3 points
  per dollar on Amtrak travel including onboard purchases and 2 points per
  dollar on dining, other travel, and transit and rideshare. FNBO cut the
  signup bonus from 30,000 points to 25,000 after $1,500 in the first three
  billing cycles in August, so the opening offer is smaller than it was. The
  tradeoff is that everything else still earns 1 point per dollar, and the
  coupons only pay off if you take the trips to use them, so an occasional
  rider will struggle to clear the fee. Regular Amtrak travelers get the
  better end of it: a 20% onboard food and beverage rebate, 5% of points back
  on Amtrak redemptions, and 1,000 Tier Qualifying Points for every $5,000
  spent toward elite status.
