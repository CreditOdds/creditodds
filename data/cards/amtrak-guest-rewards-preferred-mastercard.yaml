our_take: >
  The Amtrak Guest Rewards Preferred Mastercard is the only serious rail
  loyalty card in the US market, and for regular Amtrak riders it delivers.
  Amtrak points are consistently worth well over 2 cents each toward train
  travel, so 3x on Amtrak purchases is a genuinely strong earn rate, and the
  annual companion coupon, one-class upgrade, and station lounge pass can
  each cover the $99 fee by themselves on the right trip. The welcome offer
  of up to 30,000 points is worth several one-way rides on most corridors.
  Away from the rails the card is ordinary, with 2x on dining, travel, and
  transit and 1x elsewhere. If you ride Amtrak more than a couple of times a
  year, especially in the Northeast, this card earns a place in the wallet;
  occasional riders should consider the no-fee version instead.
