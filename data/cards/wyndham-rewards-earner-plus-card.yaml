our_take: >
  The Wyndham Rewards Earner Plus pairs a 100,000-point welcome offer with a
  15,000-point anniversary bonus each year, which on its own is described as
  enough for up to two free award nights. The signup bonus is split into
  45,000 points after $1,000 in 90 days and 55,000 after $500 at Hotels by
  Wyndham within 180 days, so plan on a Wyndham stay to earn it all. Everyday
  earning is solid at 4 points per dollar on dining, groceries, and travel,
  plus 6x at Hotels by Wyndham, with Diamond status in the first year and
  Platinum after. The catch is that the annual fee recently rose from $75 to
  $95, and the anniversary points only beat that fee if you actually redeem
  them for stays. It also carries a 15-month 0% intro APR on balance transfers
  and no foreign transaction fee. It is a good middle-tier choice for regular
  Wyndham guests who will use the yearly points.
