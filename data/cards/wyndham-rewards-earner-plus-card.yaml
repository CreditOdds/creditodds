our_take: >
  The Wyndham Rewards Earner Plus is the sweet spot of the lineup for regular
  Wyndham guests: for a $95 annual fee you get 15,000 bonus points each
  anniversary year, and 4 points per dollar on dining, groceries, and travel
  plus 6x at Hotels by Wyndham. The 100,000-point signup bonus requires only
  $1,500 in total spend, though 55,000 of those points depend on spending $500
  at Hotels by Wyndham within 180 days. Staying five or more nights in a
  calendar year also unlocks a free night worth up to 15,000 points, and you
  get Diamond status in your first year before it drops to Platinum. The catch
  is that the value is entirely tied to Wyndham redemptions and everything
  outside the bonus categories earns just 1x. If you stay at the chain a few
  times a year, the anniversary points alone can justify the fee.
