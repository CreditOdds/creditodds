our_take: >
  Summit justifies its $395 annual fee through the 25,000-point Global
  Companion Award that arrives every card anniversary with no spending
  requirement attached, backed by eight Alaska Lounge passes a year and a $120
  Global Entry or TSA PreCheck credit. The earn structure is unusually broad
  for an airline card: 3 points per dollar on Alaska and Hawaiian purchases,
  on dining, and on foreign transactions, with no foreign transaction fee
  charged, though everything else sits at 1 point per dollar. Bank of America
  cut the signup bonus from 100,000 points to 80,000 after $4,000 in the first
  90 days, so the opening offer is noticeably smaller than it was earlier this
  year. The elite-status machinery is the real hook for frequent flyers:
  10,000 status points each anniversary, 1 status point per $2 spent, and a
  100,000-point Global Companion Award once you clear $60,000 in a year. It
  sits at #12 on our Best Travel Credit Cards list, and the honest read is
  that the fee only pencils out if you redeem those companion awards and
  actually use the lounge passes.
