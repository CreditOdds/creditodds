our_take: >
  The Atmos Rewards Summit is a premium play for Alaska and Hawaiian Airlines
  loyalists, and its standout feature is a 25,000-point Global Companion Award
  every card anniversary year, plus a 100,000-point award if you spend $60,000
  or more in a year. Day to day it earns 3 points per dollar on Alaska and
  Hawaiian purchases, dining, and foreign transactions, and adds 8 Alaska
  Lounge passes a year, a free first checked bag for you and up to 6 guests,
  and up to $120 toward Global Entry or TSA PreCheck. The welcome offer has
  slid twice in recent months, from 100,000 to 80,000 and now to 70,000 points
  after $3,000 in spend within three months, so it is less compelling than it
  was over the summer. The real catch is the $395 annual fee paired with a 1
  point per dollar base rate, which means the card only pays off if you fly
  these two airlines often enough to use the companion award and lounge
  passes. It ranks on our Best Travel Credit Cards list, but it is a loyalty
  card first and a general travel card second.
