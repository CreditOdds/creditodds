our_take: >
  The Atmos Rewards Summit earns its $395 annual fee through companion awards:
  a 25,000-point Global Companion Award every card anniversary, and a
  100,000-point version if you spend $60,000 or more in a card anniversary
  year. Earning is solid for an airline card at 3 points per dollar on dining
  and foreign transactions, plus 3 points on Alaska and Hawaiian Airlines
  purchases, and the perks stack up for loyal flyers with a free first checked
  bag and preferred boarding for you and up to six guests, 8 Alaska Lounge
  passes per year, a Global Entry or TSA PreCheck credit, and 10,000 annual
  status points. The welcome offer was recently trimmed from 80,000 to 70,000
  points after $3,000 in spending in three months, though it still includes a
  25,000-point Global Companion Award. The tradeoff is that everything outside
  those categories earns just 1 point per dollar, and most of the value
  depends on flying Alaska or Hawaiian regularly. It ranks #10 on our Best
  Travel Credit Cards list, and it makes the most sense for frequent flyers of
  those airlines who will actually redeem the annual companion award.
