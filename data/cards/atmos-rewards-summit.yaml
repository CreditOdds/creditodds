our_take: >
  The Atmos Rewards Summit is built for frequent Alaska and Hawaiian flyers,
  and its headline perk is a 25,000-point Global Companion Award every card
  anniversary, with a 100,000-point award available after $60,000 in annual
  spend. Day to day it earns 3 points per dollar on Alaska and Hawaiian
  purchases, dining, and foreign transactions, and it adds 8 Alaska Lounge
  passes a year, a free first checked bag and preferred boarding for you and
  up to 6 guests, and 10,000 annual status points. The welcome offer has been
  cut twice in recent months, from 100,000 to 80,000 and now to 70,000 points
  after $3,000 in spend, though it still includes a 25,000-point companion
  award. The $395 annual fee is the real hurdle: the lounge passes, bag
  savings, and companion award only cover it if you fly these airlines
  regularly. Everything outside the bonus categories earns 1 point per dollar,
  so this is a loyalty card, not an everyday earner, and it ranks #12 on our
  Best Travel Credit Cards list for that narrower audience.
