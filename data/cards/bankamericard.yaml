our_take: >
  The BankAmericard is a straightforward intro APR card: 21 months of 0% on
  both purchases and balance transfers, with no annual fee. That long runway
  is why it ranks #2 with the Best Value badge on our Best 0% APR Credit Cards
  list, and it makes a strong pick for paying down existing debt or spreading
  out a large purchase. Its regular APR range of 14.99% to 25.99% is also
  lower at the bottom end than many cards, which helps if a balance lingers
  after the intro period. The tradeoff is that it earns no rewards at all, and
  it charges foreign transaction fees, so there is little reason to use it
  once the 0% window closes. Open it for the payoff plan, stick to the
  schedule, and plan to move everyday spending to a rewards card.

