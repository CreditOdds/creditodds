our_take: >
  The BankAmericard is a pure financing card: 21 months of 0% intro APR on
  both purchases and balance transfers, with no annual fee. That long runway
  makes it a strong choice if you are paying down existing debt or spreading
  out a large purchase. Once the intro period ends, the regular APR of 14.99%
  to 25.99% starts lower than many cards, which softens the landing if a
  balance lingers. The tradeoff is that there are no rewards at all, and it
  charges foreign transaction fees, so there is little reason to use it once
  your payoff plan is done. Open it for the 0% window and keep your focus on
  clearing the balance before month 21.

