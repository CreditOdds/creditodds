our_take: >
  Twenty-one months of 0% intro APR on both purchases and balance transfers,
  with no annual fee, is about as long a runway as this market offers, and it
  is why the card sits at #2 with a Best Value badge on our Best 0% APR list.
  If your goal is paying down existing debt or spreading a large purchase
  across nearly two years, that window does the job and the go-to rate
  afterward, 14.99% to 25.99%, starts lower than most competitors. Be clear
  about what you are getting, though: this card earns no rewards of any kind,
  so there is no cash back or points to keep it useful once the intro period
  closes. It also charges foreign transaction fees, so it is not a card for
  travel. Open it with a payoff date in mind, execute the plan, and expect to
  park it afterward.

