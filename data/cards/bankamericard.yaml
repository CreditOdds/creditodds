our_take: >
  The BankAmericard is a pure 0% APR card, offering 21 months of 0% intro APR
  on both purchases and balance transfers with no annual fee, which earns it
  the #2 spot on our Best 0% APR Credit Cards list as the best value. That
  long runway makes it a strong choice if your goal is to pay down existing
  debt or spread out a big purchase interest-free for nearly two years. The
  regular APR of 14.99% to 25.99% is also lower at the bottom of its range
  than many cards once the intro period ends. The tradeoff is that the card
  earns no rewards at all, and it charges foreign transaction fees, so it has
  little reason to stay in your wallet after the intro window closes. Open it
  for the 0% period, stick to a payoff plan, and use a rewards card for
  everyday spending.

