our_take: >
  The IHG One Rewards Premier Business earns its $99 annual fee mainly through
  the anniversary free night at properties costing up to 40,000 points, plus
  automatic Platinum Elite status and a fourth reward night free on points
  stays. Business spending earns well, with 10 points per dollar at IHG
  hotels, 5 per dollar on travel, gas, dining, and office supply stores, and 3
  per dollar on everything else. The signup bonus is 140,000 points after
  $4,000 in spending in the first three months, enough to rank #7 on our Best
  Credit Card Signup Bonuses list, though it recently came back down from a
  brief 200,000 offer. The catch is that IHG points carry a lower per-point
  value than many currencies, so the value really depends on business owners
  who actually stay at IHG properties. A $120 Global Entry, TSA PreCheck, or
  NEXUS credit and a 10,000 point bonus plus $100 credit after $20,000 in
  annual spending round out the package.
