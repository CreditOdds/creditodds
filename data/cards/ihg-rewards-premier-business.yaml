our_take: >
  For a $99 business card, the IHG One Rewards Premier Business leads with an
  anniversary free night at properties costing up to 40,000 points and
  automatic Platinum Elite status, which is usually enough to cover the fee on
  a single stay. The signup bonus is 140,000 points after $4,000 in three
  months, currently #7 on our Best Credit Card Signup Bonuses list, though it
  briefly hit 200,000 in June before falling back in July. Business spend
  outside hotels is well covered: 5x on travel, gas, restaurants, office
  supply stores, and select advertising, plus 3x on everything else, which is
  a strong floor at this price. Be clear that the 10x rate is tied to IHG
  properties, where it stacks up to 26x with loyalty earning, so the headline
  number applies to hotel stays and nothing else. Rounding it out are a $120
  Global Entry or TSA PreCheck credit every four years, 10,000 points and a
  $100 statement credit at $20,000 of annual purchases, and no foreign
  transaction fees.
