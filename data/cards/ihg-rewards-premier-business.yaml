our_take: >
  The IHG One Rewards Premier Business currently tops our Best Credit Card
  Signup Bonuses list with 190,000 points after $5,000 in spending over three
  months, plus automatic Platinum Elite status and an anniversary free night
  at properties costing up to 50,000 points. Chase recently raised the annual
  fee from $99 to $200 at the same time it lifted the bonus from 140,000, so
  the card now asks more of you each year. Earning covers a business's common
  spend well: 10x at IHG hotels, 5x on dining, gas, flights booked directly,
  and car rentals, and 3x on everything else, with office supply stores and
  other travel stepping down from 5x to 3x after December 31, 2026. Heavy
  spenders can unlock a second free night at $60,000 a year and Diamond Elite
  at $50,000 starting in 2027. The $100 Expensify credit, $100 airline credit,
  and $100 in quarterly IHG food and beverage vouchers can offset much of the
  fee, but only if they match how you already spend.
