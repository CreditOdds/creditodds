our_take: >
  The IHG One Rewards Premier Business pairs a 190,000-point welcome bonus
  after $5,000 in spending, #6 on our Best Credit Card Signup Bonuses list,
  with the same core hotel perks as the personal Premier. The big change is
  the price: Chase just doubled the annual fee from $99 to $200 and raised the
  bonus from 140,000 points at the same time. For that fee you get an
  anniversary free night at properties up to 40,000 points, automatic Platinum
  Elite status, and a 4th reward night free on award stays. It earns 10 points
  per dollar at IHG hotels, 5 per dollar on travel, gas, dining, and office
  supply stores, and 3 per dollar on everything else. The credits can cover a
  lot of the fee if they match your business: up to $100 a year each for IHG
  food and beverage and Expensify, $120 a year in Instacart credits, and a
  $100 airline credit after $250 in direct flight purchases. If those credits
  don't fit how you spend, the new $200 fee makes this a card only for
  frequent IHG guests.
