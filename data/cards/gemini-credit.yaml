our_take: >
  The Gemini Credit's best feature is its 4% back on gas, EV charging, and
  transit, but that rate applies only to the first $300 of combined spend in
  those categories each month, after which it drops to 1%. That cap limits the
  boost to about $12 a month, so it rewards modest commuters more than heavy
  drivers. Beyond that, you get 3% on dining, 2% on groceries, and 1% on
  everything else, with no annual fee and no foreign transaction fees. The
  weak 1% base rate is the real catch: anything outside the bonus categories
  earns less than a flat 2% card would, so the Gemini works best as a targeted
  category card alongside something stronger for general spending. Watch the
  regular APR, which runs as high as 34.49%, if you ever carry a balance.
