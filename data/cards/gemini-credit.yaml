our_take: >
  The Gemini Credit card's main draw is a set of solid everyday rates with no
  annual fee: 4% on gas, EV charging, and transit, 3% on dining, 2% on
  groceries, and 1% on everything else, with no foreign transaction fees. The
  catch is the cap on that headline 4%: gas, EV charging, and transit share a
  single $300 monthly limit, so the top rate is worth at most $12 a month
  before dropping to 1%. Dining at 3% has no cap, which makes it the more
  dependable earner for most people. The 1% base rate is weak, so this works
  best alongside a flat-rate card that covers your uncategorized spending.
  With a regular APR running from 16.49% to 34.49%, it only makes sense if you
  pay in full every month.
