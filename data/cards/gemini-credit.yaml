our_take: >
  The Gemini Credit card's best feature is 4% back on gas, EV charging, and
  transit with no annual fee, but that rate covers only the first $300 of
  combined spend in those categories each month before dropping to 1%. That
  works out to at most $12 a month at the top rate, so it rewards a typical
  commuter rather than a heavy driver. Beyond that you earn 3% on dining, 2%
  on groceries, and 1% on everything else, with no foreign transaction fee.
  The 1% base rate is the real weakness, since anything outside the bonus
  categories earns less than a basic flat-rate card. The regular APR runs as
  high as 34.49%, so this only makes sense if you pay in full and want your
  rewards tied to the Gemini platform.
