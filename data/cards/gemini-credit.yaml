our_take: >
  The Gemini Credit is built around one hook: 4% back on gas, EV charging, and
  transit, with no annual fee and no foreign transaction fee. The catch is
  that those three categories share a single $300 monthly cap, so the 4% rate
  tops out at $12 a month before dropping to 1%. Beyond that, it pays 3% on
  dining, 2% on groceries, and 1% on everything else, which is respectable but
  not unusual. The 1% base rate is the real weakness, since most of your
  unbonused spending will earn less here than on a flat 2% card. It fits best
  as a commuting and dining card for someone who wants a no-fee option, not as
  the only card in the wallet.
