our_take: >
  The World of Hyatt card earns its $95 annual fee mainly through its annual
  free night at any Category 1 to 4 Hyatt hotel, which on its own can be worth
  more than the fee if you redeem it well. Spending earns 4x points at Hyatt
  hotels (up to 9x with World of Hyatt membership), 2x on dining, airfare
  bought directly from airlines, transit, and gym memberships, and 1x on
  everything else. You also get automatic Discoverist status, 5 qualifying
  night credits each year, and a second free night after $15,000 in
  cardmember-year spend. The signup bonus is back to 60,000 points after a
  brief run at 75,000 this summer, and earning all of it takes work: 30,000
  points after $3,000 in 3 months, then up to 30,000 more by earning an extra
  point on up to $15,000 of spend over 6 months. This is a card for people who
  stay at Hyatt at least occasionally, and with no foreign transaction fee it
  travels well, but the 1x base rate means it should not be your main everyday
  card.
