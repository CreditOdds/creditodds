our_take: >
  The World of Hyatt card's best argument is its annual free night at any
  Category 1 to 4 Hyatt hotel, which can easily outweigh the $95 annual fee on
  its own, with a second free night available after $15,000 in spend in a
  cardmember year. Day to day it earns 4 points per dollar at Hyatt properties
  and 2x on dining, airline tickets bought directly, local transit, and gym
  memberships, plus automatic Discoverist status and 5 qualifying night
  credits each year. The welcome offer is worth reading closely: it briefly
  rose to 75,000 points this summer before dropping back to 60,000, and the
  full amount requires earning an extra point per dollar on up to $15,000 of
  spending over 6 months, with only 30,000 points coming after the first
  $3,000. Everything outside the bonus categories earns just 1x, so this is
  not an everyday spending card. Carry it for the free night and the Hyatt
  earn, and keep a stronger card for general purchases.
