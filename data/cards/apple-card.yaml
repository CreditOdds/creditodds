name: "Apple Card"
bank: "Goldman Sachs"
slug: "apple-card"
image: "apple_card.png"
accepting_applications: true
annual_fee: 0
reward_type: cashback
rewards:
  - category: online_shopping
    value: 3
    unit: percent
    note: "Apple purchases and select merchants via Apple Pay (Nike, Uber, Walgreens, Booking.com, ChargePoint, Duane Reade, Exxon Mobil, Hertz, Ace Hardware)"
    # Bonus is gated to a fixed merchant list — exclude from generic
    # category matching so store pages don't surface this card for
    # arbitrary online retailers (e.g. bloomingdales.com).
    merchant_specific: true
  # Apple's real structure is 3-2-1: 3% at Apple + select merchants, 2% on
  # ANY purchase paid with Apple Pay, 1% with the physical card. The 2% used
  # to be modeled as everything_else (plus per-category dining/transit/
  # groceries duplicates), which fed rankers a base rate the card only earns
  # when tapping. mobile_wallet carries the conditional 2%; everything_else
  # is the honest ungated floor.
  - category: mobile_wallet
    value: 2
    unit: percent
    note: "2% Daily Cash on any purchase paid with Apple Pay; the physical titanium card earns 1%"
  - category: everything_else
    value: 1
    unit: percent
    note: "Purchases made with the physical titanium card"
tags:
  - cashback
apr:
  regular:
    min: 17.49
    max: 27.74
apply_link: https://www.apple.com/apple-card/
foreign_transaction_fee: false
network: "mastercard"
our_take: >
  The Apple Card's headline 2% Daily Cash only applies when you pay through
  Apple Pay, and the physical titanium card drops to 1%, so treat 1% as the
  true base rate and the 2% as an Apple Pay habit you have to maintain. The 3%
  tier is narrower still: it covers Apple purchases and a specific merchant
  list including Nike, Uber, Walgreens, Booking.com, ChargePoint, Duane Reade,
  Exxon Mobil, Hertz, Ace Hardware, and only when paid with Apple Pay. There
  is no annual fee and no foreign transaction fee, which keeps the cost of
  carrying it at zero. A handful of partner extras round it out, including 2%
  in Booking.com Travel Credits on eligible stays booked through the Apple
  Card portal, a six month Uber One trial, and Hertz discounts, all requiring
  enrollment. The regular APR runs 17.49% to 27.74%, so this is a card to use
  for the Apple Pay flow and pay off monthly, not a rewards engine for
  tap-resistant merchants.
benefits:
  - name: "Booking.com Travel Credits"
    value: 2
    value_unit: "percent"
    description: "2% in Booking.com Travel Credits on eligible stays and car rentals booked through the Apple Card portal (in addition to 3% Daily Cash back)."
    frequency: "per_purchase"
    category: "travel"
    enrollment_required: true
  - name: "Uber One Free Trial"
    value: 6
    description: "Six-month free trial of Uber One when signing up with Apple Card through the designated link."
    frequency: "one_time"
    category: "rideshare"
    enrollment_required: true
    merchants:
      - uber
      - uber-eats
  - name: "Hertz Car Rental Benefits"
    value: 5
    value_unit: "percent"
    description: "At least 5% off Hertz Pay Later base rates, free emergency roadside service, discounted loss damage waiver, and free additional driver at pickup."
    frequency: "per_rental"
    category: "car_rental"
    enrollment_required: true
