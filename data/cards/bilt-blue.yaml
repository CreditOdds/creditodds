name: "Bilt Blue"
bank: "Bilt"
slug: "bilt-blue"
image: "bilt_blue.png"
accepting_applications: true
apply_link: https://www.biltrewards.com/card/apply
foreign_transaction_fee: false
network: "mastercard"
annual_fee: 0
reward_type: "points"
release_date: "2025-01-15"
our_take: >
  Bilt Blue's reason to exist is rent: you can pay housing with the card and
  earn up to 1.25x points with no transaction fee, which is spending almost no
  other card will touch, and it costs nothing annually. Around that sit 3x on
  hotels and 2x on flights booked through Bilt Travel, 3x on Lyft rides once
  you link your account, and a $100 Bilt Cash welcome award. The important
  caveat is that the rent multiplier is conditional: it applies only on the
  housing rewards track, and the exact rate is set each billing cycle based on
  your everyday spend relative to the housing payment, so 1.25x is a ceiling
  rather than a promise. Everything else earns just 1x, and the alternative 4%
  Bilt Cash track on everyday spend replaces the rent points rather than
  adding to them, in a separate currency used mainly for point accelerators.
  The intro APR is also unusual, a fixed 10% for the first 12 billing cycles
  rather than 0%, and the ongoing rate runs 26.74% to 34.74%, so this is a
  card to pay in full.
