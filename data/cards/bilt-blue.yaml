foreign_transaction_fee: false
network: "mastercard"
annual_fee: 0
reward_type: "points"
release_date: "2025-01-15"
our_take: >
  The Bilt Blue's main draw is simple: you can pay rent or your mortgage with
  no transaction fee and earn up to 1.25x points on it, with no annual fee and
  no foreign transaction fees. Beyond housing, it earns 3x on hotels and 2x on
  flights booked through Bilt Travel, plus 3x on Lyft rides once you link your
  account. The catch is that everyday spending earns only 1x, and the rent
  multiplier is not guaranteed: it is set each billing cycle based on how much
  you spend relative to your housing payment, and choosing the 4% Bilt Cash
  track instead drops housing to up to 1x. The intro offer is also unusual, a
  fixed 10% rate on purchases for 12 billing cycles rather than a true 0%. The
  $100 signup bonus arrives as Bilt Cash, so it is best for renters who
  already plan to live inside the Bilt ecosystem.
