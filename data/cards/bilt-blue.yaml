name: "Bilt Blue"
bank: "Bilt"
slug: "bilt-blue"
image: "bilt_blue.png"
accepting_applications: true
apply_link: https://www.biltrewards.com/card/apply
foreign_transaction_fee: false
network: "mastercard"
annual_fee: 0
reward_type: "points"
release_date: "2025-01-15"
our_take: >
  The Bilt Blue's reason to exist is rent: it earns up to 1.25x points on rent
  and mortgage payments with no transaction fee and no annual fee, something
  few cards allow at all. It adds 3x on hotels and 2x on flights booked
  through Bilt Travel, 3x on Lyft rides once you link your account, and a $100
  Bilt Cash welcome bonus. The catch is that everyday spending earns just 1x,
  and the rent multiplier is not fixed: Bilt sets it each billing cycle based
  on how much you spend relative to your housing payment, so light users may
  see less than 1.25x. You also have to pick a track, since the 4% Bilt Cash
  option on everyday spend replaces the rent points rather than stacking with
  them. The 10% intro rate for 12 billing cycles is lower than the regular
  26.74% to 34.74% APR but is not a 0% offer, so don't treat it as a financing
  tool.
benefits:
