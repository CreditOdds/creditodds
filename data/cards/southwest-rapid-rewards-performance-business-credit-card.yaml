our_take: >
  The Performance Business is Southwest's top business card, and its best
  argument is the 80,000-point bonus after $5,000 in spending within three
  months, plus 9,000 anniversary points each year to help offset the $299
  annual fee. Frequent Southwest flyers get real perks: unlimited Extra
  Legroom seat upgrades within 48 hours of departure when available, seat
  selection at booking, a free first checked bag and Group 5 boarding for up
  to eight companions on the same reservation. It earns 4 points per dollar on
  Southwest purchases and 2 points on gas, dining, hotels booked direct and
  local transit including rideshare, and it adds a Global Entry or TSA
  PreCheck credit, a 10,000-point Companion Pass boost each year and free
  employee cards. The catch is that $299 is a lot for a single-airline card,
  and its value depends almost entirely on how often you fly Southwest. If
  your business only flies the airline occasionally, the cheaper Premier
  Business covers the basics.
