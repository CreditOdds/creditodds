our_take: >
  The Southwest Rapid Rewards Performance Business is the top-tier Southwest
  card for business owners, earning 4 points per dollar on Southwest purchases
  and 2 points on gas, dining, hotels booked direct and local transit
  including rideshare. The perks are what justify the $299 annual fee: 9,000
  anniversary points, unlimited Extra Legroom upgrades within 48 hours of
  departure when available, seat selection at booking, a free first checked
  bag and Group 5 boarding for up to eight companions, plus a Global Entry or
  TSA PreCheck credit worth up to $120. Heavy spenders also earn 2,500 tier
  qualifying points toward A-List for every $5,000 spent, and the card adds
  10,000 Companion Pass qualifying points each year. The 80,000-point bonus
  requires $5,000 in spending within three months, a meaningful hurdle. The
  catch is that nearly all of the value is tied to flying Southwest often, so
  a business with lighter or more varied travel will get more from a cheaper
  card.
