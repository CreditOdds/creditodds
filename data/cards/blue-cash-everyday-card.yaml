name: "Blue Cash Everyday"
bank: "American Express"
slug: "blue-cash-everyday-card"
image: "amex_blue_cash_everyday.png"
accepting_applications: true
apply_link: https://www.americanexpress.com/us/credit-cards/card/blue-cash-everyday/
foreign_transaction_fee: true
network: "amex"
card_referral_link: "https://americanexpress.com/en-us/referral/blue-cash-everyday-credit-card?ref="
our_take: >
  The Blue Cash Everyday earns 3% cash back at U.S. supermarkets, U.S. gas
  stations, and U.S. online retail purchases with no annual fee, which covers
  a large share of most household budgets. Pair that with a $200 bonus after
  $2,000 in spend over six months and up to 18 months of 0% intro APR on
  purchases and balance transfers, and it is easy to see the appeal. The catch
  is the caps: each 3% category tops out at $6,000 in spending a year before
  dropping to 1%, and everything else earns just 1%. Note too that Amex sets
  the intro APR length at approval, and it can be as short as 6 months. The up
  to $7 monthly Disney streaming credit requires enrollment and is worth $84 a
  year only if you already pay for Disney+, Hulu, or ESPN+.
# Amex targets the intro APR length per visitor, so card-page-check sees 15 or
# 18 months depending on the fetch and has flip-flopped on seven runs since
# 2026-10-03 (#2253/#2265/#2274/#2279/#2296/#2301/#2350). The "up to 18, set at
# approval" note is the intentional model (#2301); ignore both intro lengths.
check_ignore:
  - apr.purchase_intro.months
  - apr.balance_transfer_intro.months
annual_fee: 0
reward_type: "cashback"
tags:
  - cashback
rewards:
  - category: "groceries"
    value: 3
    unit: "percent"
    note: "U.S. supermarkets"
    spend_cap: 6000
    cap_period: annual
    rate_after_cap: 1
  - category: "gas"
    value: 3
    unit: "percent"
    note: "U.S. gas stations"
    spend_cap: 6000
    cap_period: annual
    rate_after_cap: 1
  - category: "online_shopping"
    value: 3
    unit: "percent"
    note: "U.S. online retail purchases"
    spend_cap: 6000
    cap_period: annual
    rate_after_cap: 1
  - category: "everything_else"
    value: 1
    unit: "percent"
signup_bonus:
  value: 200
  type: "cash"
  spend_requirement: 2000
  timeframe_months: 6
apr:
  purchase_intro:
    rate: 0
    months: 18
    note: "0% intro APR for up to 18 months on purchases and balance transfers from account opening. Amex sets the intro period at approval, and it may be as short as 6 months."
  balance_transfer_intro:
    rate: 0
    months: 18
    note: "0% intro APR for up to 18 months on purchases and balance transfers from account opening. Amex sets the intro period at approval, and it may be as short as 6 months."
  regular:
    min: 19.49
    max: 28.49
benefits:
  - name: "Disney Streaming Credit"
    value: 84
    description: "Up to $7 monthly statement credit for Disney+, Hulu, or ESPN+ subscription purchases"
    frequency: "annual"
    category: "streaming"
    enrollment_required: true
    merchants:
      - disney-plus
      - hulu
      - espn-plus
  - name: "Purchase Protection"
    value: 0
    description: "Coverage up to $50,000 per calendar year (maximum $1,000 per purchase) for stolen or accidentally damaged covered purchases within 90 days"
    category: "protection"
    enrollment_required: false
