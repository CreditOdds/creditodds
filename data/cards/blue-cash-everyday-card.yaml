our_take: >
  The Blue Cash Everyday's strength is covering three common categories at
  once with no annual fee: 3% cash back at U.S. supermarkets, U.S. gas
  stations, and U.S. online retail purchases. That spread, plus a 0% intro APR
  on purchases for 18 months, makes it a solid no-fee pick for households that
  want one card for routine spending, and it ranks #5 on our Best Cash Back
  Credit Cards list. The catch is that each 3% category is capped at $6,000 a
  year before dropping to 1%, and everything outside those categories earns
  only 1%, so heavy grocery shoppers will outgrow it. The welcome offer is a
  modest $200 after $2,000 in spend within six months. The up to $7 monthly
  Disney streaming credit is a nice extra if you already subscribe, but the
  foreign transaction fee means it shouldn't travel with you abroad.
