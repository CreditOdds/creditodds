name: "Blue Cash Everyday"
bank: "American Express"
slug: "blue-cash-everyday-card"
image: "amex_blue_cash_everyday.png"
accepting_applications: true
apply_link: https://www.americanexpress.com/us/credit-cards/card/blue-cash-everyday/
foreign_transaction_fee: true
network: "amex"
card_referral_link: "https://americanexpress.com/en-us/referral/blue-cash-everyday-credit-card?ref="
our_take: >
  The Blue Cash Everyday earns 3% cash back on three common categories, U.S.
  supermarkets, U.S. gas stations, and U.S. online retail purchases, with no
  annual fee. That makes it a solid everyday card for households that want
  category rewards without paying for them, and it ranks #4 on our Best Cash
  Back Credit Cards list. The catch is the caps: each 3% category is limited
  to $6,000 in spending per year before dropping to 1%, which is also the rate
  on everything else. The 0% intro APR on purchases and balance transfers runs
  up to 18 months, but Amex sets the actual length at approval and it can be
  as short as 6 months, so do not count on the full window. The $200 welcome
  bonus after $2,000 in six months and up to $7 a month toward Disney+, Hulu,
  or ESPN+ (enrollment required) are nice extras, though the foreign
  transaction fee rules it out for travel abroad.
# Amex targets the intro APR length per visitor, so card-page-check sees 15 or
# 18 months depending on the fetch and has flip-flopped on seven runs since
# 2026-10-03 (#2253/#2265/#2274/#2279/#2296/#2301/#2350). The "up to 18, set at
# approval" note is the intentional model (#2301); ignore both intro lengths.
check_ignore:
  - apr.purchase_intro.months
  - apr.balance_transfer_intro.months
annual_fee: 0
reward_type: "cashback"
tags:
  - cashback
rewards:
