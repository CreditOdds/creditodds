our_take: >
  The Blue Cash Everyday earns 3% cash back at U.S. supermarkets, U.S. gas
  stations, and U.S. online retail purchases with no annual fee, which covers
  a large share of most households' regular spending. That is why it ranks #6
  on our Best Cash Back Credit Cards list and earns the "Best for Everyday
  Spending" badge on our dining and groceries list. The catch is the caps:
  each 3% category is limited to $6,000 a year before dropping to 1%, and
  everything else earns only 1%. A 15-month 0% intro APR on both purchases and
  balance transfers is a useful bonus, along with a $200 welcome offer after
  $2,000 in spend within six months. Add the up to $84 annual Disney streaming
  credit if you already pay for Disney+, Hulu, or ESPN+, but note the foreign
  transaction fee before taking it abroad.
