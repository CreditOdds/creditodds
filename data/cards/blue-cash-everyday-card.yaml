our_take: >
  Three of the categories most households actually spend in, U.S.
  supermarkets, U.S. gas stations, and U.S. online retail, all earn 3% back on
  a card with no annual fee, which is what lands the Blue Cash Everyday at #6
  on our Best Cash Back list. Each of those categories carries its own $6,000
  annual cap and drops to 1% after that, so the strong rate covers roughly the
  first $500 a month of spending in each and no more. The $200 bonus after
  $2,000 in six months is an easy hurdle, and 15 months of 0% intro APR on
  purchases and on balance transfers requested within 60 days buys real
  breathing room before the 19.49% to 28.49% regular rate starts. The up to $7
  monthly credit for Disney+, Hulu, or ESPN+ is worth $84 a year but only if
  you enroll. One genuine limitation: this card charges foreign transaction
  fees, so leave it home when you travel abroad.
