our_take: >
  Two free checked bags for the cardmember on eligible Hawaiian and Alaska
  operated flights is the perk that carries the Hawaiian Airlines World Elite,
  and for a family or a frequent Hawaii traveler it can cover the $99 annual
  fee on a single roundtrip. The welcome offer is a low hurdle at 50,000 miles
  after just $2,000 of spending in three months, and each anniversary brings a
  $100 companion discount for a roundtrip between Hawaii and North America,
  plus a one-time 50% off companion discount for a roundtrip coach ticket on
  the same route. Earning is where it thins out: 3x applies only to Hawaiian
  Airlines purchases, with 2x at gas, dining, and groceries and 1x everywhere
  else, so this is not a card for general spending. It currently ranks ninth
  on our Best Airline Credit Cards list, and it also carries a 15-month 0%
  intro APR on balance transfers, an unusual extra on an airline card. No
  foreign transaction fee rounds it out, but the value still depends almost
  entirely on how often you fly Hawaiian.
