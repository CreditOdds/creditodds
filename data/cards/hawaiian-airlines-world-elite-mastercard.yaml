our_take: >
  The Hawaiian Airlines World Elite Mastercard earns its $99 annual fee mostly
  through travel perks: free first and second checked bags on eligible
  Hawaiian and Alaska flights booked with the card, plus a $100 companion
  discount on a roundtrip between Hawaii and North America each anniversary.
  New cardholders get 50,000 miles after a manageable $2,000 in spend within
  three months, and a one-time 50% off companion discount on a roundtrip coach
  ticket. Earning is 3 points per dollar on Hawaiian Airlines purchases only,
  2 points on gas, dining, and groceries, and 1 point on everything else, with
  no foreign transaction fee. There's also a 15-month 0% intro APR on balance
  transfers, a useful extra if you have a balance to move. The value depends
  almost entirely on flying to or from Hawaii, which is why it lands at #9 on
  our Best Airline Credit Cards list rather than higher.
