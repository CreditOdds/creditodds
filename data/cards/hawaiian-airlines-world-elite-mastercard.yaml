our_take: >
  For travelers flying to and from Hawaii, the Hawaiian Airlines World Elite
  Mastercard pays its way mostly through perks: free first and second checked
  bags for the cardmember on eligible Hawaiian and Alaska operated flights
  when booked with the card, plus a $100 companion discount on a roundtrip
  between Hawaii and North America each account anniversary. The welcome bonus
  of 50,000 miles after just $2,000 in spend within three months is easy to
  reach, and the card earns 3 miles per dollar on Hawaiian Airlines purchases
  and 2 miles on gas, dining, and groceries. There's also a 15-month 0% intro
  APR on balance transfers, an unusual extra for an airline card. The tradeoff
  is the $99 annual fee and a 1 mile per dollar base rate, so everyday
  spending outside the bonus categories earns little. It ranks #10 on our Best
  Airline Credit Cards list, and it's a reasonable keep if you check bags on
  Hawaii trips at least once or twice a year.
