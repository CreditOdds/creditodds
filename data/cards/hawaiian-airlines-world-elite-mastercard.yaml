our_take: >
  The Hawaiian Airlines World Elite Mastercard earns its $99 annual fee
  fastest through free first and second checked bags for the cardmember on
  eligible Hawaiian and Alaska Airlines flights booked with the card, which
  can cover the fee on a single trip. The 50,000-mile welcome offer after just
  $2,000 in spend within 3 months is an easy target, and each account
  anniversary brings a $100 companion discount on a roundtrip flight between
  Hawaii and North America. Everyday earn is modest: 3 miles per dollar on
  Hawaiian Airlines purchases only, 2 miles on gas, dining, and groceries, and
  1 mile on everything else. A 0% intro APR on balance transfers for 15 months
  is an unusual extra for an airline card. The honest catch is that its value
  rests almost entirely on flying Hawaiian, so travelers without regular trips
  to or from the islands should look elsewhere.
