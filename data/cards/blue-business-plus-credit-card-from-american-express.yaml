our_take: >
  The draw is 2x Membership Rewards points on all business spending up to
  $50,000 a year with no annual fee, which makes it a useful base card for
  anything that does not fall into another card's bonus categories. Twelve
  months of 0% intro APR on purchases gives new businesses room to finance
  startup costs, and 15,000 points after $3,000 in three months is a modest
  but achievable opening. Two limits deserve attention: spending above $50,000
  in a year earns just 1x, and the card charges foreign transaction fees, so
  overseas purchases belong elsewhere. Because the rewards are points rather
  than cash back, the real value depends on how you redeem them, which adds a
  step compared with a straight cash card. It is best used as the
  everything-else companion to a card with stronger category rates.
