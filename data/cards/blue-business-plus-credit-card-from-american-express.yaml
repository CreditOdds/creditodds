our_take: >
  The Blue Business Plus earns a flat 2x Membership Rewards points on all
  purchases with no annual fee, which is an easy way for a small business to
  build a transferable points balance without juggling categories. American
  Express recently raised the welcome offer from 15,000 to 50,000 points after
  $5,000 in spend over three months, a big jump that makes the card far more
  compelling to open now. It also comes with a 0% intro APR on purchases for
  12 months. The limit is the annual cap: 2x applies only to the first $50,000
  in purchases each year, after which you earn 1x. Add the foreign transaction
  fee, and this is a card for domestic spending at modest volume, not for big
  spenders or international travel.
