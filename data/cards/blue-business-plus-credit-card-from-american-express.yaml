our_take: >
  The Blue Business Plus earns a flat 2x Membership Rewards points on everyday
  business purchases with no annual fee, a rare combination for a points card.
  The welcome offer just jumped sharply, from 15,000 to 50,000 points after
  $5,000 in spend within three months, which makes this an unusually good
  moment to apply. There's also a 0% intro APR on purchases for 12 months if
  you need to finance a startup expense. The catch is the annual cap: the 2x
  rate covers only the first $50,000 in purchases each year before dropping to
  1x, so it fits small businesses with moderate spending better than large
  ones. It also charges a foreign transaction fee, so leave it at home when
  traveling abroad.
