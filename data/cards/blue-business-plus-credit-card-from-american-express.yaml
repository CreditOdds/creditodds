our_take: >
  The Blue Business Plus earns a flat 2 points per dollar on everything with
  no annual fee, which makes it one of the easier ways for a small business to
  earn points without tracking categories. American Express recently raised
  the welcome offer sharply, from 15,000 to 50,000 points after $5,000 in
  spend within three months, a big improvement over its recent norm. You also
  get a 0% intro APR on purchases for 12 months. The tradeoff is the cap: the
  2x rate covers only the first $50,000 in purchases each year before falling
  to 1x, so it suits businesses with moderate spending more than large ones. A
  foreign transaction fee applies, so it is not the card to use on purchases
  abroad.
