our_take: >
  The Blue Business Plus earns 2x points on every eligible purchase with no
  annual fee, making it an easy way for a small business to earn points
  without juggling categories. That 2x rate covers the first $50,000 in
  spending each year and drops to 1x after, so very high spenders will outgrow
  it. The welcome offer is modest at 15,000 points after $3,000 in spend in
  three months, but a 0% intro APR on purchases for 12 months adds real value
  if you need to spread out a large expense. Watch the foreign transaction
  fee, which makes it a bad pick for overseas spending. If your business
  spends under the cap and you prefer points to cash back, it is a solid,
  low-maintenance choice.
