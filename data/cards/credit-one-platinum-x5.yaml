our_take: >
  The Credit One Bank Platinum X5 Visa is the top of Credit One's rewards
  lineup, paying 5% cash back on gas, groceries, mobile phone service, and
  internet, cable, and satellite TV, though only on the first $5,000 in
  combined eligible purchases each year, which caps the bonus at $250. The
  $95 annual fee eats a large bite of that, and the fine print excludes
  warehouse clubs, Walmart, Target, and drugstores from the grocery
  category. The 29.74% APR makes carrying a balance a bad idea. For
  applicants with average credit who cannot qualify for mainstream 5%
  category cards this can still net a modest profit, but anyone with good
  credit will do better with a no-fee cash back card from a major issuer.
