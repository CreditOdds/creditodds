our_take: >
  The TD Double Up is a no-annual-fee, flat 2% cash back card, so every
  purchase earns the same rate without any categories to track. It also covers
  both sides of the financing question, with 0% intro APR for 12 months on
  purchases and 15 months on balance transfers, plus a $200 bonus after
  spending $1,500 in the first three months. That combination makes it a solid
  all-purpose card for someone who wants simple rewards and a breathing room
  period on existing debt. The tradeoffs are real, though: it charges a
  foreign transaction fee, so leave it home when traveling abroad, and
  redemptions require a 2,500 point minimum and are limited to a statement
  credit or a deposit into a TD checking or savings account. After the intro
  window, the regular APR runs 18.49% to 28.49%, so carrying a balance would
  erase the 2% quickly.
