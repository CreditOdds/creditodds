our_take: >
  The TD Double Up earns a flat 2% on every purchase with no annual fee, which
  makes it a solid low-maintenance pick if you don't want to track bonus
  categories. The $200 bonus after $1,500 in spend within three months is
  reasonable for a no-fee card, and the 0% intro APR runs 12 months on
  purchases and 15 months on balance transfers. The catches are mostly about
  redemption and travel: you need 2,500 points, or $25, before you can redeem,
  and cash only goes out as a statement credit or a deposit to a TD checking
  or savings account. The card also charges a foreign transaction fee, so
  leave it home when you travel abroad. For straightforward domestic spending,
  it holds its own as an everyday 2% card.
