our_take: >
  The Double Up is a flat 2% cash back card with no annual fee, which is about
  the simplest useful shape an everyday card can take: no categories to track
  and no quarterly activation. A $200 bonus after $1,500 in the first three
  months is easy to clear, and the intro APR is unusually generous for a
  flat-rate card at 0% for 12 months on purchases and 15 months on balance
  transfers, before the regular 18.49% to 28.49% rate takes over. Two details
  keep it from being an automatic pick. Rewards accrue as points, 2 per dollar
  at a cent each, and you need 2,500 points, meaning $1,250 of spend, before
  you can cash out to a statement credit or a deposit into a TD checking or
  savings account. It also charges foreign transaction fees, so leave it home
  when you travel abroad.
