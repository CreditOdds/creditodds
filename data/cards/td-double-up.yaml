our_take: >
  The TD Double Up keeps things simple with a flat 2% back on everything and
  no annual fee, which makes it a solid default card for spending that does
  not fit any bonus category. It also brings a $200 bonus after $1,500 in
  spend within three months, plus 0% intro APR for 12 months on purchases and
  15 months on balance transfers. Rewards accrue as points worth one cent
  each, but you need at least 2,500 points before you can redeem them as a
  statement credit or a deposit to a TD checking or savings account. The
  bigger catch is the foreign transaction fee, which makes it a poor choice to
  carry abroad. For domestic everyday spending, though, it is a
  straightforward 2% card with a useful intro window attached.
