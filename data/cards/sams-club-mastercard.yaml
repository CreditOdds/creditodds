our_take: >
  The 5% back on gas and EV charging is the reason to carry this one, and it
  applies worldwide rather than only at Sam's Club stations, which makes it a
  capable fuel card for no annual fee. Dining and takeout earn 3%, and Sam's
  Club purchases earn 3% if you hold a Plus membership, though Club-tier
  members get just 1% there. Watch the ceilings: the 5% gas rate stops after
  $6,000 of spend per year and falls to 1%, and total card earnings are capped
  at $5,000 in Sam's Cash per calendar year. The welcome offer is token, a $30
  statement credit after $30 in Sam's Club purchases within the first 30 days,
  and the amount rotates periodically. The card doubles as your membership
  card at the door and register, a small convenience, but if you are not
  filling up often the 1% base rate leaves this a narrow, club-specific pick.
