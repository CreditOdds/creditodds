our_take: >
  The Sam's Club Mastercard's best feature is 5% back on gas and EV charging
  worldwide on the first $6,000 a year, with no annual fee and no foreign
  transaction fees. It adds 3% on dining and takeout, and Plus members earn 3%
  on Sam's Club purchases, though Club-tier members get only 1% there. The
  card also doubles as your membership card at the door and register. The
  tradeoffs are real: the Sam's Club rate depends on paying for Plus,
  everything else earns 1%, and total earnings are capped at $5,000 in Sam's
  Cash per calendar year. The welcome offer is a modest $30 credit after $30
  in Sam's Club purchases within 30 days. If you already hold a Sam's Club
  membership and fill up often, it is a strong gas card; otherwise there is
  little reason to carry it.
