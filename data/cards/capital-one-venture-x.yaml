our_take: >
  The Venture X makes a premium card unusually easy to justify: the $300
  annual travel credit and 10,000 anniversary miles roughly cancel out the
  $395 annual fee, leaving lounge access through Capital One Lounges and
  Priority Pass Select as the payoff. It earns 2 miles per dollar on
  everything, 10x on hotels and rental cars and 5x on flights booked through
  Capital One Travel, plus 5x on Capital One Entertainment ticket purchases on
  that platform only. The welcome offer of 75,000 miles after $4,000 in spend
  within 3 months is a reachable target, and it lands the card at #7 on our
  Best Credit Card Signup Bonuses list. The catch is that the travel credit
  only works on bookings through Capital One Travel, so if you prefer booking
  directly with airlines and hotels, the math gets tighter. For frequent
  travelers, it ranks #3 on our Best Travel Credit Cards list as our Best
  Premium pick, backed by a Global Entry or TSA PreCheck credit, Hertz
  President's Circle status, and cell phone protection up to $800.
