our_take: >
  The Venture X is the rare premium card whose math is easy: the $300 annual
  travel credit for Capital One Travel bookings plus 10,000 anniversary miles
  can offset most or all of the $395 annual fee, leaving you with 2 miles per
  dollar on everything and lounge access. Portal bookings earn more, at 10
  miles on hotels and rental cars and 5 miles on flights, and the card carries
  Capital One Lounge access, a Priority Pass Select membership, Hertz
  President's Circle status, and cell phone protection up to $800. The welcome
  offer is 75,000 miles after $4,000 in spend in 3 months, which lands it at
  #8 on our Best Credit Card Signup Bonuses list. The catch is that the travel
  credit only works through Capital One's own portal, so if you prefer booking
  directly with airlines and hotels, that value is harder to capture. It earns
  its #2 spot and Best Premium badge on our Best Travel Credit Cards list for
  travelers who will use the credit and the lounges every year.
