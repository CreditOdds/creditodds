our_take: >
  FNBO's new Complete Rewards Visa Signature leads with 5 points per dollar on
  a broad travel category that covers airlines, hotels, car rentals, cruises,
  transit, taxis, and tolls, all with no annual fee. It adds 3 points per
  dollar on cable, satellite, and streaming services and 2 points per dollar
  at gas stations and EV charging, with 1 point per dollar on everything else.
  The welcome offer is modest but easy to reach: 15,000 points, which FNBO
  values at $150, after $500 in purchases within the first 3 billing cycles.
  The real catch for a travel-focused card is the foreign transaction fee,
  which makes it a poor choice for purchases made abroad. It fits best as a
  no-fee card for domestic travel and commuting costs, paired with a different
  card for international trips.
