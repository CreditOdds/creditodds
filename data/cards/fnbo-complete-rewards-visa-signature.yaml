our_take: >
  The FNBO Complete Rewards Visa Signature stands out for a no-annual-fee card
  by earning 5 points per dollar on a broad definition of travel: airlines,
  hotels, car rental, cruise lines, travel agencies, transit, taxis, tolls,
  and timeshares. It adds 3 points per dollar on cable, satellite, and
  streaming services, 2 points on gas and EV charging, and 1 point on
  everything else. The welcome offer is 15,000 points after $500 in net
  purchases within the first 3 billing cycles, which FNBO values at $150, a
  low bar to clear. The biggest catch is the foreign transaction fee, an odd
  fit for a card built around travel spending and a reason to leave it home on
  trips abroad. Benefits are limited to standard Visa Signature protections,
  so this is a domestic travel and commuting earner rather than a full travel
  card.
