our_take: >
  FNBO's Complete Rewards Visa Signature pays an unusually high 5 points per
  dollar on travel with no annual fee, covering airlines, hotels, car rentals,
  cruises, transit, taxis, and tolls. It also earns 3 points per dollar on
  cable, satellite, and streaming services and 2 points per dollar on gas and
  EV charging, with 1 point per dollar on everything else. New cardholders can
  earn 15,000 points, which FNBO values at $150, after $500 in purchases
  within the first 3 billing cycles, a low bar to clear. The big contradiction
  is the foreign transaction fee, which undercuts the travel earning on any
  trip abroad, so this works best for domestic travel and commuting costs.
  Beyond standard Visa Signature protections there are few perks, so the value
  comes almost entirely from the earn rates.
