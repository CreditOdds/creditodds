our_take: >
  FNBO's Complete Rewards Visa Signature leads with an unusually broad 5x
  travel rate, covering airlines, hotels, car rental, cruises, travel
  agencies, transit, taxis, and tolls by merchant category code, and it
  charges no annual fee to get it. Streaming and pay TV earn 3x, gas and EV
  charging earn 2x, and everything else falls to 1x, so the card rewards a
  fairly narrow slice of spending well and the rest barely at all. The signup
  bonus is small but easy: 15,000 points, which FNBO values at $150, after
  just $500 in net purchases within the first three billing cycles. The real
  catch for a card built around travel is that it charges foreign transaction
  fees, which makes it a poor choice for trips abroad. Launched in September
  2026, it fits best as a free domestic travel-spending card rather than the
  one you pack for an international trip.
