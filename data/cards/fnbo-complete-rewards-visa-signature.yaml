our_take: >
  The FNBO Complete Rewards Visa Signature, launched in September 2026, earns
  5 points per dollar on a broad definition of travel, including airlines,
  hotels, car rentals, cruises, transit, taxis, and tolls, with no annual fee.
  Add 3 points per dollar on streaming and pay TV, 2 on gas and EV charging,
  and a 15,000-point bonus (valued by FNBO at $150) after $500 in purchases
  within the first 3 billing cycles, and it is a solid no-fee earner for
  frequent travelers and commuters. The catch is a foreign transaction fee,
  which undercuts that strong travel rate the moment you spend outside the
  U.S. Everything outside the bonus categories also earns just 1 point per
  dollar. It fits best as a domestic travel and transit card rather than a
  passport companion.
