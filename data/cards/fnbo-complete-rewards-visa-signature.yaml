our_take: >
  FNBO launched this one on September 2, 2026, and the reason to look at it is
  a single number: 5 points per dollar on travel with no annual fee. Very few
  no-fee cards pay 5x on travel at all, and FNBO defines travel generously by
  merchant category code, so transit, taxis, cruise lines, tolls, and car
  rental all count alongside the obvious flights and hotels. Streaming earns
  3x and fuel earns 2x, with EV charging folded into the fuel bucket, which is
  a nice touch on a card this cheap to hold. The welcome offer is small but
  easy: 15,000 points after just $500 in the first three billing cycles, which
  FNBO calls $150.
  Three things keep it from being a slam dunk. It charges a 3% foreign
  transaction fee, which is an odd flaw on a travel card and means you should
  leave it home on any trip abroad. The points are a closed FNBO currency with
  no airline or hotel transfer partners, so they are worth about a cent each
  whether you take cash back, gift cards, or travel, and there is no way to
  stretch them further. And they expire on the third anniversary of when you
  earn them, so this is not a card for slowly banking points toward something
  big. Treat it as a straightforward 5% back on domestic travel spending, take
  the value as cash, and it does that job better than almost anything else
  without a fee.
