our_take: >
  This is a fuel card first: 4% back on gas and EV charging worldwide on the
  first $7,000 each year, and 5% at Costco's own gas stations, which is a
  strong rate for a business running vehicles and carries no annual fee. Add
  3% on dining and on travel including Costco Travel, and no foreign
  transaction fees, and it covers a decent share of routine business spending.
  The catches are worth naming: gas drops to 1% once you pass the $7,000
  annual cap, the 2% rate applies only to Costco and Costco.com purchases and
  not to Sam's Club, BJ's, or other warehouse clubs, and everything else earns
  just 1%. There is no signup bonus and no intro APR, so there is no upfront
  sweetener to offset a slow start. It also presumes a Costco membership,
  which makes this a narrow pick that pays off mainly if your fuel and Costco
  spending are both substantial.
