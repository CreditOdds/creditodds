our_take: >
  The Costco Anywhere Visa Business earns 4% on eligible gas and EV charging
  worldwide (5% at Costco gas stations) on the first $7,000 per year, then 1%,
  along with 3% on dining and travel, including Costco Travel, all with no
  annual fee. Costco and Costco.com purchases earn 2%, but that rate does not
  apply at other warehouse clubs like Sam's Club or BJ's. With no foreign
  transaction fee, it also holds up for business travel abroad. The catch is
  the 1% rate on everything outside those categories, and the gas cap means
  fleets with heavy fuel spend will hit the limit quickly. It is a sensible
  no-fee pick for a small business that already shops at Costco and spends on
  gas, meals, and travel.
