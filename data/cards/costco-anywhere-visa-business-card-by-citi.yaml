our_take: >
  The Costco Anywhere Visa Business by Citi earns its keep at the pump: 4%
  back on eligible gas and EV charging on the first $7,000 per year, then 1%,
  and 5% at Costco gas stations. Dining and travel, including Costco Travel,
  earn 3%, and there is no annual fee and no foreign transaction fee. That
  makes it a strong fit for a business with vehicles on the road and regular
  Costco runs. The catch is the 2% warehouse rate applies only at Costco and
  Costco.com, not at other clubs like Sam's Club or BJ's, and everything else
  earns just 1%. Use it for fuel, meals, and Costco purchases, and pair it
  with a flat-rate card for the rest of your business spending.
