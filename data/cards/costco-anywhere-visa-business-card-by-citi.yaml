our_take: >
  The Costco Anywhere Visa Business by Citi earns 4% cash back on eligible gas
  and EV charging worldwide (5% at Costco gas stations), which is a strong
  rate for a card with no annual fee. Add 3% on dining and travel, including
  Costco Travel, plus 2% on Costco and Costco.com purchases, and it covers a
  lot of a small business's routine spending. The catch is the gas cap: the 4%
  rate applies only to the first $7,000 per year in combined gas and EV
  charging, then drops to 1%, so heavy fleet spending will blow past it
  quickly. The 2% warehouse rate is Costco-only and doesn't apply at Sam's
  Club or BJ's, and everything else earns just 1%. There is no foreign
  transaction fee, but the card only makes sense if your business already
  shops at Costco regularly.
