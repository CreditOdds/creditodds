our_take: >
  The Costco Anywhere Visa Business by Citi earns its keep on fuel: 4% on
  eligible gas and EV charging worldwide, rising to 5% at Costco gas stations,
  with no annual fee. It also pays 3% on dining and travel (including Costco
  Travel) and 2% on Costco and Costco.com purchases, which makes it a natural
  fit for a business that already buys in bulk there. The catch is that the
  gas rate drops to 1% after the first $7,000 in combined gas and EV charging
  spend each year, so a fleet with heavy fuel costs will hit that ceiling
  quickly. The 2% warehouse rate also applies only at Costco, not at Sam's
  Club, BJ's, or other clubs, and everything else earns just 1%. No foreign
  transaction fees make it usable abroad, but businesses with large general
  spend should pair it with a stronger flat-rate card.
