our_take: >
  Wells Fargo is no longer accepting applications for the Propel American
  Express, so it only matters if you already carry one. For existing
  cardholders it remains a capable no-annual-fee earner, with 3x points on
  dining, travel, transit, gas, and select streaming services. Those
  categories cover a lot of everyday spending, which makes it worth keeping as
  a long-standing account. The catch is that everything else earns just 1x, so
  it works best alongside a flat-rate card for general purchases.
