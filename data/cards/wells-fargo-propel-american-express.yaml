our_take: >
  The Propel is no longer accepting applications, so this take is for existing
  cardholders. It still earns 3x points on dining, travel, transit, gas, and
  select streaming services with no annual fee, which is a broad set of
  everyday categories for a free card. Travel at 3x covers flights, hotels,
  homestays, and car rentals, so it remains a useful card to keep for trips
  and nights out. The catch is that everything else earns just 1x, so it works
  best paired with a flat-rate card for the rest of your spending. Since there
  is no fee to carry it, there is little reason to close it if those
  categories match your habits.
