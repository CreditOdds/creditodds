our_take: >
  The Propel American Express no longer accepts applications, so this is for
  existing cardholders. It's still a solid no-annual-fee card, earning 3x
  points on dining, travel (flights, hotels, homestays, and car rentals),
  transit, gas, and select streaming services. That covers much of a typical
  household's discretionary spending without a fee. The catch is that
  everything outside those categories earns just 1x, so it pairs best with a
  flat-rate card for groceries and general spending. If you already have one,
  there's little reason to close a no-fee card that still earns this well, but
  new applicants will need to look elsewhere.
