our_take: >
  The Propel packed an unusually wide 3x band into a card with no annual fee:
  dining, travel including flights, hotels, homestays and car rentals,
  transit, gas, and select streaming services all earned 3 points per dollar.
  That combination covered most of a household's discretionary spending
  without asking for a fee, which is why it was worth keeping long after the
  signup period ended. The problem is that you can no longer get it, since
  Wells Fargo has stopped accepting applications, so this is really a
  reference for existing cardholders. If you still hold one, the case for
  leaving it open is simple, because there is no fee to justify. Just note
  that everything outside those five categories earns a flat 1 point per
  dollar, so it was never the right card for large uncategorized purchases.
