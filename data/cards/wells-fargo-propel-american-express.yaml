our_take: >
  Wells Fargo no longer accepts applications for the Propel American Express,
  so this take is for existing cardholders deciding whether to keep it. It
  earns 3x points on dining, travel (including flights, hotels, homestays, and
  car rentals), transit, gas, and select streaming services, with no annual
  fee. That is a wide spread of bonus categories for a no-fee card, so if you
  still have it, there is little reason to close it. The tradeoff is the 1x
  rate on everything else, and since it runs on the American Express network,
  some merchants may not accept it, so keep a Visa or Mastercard as a backup.
