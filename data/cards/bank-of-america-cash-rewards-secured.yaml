our_take: >
  The Bank of America Cash Rewards Secured stands out among secured cards
  because it actually earns real rewards while you build credit, which is why
  it ranks #2 on our Best Secured Credit Cards list as the best pick for
  customization. You choose one 3% category from gas, online shopping, dining,
  travel, drugstores, or home improvement, and earn 2% at grocery stores and
  wholesale clubs, with no annual fee. The catch is that the bonus rates share
  a combined $2,500 quarterly spending cap, after which everything drops to
  1%, the same rate you earn on all other purchases. The 27.49% APR is steep,
  so carrying a balance would quickly erase the cash back, and the foreign
  transaction fee makes it a poor choice abroad. Use it for everyday spending
  in your chosen category, pay in full, and let it help you graduate to an
  unsecured card.
