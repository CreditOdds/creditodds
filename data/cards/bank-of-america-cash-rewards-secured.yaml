our_take: >
  Most secured cards ask you to give up rewards while you rebuild, and this
  one does not: you choose a 3% category from gas, online shopping, dining,
  travel, drugstores or home improvement, and earn 2% at grocery stores and
  wholesale clubs on top, with no annual fee. That combination is why it ranks
  #2 on our Best Secured Credit Cards list with the Best for Rewards badge.
  Read the cap before you plan around it, because the 3% and 2% rates apply to
  a combined $2,500 in purchases per quarter and everything past that, along
  with all other spending, earns 1%. The APR is a flat 27.49% and the card
  does charge foreign transaction fees, so this is one to pay in full every
  month and leave behind when you travel abroad. Used that way, it is one of
  the better places to rebuild credit without giving up cash back to do it.
