our_take: >
  The Bank of America Cash Rewards Secured stands out because it earns real
  rewards while you build credit, which most secured cards do not, and it does
  so with no annual fee. You pick one 3% cash back category from gas, online
  shopping, dining, travel, drugstores, or home improvement, and earn 2% at
  grocery stores and wholesale clubs. The catch is that the 3% and 2% rates
  share a combined $2,500 quarterly cap, after which everything drops to 1%,
  and the regular APR is a flat 27.49%, so carrying a balance will erase
  whatever you earn. It also charges foreign transaction fees, so leave it
  home when traveling abroad. That earning structure is why it holds the #2
  spot and the Best for Rewards badge on our Best Secured Credit Cards list,
  and it is a sensible starter card if you pay in full each month.
