our_take: >
  The Signify Business Cash keeps things simple: a flat 2% cash back on every
  purchase with no annual fee and no categories to track. New cardholders can
  also earn a $500 cash bonus after spending $5,000 in the first 3 months, and
  a 0% intro APR on purchases for 12 months gives a young business room to
  finance equipment or inventory. The catch is that the flat rate is the whole
  story, so a business with heavy spending in specific categories may do
  better with a card that pays more in those areas. It also carries a foreign
  transaction fee, which makes it a poor fit for overseas purchases. Travel
  accident insurance on fares charged to the card is the only listed extra, so
  pick this one for its no-fuss 2% and treat everything else as a bonus.
