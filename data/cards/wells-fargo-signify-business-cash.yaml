our_take: >
  The Signify Business Cash keeps things simple for a small business: a flat
  2% cash back on every purchase with no annual fee and no categories to
  track. New cardholders can add a $500 cash bonus after spending $5,000 in
  the first 3 months, plus 12 months of 0% intro APR on purchases, which helps
  if you are financing an equipment buy or a slow season. That combination
  earns it a spot on our Best Cash Back and Best Signup Bonuses lists. The
  catch is that a flat rate means no upside: businesses with heavy spend on
  gas, shipping, or advertising can earn more from a card with bonus
  categories. It also charges foreign transaction fees, and travel accident
  insurance is the only real perk, so treat it as a dependable everyday earner
  rather than a travel card.
