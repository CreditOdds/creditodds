our_take: >
  The Signify Business Cash keeps things simple: a flat 2% cash back on every
  purchase with no annual fee and no categories to track. That makes it an
  easy default for a business owner who wants solid returns without managing
  quarterly bonuses or spend caps. New cardholders can also earn a $500 cash
  bonus after $5,000 in spending within 3 months, plus a 12-month 0% intro APR
  on purchases to help finance early expenses. The catch is the foreign
  transaction fee, which makes it a poor choice for any spending abroad, and
  the benefits list is thin beyond travel accident insurance. Use it as the
  steady 2% workhorse for domestic spending and pair it with a no-foreign-fee
  card if you travel internationally.
