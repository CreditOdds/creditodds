our_take: >
  The Signify Business Cash keeps things simple: a flat 2% cash back on every
  purchase with no annual fee and no categories to track. New cardholders can
  earn a $500 cash bonus after spending $5,000 in the first 3 months, and a 0%
  intro APR on purchases for 12 months gives some breathing room to finance
  early business expenses. That combination lands it on our Best Cash Back and
  Best Signup Bonuses lists. The catch is that 2% is also the ceiling, so a
  business with heavy spending in specific categories may earn more with a
  tiered card. It also charges foreign transaction fees, and the only listed
  perk beyond the rewards is travel accident insurance, so this is a card for
  steady domestic spend rather than travel.
