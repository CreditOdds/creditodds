name: "Atmos Rewards Business"
bank: "Bank of America"
slug: "atmos-rewards-business"
image: "atmos-rewards-business.png"
accepting_applications: true
apply_link: https://business.bankofamerica.com/en/credit-cards/atmos-rewards
category: "business"
annual_fee: 95
# $70 per company + $25 per card = $95 effective. The apply page only exposes the
# $70 per-company figure, so card-page-check (a single-number extractor) keeps
# proposing 95 -> 70. Ignore annual_fee for this card. (#1413/#1421/#1426/#1434)
check_ignore:
  - annual_fee
foreign_transaction_fee: false
network: "visa"
our_take: >
  The Atmos Rewards Business makes the most sense for a business owner who
  already flies Alaska or Hawaiian, earning 3 points per dollar on those
  airlines plus 2 points per dollar on gas, EV charging, transit, and
  shipping. The welcome offer was recently cut from 80,000 to 70,000 points,
  but it still comes with a $99 Companion Fare (plus taxes and fees from $23)
  after $4,000 in purchases within 90 days. Ongoing value depends on loyalty:
  the free first checked bag and priority boarding apply only on Alaska
  flights paid with the card, and repeating the Companion Fare each year
  requires $6,000 in annual spend. Outside the bonus categories everything
  earns just 1 point per dollar, so it is a weak choice for general business
  spending. For the $95 annual fee, it fits owners who fly Alaska a few times
  a year and want card activity kept off their personal credit reports.
tags:
  - travel
  - airline
  - business
  - rewards
reward_type: "points"
rewards:
  - category: airlines
    value: 3
    unit: points_per_dollar
    note: "Alaska and Hawaiian Airlines purchases"
    merchant_gate: [alaska-airlines, hawaiian-airlines]
  - category: gas
    value: 2
    unit: points_per_dollar
  - category: ev_charging
    value: 2
    unit: points_per_dollar
  - category: transit
    value: 2
    unit: points_per_dollar
  - category: shipping
    value: 2
    unit: points_per_dollar
  - category: everything_else
    value: 1
    unit: points_per_dollar
signup_bonus:
  value: 70000
  type: "points"
  spend_requirement: 4000
  timeframe_months: 3
  note: "Get 70,000 bonus points and a $99 Companion Fare (plus taxes and fees from $23) after you make $4,000 or more in purchases within the first 90 days of opening your account."
apr:
  regular:
    min: 19.49
    max: 27.49
benefits:
  - name: "Coach Companion Fare"
    value: 0
    description: "$99 Companion Fare (plus taxes and fees from $23) every year that you spend at least $6,000 on purchases with the card"
    frequency: "annual"
    category: "travel"
    enrollment_required: false
  - name: "Free Checked Bag"
    value: 0
    description: "First checked bag free for the cardmember on Alaska Airlines flights when paid with the card"
    frequency: "per_flight"
    category: "travel"
    enrollment_required: false
  - name: "Priority Boarding"
    value: 0
    description: "Priority boarding on Alaska Airlines flights when paid with the card"
    frequency: "per_flight"
    category: "travel"
    enrollment_required: false
  - name: "Alaska Lounge+ Membership Discount"
    value: 0
    description: "$100 off an annual Alaska Lounge+ Membership"
    frequency: "annual"
    category: "lounge"
    enrollment_required: false
  - name: "No Personal Credit Reporting"
    value: 0
    description: "Card activity does not report to personal credit bureaus, helpful for managing personal credit utilization and 5/24-style limits"
    frequency: "annual"
    category: "other"
    enrollment_required: false
  - name: "Inflight Purchase Rebate"
    value: 20
    value_unit: "percent"
    description: "20% back on Alaska Airlines and Hawaiian Airlines inflight purchases"
    frequency: "per_purchase"
    category: "rewards"
    enrollment_required: false
