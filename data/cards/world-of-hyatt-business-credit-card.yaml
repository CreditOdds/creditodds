our_take: >
  The World of Hyatt Business is built for companies that put real money and
  real nights into Hyatt: 4 points per dollar at Hyatt hotels, plus 2x
  automatically applied to your top three spending categories each quarter
  from a list that includes dining, shipping, gas, advertising, and phone and
  internet services. The signup bonus recently rose from 60,000 to 70,000
  points after $7,000 in spending within 3 months, which helps offset the $199
  annual fee in year one. Ongoing value comes from up to $100 in Hyatt
  statement credits each year, Discoverist status, and 5 tier-qualifying night
  credits for every $10,000 spent. The tradeoff is that the richer perks are
  gated behind heavy spending: the 10% points back on redemptions only unlocks
  after $50,000 in a calendar year, and everything outside the bonus
  categories earns just 1x. It suits a business with steady Hyatt travel and
  high card volume, but a light spender will struggle to justify the fee after
  the first year.
