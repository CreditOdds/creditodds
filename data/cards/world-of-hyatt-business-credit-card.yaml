our_take: >
  Chase recently raised the welcome offer here from 60,000 to 70,000 points
  after $7,000 of spending in the first three months, and at Hyatt's
  redemption rates that is the strongest reason to open it right now. Ongoing,
  it earns 4 points per dollar at Hyatt hotels specifically, plus an automatic
  2x in your top three spending categories each quarter drawn from a list that
  includes dining, shipping, airfare bought directly from the airline,
  transit, gas, car rentals, advertising, and internet and phone service,
  which is a genuinely flexible structure for a business whose costs move
  around. Automatic Discoverist status, 5 tier-qualifying night credits for
  every $10,000 spent, and up to $100 in Hyatt statement credits each
  anniversary year chip away at the $199 annual fee, and there is no foreign
  transaction fee. The catch is that nearly all of the value is Hyatt value:
  everything outside the bonus categories earns 1 point per dollar, and the
  10% points-back perk does nothing until you spend $50,000 in a calendar
  year. If your business does not book Hyatt regularly, the fee is hard to
  justify.
