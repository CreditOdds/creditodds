our_take: >
  Most secured cards ask you to accept zero rewards while you rebuild, so a
  flat 1.5% back on every purchase with no annual fee is a real advantage, and
  it is why the Quicksilver Secured ranks #3 on our Best Secured Credit Cards
  list with a Best for Simplicity badge. Hotels and rental cars booked through
  Capital One Travel earn 5%, though that rate is tied to the portal and does
  nothing for bookings made directly with the hotel or rental company. The
  catch is a flat 28.99% APR with no intro period, which makes paying in full
  every month non negotiable: at that rate, interest swallows 1.5% cash back
  many times over. There are no foreign transaction fees, so it works abroad
  as well as at home. As a card to rebuild on while still earning something,
  it is hard to fault.
