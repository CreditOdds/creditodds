our_take: >
  The Quicksilver Secured stands out because it pays real rewards while you
  build credit: a flat 1.5% cash back on everything, plus 5% on hotels and
  rental cars booked through Capital One Travel, all with no annual fee. That
  earn rate is uncommon for a secured card. No foreign transaction fees is
  another useful extra. The tradeoff is the 28.99% APR, which wipes out any
  cash back the moment you carry a balance, so treat it as a pay-in-full card.
  If you need a secured card anyway, this is one that earns its keep while you
  rebuild.
