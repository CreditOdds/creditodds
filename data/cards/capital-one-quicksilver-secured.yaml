our_take: >
  The Quicksilver Secured is rare among secured cards because it actually pays
  you back: a flat 1.5% cash back on everything, plus 5% on hotels and rental
  cars booked through Capital One Travel, with no annual fee. That simple earn
  rate is why it ranks #3 on our Best Secured Credit Cards list with the Best
  for Simplicity badge. It lets you build credit while earning something on
  purchases you would make anyway, and there is no foreign transaction fee if
  you use it abroad. The catch is the 28.99% APR, which wipes out any rewards
  the moment you carry a balance. Pay in full every month and it is one of the
  more rewarding ways to build credit.
