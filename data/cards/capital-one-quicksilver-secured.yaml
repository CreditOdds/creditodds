our_take: >
  The Quicksilver Secured stands out because it pays real rewards while you
  build credit: 1.5% cash back on everything, plus 5% on hotels and rental
  cars booked through Capital One Travel, with no annual fee. That flat rate
  is why it holds the Best Flat Rate badge and the #3 spot on our Best Secured
  Credit Cards list, since most secured cards earn little or nothing. The
  tradeoff is the 28.99% APR, which will wipe out that 1.5% quickly if you
  carry a balance, and as a secured card it needs a deposit backing the line.
  There is no signup bonus or intro APR here either. Pay in full each month
  and it is one of the more rewarding ways to establish a credit history, with
  no foreign transaction fee as a bonus abroad.
