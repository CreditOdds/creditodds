our_take: >
  The Quicksilver Secured stands out because it pays real rewards while you
  build credit: a flat 1.5% cash back on everything, with no annual fee and no
  foreign transaction fee. That simplicity earns it the #3 spot and the "Best
  for Simplicity" badge on our Best Secured Credit Cards list. You can also
  earn 5% on hotels and rental cars booked through Capital One's travel
  portal, though most people building credit will rarely use it. The catch is
  the 28.99% regular APR, which wipes out any cash back the moment you carry a
  balance. Pay in full every month and this is one of the few secured cards
  worth keeping even after your credit improves.
