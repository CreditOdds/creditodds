our_take: >
  The Credit One Bank Secured card is a surprisingly reasonable product from
  an issuer better known for fee-heavy subprime cards. There is no annual
  fee, the refundable $200 to $500 deposit sets your credit line and even
  earns interest while it is held, and the card pays 1% back on gas,
  groceries, mobile phone, and TV services, which most secured cards do not
  match. Payment history reports to all three bureaus, doing the actual work
  of credit building. The 29.74% APR is the highest among major secured
  cards, so pay in full without exception. Within Credit One's own lineup
  this card makes the fee-charging rebuilding cards hard to justify for
  anyone who can spare the deposit, and against the wider market it holds
  its own with the Capital One and Discover secured staples.
