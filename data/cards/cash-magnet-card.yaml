our_take: >
  The Cash Magnet is no longer accepting applications, so this take is mainly
  for people who already carry it. Its appeal was simplicity: 1.5% cash back
  on all eligible purchases with no annual fee and no categories to track.
  That flat rate is still serviceable for an everyday card, and keeping a
  no-fee account open can help the age of your credit history. The tradeoff is
  that 1.5% now trails many flat-rate cards, and the data lists no other
  ongoing benefits to make up the difference. If you have one, it is fine to
  keep for occasional use, but it is not a card to build a rewards strategy
  around.
