our_take: >
  American Express is no longer accepting applications for the Cash Magnet, so
  this is a card to understand rather than one to go get. The pitch was as
  simple as flat-rate cash back gets: 1.5% unlimited on all eligible
  purchases, no annual fee, and no categories to activate or track. If you
  already hold one it remains a fine home for spending that does not fit a
  bonus category, though 1.5% is no longer a standout rate. There are no
  ongoing credits or protections attached beyond that flat rate, so its main
  value now is the account age it carries. Before you consider closing it,
  check whether Amex will let you move the line to a card still open to new
  applicants.
