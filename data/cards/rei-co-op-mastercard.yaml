our_take: >
  The REI Co-op Mastercard is a strong fit for regular REI shoppers, earning
  5% back at REI stores and on REI.com with no annual fee. Unlike many store
  cards, it also earns a respectable 1.5% on everything else and charges no
  foreign transaction fee, so it can stay useful on trips and for general
  spending. The welcome offer is a $100 REI gift card after your first
  purchase outside REI within 60 days, which is about as easy as a bonus gets,
  though it is only spendable at REI. There are no other bonus categories and
  no intro APR, and the regular APR runs up to 28.49%, so pay in full. If you
  buy outdoor gear often, it is an easy card to justify; if not, a flat-rate
  card that pays 2% will serve you better.
