our_take: >
  The REI Co-op Mastercard rewards outdoor shoppers with 5% back at REI stores
  and REI.com, plus a respectable 1.5% on everything else, all with no annual
  fee and no foreign transaction fee. The signup bonus is one of the easiest
  around: a $100 REI gift card after your first purchase outside REI within 60
  days, with no minimum spend. That combination makes it a natural fit for
  anyone who regularly buys gear at REI and wants a decent card for trips
  abroad too. The tradeoff is that there are no other bonus categories and no
  intro APR, and the welcome bonus comes as an REI gift card rather than cash.
  If you rarely shop at REI, a flat 2% card will earn more on your everyday
  spending.
signup_bonus:
  value: 100
  type: cash
  spend_requirement: 0
  timeframe_months: 2
  note: "$100 REI gift card after first purchase outside REI within 60 days"
