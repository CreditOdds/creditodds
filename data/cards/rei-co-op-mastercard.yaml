our_take: >
  The REI Co-op Mastercard earns 5% back at REI stores and REI.com, which
  makes it a natural pick for outdoor enthusiasts who buy gear there
  regularly. It holds up better than most store cards outside its home turf
  too, with 1.5% back on everything else, no annual fee, and no foreign
  transaction fee, so it can travel with you. New cardholders get a $100 REI
  gift card after their first purchase outside REI within 60 days, an easy
  bonus to earn. The tradeoff is that the headline rate only pays off if REI
  is a meaningful part of your spending, and the 1.5% base rate trails the 2%
  flat-rate cards on the market. For frequent REI shoppers it's a solid,
  low-maintenance option.
