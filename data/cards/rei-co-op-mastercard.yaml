our_take: >
  The REI Co-op Mastercard is a strong pick for regular REI shoppers, earning
  5% back at REI stores and REI.com with no annual fee. Unlike many store
  cards, it holds up outside the store too, with a 1.5% base rate on
  everything else and no foreign transaction fee, which suits outdoor travel
  abroad. The welcome offer is easy to earn: a $100 REI gift card after your
  first purchase outside REI within 60 days. The tradeoff is that the bonus is
  tied to REI, and the 1.5% everyday rate trails the best flat-rate cards.
  There is also no intro APR, so it is not a tool for financing a big gear
  purchase.
