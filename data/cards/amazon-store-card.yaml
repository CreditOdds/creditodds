our_take: >
  The Amazon Store card's main appeal is 5% back at Amazon and Whole Foods
  Market for eligible Prime members, with no annual fee. It also offers 0%
  equal monthly payment plans on Amazon purchases, from 6 months on purchases
  of $50 or more up to 24 months on select purchases. The catches are
  significant: without Prime there is no 5% at all, and it is a closed-loop
  store card that works only at Amazon, Whole Foods via an in-store code, and
  merchants that accept Amazon Pay. The 29.49% regular APR is also steep if
  you carry a balance outside a financing plan. The approval gift card is no
  longer shown as a set amount, recently listed as $0 instead of $10, with the
  amount revealed after sign-in. Most Prime members who qualify will get more
  flexibility from a general-purpose card with the same 5% Amazon rate.
