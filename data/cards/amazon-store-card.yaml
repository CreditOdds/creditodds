our_take: >
  The Amazon Store card's appeal is 5% back at Amazon and Whole Foods Market
  for Prime members, plus 0% equal monthly payment plans of 6 months on
  purchases from $50 to $599.99, 12 months on $600 and up, and 24 months on
  select items. The catch is significant: this is a closed-loop store card
  that only works at Amazon, select Amazon stores, Whole Foods via an in-store
  code, and merchants that accept Amazon Pay. Without Prime, there is no 5% at
  all, and the regular APR is a steep 29.49% if you carry a balance outside a
  financing plan. The welcome gift card amount is no longer published and is
  shown only after sign-in, after the listed value dropped from $10 recently.
  It can make sense for shoppers who want interest-free installments on big
  Amazon purchases, but Prime members who qualify for a general-purpose card
  will usually get more flexibility elsewhere.
