our_take: >
  The Amazon Store Card is a closed-loop card, and its only real draw is 5%
  back at Amazon and Whole Foods Market for members with an eligible Prime
  membership, with no annual fee. Without Prime there is no 5% at all, and the
  card works only at Amazon, select Amazon stores, Whole Foods via an in-store
  code, and merchants that accept Amazon Pay. Its equal monthly payment plans
  can be handy, with 0% APR for 6 months on Amazon purchases of $50 to
  $599.99, 12 months on $600 or more, and 24 months on select items. The catch
  is a steep 29.49% regular APR on anything you carry outside those plans. The
  welcome offer is now listed at $0 after recently dropping from $10, though
  Amazon says a gift card amount shows after sign-in. Most Prime members who
  qualify for an open-loop card will get more flexibility elsewhere, so this
  makes most sense if you want Amazon financing.
