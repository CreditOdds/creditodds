our_take: >
  The Amazon Store card earns 5% back at Amazon and Whole Foods for Prime
  members, the same headline rate as the Prime Visa, but it is a closed-loop
  card usable only at Amazon, select Amazon physical stores, Whole Foods via
  in-store code, and merchants accepting Amazon Pay. Without an eligible Prime
  membership there is no 5% at all, which removes most of the reason to carry
  it. The financing is the genuine differentiator: 0% equal monthly payments
  over 6 months on Amazon purchases from $50 to $599.99, 12 months on $600 and
  up, and 24 months on select items, plus rotating limited-time offers of 10%
  or more for eligible Prime cardmembers. Treat the regular APR of 29.49% as
  the reason to only use this card inside a promotional financing window. Note
  also that the approval gift card has been shrinking, from $60 down to $10 in
  June and to nothing in July, so there is no real signup incentive left.
