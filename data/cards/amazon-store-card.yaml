our_take: >
  The Amazon Store card is a closed-loop card that only works at Amazon.com,
  select physical Amazon stores, Whole Foods Market via an in-store code, and
  merchants that accept Amazon Pay. Its value hinges on Prime: eligible Prime
  members earn 5% back at Amazon and Whole Foods, while non-Prime holders get
  no 5% at all. The more distinctive feature is financing, with 0% APR equal
  monthly payments for 6 months on Amazon purchases from $50, 12 months on
  $300 and up, and 24 months on select purchases. Outside those plans the
  29.49% APR is steep, so carrying an ordinary balance gets expensive quickly.
  With no annual fee it can work for Prime members who want structured payment
  plans on big Amazon buys, but anyone wanting rewards beyond Amazon is better
  served by an open-network card.
