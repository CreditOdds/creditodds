our_take: >
  The Credit One Bank American Express for Rebuilding Credit is the Amex
  network twin of Credit One's rebuilding Platinum Visa, with identical
  economics: a $75 first-year fee billed against your opening credit line,
  $99 a year after that charged monthly, 1% back on gas, groceries, phone,
  and TV services, and a 29.74% APR. The Amex network adds Retail Protection
  and American Express Offers, which is a genuine, if small, edge over the
  Visa version, at the cost of slightly narrower acceptance abroad. The same
  caveat applies to both cards: the fees are steep for what you get, and a
  no-fee secured card builds credit far more cheaply if you can manage a
  deposit. Choose this only if unsecured credit is the priority and the Amex
  perks appeal.
