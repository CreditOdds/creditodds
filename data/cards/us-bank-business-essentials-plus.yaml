our_take: >
  The Business Essentials Plus asks $295 a year for two things the no fee
  Business Essentials lacks: 5% cash back on your top eligible category each
  month, and a much higher ceiling on the checking relationship boost. The
  5% applies automatically to whichever of eight categories you spend the
  most in, including airlines, dining, cell phone service, office supplies,
  shipping, utilities, and accounting and tax services, on up to $200,000 a
  year. Everything else earns 2%, rising to 2.5%, 3%, or 3.5% on up to
  $200,000 a year once you hold $15,000, $75,000, or $150,000 in qualifying
  U.S. Bank business checking, which means the top tier needs serious cash
  parked at U.S. Bank. The welcome offer is $1,000 after $15,000 in spending
  within 150 days. There is no intro APR, but there is also no foreign
  transaction fee, and prepaid hotels and car rentals in the U.S. Bank Travel
  Center earn 10%.
