our_take: >
  The Business Essentials Plus earns 5% cash back automatically on your top
  eligible category each month, chosen from a list that includes airlines,
  cell phone service, dining, entertainment, office supply stores, shipping,
  and utilities, on up to $200,000 a year. Everything else earns 2%, and
  businesses holding $15,000 or more in qualifying U.S. Bank business checking
  can push that base rate to 2.5%, 3%, or 3.5% depending on balance tier.
  Prepaid hotels and car rentals through the U.S. Bank Travel Center earn 10%,
  and there's no foreign transaction fee. The catch is the $295 annual fee,
  which only makes sense for a business with heavy spend in one bonus category
  or substantial checking balances at U.S. Bank. The $1,000 bonus also demands
  $15,000 in spend within 150 days, so it suits established businesses rather
  than small operators.
