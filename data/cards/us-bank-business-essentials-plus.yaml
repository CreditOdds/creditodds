our_take: >
  The Business Essentials Plus pays a 2% floor on everything plus 5% cash back
  automatically on your top eligible category each month, chosen from a list
  that includes airlines, cell phone service, dining, entertainment, office
  supply stores, shipping, and utilities. Businesses that also keep qualifying
  U.S. Bank business checking balances can push that base rate to 2.5%, 3%, or
  3.5% depending on balance, which is unusually rich for a flat-rate earn. The
  tradeoff is the $295 annual fee, so the card needs real volume to come out
  ahead of a no-fee 2% card, and both the 5% and boosted rates stop after
  $200,000 in spend a year. The $1,000 bonus after $15,000 in 150 days helps
  cover the first year's fee. Prepaid hotels and car rentals through the U.S.
  Bank Travel Center earn 10%, and there are no foreign transaction fees.
