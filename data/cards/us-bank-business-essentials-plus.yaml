our_take: >
  The Business Essentials Plus earns 5% cash back automatically on your top
  eligible spend category each month, chosen from eight categories including
  airlines, cell phone service, dining, office supply stores, shipping, and
  utilities, on up to $200,000 a year with no category picking required.
  Everything else earns 2%, rising to as much as 3.5% if your business keeps
  $150,000 or more in qualifying U.S. Bank business checking, and prepaid
  hotels and car rentals booked in the U.S. Bank Travel Center earn 10%. The
  $1,000 signup bonus is generous but demands $15,000 in spend within 150
  days, which puts it in reach mainly for businesses with real monthly volume.
  The catch is the $295 annual fee: at the base 2% rate, you need meaningful
  spend in the 5% categories or a sizable checking relationship before this
  card beats its no-fee sibling. It does skip foreign transaction fees, a plus
  for businesses that buy or travel abroad.
