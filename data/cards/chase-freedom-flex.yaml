foreign_transaction_fee: false
network: "mastercard"
our_take: >
  The Freedom Flex earns the top spot on our Best Cash Back Credit Cards list
  by stacking several strong categories on a no annual fee card: 5% on
  rotating quarterly categories, 5% on travel booked through Chase, 3% on
  dining, and 3% at drugstores. The Q4 2026 rotation covers grocery stores
  (excluding Walmart and Target), dining, and donations to the American Red
  Cross, but the 5% applies only to the first $1,500 in combined purchases
  each quarter, then drops to 1%. The welcome bonus recently rose from $200 to
  $250 after $500 in spend within 3 months, and a 15 month 0% intro APR on
  both purchases and balance transfers adds flexibility. The catch is the
  effort: the rotating categories change each quarter and need tracking, and
  everything outside the bonus categories earns just 1%. It works best for
  organized spenders or as a partner to a flat-rate card for non-bonus
  purchases.
benefits:
  - name: "DashPass Complimentary Membership"
    value: 0
