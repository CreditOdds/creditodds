our_take: >
  The Freedom Flex is our #1 cash back pick and carries the Best Overall
  badge, largely because of how much ground it covers for no annual fee: 5% on
  rotating quarterly categories, 5% on travel booked through Chase, 3% on
  dining, 3% at drugstores, and 1% on everything else. The Q4 2026 rotation is
  grocery stores (excluding Walmart and Target) and dining, which stacks with
  the everyday 3% to make dining 7% through December.
  The $250 bonus, a limited-time increase from $200, after only $500 of spend
  in the first 3 months is among the easier ones to hit, and there are 15
  months of 0% intro APR on both purchases and balance transfers if you have
  something to pay down. The one real limit is that the 5% rate covers only
  $1,500 of spend per quarter and falls to 1% after that. Chase has also
  dropped the foreign transaction fee, so the card no longer needs to stay
  home on international trips. The trade was cell phone protection, which
  Chase removed from the card on September 20, 2026.
