our_take: >
  The Freedom Flex tops our Best Cash Back Credit Cards list by packing a lot
  into a no-annual-fee card: 5% on quarterly rotating categories, 5% on travel
  booked through Chase, and 3% on dining and drugstores. For Q4 2026 the
  rotating categories are grocery stores (excluding Walmart and Target),
  dining, and American Red Cross donations, with 5% applying to the first
  $1,500 in combined purchases each quarter before dropping to 1%. The welcome
  offer recently rose from $200 to $250 after $500 in spend within 3 months,
  and a 15-month 0% intro APR on purchases and balance transfers adds
  flexibility. The catch is effort: you have to track and activate the
  rotating categories, and everything outside the bonus categories earns just
  1%. It works best paired with a strong flat-rate card for everyday spending.
benefits:
