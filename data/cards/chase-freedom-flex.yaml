our_take: >
  The Freedom Flex is our #1 cash back pick and carries the Best Overall
  badge, largely because of how much ground it covers for no annual fee: 5% on
  rotating quarterly categories, 5% on travel booked through Chase, 3% on
  dining, 3% at drugstores, and 1% on everything else. The Q3 2026 rotation is
  gas stations and EV charging, public transit, and select live entertainment.
  The $250 bonus, a limited-time increase from $200, after only $500 of spend
  in the first 3 months is among the easier ones to hit, and there are 15
  months of 0% intro APR on both purchases and balance transfers if you have
  something to pay down. The one real limit is that the 5% rate covers only
  $1,500 of spend per quarter and falls to 1% after that. Chase has also
  dropped the foreign transaction fee, so the card no longer needs to stay
  home on international trips. Cell phone protection of up to $800 per claim
  when you pay your bill with the card is a real extra rather than filler.
benefits:
  - name: "Cell Phone Protection"
    value: 1000
    description: "Up to $800 per claim and $1,000 per 12-month period in protection against covered theft or damage for cell phones listed on your monthly cell phone bill when paid with this card, maximum 2 claims per 12 months with $50 deductible per claim."
    frequency: "per_claim"
    category: "other"
    enrollment_required: false
  - name: "DashPass Complimentary Membership"
    value: 0
    description: "6 months of complimentary DashPass on DoorDash and Caviar, plus $10 off one non-restaurant DoorDash order each quarter while enrolled."
    frequency: "one_time"
    category: "dining"
    enrollment_required: true
