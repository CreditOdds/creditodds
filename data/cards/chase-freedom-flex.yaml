our_take: >
  The Freedom Flex earns 5% cash back on quarterly rotating categories on up
  to $1,500 in combined purchases each quarter, which for Q3 2026 covers gas
  stations and EV charging, public transit, and select live entertainment.
  That sits on top of a solid fixed lineup: 5% on travel booked through
  Chase's portal and 3% on dining and drugstores, all with no annual fee and
  no foreign transaction fees. Chase recently raised the welcome bonus from
  $200 to $250 after $500 in spend within 3 months, and a 15-month 0% intro
  APR on purchases and balance transfers adds flexibility. The catch is
  effort: you have to activate and track the rotating categories, and
  everything outside them earns just 1%, so it works best paired with a
  flat-rate card for everyday spending. It ranks #1 on our Best Cash Back
  Credit Cards list, and that standing makes sense for anyone willing to work
  the calendar.
