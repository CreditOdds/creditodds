our_take: >
  The Freedom Flex earns more than most no-annual-fee cards, combining 5% on
  quarterly rotating categories with a steady 3% on dining and drugstores and
  5% on travel booked through Chase, which is why it ranks #1 on our Best Cash
  Back Credit Cards list. For Q4 2026, the 5% categories are grocery stores
  (excluding Walmart and Target), dining, and American Red Cross donations, on
  up to $1,500 in combined purchases before dropping to 1%. Chase recently
  raised the welcome offer from $200 to $250 after $500 in spend within 3
  months, and the 15 months of 0% intro APR on purchases and balance transfers
  adds flexibility. The tradeoff is effort: you have to track and activate
  rotating categories each quarter, and the 1% base rate on everything else is
  weak. Pair it with a flat-rate card for non-bonus spending and it pulls a
  lot of weight for no fee.
benefits:
