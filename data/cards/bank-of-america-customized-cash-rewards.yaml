our_take: >
  The Customized Cash Rewards is a flexible no-annual-fee card that lets you
  pick one 3% category from gas, online shopping, dining, travel, drugstores,
  or home improvement, plus 2% at grocery stores and wholesale clubs. That
  choice makes it easy to aim the card at wherever you spend the most, and new
  cardholders also get a $200 bonus after $1,000 in purchases within three
  months and 15 months of 0% intro APR on purchases and balance transfers. The
  real limitation is the combined $2,500 quarterly cap on the 3% and 2%
  categories, after which all spending earns just 1%, so heavy spenders will
  hit the ceiling quickly. It also charges foreign transaction fees, so leave
  it home when traveling abroad. It works best as a targeted category card
  paired with a flat-rate card for everything else.
