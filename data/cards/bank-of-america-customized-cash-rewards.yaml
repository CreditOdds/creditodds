our_take: >
  The Customized Cash Rewards lets you choose where you earn 3% cash back,
  picking one category from gas, online shopping, dining, travel, drugstores,
  or home improvement, with 2% at grocery stores and wholesale clubs and no
  annual fee. It sweetens the deal with a $200 bonus after $1,000 in spend
  within 3 months and 15 months of 0% intro APR on both purchases and balance
  transfers. The real limitation is the cap: the 3% and 2% categories share a
  combined $2,500 in quarterly spending, after which they fall to 1%, so heavy
  spenders will hit the ceiling quickly. Foreign transaction fees also make it
  a poor travel companion abroad. It works best for moderate spenders who can
  concentrate a few hundred dollars a month in one category and want a long
  intro APR window alongside it.
