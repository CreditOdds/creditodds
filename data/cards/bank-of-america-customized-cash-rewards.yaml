our_take: >
  The appeal here is control: you pick one 3% category each month from gas,
  online shopping, dining, travel, drugstores, or home improvement, and
  grocery stores and wholesale clubs earn 2% on top of it, all with no annual
  fee. A $200 bonus after $1,000 of spend in the first three months is easy to
  clear, and the 15 months of 0% intro APR on purchases and balance transfers
  gives the card a second use as a payoff tool. The real limit is the cap: the
  3% and 2% rates share a single $2,500 combined quarterly spending pool, and
  everything past it drops to 1%, which is where all non-bonus spend sits
  anyway. It also charges foreign transaction fees, so leave it home when you
  travel abroad. Think of it as a category card for a specific chunk of
  household spending, not a card to put everything on.
