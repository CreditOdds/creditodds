our_take: >
  The Bank of America Customized Cash Rewards lets you choose where you earn
  3% cash back, from gas, online shopping, dining, travel, drugstores, or home
  improvement, and adds 2% at grocery stores and wholesale clubs, all with no
  annual fee. New cardholders also get a $200 bonus after $1,000 in purchases
  in the first three months, plus 15 months of 0% intro APR on purchases and
  balance transfers. The real limitation is the cap: the 3% and 2% categories
  share a combined $2,500 in quarterly spending, after which they drop to 1%,
  the same rate everything else earns. That makes it a strong pick for steady
  spend in one category, but less useful if you spend heavily in several.
  Foreign transaction fees also make it a card to leave home when traveling
  abroad.
