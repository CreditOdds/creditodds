our_take: >
  The Customized Cash Rewards lets you pick where your 3% cash back lands,
  choosing one category from gas, online shopping, dining, travel, drugstores,
  or home improvement, while grocery stores and wholesale clubs earn 2%, all
  with no annual fee. A $200 bonus after $1,000 in spend within three months
  and 15 months of 0% intro APR on purchases and balance transfers add useful
  early value. The catch is the cap: the 3% and 2% rates share a combined
  $2,500 quarterly limit, after which everything earns 1%, so heavy spenders
  will run past it quickly. It also charges foreign transaction fees, which
  rules it out for international travel. It works best as a targeted second
  card for one big spending category rather than as your everyday catch-all.
