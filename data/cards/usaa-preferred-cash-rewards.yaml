our_take: >
  The Preferred Cash Rewards is a set it and forget it card: 1.5% cash back on
  every purchase with no annual fee and no foreign transaction fees. New
  cardholders can pick up a $250 bonus after spending $1,000 in the first 3
  months, a low bar that most people will clear with normal spending. The
  tradeoff is that 1.5% is below what some flat rate competitors pay, and
  there are no bonus categories to boost your return. The regular APR range of
  15.4% to 27.4% is reasonable but not a reason to carry a balance. It works
  best as a simple catch-all card, especially for travel abroad, rather than a
  rewards maximizer.
