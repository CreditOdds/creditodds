our_take: >
  The Preferred Cash Rewards is a simple flat-rate card: 1.5% cash back on
  every purchase with no annual fee and no categories to track. A $250 bonus
  after $1,000 in spending in the first three months is a generous welcome for
  a modest spend requirement. No foreign transaction fee also makes it a
  reasonable card to use overseas, which matters for members stationed or
  traveling abroad. The tradeoff is that 1.5% is merely average for a
  flat-rate card, so anyone who wants more from everyday spending can likely
  do better elsewhere. It's best as a low-maintenance default card for USAA
  members who value simplicity over squeezing out every point.
