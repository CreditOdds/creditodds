our_take: >
  The Preferred Cash Rewards is a simple flat-rate card: 1.5% cash back on
  every purchase with no annual fee and no foreign transaction fee. The $250
  bonus after $1,000 in spend within three months is a generous welcome offer
  for such a low spending requirement. That combination makes it an easy pick
  if you want one no-fuss card that works at home and abroad. The catch is
  that 1.5% is now a modest flat rate, so you are leaving money on the table
  compared with cards that pay 2% on everything or bonus your biggest
  categories. After the bonus, its main appeal is simplicity rather than
  earning power.
