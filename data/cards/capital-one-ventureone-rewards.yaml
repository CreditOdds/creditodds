our_take: >
  The VentureOne Rewards is a starter travel card with no annual fee and no
  foreign transaction fees, plus a 15-month 0% intro APR on purchases that
  helps if you have a big expense to spread out. Its welcome offer of 20,000
  miles after just $500 in spend within 3 months is easy to reach. The catch
  is the earn rate: 1.25 miles per dollar on everyday purchases is thin, and
  the only bonus is 5 miles on hotels and rental cars booked through Capital
  One Travel. Price drop protection and a price match guarantee on Capital One
  Travel bookings are minor extras. It works as a no-fee card to carry abroad,
  but anyone who spends meaningfully will earn more with a stronger flat-rate
  card.
