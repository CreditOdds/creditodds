our_take: >
  For a $95 annual fee, the Enjoy Beyond earns 3x points on airlines, hotels,
  and car rentals, 2x on dining, and 1x elsewhere, with no foreign transaction
  fees, which is a solid shape for a mid-tier travel card. The signup bonus is
  30,000 points after just $1,500 in three months, a notably low spend
  requirement, and the $100 annual travel experience credit for ground
  transportation, streaming, and ticket agencies plus a $120 Global Entry or
  TSA PreCheck credit every four years can cover the fee outright if those fit
  your habits. The complication is on the redemption side: the 10% to 50%
  bonus on points cashed into an eligible Truist deposit account is what lifts
  the effective return, and the tier depends on your combined balances with
  the bank. Without that relationship you are holding a fairly ordinary 3x
  travel card at 18.74% to 27.74% regular APR. Read this as a card for
  existing Truist customers, where the loyalty bonus does most of the work.
