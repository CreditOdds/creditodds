our_take: >
  The Truist Enjoy Beyond earns 3 points per dollar on airlines, hotels, and
  car rentals and 2 points on dining, with no foreign transaction fee, making
  it a reasonable travel card for Truist customers. The $95 annual fee is
  partly offset by up to $100 in annual credits for ground transportation,
  streaming, and ticket agencies, plus a Global Entry or TSA PreCheck credit
  of up to $120 every four years. The catch is that its best value is tied to
  a Truist relationship: the loyalty bonus of 10% to 50% applies only when you
  redeem into an eligible Truist deposit account, and the fee waiver is
  limited to Truist Wealth clients with an assigned advisor. The 30,000 point
  bonus after $1,500 in spend within three months is modest, and everything
  else earns 1x. Without Truist deposits, competing travel cards at the same
  fee will likely serve you better.
