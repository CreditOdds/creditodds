our_take: >
  The Truist Enjoy Beyond is a mid-tier travel card that earns 3 points per
  dollar on airlines, hotels, and car rentals and 2 points on dining, with no
  foreign transaction fees. The $95 annual fee is offset by up to $100 a year
  in statement credits for ground transportation, streaming services, and
  ticket agencies, plus a Global Entry or TSA PreCheck credit of up to $120
  once every four years. New cardholders can earn 30,000 bonus points after
  spending $1,500 in the first three months. The catch is that everyday
  spending outside travel and dining earns just 1 point per dollar, and the
  strongest value goes to existing Truist customers, who get a 10% to 50%
  bonus when redeeming into a Truist deposit account and, for Truist Wealth
  clients with an assigned advisor, a waived annual fee. If you do not bank
  with Truist, this card has less to offer, but for loyal Truist customers who
  travel regularly, it is a reasonable fit.
