our_take: >
  The Choice Privileges Mastercard is a no-annual-fee hotel card that earns 5x
  points at participating Choice Hotels properties and a notably broad 3x on
  gas, groceries, home improvement, and phone plans. The 60,000-point welcome
  bonus needs only $1,000 in spending in the first three months, an easy bar
  to clear. Automatic Gold Elite status, backed by 10 elite qualifying nights
  each calendar year, adds value if you stay at Choice properties, and there
  are no foreign transaction fees. The catch is that the points are tied to a
  single hotel program, so the card only makes sense if Choice Hotels fit your
  travel. Everything outside the bonus categories earns just 1x, and cell
  phone protection of up to $800 per claim rounds out the perks.
