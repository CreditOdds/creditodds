our_take: >
  The Choice Privileges Mastercard is a no-annual-fee way into Choice Hotels
  rewards: 60,000 bonus points after $1,000 in spending in the first three
  months, which is a low bar for a bonus that size. It earns 5x at
  participating Choice Hotels properties and 3x on gas, groceries, home
  improvement, and phone plans, so it also pulls its weight on everyday
  spending. Cardholders get automatic Gold Elite status plus 10 elite
  qualifying nights each calendar year, and there are no foreign transaction
  fees. The catch is that every point goes into Choice Privileges, so the
  value depends on whether you actually stay at Choice properties, and
  everything outside the bonus categories earns just 1x. Cell phone protection
  of up to $800 per claim with a $25 deductible is a useful extra. If Choice
  hotels fit your travel, it's an easy card to keep at no cost.
