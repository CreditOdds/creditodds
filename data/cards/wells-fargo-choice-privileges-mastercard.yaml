our_take: >
  Wells Fargo raised this card's opening offer from 40,000 to 60,000 Choice
  Privileges points in May 2026, and with a $1,000 spending requirement over
  three months it is one of the easier hotel bonuses to clear. Beyond the
  bonus, the everyday earn is broader than most no-fee hotel cards: 3x points
  on gas, groceries, home improvement, and phone plans, alongside 5x at
  participating Choice Hotels properties. Automatic Gold Elite status and 10
  elite qualifying nights each year come with it, and there is no annual fee
  and no foreign transaction fee, so nothing has to be earned back. The limits
  are worth naming: the 5x rate applies only at participating Choice
  properties, everything outside the bonus categories earns 1x, and the points
  are only as useful as Choice's footprint is to your travel. If you stay at
  Comfort, Quality, or the other Choice brands with any regularity, it is a
  low-risk card to hold.
