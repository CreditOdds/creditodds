our_take: >
  The Choice Privileges Mastercard is a no-annual-fee way to earn toward
  Choice Hotels stays, with 5x points at participating Choice properties and
  3x on gas, groceries, home improvement, and phone plans. The welcome offer
  of 60,000 points after just $1,000 in spending in the first 3 months is
  generous for a free card. It also includes automatic Gold Elite status plus
  10 elite qualifying nights each year, and no foreign transaction fee. The
  catch is that the points are only useful if you actually stay at Choice
  hotels, and the 5x rate applies only at Choice properties, not other hotel
  brands. Everything else earns 1x, and cell phone protection up to $800 per
  claim rounds out the package.
