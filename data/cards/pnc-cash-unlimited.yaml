our_take: >
  The PNC Cash Unlimited keeps things simple: 2% cash back on every purchase
  with no annual fee and no categories to track. A 15-month 0% intro APR on
  balance transfers adds value if you are carrying debt from another card, and
  the lack of a foreign transaction fee means it works abroad too. The
  tradeoff is that there is no signup bonus, so you give up the upfront cash
  many competing flat-rate cards offer. Also note the intro APR covers balance
  transfers only, not new purchases. Cell phone protection, purchase security,
  and Visa Signature Concierge round out a solid set of extras for a card that
  is easy to keep for years.
