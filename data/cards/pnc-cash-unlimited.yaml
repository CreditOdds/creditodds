our_take: >
  A flat 2% back on everything with no annual fee and no foreign transaction
  fee is a straightforward proposition, and PNC Cash Unlimited delivers it
  without caps, categories or activations to track. It is a legitimate
  everyday default, and the 15 months of 0% intro APR on balance transfers
  make it useful if you are also clearing a balance. PNC adds more protection
  than most 2% cards bother with: cell phone coverage of up to $800 per claim
  when you pay your bill with the card, purchase security on items stolen or
  damaged within 90 days, and Visa Signature concierge access. What is missing
  is an opening bonus, which most competing flat-rate cards offer and which is
  often worth a couple hundred dollars in year one. The regular APR of 18.49%
  to 28.49% is standard, so the card only pays off if you clear the balance
  each month.
