our_take: >
  The PNC Cash Unlimited keeps things simple with a flat 2% cash back on every
  purchase, no annual fee, and no foreign transaction fee. It adds 15 months
  of 0% intro APR on balance transfers, which gives it extra value if you're
  carrying a balance you want to pay down. The supporting benefits are solid
  for a no-fee card: cell phone protection up to $800 per claim when you pay
  your bill with the card, purchase security on items within 90 days, and Visa
  Signature Concierge. The tradeoff is that there's no signup bonus listed and
  no bonus categories, so it won't outperform a tiered card on dining or
  groceries. As a reliable catch-all card, especially for existing PNC
  customers, it does its job without fuss.
