our_take: >
  The Everyday Preferred is closed to new applicants, so American Express has
  effectively taken it off the table unless you already hold one. For existing
  cardholders the math is less automatic than on the no-fee Everyday: this
  version carries a $95 annual fee, so it is worth confirming that the points
  you actually earn in a year clear that cost. If they do not, the fee is a
  real recurring reason to reconsider the account rather than let it renew out
  of habit. And since you cannot apply for it, there is no reason to build a
  plan around this card if you are shopping for a new points earner now.
