our_take: >
  The Delta SkyMiles Blue American Express is the no-annual-fee entry point
  into Delta's program, earning 2x miles on Delta purchases and dining and 1x
  on everything else. That makes it a reasonable way for occasional Delta
  flyers to keep miles accumulating without paying to carry a card, and it
  shows up at #19 on our list of the best airline cards. The tradeoff is how
  little comes with it: the 10,000-mile bonus after $1,000 in spend within 6
  months is small, and there is no free checked bag or priority boarding. The
  perks are limited to 20% back as a statement credit on Delta in-flight food
  and beverage purchases and 10% back on select stadium concessions, up to
  $250 per calendar year with enrollment. No foreign transaction fees help on
  international trips, but frequent Delta flyers will likely get more from a
  card with travel perks.
