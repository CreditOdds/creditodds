our_take: >
  The Delta SkyMiles Blue American Express is the easiest way to start earning
  Delta miles without paying an annual fee, and it ranks #19 on our best
  airline cards list with a Best No-Fee badge. It earns 2x miles on Delta
  purchases and dining, with 1x on everything else, and saves you 20% as a
  statement credit on Delta in-flight food and beverages. No foreign
  transaction fee is a nice touch for international trips. The catch is that
  the in-flight discount is the only real Delta perk, with no checked-bag or
  boarding benefits that usually justify a co-branded airline card. The
  10,000-mile bonus after $1,000 in spend over six months is also modest, so
  frequent Delta flyers will get more from a paid tier, while occasional
  flyers may do better with a flexible rewards card.
