our_take: >
  The Delta SkyMiles Blue is a no-annual-fee entry point into SkyMiles,
  earning 2x miles on Delta purchases and at restaurants, with no foreign
  transaction fee. That makes it a reasonable way to start building miles if
  you fly Delta occasionally and want a card you can keep without paying to
  carry it, and it appears at #19 on our Best Airline Credit Cards list. The
  catch is how little it includes beyond earning: the perks are limited to 20%
  back as a statement credit on Delta in-flight food and beverage purchases
  and 10% back on concessions at select stadiums and arenas, up to $250 per
  year, with enrollment. Everything outside Delta and dining earns only 1x,
  and the 10,000 mile bonus after $1,000 in spend over six months is small.
  Frequent Delta flyers will likely get more from a card that includes travel
  perks.
