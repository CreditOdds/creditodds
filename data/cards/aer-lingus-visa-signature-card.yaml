our_take: >
  The Aer Lingus Visa Signature is mainly a way to rack up Avios for
  transatlantic trips to Ireland, with a 75,000-point welcome bonus after
  $5,000 in spend within three months and 3 points per dollar on Aer Lingus,
  British Airways, and Iberia flights. Its most distinctive perk is an economy
  companion ticket, but you only earn it by spending $30,000 on the card in a
  calendar year, which is a steep bar for most households. Day-to-day earning
  is thin: 2 points per dollar at hotels booked directly and 1 point
  everywhere else. For the $95 annual fee you also get 2,500 bonus Avios each
  anniversary, priority boarding on US to Ireland flights, a 10% discount on
  Aer Lingus flights to Europe booked through the cardmember site, and no
  foreign transaction fees. It makes sense for frequent Ireland travelers who
  can use the bonus well, but most people will find a flexible travel card
  more rewarding over time.
