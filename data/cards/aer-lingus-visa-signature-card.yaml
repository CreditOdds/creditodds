our_take: >
  The Aer Lingus card's best feature is its 75,000 Avios welcome bonus after
  $5,000 in spending within three months, a large haul for a $95 annual fee.
  Ongoing earning is modest: 3 Avios per dollar on Aer Lingus, British
  Airways, and Iberia flights, 2 on hotels booked directly, and 1 on
  everything else. The companion ticket is the standout perk, but it requires
  $30,000 in calendar-year spending, which puts it out of reach for most
  cardholders. Priority boarding on US to Ireland flights, a 10% Aer Lingus
  discount on US to Europe fares, 2,500 anniversary Avios, and no foreign
  transaction fees round out the package. It makes sense if you fly to Ireland
  or Europe regularly, but without that travel pattern a general travel card
  will serve you better.
