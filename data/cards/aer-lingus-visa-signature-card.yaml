our_take: >
  The Aer Lingus Visa Signature is worth carrying mainly for its 75,000 Avios
  welcome bonus after $5,000 in three months, a large haul for a card with a
  $95 annual fee and no foreign transaction fees. Ongoing earning is narrow:
  3x Avios only on Aer Lingus, British Airways, and Iberia flights, 2x on
  hotels booked directly, and 1x everywhere else, so this is not a card for
  daily spending. The perks lean transatlantic, with priority boarding on Aer
  Lingus flights between the US and Ireland, 10% off Aer Lingus flights to
  Europe booked through the cardmember site, and 2,500 bonus Avios each
  account anniversary. The companion ticket is the headline benefit but it
  takes $30,000 of spending in a calendar year to earn, which is a high bar on
  a card that only earns 1x on most purchases. Take the bonus if you fly Aer
  Lingus or British Airways, and decide each year whether the anniversary
  Avios and boarding perks justify the fee.
