our_take: >
  The Amazon Business Prime American Express is not currently accepting
  applications, but for businesses that already hold it, the appeal is
  straightforward: 5% back on U.S. purchases at Amazon.com, Amazon Business,
  AWS, and Whole Foods Market with no annual fee. That 5% rate applies to up
  to $120,000 in spending per year before dropping to 1%, which is generous
  enough for most small businesses. Outside Amazon the earning is modest, at
  2% on U.S. restaurants and gas stations and 1% on everything else. Hold onto
  it if Amazon and AWS are major line items for your business, but pair it
  with a stronger card for general spending.
