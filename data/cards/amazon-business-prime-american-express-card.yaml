our_take: >
  The Amazon Business Prime American Express is no longer accepting
  applications, so it matters mainly to existing cardholders. Its strength is
  5% back on U.S. purchases at Amazon.com, Amazon Business, AWS, and Whole
  Foods Market, with no annual fee, on up to $120,000 in spending per year
  before the rate drops to 1%. That cap is generous enough that most small
  businesses will never hit it. The rest of the earning is modest: 2% at U.S.
  restaurants and gas stations and 1% on everything else. For a business that
  buys heavily from Amazon, it remains a worthwhile card to keep, but
  everything outside Amazon is better put on a card with a stronger base rate.
