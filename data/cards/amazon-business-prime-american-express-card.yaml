our_take: >
  American Express is no longer accepting applications for the Amazon Business
  Prime card, so this one matters only to existing cardholders. For those who
  have it, the earn rate is still hard to beat for a no annual fee business
  card: 5% back on U.S. purchases at Amazon.com, Amazon Business, AWS, and
  Whole Foods Market on up to $120,000 of annual spend, which is a high enough
  ceiling that most small businesses will never reach it. Outside that, it
  earns 2% at U.S. restaurants and gas stations and 1% on everything else, so
  it is a spend-anchoring card for Amazon and AWS bills rather than a general
  business card. The $125 welcome offer with no spending requirement was a
  nice entry point but is academic now that applications are closed. Keep it
  for the 5% if you buy through Amazon Business or run workloads on AWS, and
  route the rest of your spending elsewhere.
