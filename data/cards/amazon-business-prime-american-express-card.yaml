our_take: >
  This card is no longer accepting applications, so it only matters to
  businesses that already carry it. For those holders, the core value is 5%
  back on U.S. purchases at Amazon, Amazon Business, AWS, and Whole Foods
  Market on up to $120,000 a year, with no annual fee. That cap is generous
  enough that most small businesses will never hit it, though spending beyond
  it drops to 1%. Outside Amazon, the card earns 2% at U.S. restaurants and
  gas stations and 1% on everything else, so it is not a strong general
  business card. If you already have it and spend heavily on Amazon or AWS,
  keep using it there and pair it with a better flat-rate card for other
  expenses.
