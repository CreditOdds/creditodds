our_take: >
  The Venture Rewards is about as simple as a travel card gets: 2 miles per
  dollar on every purchase, with 5 miles on hotels and rental cars booked
  through Capital One Travel. The welcome offer of 75,000 miles after $4,000
  in spend in 3 months, plus a $250 travel credit in the first cardholder
  year, does a lot to justify opening it. The catch is the $95 annual fee buys
  little beyond the earn rate: a Global Entry or TSA PreCheck credit and a $50
  experience credit on niche Lifestyle Collection stays are the main extras.
  The 5 miles on Capital One Entertainment applies only to purchases on that
  platform, not to entertainment generally. If you want one card that earns a
  strong flat rate everywhere with no foreign transaction fees, it fits; if
  you chase category bonuses, you will outgrow it.
