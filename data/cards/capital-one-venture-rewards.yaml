our_take: >
  The Venture Rewards earns a flat 2x miles on everything for a $95 annual
  fee, the simplest version of the earn-and-transfer pitch and enough to place
  it #8 on our Best Travel Credit Cards list. The current offer is 75,000
  miles after $4,000 of spend in the first 3 months plus a $250 travel credit
  in your first cardholder year, so year one clears the fee comfortably. The
  5x rates are narrower than they look: they apply to hotels and rental cars
  booked through Capital One Travel and to tickets bought on the Capital One
  Entertainment platform, which excludes general entertainment, dining
  reservations, and Capital One Dining. Ongoing perks are modest beyond that,
  with up to $120 for Global Entry or TSA PreCheck every four years and a $50
  experience credit on Lifestyle Collection stays. If you want lounge access
  and a $300 travel credit, the Venture X is the step up; if you just want 2x
  on everything without thinking about it, this is the cleaner card.
