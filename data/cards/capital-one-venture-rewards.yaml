our_take: >
  The Venture Rewards earns a flat 2 miles per dollar on everything, which
  makes it one of the easiest travel cards to use without thinking about
  categories, and it currently ranks #6 on our Best Travel Credit Cards list.
  New cardholders can earn 75,000 miles after $4,000 in spend within 3 months,
  plus a $250 travel credit in the first cardholder year, which covers the $95
  annual fee for a couple of years on its own. You also get 5x on hotels and
  rental cars booked through Capital One Travel, 5x on Capital One
  Entertainment platform purchases only, no foreign transaction fees, and up
  to $120 toward Global Entry or TSA PreCheck every four years. The catch is
  that ongoing perks are thin after year one: beyond a $50 experience credit
  on niche Lifestyle Collection stays and 50% off Capital One Café drinks,
  there is little to offset the fee except the 2x earn itself. It is a solid
  pick for someone who wants one travel card for all spending, but not for
  anyone chasing premium extras.
