our_take: >
  The Discover it Secured is that rare secured card with a real rewards
  program attached, and with no annual fee it tops our Best Secured Credit
  Cards list. You earn 5% cash back in rotating quarterly categories on up to
  $1,500 in spending each quarter, and for Q4 2026 those categories are
  dining, entertainment, and utilities, with 1% on everything else. The catch
  is the work involved: you have to activate the categories every quarter, and
  anything past the $1,500 cap drops back to 1%. The 26.49% regular APR is
  also steep, so carrying a balance would quickly wipe out whatever you earn.
  No foreign transaction fee is a nice extra for a starter card. Use it to
  build credit, pay in full each month, and treat the cash back as a bonus
  rather than the main reason to apply.
