our_take: >
  The Discover it Secured is the rare secured card that earns real rewards,
  which is why it sits at #1 on our Best Secured Credit Cards list. It charges
  no annual fee and pays 5% cash back on rotating quarterly categories
  (dining, entertainment, and utilities for Q4 2026) on up to $1,500 in
  spending per quarter, plus 1% on everything else. That combination makes it
  a sensible first card if you are building or rebuilding credit and want your
  everyday spending to pay something back. The catch is the bookkeeping: you
  have to activate the 5% categories every quarter, and spending past the
  $1,500 cap drops back to 1%. The 26.49% regular APR is also steep, so pay
  the balance in full each month and let the card do its main job of building
  your history.
