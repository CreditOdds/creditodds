our_take: >
  The Discover it Secured earns real rewards while you build credit, which
  most secured cards don't: 5% cash back in rotating quarterly categories on
  up to $1,500 in spending each quarter, plus 1% on everything else, all with
  no annual fee. That earning structure is a big part of why it ranks as our
  Best Overall secured card. The catch is that the 5% takes work, since you
  have to activate the categories every quarter and they change (Q3 2026
  covers gas, EV charging, transit, airlines, and drugstores), so a forgotten
  activation leaves you at 1%. The 26.49% APR is also steep, which matters on
  a card aimed at people still establishing a track record, so plan to pay in
  full each month. No foreign transaction fee is a small bonus if you travel.
