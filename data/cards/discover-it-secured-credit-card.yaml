our_take: >
  The Discover it Secured earns real rewards while you build credit, which is
  rare for a secured card: 5% cash back on quarterly rotating categories
  (dining, entertainment, and utilities for Q4 2026) on up to $1,500 in spend
  each quarter, plus 1% on everything else, all with no annual fee. That
  combination is why it sits at the top of our Best Secured Credit Cards list
  as the best overall pick. The catch is the bonus categories take work: you
  have to activate them every quarter, and anything past the $1,500 cap drops
  to 1%. The 26.49% APR is also steep, so carrying a balance would quickly
  wipe out whatever you earn. No foreign transaction fee is a nice extra, but
  the real job here is building a payment history while collecting some cash
  back along the way.
