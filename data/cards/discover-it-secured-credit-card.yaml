our_take: >
  This is our #1 pick and Best Overall on the Best Secured Credit Cards list,
  largely because it does something most secured cards don't: it actually pays
  rewards. You get 5% back in rotating quarterly categories, currently gas, EV
  charging, transit, airlines, and drugstores for Q3 2026, plus 1% on
  everything else, with no annual fee and no foreign transaction fee. The
  limits are the usual ones: activation is required every quarter and the 5%
  applies only to the first $1,500 of spending, after which it drops to 1%.
  The APR is a flat 26.49%, so this card only makes sense if you pay in full
  each month, which is the point of a secured card anyway. Fund the deposit,
  use it lightly, pay it off, and let the account age.
