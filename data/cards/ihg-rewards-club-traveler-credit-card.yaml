our_take: >
  The IHG Rewards Club Traveler is the no-annual-fee way into IHG, and its
  current 125,000-point signup bonus after $2,000 in spending over three
  months is the main reason to open it, back up from the 80,000 it dipped to
  over the summer. Ongoing earn is solid for a free card: 5x at IHG hotels, 3x
  on dining, gas, and groceries, and 2x on everything else. Automatic Silver
  Elite status and 5 Elite Night Credits each year are modest perks, while
  Gold Elite status takes $15,000 in calendar-year spending. The tradeoffs are
  timing related: the 4th reward night free becomes a $5,000 spending
  requirement starting in 2027, and the 3x on utilities, phone and internet,
  and streaming falls to 2x after December 31, 2026. There is no anniversary
  free night here, so frequent IHG guests will likely get more from the
  Premier.
