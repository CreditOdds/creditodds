our_take: >
  The IHG Rewards Club Traveler is a no-annual-fee way to earn IHG points,
  with 5 points per dollar at IHG hotels, 3 per dollar on dining, gas,
  utilities, internet, cable, phone, and select streaming, and 2 per dollar on
  everything else. The signup bonus is 80,000 points after $2,000 in spending
  in the first three months, though it recently dropped from a short-lived
  125,000 offer. You also get automatic Silver Elite status and a fourth night
  free when you redeem points for a four-night stay. The tradeoff versus the
  Premier is clear: there is no anniversary free night, and Gold Elite status
  requires $20,000 in yearly spending, so the card does less to reward
  loyalty. It fits best if you stay with IHG occasionally and want to keep
  earning hotel points without paying a fee, and the monthly Instacart credit
  and DashPass membership are small bonuses on top.
