our_take: >
  The Capital One Platinum is a no-frills, no-annual-fee card built for one
  job: helping you build credit with on-time payments. There is no fee to keep
  it open and no foreign transaction fee, which makes it a low-cost card to
  hold for the long term as your account ages. The tradeoff is that it earns
  no rewards, offers no intro APR, and charges a flat 28.99% regular APR, so
  it gives you nothing back for your spending and punishes carried balances.
  Treat it as a stepping stone: pay it in full each month, and once your
  profile improves, look at a card that actually earns cash back.
