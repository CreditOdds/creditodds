our_take: >
  The Platinum is a no-frills credit builder: no annual fee and no foreign
  transaction fee, so it costs nothing to hold while you establish a track
  record. That makes it a reasonable first unsecured card if your goal is
  simply to build credit history without paying for the privilege. The catch
  is that it earns no rewards, offers no signup bonus, and has no intro APR,
  so there is nothing here beyond the credit line itself. The 28.99% APR is
  high enough that carrying a balance would quickly undo any benefit. Pay it
  off in full each month, let the account age, and plan to graduate to a
  rewards card once your score improves.
