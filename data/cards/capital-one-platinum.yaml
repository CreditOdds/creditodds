our_take: >
  The Capital One Platinum exists to help you build or rebuild credit without
  paying an annual fee, and it does that job without frills. It is an
  unsecured card, so there is no deposit tied up, which is the main thing it
  offers over a secured option. The catch is that it earns no rewards, carries
  no intro APR, and charges a flat 28.99% APR, so every dollar of interest you
  pay is pure cost. Use it for a few small purchases a month, pay the
  statement in full, and let the on-time history do the work. No foreign
  transaction fee is a minor bonus if you travel, but once your credit
  improves this card has little reason to stay at the top of your wallet.
