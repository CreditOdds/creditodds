our_take: >
  The Slate Edge is a no-annual-fee Chase card built around balance transfers
  rather than rewards, which is why it lands on our Best 0% APR list. If your
  goal is to move existing debt somewhere cheaper and pay it down, it can do
  that job without costing you a yearly fee. The catch is everything outside
  that use case: there is no earn rate at all, and the regular APR is a flat
  28.99%, so any balance left once the promotional terms end gets expensive
  fast. It also charges foreign transaction fees, which rules it out for
  travel. Six months of complimentary DashPass is a small welcome extra, not a
  reason to keep the card long term.
