our_take: >
  The Cashback Rewards Plus is a strong no-annual-fee pick for USAA members
  who fill up often: 5% back on the first $3,000 of gas each year and 5% on
  the first $5,000 at military bases, plus 3% on the first $3,000 of
  groceries. Those caps are the catch, since everything beyond them and all
  other spending drops to 1%, so heavy spenders will hit the ceilings and want
  a flat-rate card alongside it. There is also a 0% intro APR on balance
  transfers through the March 2028 billing cycle, but only for transfers that
  post by November 30, 2026, and each one carries a 5% fee. No foreign
  transaction fee is a nice bonus for deployments and travel. Keep in mind it
  runs on the American Express network, which is not accepted everywhere a
  Visa is.
