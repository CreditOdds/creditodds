our_take: >
  The Cashback Rewards Plus pays 5% on gas on the first $3,000 a year and 5%
  at military bases on the first $5,000 a year, with no annual fee, which
  makes it a strong fit for anyone who fuels up often or shops on base.
  Groceries earn 3% on the first $3,000 a year, rounding out a solid set of
  everyday categories. The catch is the caps: once you hit them, those
  purchases drop to the 1% base rate, so big spenders will outgrow the bonus
  tiers quickly. There is also a 0% intro APR on balance transfers through the
  March 2028 billing cycle for transfers posted by November 30, 2026, though
  the 5% transfer fee eats into the savings. No foreign transaction fee makes
  it usable abroad, but keep in mind it runs on the American Express network,
  which is not accepted everywhere.
