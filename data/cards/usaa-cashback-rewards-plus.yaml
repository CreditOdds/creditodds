our_take: >
  The Cashback Rewards Plus pays 5% back on gas and at military bases, plus 3%
  on groceries, with no annual fee and no foreign transaction fees. Those
  rates come with caps, though: 5% on the first $3,000 of gas and the first
  $5,000 at military bases each year, and 3% on the first $3,000 of groceries,
  with everything above that and all other spending earning just 1%. That
  makes it a strong fit for households whose spending clusters in those
  categories and stays near the caps. It also carries 0% intro APR on balance
  transfers through the March 2028 billing cycle for transfers posting by
  November 30, 2026, though the 5% transfer fee eats into the savings. It runs
  on the American Express network, so check acceptance where you shop before
  making it your main card.
