our_take: >
  The Cashback Rewards Plus is built for military households: 5% cash back on
  military base purchases (first $5,000 a year) and 5% on gas (first $3,000 a
  year), plus 3% on groceries up to $3,000 a year, all with no annual fee. If
  you regularly shop on base and fill up often, those capped categories can
  add up to real money. It also offers a 0% intro APR on balance transfers
  through the March 2028 billing cycle, roughly 20 months, for transfers
  posting by November 30, 2026, though a 5% transfer fee applies. The
  tradeoffs are the caps and the 1% base rate on everything else, so heavy
  spenders will blow through the bonus limits and fall back to a weak earn.
  There's also no signup bonus, but no foreign transaction fee makes it a
  solid card to take on deployment or travel abroad.
