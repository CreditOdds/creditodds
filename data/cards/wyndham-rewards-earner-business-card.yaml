our_take: >
  Barclays raised this card's welcome offer from 45,000 to 100,000 points in
  June, and that is now the clearest reason to look at it: 45,000 after $3,000
  of spending in the first 90 days, plus 55,000 more after $500 at Hotels by
  Wyndham within 180 days. The ongoing structure is built for a road-based
  business, with 5 points per dollar on gas, EV charging, office supplies and
  shipping, and 8 points per dollar specifically at Wyndham hotels. Top-tier
  Diamond status, 15,000 anniversary points, and a 20% discount on award
  redemptions all push in the same direction, and there is no foreign
  transaction fee. The tradeoff arrived in that same June update, when the
  annual fee went from $95 to $149, so the anniversary points and the $65
  warehouse club credit now cover less of the cost than they used to.
  Everything outside those categories earns 1 point per dollar, so this only
  works if Wyndham stays in your regular travel rotation.
