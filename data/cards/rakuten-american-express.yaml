name: "Rakuten American Express"
bank: "American Express"
slug: "rakuten-american-express"
accepting_applications: true
apply_link: https://www.rakuten.com/american-express-card
# Checker-only: rakuten.com renders this card's page inside a cross-origin iframe
# served from rakuten.imprint.co (Imprint issues the card), so a fetch of
# apply_link strips to ~523 chars of accessibility boilerplate. Point the page
# check at the framed document directly; the Apply button still uses apply_link.
# NOTE: this path is a dated campaign slug and will rotate — when the check skips
# Rakuten with an HTTP 404, re-read the iframe src on apply_link and update it.
page_check_url: https://rakuten.imprint.co/cham-july-2026
category: "cashback"
image: "rakuten-american-express.png"
annual_fee: 0
tags:
  - cashback
  - shopping
  - dining
  - rewards
reward_type: "cashback"
rewards:
  - category: "rakuten"
    value: 4
    unit: "percent"
    note: "Rakuten.com purchases, up to $10,000 in spend per calendar year (then 1%); cap raised from $7,000 on July 15, 2026"
  - category: "rakuten_dining"
    value: 5
    unit: "percent"
    note: "Rakuten Dining purchases"
  - category: "groceries"
    value: 2
    unit: "percent"
  - category: "dining"
    value: 2
    unit: "percent"
  - category: "everything_else"
    value: 1
    unit: "percent"
signup_bonus:
  value: 100
  type: "cash"
  spend_requirement: 1000
  timeframe_months: 3
apr:
  regular:
    min: 19.74
    max: 33.99
foreign_transaction_fee: false
network: "amex"
our_take: >
  The Rakuten American Express pairs naturally with the Rakuten shopping
  portal, earning 4% cash back on Rakuten.com purchases on up to $10,000 in
  spending per calendar year, a cap that was raised from $7,000 in July. It
  also earns 5% on Rakuten Dining purchases and 2% at grocery stores and
  restaurants, all with no annual fee and no foreign transaction fee. The
  signup bonus was recently cut from $200 to $100 after $1,000 in spending
  within three months, so the welcome offer is no longer much of a draw.
  Outside of Rakuten, the 2% categories are respectable but not standout, and
  everything else earns just 1%. It is a good fit if you already route a lot
  of online shopping through Rakuten, and a weak one if you don't.
