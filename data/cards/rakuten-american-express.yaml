name: "Rakuten American Express"
bank: "American Express"
slug: "rakuten-american-express"
accepting_applications: true
apply_link: https://www.rakuten.com/american-express-card
# Checker-only: rakuten.com renders this card's page inside a cross-origin iframe
# served from rakuten.imprint.co (Imprint issues the card), so a fetch of
# apply_link strips to ~523 chars of accessibility boilerplate. Point the page
# check at the framed document directly; the Apply button still uses apply_link.
# NOTE: this path is a dated campaign slug and will rotate — when the check skips
# Rakuten with an HTTP 404, re-read the iframe src on apply_link and update it.
page_check_url: https://rakuten.imprint.co/cham-july-2026
category: "cashback"
image: "rakuten-american-express.png"
annual_fee: 0
tags:
  - cashback
  - shopping
  - dining
  - rewards
reward_type: "cashback"
rewards:
  - category: "rakuten"
    value: 4
    unit: "percent"
    note: "Rakuten.com purchases, up to $10,000 in spend per calendar year (then 1%); cap raised from $7,000 on July 15, 2026"
  - category: "rakuten_dining"
    value: 5
    unit: "percent"
    note: "Rakuten Dining purchases"
  - category: "groceries"
    value: 2
    unit: "percent"
  - category: "dining"
    value: 2
    unit: "percent"
  - category: "everything_else"
    value: 1
    unit: "percent"
signup_bonus:
  value: 100
  type: "cash"
  spend_requirement: 1000
  timeframe_months: 3
apr:
  regular:
    min: 19.74
    max: 33.99
foreign_transaction_fee: false
network: "amex"
our_take: >
  This is a shopper's card built around one ecosystem: 4% back on Rakuten.com
  purchases on up to $10,000 of spending per calendar year, a cap raised from
  $7,000 in July 2026, plus 5% on Rakuten Dining purchases. Outside that, 2%
  on groceries and 2% on dining are reasonable but not category-leading, and
  everything else drops to 1%. There's no annual fee and no foreign
  transaction fee, so the card costs nothing to keep around for Rakuten runs.
  Note that the signup bonus was cut in July 2026 from $200 to $100 after
  $1,000 in spending within three months, which takes a lot of the first-year
  shine off. The math only works if you genuinely shop through Rakuten; if you
  don't, the 1% base rate makes this an easy pass.
