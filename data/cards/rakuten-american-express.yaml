name: "Rakuten American Express"
bank: "American Express"
slug: "rakuten-american-express"
accepting_applications: true
apply_link: https://www.rakuten.com/american-express-card
# Checker-only: rakuten.com renders this card's page inside a cross-origin iframe
# served from rakuten.imprint.co (Imprint issues the card), so a fetch of
# apply_link strips to ~523 chars of accessibility boilerplate. Point the page
# check at the framed document directly; the Apply button still uses apply_link.
# NOTE: this path is a dated campaign slug and will rotate — when the check skips
# Rakuten with an HTTP 404, re-read the iframe src on apply_link and update it.
page_check_url: https://rakuten.imprint.co/cham-july-2026
category: "cashback"
image: "rakuten-american-express.png"
annual_fee: 0
tags:
  - cashback
  - shopping
  - dining
  - rewards
reward_type: "cashback"
rewards:
  - category: "rakuten"
    value: 4
    unit: "percent"
    note: "Rakuten.com purchases, up to $10,000 in spend per calendar year (then 1%); cap raised from $7,000 on July 15, 2026"
  - category: "rakuten_dining"
    value: 5
    unit: "percent"
    note: "Rakuten Dining purchases"
  - category: "groceries"
    value: 2
    unit: "percent"
  - category: "dining"
    value: 2
    unit: "percent"
  - category: "everything_else"
    value: 1
    unit: "percent"
signup_bonus:
  value: 100
  type: "cash"
  spend_requirement: 1000
  timeframe_months: 3
apr:
  regular:
    min: 19.74
    max: 33.99
foreign_transaction_fee: false
network: "amex"
our_take: >
  If you shop Rakuten.com regularly, the 4% back on Rakuten purchases is the
  reason to carry this card, and the cap on that rate was recently raised from
  $7,000 to $10,000 of spend per calendar year before it drops to 1%. Rakuten
  Dining purchases earn 5%, and the rest of the lineup is reasonable for a
  no-annual-fee card: 2% at grocery stores, 2% on dining, 1% on everything
  else, and no foreign transaction fees. The catch is that the headline rate
  is tied to one retailer's ecosystem, so the card is worth exactly as much as
  the share of your spending that actually runs through Rakuten. Amex also
  halved the welcome offer in July 2026, from $200 to $100 after $1,000 of
  spend in the first three months, so the upfront incentive is weaker than it
  was. Worth a slot if Rakuten is already part of your routine, easy to skip
  if it isn't.
