our_take: >
  The Enjoy Cash 3-2-1 pays 3% cash back on gas and EV charging and 2% on
  groceries and utilities, with no annual fee and a 12-month 0% intro APR on
  purchases and balance transfers. The catch is a tight cap: those 3% and 2%
  rates share a combined $1,000 monthly spending limit, after which everything
  drops to 1%, the same as the base rate on all other purchases. That cap is
  fine for a modest household budget but limits the upside for heavier
  spenders. Truist banking customers get extra mileage from the Loyalty Cash
  Bonus, which adds 10% to 50% on rewards redeemed into an eligible Truist
  deposit account depending on combined balances. No foreign transaction fee
  rounds it out, making this a solid everyday card for existing Truist
  customers whose gas and grocery spend fits under the cap.
