our_take: >
  The Enjoy Cash 3-2-1 pays 3% back on gas and EV charging and 2% on groceries
  and utilities with no annual fee and no foreign transaction fee, which is a
  reasonable everyday mix if your spending clusters in those buckets. The
  catch is the cap: the 3% and 2% tiers share a single $1,000 monthly limit,
  and everything past it drops to 1%, the same rate the card pays on all other
  purchases. That ceiling puts a hard lid on what the card can return in a
  year, so it works better as a topped-up category card than as your only one.
  A 0% intro APR for 12 months on both purchases and balance transfers gives
  you some breathing room up front, after which the rate runs 18.74% to
  27.74%. The Loyalty Cash Bonus adds 10% to 50% to your redemption if you
  bank with Truist, so the card is most worth carrying for existing Truist
  deposit customers.
