our_take: >
  The Enjoy Cash 3-2-1 pays 3% on gas and EV charging and 2% on groceries and
  utilities, with no annual fee and 12 months of 0% intro APR on purchases and
  balance transfers. That lineup covers a lot of routine household spending,
  and Truist banking customers can stretch it further with a 10% to 50%
  Loyalty Cash Bonus on rewards redeemed into an eligible Truist deposit
  account. The catch is the cap: the 3% and 2% categories share a combined
  $1,000 monthly limit, after which everything drops to 1%. Since 1% is also
  the base rate on all other purchases, bigger spenders will find the ceiling
  arrives quickly. It works best for a household with moderate gas and grocery
  bills, ideally one already banking at Truist.
