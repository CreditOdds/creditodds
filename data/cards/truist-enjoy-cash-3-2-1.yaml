our_take: >
  The Enjoy Cash 3-2-1 earns 3% cash back on gas and EV charging and 2% on
  groceries and utilities with no annual fee, which covers a big chunk of a
  typical household budget. It also opens with 12 months of 0% intro APR on
  both purchases and balance transfers, so it can double as a short payoff
  runway. The catch is the cap: the 3% and 2% categories share a single $1,000
  monthly spending limit, after which everything drops to 1%, so heavier
  spenders will hit the ceiling fast. The best reason to pick this over a
  national competitor is the Loyalty Cash Bonus, which adds 10% to 50% to
  rewards redeemed into an eligible Truist deposit account depending on your
  combined Truist balances. If you already bank with Truist and spend
  moderately, it is a sensible everyday card; if you don't, the capped rates
  and 1% base are hard to get excited about.
