our_take: >
  The Discover it Cash Back earns 5% in quarterly rotating categories, which
  for Q4 2026 are dining, entertainment, and utilities, on up to $1,500 in
  spending each quarter after you activate. That works out to as much as $75
  in bonus cash back per quarter with no annual fee, and it places the card on
  our list of the best cash back cards. A 0% intro APR for 15 months on both
  purchases and balance transfers adds real value if you're carrying a balance
  or planning a large purchase. The tradeoff is effort and a low floor: you
  have to activate each quarter, the categories change, and everything else
  earns just 1%. It works best as a companion to a flat-rate card rather than
  as your only card.
