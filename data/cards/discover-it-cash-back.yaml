our_take: >
  The Discover it Cash Back pairs 5% cash back on rotating quarterly
  categories with no annual fee and a long 15-month 0% intro APR on both
  purchases and balance transfers. For Q3 2026 the 5% categories are gas, EV
  charging, transit, airlines, and drugstores, which cover a lot of everyday
  spending for many households. The catch is the work involved: you have to
  activate the bonus each quarter, and the 5% rate applies only to the first
  $1,500 in category spending per quarter before dropping to 1%. Outside those
  categories, everything earns just 1%, which is weak for a base rate. No
  foreign transaction fee is a nice extra. It ranks #7 on our Best Cash Back
  Credit Cards list, and it works best as a companion to a flat-rate card for
  people who will actually track and activate the categories each quarter.
