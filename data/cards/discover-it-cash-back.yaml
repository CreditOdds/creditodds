our_take: >
  The Discover it Cash Back pairs 5% back on quarterly rotating categories,
  dining, entertainment, and utilities for Q4 2026, with 15 months of 0% intro
  APR on both purchases and balance transfers and no annual fee. That
  combination makes it a flexible pick for someone who wants to float a
  purchase or move a balance while still earning meaningful rewards, and it
  ranks #8 on our Best Cash Back Credit Cards list. The catch is the work
  involved: you must activate the categories every quarter, and the 5% rate
  stops at $1,500 in spend per quarter before dropping to 1%. Outside the
  bonus categories, everything else earns just 1%, which lags flat-rate cards.
  No foreign transaction fee is a nice extra, but this card rewards people
  willing to track the calendar and pair it with a stronger everyday card.
