our_take: >
  The Discover it Cash Back earns 5% in rotating quarterly categories on up to
  $1,500 in spending per quarter, which for Q4 2026 covers dining,
  entertainment, and utilities, then 1% on everything else, all with no annual
  fee. It also offers 0% intro APR on purchases and balance transfers for 15
  months, so it can double as a modest financing tool. The catch is the work
  involved: you have to activate the 5% categories every quarter, and the cap
  means the bonus tops out at $75 per quarter before dropping to 1%. Outside
  those categories, the flat 1% base rate is weak compared with simpler
  flat-rate cards. It ranks #7 on our Best Cash Back Credit Cards list and
  works best as a no-fee companion card for people willing to track the
  calendar.
