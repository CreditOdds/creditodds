our_take: >
  The Travel Advantage leads with 5% cash back on gas and EV charging, then
  layers 3% on groceries, dining, travel, and transit, all with no annual fee
  and no foreign transaction fees. That spread of 3% categories is broad for a
  no-fee card and makes it a reasonable everyday option for drivers and
  road-trippers, with a $100 bonus after $1,000 in spending in the first three
  months. The tradeoff is that the 5% gas rate is capped at $350 in cash back
  per year, roughly $7,000 in spending, before falling to 1%. The base rate on
  everything else is also just 1%, so purchases outside the named categories
  earn little. The 4% on Hertz rentals and the AAA redemption bonus are
  worthwhile only if you rent from Hertz or redeem through AAA.
