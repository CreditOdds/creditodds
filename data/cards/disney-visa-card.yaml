name: "Disney Visa"
bank: "Chase"
slug: "disney-visa-card"
accepting_applications: true
image: "chase-disney.png"
annual_fee: 0
reward_type: "cashback"
rewards:
  - category: everything_else
    value: 1
    unit: percent
    note: "1% in Disney Rewards Dollars on all purchases"
signup_bonus:
  value: 150
  type: "cash"
  spend_requirement: 500
  timeframe_months: 3
  note: "$100 Disney eGift Card upon approval + $50 statement credit after spending $500 in first 3 months"
apr:
  regular:
    min: 18.24
    max: 27.74
apply_link: https://creditcards.chase.com/rewards-credit-cards/disney/rewards
