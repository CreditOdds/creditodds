our_take: >
  The no-annual-fee Disney Visa is best understood as a park-perks card with a
  welcome offer attached: $150 total, split between a $100 Disney eGift Card
  on approval and a $50 statement credit after $500 of spending in the first
  three months. Ongoing, it earns a flat 1% in Disney Rewards Dollars on all
  purchases, which is below what a plain no-fee cash back card pays, and those
  rewards are most useful inside the Disney ecosystem rather than as cash. The
  reason to keep it in a drawer is the in-park discounts, 10% off select
  merchandise and select dining and 15% off select guided tours, plus a
  complimentary one-year DoorDash DashPass membership that requires
  enrollment. It also charges foreign transaction fees, so it is not a card
  for travel outside the U.S. Grab it for the sign-up value and the park
  discounts if you go often, but do not put your everyday spending on it.
benefits:
  - name: "DoorDash DashPass"
    value: 0
    description: "Complimentary one-year DashPass membership providing unlimited deliveries with $0 delivery fees on eligible orders"
    frequency: "one_time"
    category: "dining"
    enrollment_required: true
    merchants:
      - doordash
  - name: "Purchase Protection"
    description: "Covers eligible new purchases against damage or theft for 120 days from date of purchase up to $500 per item"
    category: "protection"
    enrollment_required: false
  - name: "Baggage Delay Insurance"
    description: "Reimburses up to $100 per day for up to 3 days for essential purchases when baggage is delayed over 6 hours"
    category: "travel"
    enrollment_required: false
  - name: "Disney Park Merchandise Discount"
    description: "10% off select merchandise purchases at Disneyland and Walt Disney World Resort locations"
    frequency: "per_purchase"
    category: "shopping"
    enrollment_required: false
  - name: "Disney Park Dining Discount"
    description: "10% off select dining locations at Disneyland and Walt Disney World Resort"
    frequency: "per_purchase"
    category: "dining"
    enrollment_required: false
  - name: "Disney Guided Tour Discount"
    description: "15% off select guided tours at Disneyland and Walt Disney World Resort"
    frequency: "per_purchase"
    category: "entertainment"
    enrollment_required: false
  - name: "DisneyStore.com Discount"
    description: "10% savings on select purchases at DisneyStore.com"
