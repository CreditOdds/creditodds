our_take: >
  The QuicksilverOne offers a flat 1.5% cash back on every purchase, plus 5%
  on hotels and rental cars booked through Capital One Travel, which is a
  respectable earn rate for a card at this tier. It also skips the foreign
  transaction fee, so it works abroad without extra cost. The catch is the $39
  annual fee: you need to spend about $2,600 a year just to break even on it
  at 1.5%, and there is no signup bonus or intro APR to offset it. The 28.99%
  APR is also high, so carrying a balance erases the rewards quickly. It can
  make sense if you will use it regularly and pay in full, but weigh that fee
  carefully before applying.
