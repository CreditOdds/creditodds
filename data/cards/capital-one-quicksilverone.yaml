our_take: >
  The QuicksilverOne offers something many fair-credit cards do not: real
  rewards, with a flat 1.5% cash back on everything and 5% on hotels and
  rental cars booked through Capital One Travel, plus no foreign transaction
  fees. The catch is the $39 annual fee, which means you need to spend about
  $2,600 a year just to break even on the base rate. There is also no signup
  bonus and no intro APR, and the 28.99% APR makes carrying a balance costly
  enough to erase any cash back. It makes sense if your credit currently
  limits your options and you will put steady spending on it while paying in
  full. Once your credit improves, look to move to a no-fee card with the same
  earn rate.
