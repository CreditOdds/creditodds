our_take: >
  The QuicksilverOne offers a rare thing for a card aimed at building credit:
  a flat 1.5% cash back on everything, plus 5% on hotels and rental cars
  booked through Capital One's travel portal, with no foreign transaction fee.
  The catch is the $39 annual fee, which means you need about $2,600 a year in
  spending just to break even at 1.5%. Add a 28.99% regular APR and no intro
  APR or signup bonus, and the card only makes sense if you pay in full every
  month. It is a reasonable option if you cannot yet qualify for the no-fee
  Quicksilver, but plan to move to a fee-free card once your credit improves.
