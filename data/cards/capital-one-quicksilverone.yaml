our_take: >
  The QuicksilverOne pays a flat 1.5% back on every purchase with no
  categories to manage, which is a genuine rewards rate on a card aimed at
  people still building credit. The problem is the $39 annual fee: at 1.5%,
  you need to spend about $2,600 a year just to earn the fee back, and every
  dollar short of that is a net loss. Hotels and rental cars booked through
  Capital One Travel earn 5%, but only when booked inside that portal. There
  is no signup bonus and no intro APR window, and the regular rate is a flat
  28.99%, so a carried balance is expensive from the first month. If you can
  qualify for a no fee card earning the same 1.5%, take that instead; this one
  makes sense mainly when approval odds, not economics, are the binding
  constraint.
