our_take: >
  Navy Federal has stopped taking new applications for the Visa Signature
  Flagship Travel Rewards, so this card is now relevant only to existing
  cardholders. Before it closed, the annual fee jumped from $49 to $95 and the
  welcome offer rose from 35,000 to 50,000 points, a sign the product was
  being repositioned. For current holders, the appeal is a flat 2 points per
  dollar on everything plus 3 points on a broad travel category that covers
  airlines, hotels, car rentals, ride-sharing, parking, tolls, and even
  museums and golf courses. The perks help justify the higher fee: a statement
  credit covering one Amazon Prime annual membership each year when you pay
  for it with the card, a Global Entry or TSA PreCheck credit of up to $120
  every four years, and no foreign transaction fees. If you already carry it
  and use Prime, the math still works at $95; if you do not, the jump from $49
  is a fair reason to reconsider whether it stays in your wallet.
