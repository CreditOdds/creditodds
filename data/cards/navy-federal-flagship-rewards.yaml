our_take: >
  Navy Federal has stopped accepting new applications for the Flagship Travel
  Rewards, so this take is mainly for existing cardholders deciding whether to
  keep it. Just before closing it, Navy Federal nearly doubled the annual fee
  from $49 to $95 while raising the signup bonus from 35,000 to 50,000 points.
  The earning is still solid: 3 points per dollar on a broad travel category
  that includes ride-sharing, parking, tolls, and even museums, and a generous
  2 points per dollar on everything else. An annual statement credit for one
  Amazon Prime membership paid with the card, a Global Entry or TSA PreCheck
  credit of up to $120 every four years, and no foreign transaction fees help
  offset the higher fee. If you already pay for Prime and put real spending on
  the card, keeping it still makes sense, but the fee hike is worth rechecking
  against how much you actually use it.
