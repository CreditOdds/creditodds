our_take: >
  Navy Federal is no longer accepting applications for the Visa Signature
  Flagship Travel Rewards, so this take is for existing cardholders deciding
  whether to keep it. Shortly before closing to new applicants, the annual fee
  jumped from $49 to $95, which changes the math for anyone who signed up at
  the old price. The card still earns a respectable 2 points per dollar on
  everything and 3 on a broad travel category that includes airlines, hotels,
  ride-sharing, parking, tolls, and even museums and golf courses. The Amazon
  Prime membership credit of up to $139 per year, when you pay for Prime with
  the card, can cover the new fee by itself if you already subscribe, and
  there's a Global Entry or TSA PreCheck credit every four years. If you don't
  use Prime, weigh the higher fee carefully against what you earn, because the
  2x base rate alone has to do a lot of work.
