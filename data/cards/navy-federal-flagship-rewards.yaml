our_take: >
  Navy Federal stopped accepting new applications for the Flagship Travel
  Rewards on September 29, 2026, so this take is mainly for existing
  cardholders deciding whether to keep it. The card's strength was its
  earning: 3 points per dollar on a broad travel category that includes
  airlines, hotels, ride-sharing, parking, tolls and even museums and golf
  courses, plus a solid 2 points on everything else. The tradeoff got steeper
  this month, when the annual fee jumped from $49 to $95 just before the card
  closed to applicants. To justify that higher fee, you need to actually use
  the annual Amazon Prime membership credit, which alone covers more than the
  fee if you already pay for Prime with the card. Up to $120 for Global Entry
  or TSA PreCheck every four years and no foreign transaction fees help, but
  if you don't use Prime, the math on keeping this card is far less convincing
  than it used to be.
