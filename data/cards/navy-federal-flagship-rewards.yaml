our_take: >
  The Flagship Travel Rewards card's strength is its floor: 2 points per
  dollar on everything, with 3 points on an unusually broad travel definition
  that includes airlines, hotels, car rentals, rideshare, parking, tolls,
  museums, amusement parks and golf courses. Navy Federal reworked the
  economics on September 10, 2026, raising the annual fee from $49 to $95
  while lifting the welcome offer from 35,000 to 50,000 points, described as
  worth $500, after $4,000 in purchases in three months. That fee increase is
  largely absorbed by the annual statement credit covering one Amazon Prime
  membership, worth $139 when you pay for Prime with the card, and there is up
  to $120 for Global Entry or TSA PreCheck every four years on top. Rates stay
  low for the category at 14.74% to 18%, with no foreign transaction fee and
  no balance transfer fee. If you were holding it at the old $49 fee, the
  question is simply whether you renew Prime on this card, because that credit
  is what keeps the new math working.
