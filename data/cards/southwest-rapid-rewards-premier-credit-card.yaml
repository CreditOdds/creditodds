our_take: >
  The Premier's case rests on what arrives every year regardless of spend:
  6,000 anniversary points, 10,000 Companion Pass qualifying points, a 15%
  promo code on your cardmember anniversary, and a free first checked bag for
  you and up to eight passengers on the same reservation. At $149 that is a
  fair trade for a regular Southwest flyer, and it ranks #11 on our Best
  Airline Credit Cards list. The signup bonus is worth timing, though: Chase
  pushed it to 85,000 points at the end of May and cut it back to 55,000 after
  $1,500 of spend in the first three months on July 3, so today's offer is the
  floor rather than the ceiling. Everyday earning is unremarkable at 3 points
  per dollar on Southwest, 2 points at grocery stores and restaurants up to
  $8,000 a year, and 1 point elsewhere, so this is not a card for general
  spending. Count the up to $120 in annual Instacart credits and the
  complimentary DashPass year only if you will use them, and skip the card
  entirely if Southwest isn't your default airline.
