our_take: >
  The SavorOne earns 3% cash back on dining, entertainment, streaming, and
  groceries, which is why it ranks #4 on our Best Credit Cards for Dining and
  Groceries list and #13 on Best Cash Back Credit Cards. It also offers 12
  months of 0% intro APR on purchases and balance transfers and no foreign
  transaction fee. The catch is the $39 annual fee, which you need to offset
  with roughly $1,950 a year in 3% category spending before the card comes out
  ahead, and there is no signup bonus to cushion the first year. Everything
  outside the bonus categories earns just 1%. It works well if you reliably
  spend in those four categories, but it is a harder sell for light spenders.
