our_take: >
  The SavorOne earns 3% cash back on dining, entertainment, streaming, and
  groceries. A 12-month 0% intro APR on purchases and balance transfers and no
  foreign transaction fees round out the package. The catch is the $39 annual
  fee paired with no signup bonus, so you need roughly $1,950 a year in
  bonus-category spending just to cover the fee at the 2% margin those
  categories earn over a 1% card. Everything outside the 3% categories earns
  only 1%, which makes it a weak catch-all card. It fits best for someone
  whose spending is heavily concentrated on food and entertainment and who
  will clear that break-even comfortably.
