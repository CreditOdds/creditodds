our_take: >
  The SavorOne earns 3% cash back on dining, entertainment, streaming, and
  groceries, categories that cover a big share of most household budgets, and
  it ranks #4 on our Best Credit Cards for Dining and Groceries list. It also
  includes 12 months of 0% intro APR on purchases and balance transfers, plus
  no foreign transaction fee. The catch is that this version carries a $39
  annual fee and offers no signup bonus, so you need roughly $2,000 a year in
  bonus-category spending before the extra 2 percentage points over the base
  rate cover the fee. Everything outside the bonus categories earns only 1%,
  so pair it with a flat-rate card for the rest of your spending.
