our_take: >
  The SavorOne earns 3% on dining, entertainment, select streaming, and
  groceries, and that breadth is what puts it at #4 on our Best Credit Cards
  for Dining and Groceries list and #13 on our Best Cash Back list. The
  complication is the $39 annual fee paired with no signup bonus at all, so
  nothing cushions the first year and you need roughly $2,000 of bonus
  category spending a year before the 3% rate covers what you are paying to
  hold the card. Everything outside those four categories earns 1%, which is
  thin on a card that charges a fee. It does bring 12 months of 0% intro APR
  on purchases and balance transfers, and no foreign transaction fees, before
  the 18.49% to 28.49% regular rate takes over. Worth carrying if your dining
  and grocery spending clearly clears the fee, and easy to skip if it does
  not.
