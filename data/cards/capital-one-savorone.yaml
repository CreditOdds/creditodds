our_take: >
  The SavorOne earns 3% cash back on dining, entertainment, streaming, and
  groceries, a combination that lands it at #4 on our Best Credit Cards for
  Dining and Groceries list and #11 among our cash back picks. A 12-month 0%
  intro APR on purchases and balance transfers adds some value up front. The
  catch is a $39 annual fee with no signup bonus to offset it, so you need
  about $1,300 a year in those 3% categories just to cover the fee. Everything
  else earns only 1%, which makes it a poor catch-all card. No foreign
  transaction fee helps on trips abroad, but compare it carefully against
  no-fee cards with similar category rates before applying.
