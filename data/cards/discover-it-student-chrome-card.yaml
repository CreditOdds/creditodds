our_take: >
  Chrome trades the rotating-category hassle for something simpler: a steady
  2% back on gas and dining, with no quarterly activation to remember, on a
  card with no annual fee and no foreign transaction fee. For a student whose
  spending really is mostly food and fuel, that predictability is worth
  something. The ceiling is low, though: the 2% is capped at $1,000 in
  combined gas and dining per quarter, and everything past that cap or outside
  those two categories earns 1%. The 0% intro APR lasts just 6 months on
  purchases, and the ongoing rate of 16.49% to 25.49% means this is not a card
  to carry a balance on. If you'd rather chase bigger categories, Discover's
  rotating-category student card earns more; Chrome is for the student who
  wants to not think about it.
