our_take: >
  The Discover it Student Chrome is a simple, no-annual-fee starter card for
  students whose spending leans toward gas and restaurants: it earns 2% cash
  back in both categories on up to $1,000 in combined purchases each quarter,
  then 1% on everything else. That combined cap is generous for a typical
  student budget, and there are no categories to activate or track. A 6-month
  0% intro APR on purchases gives a short cushion for a larger expense, though
  it is brief compared with many cards. The tradeoff is a modest ceiling:
  outside gas and dining you are earning a flat 1%, so heavy grocery or online
  shoppers will outgrow it. No foreign transaction fee makes it a reasonable
  card to carry on a study-abroad trip.
