our_take: >
  The Discover it Student Chrome keeps things simple for students: 2% cash
  back at gas stations and restaurants with no annual fee and no category
  activation to remember. That makes it a sensible first card for someone
  whose spending mostly goes to fuel and eating out. The tradeoff is the
  ceiling: the 2% rate applies to only $1,000 per quarter combined across gas
  and dining, after which it falls to 1%, and everything else earns just 1%
  from the start. A 6-month 0% intro APR on purchases gives a short cushion
  for a larger buy, but the regular APR of 16.49% to 25.49% follows quickly.
  No foreign transaction fee helps if you study abroad. It is a solid
  credit-building tool, just not one that will reward heavy spending.
