our_take: >
  The Discover it Student Chrome keeps things simple for students: 2% cash
  back at gas stations and restaurants on up to $1,000 in combined spending
  each quarter, 1% on everything else, and no annual fee. That makes it a
  sensible first card if most of your spending goes to fuel and eating out,
  and you never have to track rotating categories or activate anything. The
  tradeoff is a modest ceiling, since the 2% rate is shared across both
  categories and everything outside them earns just 1%. The 6-month 0% intro
  APR on purchases is short, so treat it as a cushion for a single larger
  purchase rather than a long payoff plan. No foreign transaction fee helps if
  you study or travel abroad.
