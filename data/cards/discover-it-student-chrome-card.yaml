our_take: >
  The Discover it Student Chrome keeps things simple for a student: 2% cash
  back at gas stations and restaurants with no annual fee and no foreign
  transaction fee. There are no categories to activate, and 1% on everything
  else covers the rest of your spending. The 2% rate applies to up to $1,000
  per quarter in combined gas and dining purchases, then drops to 1%, which
  few students will hit anyway. A 6-month 0% intro APR on purchases gives a
  little breathing room for a bigger expense like textbooks or a laptop, but
  the regular APR runs 16.49% to 25.49% after that. It is a low-maintenance
  starter card for students whose spending centers on food and fuel, though
  the earn rates are modest once you outgrow it.
