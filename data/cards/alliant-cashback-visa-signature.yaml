our_take: >
  The Alliant Cashback Visa Signature is not accepting new applications, so
  this verdict matters mainly to existing cardholders. What remains is a flat
  1.5% cash back on all purchases with no annual fee and no foreign
  transaction fee. That rate has been in place since November 1, 2025, when
  Alliant discontinued the old 2.5% Tier One structure tied to its High-Rate
  Checking account. At 1.5% with no listed benefits, the card is now an
  ordinary flat-rate earner rather than the standout it used to be. If you
  already hold it, it is fine as a fee-free card to keep open for your credit
  history, but there is little reason to make it your primary everyday card.
