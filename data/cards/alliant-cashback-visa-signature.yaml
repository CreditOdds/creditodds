our_take: >
  Alliant is no longer accepting applications for the Cashback Visa Signature,
  so this take is mainly for existing cardholders. The card now earns a flat
  1.5% cash back on all purchases with no annual fee and no foreign
  transaction fees, after Alliant discontinued the earlier 2.5% Tier One
  structure on November 1, 2025. That change removed the reason most people
  opened it, and 1.5% is now an ordinary flat rate that many no-fee cards
  match or beat. There are no listed benefits beyond the cash back. If you
  hold it, it is fine to keep as a no-fee card for its credit history, but it
  no longer deserves to be your main card.
