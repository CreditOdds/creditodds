our_take: >
  Alliant is no longer accepting applications for the Cashback Visa Signature,
  so this card is only relevant if you already hold it. Since November 1,
  2025, it earns a flat 1.5% cash back on all purchases, down from the old
  2.5% Tier One structure that required Alliant High-Rate Checking. That cut
  erases what used to be its main selling point, leaving a rate that many
  no-fee cards match or beat. The no annual fee and no foreign transaction
  fees keep it harmless to hold. Existing cardholders should keep it open for
  credit history if it costs nothing, but route everyday spending to a card
  with a higher flat rate.
