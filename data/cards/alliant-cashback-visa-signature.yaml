our_take: >
  Alliant is no longer accepting applications for this card, so it is only
  relevant if you already hold one. What remains is a flat 1.5% back on every
  purchase with no annual fee and no foreign transaction fee, which is a step
  down from the 2.5% Tier One structure that required Alliant High-Rate
  Checking and was discontinued as of November 1, 2025. At 1.5% flat with no
  categories and no benefits attached, the card is now merely adequate rather
  than the standout it used to be. Existing holders may want to keep it open
  for the credit history since it costs nothing to carry, but there is little
  reason to put spending on it over a stronger flat-rate card.
