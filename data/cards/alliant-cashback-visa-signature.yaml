our_take: >
  The Alliant Cashback Visa Signature is not currently accepting applications,
  and its appeal has faded considerably. The card once offered up to 2.5% back
  through a Tier One structure tied to Alliant High-Rate Checking, but that
  was discontinued, and since November 1, 2025 it earns a flat 1.5% cash back
  on all purchases. There is no annual fee and no foreign transaction fee,
  which keeps it harmless for existing cardholders who use it abroad. Still,
  1.5% with no listed welcome bonus or extra benefits is an ordinary rate, so
  current members should weigh whether a stronger flat-rate card deserves the
  top spot in their wallet.
