our_take: >
  The Shield offers 21 months of 0% intro APR on both purchases and balance
  transfers with no annual fee, a runway long enough to rank it #1 on our Best
  0% APR Credit Cards list. That makes it a strong pick for paying down
  existing debt or financing a large purchase over nearly two years without
  interest. The catch is the rewards are thin: outside of 4% cash back on
  prepaid air, hotel, and car reservations booked through the U.S. Bank Travel
  Rewards Center, there's no everyday earn rate. Once the intro period ends,
  the card has little reason to stay in your wallet, and the foreign
  transaction fee rules it out for travel abroad. Treat the $20 annual
  statement credit for 11 consecutive months of purchases and cell phone
  protection of up to $600 per claim as minor extras.
