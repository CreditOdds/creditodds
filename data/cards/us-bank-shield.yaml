our_take: >
  The Shield offers 21 months of 0% intro APR on both purchases and balance
  transfers with no annual fee, one of the longest runways available and the
  reason it ranks first on our list of the best 0% APR cards. That makes it a
  strong pick if you are paying down existing debt or financing a large
  purchase over the next year and a half or more. The catch is the rewards are
  thin: outside of 4% cash back on prepaid air, hotel, and car reservations
  booked through the U.S. Bank Travel Rewards Center, there is no everyday
  earn rate, so the card has little reason to stay in your wallet once the
  intro period ends. It also charges foreign transaction fees. Treat the $20
  annual statement credit for 11 consecutive months of purchases and the cell
  phone protection of up to $600 per claim as minor extras.
