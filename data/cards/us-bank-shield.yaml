our_take: >
  The Shield offers 21 months of 0% intro APR on both purchases and balance
  transfers with no annual fee, which is why it sits at #1 on our list of the
  best 0% APR cards. That is a long runway if your goal is paying down
  existing debt or financing a large purchase over roughly the next year and a
  half without interest. The honest catch is that the rewards are nearly
  nonexistent: aside from 4% back on prepaid travel booked through the U.S.
  Bank Travel Rewards Center, there is no everyday earn rate, so the card
  gives you little reason to keep using it once the intro window closes. Treat
  the $20 annual statement credit for 11 consecutive months of purchases and
  the cell phone protection, up to $600 per claim when you pay your bill with
  the card, as small extras rather than reasons to apply. Open it for the 0%
  period, run your payoff plan, and expect the rate to reset somewhere between
  16.99% and 27.99%.
