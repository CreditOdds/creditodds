our_take: >
  The Costco Anywhere Visa earns 4% on eligible gas and EV charging worldwide
  (5% at Costco gas stations) on the first $7,000 per year, then 1%, plus 3%
  on dining and travel, including Costco Travel, with no annual fee. Purchases
  at Costco and Costco.com earn 2%, but that rate does not extend to Sam's
  Club, BJ's, or other warehouse clubs. No foreign transaction fee makes it a
  reasonable card to take abroad as well. The tradeoff is a 1% base rate on
  everything else, and big commuters may hit the gas cap well before the year
  ends. It works best for Costco shoppers who want one no-fee card covering
  gas, dining, and travel.
