our_take: >
  The Costco Anywhere Visa by Citi is one of the stronger gas cards available
  with no annual fee, paying 4% back on eligible gas and EV charging on the
  first $7,000 per year, then 1%, and 5% at Costco gas stations. Dining and
  travel, including Costco Travel, earn 3%, and with no foreign transaction
  fee it also holds up on trips abroad. The catch is that the 2% warehouse
  rate is limited to Costco and Costco.com purchases, not other clubs like
  Sam's Club or BJ's, and all other spending earns only 1%. That base rate
  means it works best alongside a flat-rate card rather than as your only
  card. If you already shop at Costco and drive regularly, it is an easy
  addition to the wallet.
