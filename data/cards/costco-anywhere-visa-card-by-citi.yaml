our_take: >
  The Costco Anywhere Visa by Citi is at its best at the pump, earning 4% cash
  back on eligible gas and EV charging worldwide and 5% at Costco gas
  stations, with no annual fee. It also earns 3% on dining and travel
  (including Costco Travel) and 2% on Costco and Costco.com purchases, which
  makes it a natural fit for regular Costco shoppers. The tradeoff is that the
  4% gas rate only applies to the first $7,000 in combined gas and EV charging
  spend per year, then drops to 1%, and everything outside the bonus
  categories also earns just 1%. The 2% warehouse rate works only at Costco,
  not at Sam's Club, BJ's, or other clubs. No foreign transaction fee makes it
  usable abroad, but it's really a card for people already loyal to Costco,
  not a standalone everyday earner.
