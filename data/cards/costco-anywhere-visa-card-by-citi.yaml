our_take: >
  The draw is gas: 4% back on eligible gas and EV charging worldwide on the
  first $7,000 per year, and 5% at Costco gas stations, with no annual fee
  beyond the Costco membership the card assumes. Dining and travel at 3%,
  including Costco Travel, and no foreign transaction fees round it out into a
  usable travel and commuting card. Be clear on the limits, though: gas falls
  to 1% after the $7,000 annual cap, and the 2% rate is specific to Costco and
  Costco.com, not warehouse clubs generally, so it will not follow you to
  Sam's Club or BJ's. Everything outside those categories earns 1%, and there
  is no signup bonus or intro APR to bridge the early months. If you fill up
  often and shop Costco regularly it earns its place; otherwise a flat-rate
  card will likely do better.
