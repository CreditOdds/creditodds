our_take: >
  American Express is no longer accepting new applications for the Green as of
  July 2026, so this card is only relevant if you already carry it. For
  existing cardholders, the appeal is broad 3 points per dollar on travel,
  transit, and dining, with no foreign transaction fees and up to $219 a year
  in statement credits toward CLEAR Plus. Against that, the $150 annual fee is
  steep for a card whose only other earn rate is 1 point per dollar, and the
  CLEAR credit only offsets the fee if you would pay for that membership
  anyway. If you are weighing whether to keep it, compare it with a no-fee
  card that matches its 3x categories or a cheaper travel card with
  transferable points. Hold on to it only if the 3x spend and the CLEAR credit
  together clearly beat the fee each year.
