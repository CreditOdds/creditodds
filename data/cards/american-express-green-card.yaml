our_take: >
  Amex stopped taking new applications for the Green on July 25, 2026, so this
  card now matters only to people who already carry it. For them, the case is
  still reasonable: 3 points per dollar on travel, transit, and dining, no
  foreign transaction fees, and up to $219 a year in statement credits for a
  CLEAR Plus membership. The tradeoff is a $150 annual fee against a 1 point
  per dollar base rate, which means the card earns its keep only if you spend
  steadily in those three categories and actually use CLEAR. If you are
  shopping for a new card, look elsewhere: the Wells Fargo Autograph matches
  the 3x categories with no annual fee, the Chase Sapphire Preferred offers 3x
  dining and transferable points for $95, and the Amex Gold is the step up if
  your restaurant and grocery spending is high enough to justify its larger
  fee.
