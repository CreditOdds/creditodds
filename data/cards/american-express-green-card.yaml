our_take: >
  American Express stopped accepting new applications for the Green as of July
  25, 2026, so this is now a question for existing cardholders rather than a
  card to apply for. The earn structure was always its cleanest feature, a
  straightforward 3x on travel, transit, and dining with 1x on everything else
  and no foreign transaction fee, but the $150 annual fee leans almost
  entirely on the CLEAR Plus credit of up to $219 a year. If you use CLEAR,
  the card still pays for itself; if you do not, there is nothing else in the
  benefits column to justify keeping it. The most direct replacement is the
  Wells Fargo Autograph, which matches 3x on travel, transit, and dining, adds
  streaming and phone, and charges no annual fee. If you want to stay in the
  Amex points ecosystem, the Gold steps up to 4x at restaurants and U.S.
  supermarkets, provided your spending clears its higher fee.
