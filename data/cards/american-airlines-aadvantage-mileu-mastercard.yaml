our_take: >
  The MileUp is the no-annual-fee entry point to American Airlines AAdvantage,
  earning 2 miles per dollar at grocery stores and on eligible American
  Airlines purchases. That makes it a reasonable way to keep an AAdvantage
  balance growing without paying a fee. The welcome bonus is modest at 15,000
  miles after $500 in spending in the first three months. The tradeoffs are
  real: everything else earns just 1 mile per dollar, there is a foreign
  transaction fee, and the only travel perk is 25% off inflight food and
  beverages. It works for occasional American flyers who want miles on
  groceries, but frequent flyers will want a card with more travel benefits.
