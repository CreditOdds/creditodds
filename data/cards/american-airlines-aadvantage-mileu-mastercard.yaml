our_take: >
  The AAdvantage MileUp is the no-annual-fee entry point into American
  Airlines miles, earning 2 miles per dollar at grocery stores and on eligible
  American Airlines purchases. The 15,000-mile welcome bonus after just $500
  in spend within three months is small but easy to reach. The tradeoffs are
  real: everything else earns only 1 mile per dollar, and the card charges
  foreign transaction fees, which is an odd fit for an airline card. The only
  listed perk is 25% off inflight food and beverage purchases on American
  flights, so it skips the checked-bag benefits travelers typically want from
  an airline card. It earns a spot on our Best Airline Credit Cards list as a
  low-cost way to keep AAdvantage miles trickling in, but frequent American
  flyers will likely want a card with more travel perks.
