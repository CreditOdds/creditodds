our_take: >
  The MileUp is the no-annual-fee entry point to American Airlines AAdvantage,
  earning 2 miles per dollar at grocery stores and on eligible American
  Airlines purchases, and 1 mile everywhere else. Its welcome offer is modest
  at 15,000 miles after $500 in spend in the first 3 months, though the low
  bar makes it easy to earn. It appears at #18 on our Best Airline Credit
  Cards list, which reflects that it is a starter card rather than a heavy
  hitter. The perks are thin: 25% off inflight food and beverage on American
  flights is the only listed benefit, with nothing like free checked bags or
  priority boarding. It also charges foreign transaction fees, so leave it
  home when traveling abroad. Treat it as a fee-free way to keep AAdvantage
  miles trickling in from groceries, not as a travel card.
