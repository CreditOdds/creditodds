our_take: >
  The MileUp is the no-annual-fee way into the AAdvantage program, which is
  why it earns the Best No-Fee badge on our Best Airline Credit Cards list. It
  earns 2 miles per dollar at grocery stores and on eligible American Airlines
  purchases, 1 mile everywhere else, and offers 15,000 bonus miles after $500
  in spending within three months. That bonus is small, but the spending bar
  is low enough for almost anyone to clear. The real tradeoffs are a thin perk
  set, limited to 25% off inflight food and beverages, and a foreign
  transaction fee that makes it a poor choice to carry abroad. It suits
  occasional American flyers who want to earn miles on groceries without
  paying a fee, but frequent travelers will want a card with checked bags and
  boarding perks.
