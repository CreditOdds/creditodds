name: "Citi AAdvantage Business World Elite Mastercard"
bank: "Citi"
slug: "citibusiness-aadvantage-platinum-select-maste"
previous_names:
  - "CitiBusiness AAdvantage Platinum Select Mastercard"
accepting_applications: true
image: "citi-business-aadvantage-platinum-select.png"
annual_fee: 99
# Ongoing fee is $99, waived the first 12 months (annual_fee_intro below). Same
# JS-rendered-fee misread as the consumer Citi AAdvantage card; preempt it here so
# the business variant doesn't generate the same false-positive PRs.
check_ignore:
  - annual_fee
annual_fee_intro:
  value: 0
  months: 12
foreign_transaction_fee: false
network: "mastercard"
reward_type: "miles"
our_take: >
  This business card is for companies that fly American Airlines: it earns 2
  miles per dollar on eligible American Airlines purchases, car rentals, gas,
  telecommunications, and cable and satellite services, and the first checked
  bag is free on domestic American itineraries for you and up to 4 companions.
  The 65,000-mile bonus after $4,000 in spend within 4 months is substantial,
  and the $99 annual fee is waived for the first 12 months. The catch is that
  most of the value depends on flying American; outside the bonus categories
  the card earns just 1 mile per dollar. The Companion Certificate requires
  $30,000 in purchases each cardmembership year and still carries a $99
  ticketing fee plus taxes, so only heavy spenders will see it. Preferred
  boarding and 25% off in-flight purchases are useful extras for regular
  American flyers.
