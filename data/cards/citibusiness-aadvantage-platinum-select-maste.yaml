annual_fee: 99
# Ongoing fee is $99, waived the first 12 months (annual_fee_intro below). Same
# JS-rendered-fee misread as the consumer Citi AAdvantage card; preempt it here so
# the business variant doesn't generate the same false-positive PRs.
check_ignore:
  - annual_fee
annual_fee_intro:
  value: 0
  months: 12
foreign_transaction_fee: false
network: "mastercard"
reward_type: "miles"
our_take: >
  The Citi AAdvantage Business World Elite Mastercard makes the most sense for
  business owners who already fly American, thanks to a free first checked bag
  on domestic itineraries for you and up to four companions, preferred
  boarding, and 25% off inflight food, drinks, and Wi-Fi. The $99 annual fee
  is waived for the first 12 months, and the 65,000-mile bonus after $4,000 in
  spend over four months is a meaningful head start. Everyday earning is
  middling: 2x miles on eligible American Airlines purchases, car rentals,
  gas, and telecom, cable, and satellite bills, with 1x on everything else.
  The Companion Certificate is the standout long-term perk, but it requires
  $30,000 in purchases each cardmembership year and still carries a $99
  ticketing fee plus taxes. If a couple of checked bags per year cover the
  fee, it pays for itself, but businesses that don't fly American regularly
  will find better value elsewhere.
