image: "citi-business-aadvantage-platinum-select.png"
annual_fee: 99
# Ongoing fee is $99, waived the first 12 months (annual_fee_intro below). Same
# JS-rendered-fee misread as the consumer Citi AAdvantage card; preempt it here so
# the business variant doesn't generate the same false-positive PRs.
check_ignore:
  - annual_fee
annual_fee_intro:
  value: 0
  months: 12
foreign_transaction_fee: false
network: "mastercard"
reward_type: "miles"
our_take: >
  The Citi AAdvantage Business World Elite Mastercard is built for business
  owners who fly American Airlines and want the travel perks that come with
  it: a free first checked bag and preferred boarding on domestic AA
  itineraries for you and up to four companions on the same reservation. The
  $99 annual fee is waived for the first 12 months, and the 65,000 mile bonus
  after $4,000 in spend over four months gives you plenty of time to earn it.
  Earning is 2x miles on eligible American Airlines purchases, car rentals,
  gas, and telecom, cable, and satellite services, with 1x on everything else.
  The catch is that the ongoing earn rates are modest, so the card's value
  rests mostly on how often your team flies American. Heavy spenders can also
  unlock a Companion Certificate after $30,000 in purchases each
  cardmembership year, though it still carries a $99 ticketing fee plus taxes.
