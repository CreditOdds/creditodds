name: "Citi AAdvantage Business World Elite Mastercard"
bank: "Citi"
slug: "citibusiness-aadvantage-platinum-select-maste"
previous_names:
  - "CitiBusiness AAdvantage Platinum Select Mastercard"
accepting_applications: true
image: "citi-business-aadvantage-platinum-select.png"
annual_fee: 99
# Ongoing fee is $99, waived the first 12 months (annual_fee_intro below). Same
# JS-rendered-fee misread as the consumer Citi AAdvantage card; preempt it here so
# the business variant doesn't generate the same false-positive PRs.
check_ignore:
  - annual_fee
annual_fee_intro:
  value: 0
  months: 12
foreign_transaction_fee: false
network: "mastercard"
reward_type: "miles"
our_take: >
  For a small business that flies American regularly, the value here is the
  free first checked bag for you and up to four companions on the same
  domestic reservation, which can cover the $99 annual fee on a single trip
  with employees or family. Citi waives that fee for the first 12 months and
  pairs it with 65,000 bonus miles after $4,000 of spend in four months, plus
  Group 5 boarding and 25% off in-flight food, beverages, and Wi-Fi. The
  everyday earn is business-flavored rather than generous: 2x on American
  Airlines purchases, car rentals, gas, and telecom or cable providers, and 1x
  on everything else. The companion certificate sounds appealing but requires
  $30,000 in purchases each cardmembership year, so treat it as a stretch goal
  rather than a reason to apply. No foreign transaction fees make it
  reasonable for overseas business travel, but if you rarely fly American, the
  bag benefit is the whole argument and it disappears.
tags:
