our_take: >
  Citi is no longer accepting new applications for the Custom Cash, so this
  take is mainly for existing cardholders. Its appeal was simplicity: 5% cash
  back automatically lands on whichever eligible category you spend the most
  on each billing cycle, from dining and groceries to gas, travel, streaming,
  and drugstores, with no enrollment and no annual fee. The limit is real,
  though, since the 5% applies only to the first $500 in that category each
  month, which caps the bonus at $25 a cycle before the rate drops to 1%, the
  same as everything else. If you already hold it, it remains a useful no-fee
  card for one focused spending category. For new applicants, the U.S. Bank
  Cash+ is the closest structure with two chosen 5% categories, the Chase
  Freedom Flex offers rotating 5% categories plus 3% on dining and drugstores,
  and Citi itself steers cash back seekers to the Double Cash.
