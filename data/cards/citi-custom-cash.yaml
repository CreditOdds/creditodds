our_take: >
  Citi Custom Cash is no longer accepting applications, so this take is mainly
  for existing cardholders. Its strength is effortless 5% cash back on
  whichever eligible category you spend the most on each billing cycle, from
  dining and groceries to gas, travel, and streaming, with no annual fee and
  no category activation. The catch is the cap: the 5% applies only to the
  first $500 of that category each month, after which it falls to 1%, and
  everything else earns just 1%, so it works best paired with a flat-rate
  card. If you already have it, it remains worth keeping for that one targeted
  category. New applicants should look at alternatives like the Citi Double
  Cash for 2% on everything, the U.S. Bank Cash+ for a similar
  pick-your-category setup, or the Chase Freedom Flex for rotating 5%
  categories.
