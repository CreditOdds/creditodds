our_take: >
  Citi Custom Cash is no longer accepting new applications, so this verdict is
  for current cardholders deciding whether to keep it. Its appeal is
  simplicity: you automatically earn 5% cash back on whichever eligible
  category you spend the most in each billing cycle, from dining and groceries
  to gas, travel, streaming, and drugstores, with no enrollment and no annual
  fee. The catch is the cap, since that 5% only applies to the first $500 in
  your top category each month, after which it drops to 1%, and everything
  else earns just 1%. That makes it a strong partner card for one concentrated
  monthly expense but a weak primary card. If you already carry it, it is
  worth keeping for its targeted 5%, and if you are shopping now, Citi points
  new applicants toward the Double Cash and its flat 2% instead.
