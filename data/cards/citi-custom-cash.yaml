our_take: >
  Citi stopped accepting new applications for the Custom Cash in May 2026, so
  this is now a card you keep rather than one you can get. What made it worth
  keeping is the automatic 5% back on your top eligible spending category each
  billing cycle, drawn from a list that spans dining, gas, groceries, transit,
  travel, streaming, drugstores, home improvement and entertainment, with
  nothing to activate. The cap is the catch: 5% applies only to the first $500
  in that category each month, and everything above it, along with all other
  spending, earns 1%. If you are shopping for a replacement, Citi points new
  cash back applicants to its own Double Cash at 2% on everything, while the
  U.S. Bank Cash+ and Chase Freedom Flex come closest to the 5% category
  structure. It still holds #5 on our Best Cash Back Credit Cards list on the
  strength of that formula, but the ranking matters less now that the
  application door is shut.
