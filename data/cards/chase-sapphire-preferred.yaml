our_take: >
  The Sapphire Preferred remains the easiest recommendation for a first travel
  card, which is why it ranks #1 on our Best Travel Credit Cards list. For $95
  a year you earn 5 points per dollar on Chase Travel, 3 on dining, gas and EV
  charging, streaming, and online groceries, and 2 on other travel, with no
  foreign transaction fee. The signup bonus recently slipped back from 100,000
  to 75,000 points after $5,000 in spending within three months, though it
  still holds the top spot on our Best Credit Card Signup Bonuses list. A $100
  annual hotel credit through Chase Travel and a Global Entry or TSA PreCheck
  credit help offset the fee. The catch is the 1 point per dollar base rate on
  everything else, so pair it with a flat-rate card for general spending.
