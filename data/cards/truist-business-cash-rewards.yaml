our_take: >
  The Truist Business Cash Rewards is a no-annual-fee business card that earns
  3% on gas and 2% on dining and office supplies, which suits small businesses
  with steady vehicle and office costs. It also offers a $300 bonus after
  $3,000 in spend within three months and 0% intro APR on purchases for nine
  months. The catch is the cap: the 3% and 2% categories share a $2,000
  combined monthly limit, after which they drop to 1%, the same rate as
  everything else. Businesses that bank with Truist can squeeze out more value
  through the Loyalty Cash Bonus, which adds 10%, 25%, or 50% to rewards
  redeemed into an eligible Truist business deposit account depending on the
  relationship. Free employee cards round it out, but heavy spenders will hit
  the cap quickly.
