our_take: >
  For a business card with no annual fee, the earn structure covers the
  categories small businesses actually use: 3% back on gas, 2% on dining and
  office supplies, and 1% on everything else. The catch is a tight one, since
  the 3% and 2% rates share a combined $2,000 monthly cap and everything past
  it drops to 1%, which limits how much those bonus rates can be worth over a
  year. A $300 bonus after $3,000 in three months and 0% intro APR for nine
  months on purchases make the first year reasonable, with the regular rate
  landing between 15.74% and 24.74%. The most interesting feature is the
  loyalty bonus: redeeming into an eligible Truist business deposit account
  adds 10%, 25%, or 50% on top, but the tier is set by your existing
  relationship with the bank, so most applicants should assume the 10%. If you
  do not already bank with Truist, an uncapped flat-rate business card will
  usually return more on the same spend.
