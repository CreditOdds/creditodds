our_take: >
  The Truist Business Cash Rewards is a no-annual-fee card for small
  businesses that spend on gas, with 3% back there and 2% on dining and office
  supplies. The $300 bonus after $3,000 in spend within three months is
  generous for a no-fee business card, and a 9-month 0% intro APR on purchases
  helps with startup costs. The catch is the cap: the 3% and 2% rates share a
  $2,000 monthly limit, after which you earn 1%, which is also the rate on
  everything else. Businesses that bank with Truist get the most out of it,
  since redeeming into an eligible Truist business deposit account adds a 10%,
  25%, or 50% bonus depending on your relationship. Free employee cards round
  it out, but heavier spenders will outgrow the cap quickly.
