our_take: >
  The Truist Business Cash Rewards is a no-annual-fee card that pays 3% on gas
  and 2% on dining and office supplies, which lines up well with the everyday
  costs of many small businesses. New cardholders also get a $300 bonus after
  spending $3,000 in the first three months and 0% intro APR on purchases for
  nine months. The catch is a $2,000 combined monthly cap across all the bonus
  categories, after which those purchases drop to 1%, the same as everything
  else, so higher-spending businesses will hit the ceiling fast. The card gets
  more interesting if you already bank with Truist, since redeeming into an
  eligible Truist business deposit account adds a 10%, 25%, or 50% loyalty
  bonus depending on your relationship. Free employee cards round it out as a
  reasonable, low-cost option for a smaller business, not a heavy spender.
