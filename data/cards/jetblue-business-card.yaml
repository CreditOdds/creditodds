our_take: >
  The JetBlue Business card is aimed at business owners who fly JetBlue,
  earning 6 points per dollar on JetBlue purchases for a $99 annual fee with
  no foreign transaction fee. The welcome bonus is 50,000 points after $4,000
  in spending in three months. Its most useful ongoing perk is a free first
  checked bag for you and up to three companions on JetBlue-operated flights
  when you book with the card, which can cover the fee in a single trip. You
  also get 5,000 anniversary points, 10% of your points back on award flights,
  half off inflight food, drinks, and Wi-Fi, and Group 3 boarding. The catch
  is limited earning outside JetBlue: 2 points per dollar on dining and office
  supplies and only 1 point everywhere else, so it isn't a strong card for
  general business spending. Mosaic status requires $50,000 in yearly
  spending, so most owners will get value from the bag and points perks rather
  than elite status.
