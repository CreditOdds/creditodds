our_take: >
  The JetBlue Business card is built for companies that fly JetBlue regularly:
  6x points on JetBlue purchases, a free first checked bag for you and up to
  three companions when you book with the card, and 50% off inflight food,
  drinks, and Wi-Fi. The $99 annual fee is partly offset by 5,000 bonus points
  each anniversary and a $100 statement credit once per year on a JetBlue
  Vacations package of $100 or more. New cardholders can earn 50,000 points
  after spending $4,000 in three months. The tradeoff is weak earning away
  from JetBlue, with just 2x on dining and office supplies and 1x on
  everything else, so it is not a card for general business spend. Mosaic
  status after $50,000 in yearly purchases and a 10% points rebate on award
  flights reward loyalists, but only the bag benefit reliably pays for the
  card on its own.
