our_take: >
  The JetBlue Business is built for companies that fly JetBlue: 6 points per
  dollar on JetBlue purchases, plus a free first checked bag for the
  cardmember and up to three companions when you book with the card. For a $99
  annual fee, those bag savings alone can cover the cost after a trip or two.
  The signup bonus is 50,000 points after $4,000 in spending in the first
  three months, and you get 5,000 bonus points each anniversary, 10% of points
  back on JetBlue award flights, and 50% off inflight food, drinks, and Wi-Fi.
  The tradeoff is weak earning elsewhere: just 2 points per dollar on dining
  and office supplies and 1 per dollar on everything else, so it is not a
  strong card for general business spend. Mosaic status requires $50,000 in
  yearly spending, so treat that as a stretch goal, not a reason to apply.
