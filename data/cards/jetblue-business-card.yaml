our_take: >
  The JetBlue Business works for a company whose team actually flies JetBlue:
  6x on JetBlue purchases, a free first checked bag for you and up to three
  traveling companions when you book with the card, and Group 3 boarding, for
  a $99 annual fee. The signup bonus is 50,000 TrueBlue points after $4,000 in
  three months, and the $100 JetBlue Vacations statement credit plus 5,000
  anniversary points each year chip away at the fee on their own. Away from
  the airline the earn rate is ordinary, at 2x on dining and office supplies
  and 1x on everything else, so this shouldn't be your general business card.
  Mosaic elite status is available but takes $50,000 of eligible purchases in
  a calendar year, which is a lot of spend to route through a 1x rate. There
  are no foreign transaction fees, and getting 10% of your points back after
  you fly an award flight makes redemptions stretch a little further.
