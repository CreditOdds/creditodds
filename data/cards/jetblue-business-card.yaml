our_take: >
  If your business flies JetBlue with any regularity, the free first checked
  bag for you and up to three traveling companions on every booking can cover
  the $99 annual fee on its own. Earning is 6x on JetBlue purchases, 2x at
  restaurants and office supply stores, and 1x on everything else, so it
  functions as a JetBlue-spend card rather than a general business card. The
  current offer is 50,000 points after $4,000 in three months, trimmed from
  60,000 back in May. The recurring extras are small individually but add up
  for frequent flyers: 5,000 anniversary points, 50% off inflight food,
  drinks, and Wi-Fi, a 10% points rebate on award flights you actually travel,
  and a $100 statement credit on one JetBlue Vacations package a year. Mosaic
  status is available but requires $50,000 in purchases, which is a hard
  target when most of that spending earns only 1x.
benefits:
  - name: "Anniversary Points Bonus"
    value: 5000
    value_unit: "points"
    description: "5,000 bonus TrueBlue points each year after your account anniversary"
    frequency: "annual"
    category: "rewards"
    enrollment_required: false
  - name: "First Checked Bag Free"
    description: "First checked bag free for the cardmember and up to 3 traveling companions on JetBlue-operated flights when the card is used to book"
    frequency: "per_flight"
    category: "travel"
    enrollment_required: false
  - name: "50% Off Inflight Purchases"
    description: "50% savings on eligible food, drinks, and Wi-Fi purchased on JetBlue-operated flights"
    frequency: "per_purchase"
    category: "statement_credit"
    enrollment_required: false
  - name: "Mosaic Status Boost"
    description: "Earn Mosaic elite status after $50,000 in eligible purchases per calendar year"
    frequency: "annual"
    category: "travel"
    enrollment_required: false
  - name: "Award Flight Points Rebate"
    value: 10
    value_unit: "percent"
    description: "Get 10% of your points back after you redeem for and travel on a JetBlue-operated Award Flight"
    frequency: "per_trip"
    category: "rewards"
    enrollment_required: false
  - name: "JetBlue Vacations Statement Credit"
    value: 100
    description: "Receive a $100 statement credit after you purchase a JetBlue Vacations package of $100 or more with your card. Limited to one statement credit per calendar year."
    frequency: "annual"
    category: "travel"
    enrollment_required: false
  - name: "Group 3 Boarding"
    description: "Group 3 boarding on JetBlue-operated flights"
    frequency: "per_flight"
    category: "travel"
