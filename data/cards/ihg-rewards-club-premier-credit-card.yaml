our_take: >
  The IHG One Rewards Premier is built for regular IHG guests, and its current
  180,000-point welcome bonus after $3,000 in spending puts it at #4 on our
  Best Credit Card Signup Bonuses list. Chase raised the bonus from 140,000 at
  the same time it raised the annual fee from $99 to $150, so it now costs
  more to keep. In return you get an anniversary free night at properties up
  to 40,000 points, automatic Platinum Elite status, and a 4th reward night
  free on award stays, which together can easily cover the fee for someone who
  stays with IHG. It earns 10 points per dollar at IHG hotels, 5 per dollar on
  travel, gas, and dining, and 3 per dollar on everything else. Up to $100 a
  year in IHG food and beverage vouchers, a $10 monthly Instacart credit, and
  up to $50 in United TravelBank Cash can offset more of the cost if you use
  them. If you don't stay at IHG properties at least a few nights a year, the
  higher fee is hard to justify.
