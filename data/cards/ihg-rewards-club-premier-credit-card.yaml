our_take: >
  The IHG One Rewards Premier pays you back mainly through its anniversary
  free night at properties costing up to 50,000 points, automatic Gold Elite
  status, and the 4th reward night free, all of which favor anyone who stays
  with IHG a few times a year. The welcome offer is strong right now at
  180,000 points after $3,000 in spending over three months, enough to rank it
  third on our Best Credit Card Signup Bonuses list. The catch is the price:
  Chase just raised the annual fee from $99 to $150 alongside that bonus bump,
  so the free night now has to carry more weight. Earning is generous on paper
  at 10x at IHG hotels, 5x on dining, gas, groceries, flights booked directly,
  and car rentals, and 3x on everything else, though other travel drops from
  5x to 3x after December 31, 2026. Treat the $100 airline credit, $100 in
  quarterly IHG food and beverage vouchers, and Instacart and DoorDash credits
  as bonuses that only pay off if you would use them anyway.
