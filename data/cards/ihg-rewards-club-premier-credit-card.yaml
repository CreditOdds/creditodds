our_take: >
  The IHG One Rewards Premier now offers 180,000 bonus points after $3,000 in
  spending in the first three months, back up from 140,000 earlier this year
  and good enough for the #3 spot on our Best Credit Card Signup Bonuses list.
  The catch is that Chase raised the annual fee from $99 to $150 at the same
  time, so the keeper math now rests more on the anniversary free night at
  properties up to 50,000 points, automatic Gold Elite status, and the fourth
  reward night free. Earning is strong for a hotel card: 10x at IHG hotels, 5x
  on flights booked directly with airlines, car rentals, groceries, gas, and
  dining, and a 3x base rate on everything else, though other travel drops
  from 5x to 3x after December 31, 2026. A long list of credits, including up
  to $100 a year in IHG food and beverage vouchers, a $100 airline credit
  after $250 in direct flight purchases, and monthly Instacart and DoorDash
  offers through 2027, can cover the fee if you actually use them. Loyal IHG
  guests should find it easy to justify; occasional guests should be sure the
  free night alone is worth $150 to them.
