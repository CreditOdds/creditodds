our_take: >
  The no-annual-fee Hilton Honors card earns surprisingly well for a free
  card: 5 points per dollar at U.S. restaurants, U.S. supermarkets, and U.S.
  gas stations, 7 points at Hilton, and 3 points on everything else. Amex
  recently cut the welcome offer from 100,000 to 80,000 points, though it
  still comes with a $100 statement credit after $2,000 in spend within six
  months. Cardholders get Silver status with the 5th night free on reward
  stays, and can reach Gold after $20,000 in calendar-year spend. The catch is
  that the points only pay off if you redeem them at Hilton, and unlike the
  fee-carrying versions there are no Hilton credits or free night rewards.
  It's a sensible starter or keeper card for occasional Hilton guests who want
  to collect points with no fee.
