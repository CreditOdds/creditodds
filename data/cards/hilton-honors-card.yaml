our_take: >
  The no-annual-fee Hilton Honors card is an easy way to start earning Hilton
  points, with 7 points per dollar at Hilton hotels and resorts, 5 points at
  U.S. restaurants, supermarkets, and gas stations, and 3 points on everything
  else, plus no foreign transaction fees. American Express recently cut the
  welcome offer from 100,000 to 80,000 points, though it still comes with a
  $100 statement credit after $2,000 in spend within 6 months. Silver status
  gives you the 5th night free on reward stays, and $20,000 in calendar-year
  spending upgrades you to Gold. The tradeoff is that there are no hotel
  credits or free night awards, and every point is locked into Hilton Honors,
  so it suits someone who stays at Hilton occasionally and doesn't want to pay
  a fee. If you're at Hilton properties more than a few times a year, a
  fee-based Hilton card with credits and status perks may return more.
