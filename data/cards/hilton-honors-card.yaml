our_take: >
  The no-annual-fee Hilton Honors card is the easiest way into Hilton's
  program, earning 7 points per dollar at Hilton hotels and resorts and 5
  points at U.S. restaurants, supermarkets, and gas stations, with 3 points on
  everything else. Amex recently cut the welcome bonus from 100,000 to 80,000
  points, still paired with a $100 statement credit, after $2,000 in spend
  within six months, which remains reachable for most people. Silver status
  comes with the card, and it upgrades to Gold after $20,000 in purchases in a
  calendar year. The tradeoff is that there are no hotel credits or free night
  awards, and the points are only worth much when redeemed for Hilton stays.
  It's a sensible keeper for occasional Hilton guests who want to earn toward
  free nights without paying a fee.
