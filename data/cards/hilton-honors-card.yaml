our_take: >
  The no-annual-fee Hilton Honors card is the low-commitment way into the
  program, and its everyday earn rate is better than most free cards manage:
  5x at U.S. restaurants, U.S. supermarkets, and U.S. gas stations, 3x on
  everything else, and 7x on eligible purchases at Hilton hotels and resorts.
  The current welcome offer is 80,000 points plus a $100 statement credit
  after $2,000 of spending in six months, which is back down after American
  Express briefly raised it to 100,000 points in May and cut it again on July
  30. Complimentary Silver status is thin compared with the Gold that the paid
  cards grant automatically, though it does include a 5th night free on reward
  stays. You can reach Gold, but only after $20,000 of eligible purchases in a
  calendar year, which is a lot of spending on a free card. It works best as a
  keeper for the 5x categories and occasional Hilton stays rather than as the
  card that gets you meaningful hotel status.
