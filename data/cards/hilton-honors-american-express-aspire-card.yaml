our_take: >
  The Hilton Honors Aspire's headline perk is complimentary Diamond status
  plus a Free Night Award each year, which together can make Hilton stays
  dramatically better for frequent guests. It backs that up with up to $400 a
  year in Hilton resort credits, $200 in flight credits paid out at $50 per
  quarter, and up to $219 toward CLEAR Plus, along with 14 points per dollar
  at Hilton hotels and resorts, 7 points on flights, car rentals, and U.S.
  dining, and 3 points on everything else. American Express recently trimmed
  the welcome offer from 175,000 to 150,000 points after $6,000 in spend
  within 6 months. The catch is the $550 annual fee: the credits are split
  into semiannual and quarterly pieces and the resort credit only works at
  participating resorts, so you need to plan around them to come out ahead. If
  you stay at Hilton properties several times a year and will actually use the
  credits, it pays for itself; if not, a lower-fee Hilton card is the safer
  bet.
