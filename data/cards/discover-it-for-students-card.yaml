our_take: >
  The Discover it for Students gives new credit users a real rewards card with
  no annual fee: 5% cash back in quarterly rotating categories, which are
  dining, entertainment, and utilities for Q4 2026, on up to $1,500 in
  spending each quarter after activation. The standout is Cashback Match,
  where Discover matches all the cash back you earn at the end of your first
  year, with no cap, effectively doubling first-year rewards. The catch is
  that the rewards take some attention, since you must activate each quarter
  and everything outside the bonus categories earns just 1%. The 0% intro APR
  on purchases lasts only 6 months, so don't lean on it for anything you can't
  pay off quickly. As a first card for building credit while earning something
  back, it's a sensible pick.
