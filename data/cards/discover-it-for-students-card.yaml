our_take: >
  The standout feature for a first card is the Cashback Match: Discover
  automatically matches all the cash back you earn in your first year, with no
  cap and no annual fee, which effectively doubles whatever you earn while
  you're learning the habit. On top of that you get 5% back in rotating
  quarterly categories, currently gas, EV charging, transit, airlines, and
  drugstores for Q3 2026, plus no foreign transaction fee if you study abroad.
  Be clear on the limits: the 5% requires activation each quarter and stops
  after $1,500 of spending, dropping to 1%, which is also the rate on
  everything else. The 0% intro APR runs only 6 months on purchases, so this
  isn't a card for carrying a balance, and the regular rate of 16.49% to
  25.49% gets expensive fast. Use it to build history, pay it in full, and let
  the first-year match do the work.
