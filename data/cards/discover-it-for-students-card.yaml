our_take: >
  The Discover it for Students gives college students a no-annual-fee card
  with real earning potential: 5% cash back on rotating quarterly categories,
  which for Q3 2026 are gas, EV charging, transit, airlines, and drugstores.
  The bigger draw is the Cashback Match, where Discover matches all the cash
  back new cardmembers earn at the end of the first year with no cap,
  effectively doubling first-year rewards. The tradeoff is that the 5% rate
  requires activation each quarter and stops after $1,500 in category spending
  per quarter, and everything else earns only 1%. The 6-month 0% intro APR on
  purchases is short, so it is not a card to carry a balance on. No foreign
  transaction fee helps students who study or travel abroad. It is a solid
  first card for a student willing to activate categories and pay in full each
  month.
