our_take: >
  The Platinum Select is the easiest way to get American Airlines perks
  without a big fee: a first checked bag free on domestic American itineraries
  and preferred boarding, with the $99 annual fee waived for the first year.
  The welcome offer is back at 80,000 miles after $3,500 in spending within
  four months, after briefly dipping to 50,000 in late summer, which makes
  this a good moment to apply if you have been watching it. Earning is 2x on
  eligible American Airlines purchases, dining, and gas, with 1x on everything
  else, plus 25% off inflight food and beverage. That earn structure is
  modest, so the card's value comes mostly from the bonus and from checked bag
  savings, which can cover the fee after one or two round trips with a
  companion. It ranks among our top airline cards for a reason, but if you
  rarely fly American, a flat cash back card will do more for you on everyday
  spending.
