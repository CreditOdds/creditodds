our_take: >
  The Platinum Select is the easiest way into American Airlines perks, and it
  ranks as the Best Overall pick on our airline cards list: the $99 annual fee
  is waived the first year, and the welcome offer is back up to 80,000 miles
  after $3,500 in spend within four months. That bonus has bounced between
  50,000 and 80,000 miles several times since June, so if you are considering
  the card, the current higher offer is the one to grab. Ongoing value comes
  mainly from a first checked bag free on domestic American itineraries,
  preferred boarding, and 25% off inflight food and drinks, which can cover
  the fee after a single round trip with a checked bag. Earning is 2x on
  American Airlines purchases, dining, and gas, with 1x on everything else.
  The tradeoff is that there are no lounge passes or travel credits, so it
  suits occasional American flyers who want bag savings more than anyone
  chasing premium perks.
