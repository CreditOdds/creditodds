our_take: >
  The Boundless earns its $95 annual fee mainly through the yearly Free Night
  Award, worth up to 35,000 points, which on its own can cover the cost of
  carrying the card. Earning is solid for a midtier hotel card: 6x at Marriott
  Bonvoy hotels, 3x on groceries, gas and dining on up to $6,000 a year
  combined, and 2x on everything else. It also comes with automatic Silver
  Elite status, 15 Elite Night Credits a year, no foreign transaction fees and
  up to $100 in airline statement credits, though those credits require $250
  in airline spending each half year to unlock the $50. The welcome offer is
  paid in Free Night Awards, each good for properties up to 50,000 points,
  after $3,000 in spending in the first 3 months. The real catch is that the
  value depends on actually using the free night and staying with Marriott, so
  it makes sense for regular Marriott guests and much less for anyone who
  rarely books with the chain.
