our_take: >
  The Boundless justifies its $95 annual fee mostly with one thing: an annual
  Free Night Award good for a redemption up to 35,000 points, which a single
  decent stay can cover. Alongside that you get 6 points per dollar at
  Marriott Bonvoy hotels, 15 elite night credits, automatic Silver Elite
  status, and up to $100 a year in airline statement credits, paid as $50 each
  half after $250 in airline purchases. Everyday earning is where it thins
  out: 3 points on groceries, gas and dining but only across a combined $6,000
  a year before the rate drops to 2, with 2 points on other travel and on
  everything else. The current welcome offer is Free Night Awards after $3,000
  in purchases in the first three months, each valid at properties charging up
  to 50,000 points a night, and that is the strongest reason to apply now
  rather than later. Hold it for the free night and the elite night credits,
  not for the spending.
