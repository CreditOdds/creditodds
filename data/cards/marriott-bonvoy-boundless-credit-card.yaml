our_take: >
  The Boundless earns its $95 annual fee mostly through its Free Night Award
  each year, good at properties up to 35,000 points, which on its own can
  cover the cost for anyone who stays with Marriott at least once a year. Day
  to day it earns 6 points per dollar at Marriott hotels, 3 points on
  groceries, gas and dining on the first $6,000 a year combined, and a solid 2
  points on everything else. The welcome offer is paid in Free Night Awards
  rather than points, each valid at properties up to 50,000 points, after
  $3,000 in spend within 3 months. Up to $100 a year in airline statement
  credits helps too, but it pays out $50 per half year only after $250 in
  airline purchases each half, so it takes some planning. Silver Elite status
  and 15 elite night credits are a reasonable head start on status. If you
  never stay at Marriott, the points and free night lose most of their value.
