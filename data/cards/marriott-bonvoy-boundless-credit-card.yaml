our_take: >
  For a $95 annual fee, the Boundless returns an annual Free Night Award worth
  up to 35,000 points, which on its own can cover the fee for anyone who stays
  with Marriott at least once a year. It earns 6x at Marriott Bonvoy hotels,
  3x on groceries, gas, and dining on up to $6,000 a year combined, and a
  solid 2x on everything else, plus automatic Silver Elite status and 15 Elite
  Night Credits annually. Up to $100 a year in airline statement credits adds
  value, but it comes in $50 halves that each require $250 in airline
  purchases first. The welcome offer is paid in Free Night Awards, each valid
  at properties up to 50,000 points per night, after $3,000 in spend within 3
  months. The catch is that the 3x categories cap out quickly at $6,000, so
  this works best as a Marriott loyalty card rather than a primary everyday
  earner.
