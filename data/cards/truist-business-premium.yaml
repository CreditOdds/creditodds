our_take: >
  Two percent back on every purchase with no categories to track is the entire
  pitch, and a $1,000 bonus after $15,000 in three months is a strong opening
  for a business with real volume. The $299 annual fee is waived for the first
  12 months and waived again in any year the business puts $100,000 or more in
  eligible purchases on the card, and that threshold is the number to plan
  around: clear it and this is effectively a free 2% card, fall short and you
  are paying $299 for a rate a no annual fee card can approach. Redeeming into
  an eligible Truist business deposit account adds a 10% bonus, which nudges
  the effective return up if you already bank there. Employee cards are free
  and the regular APR runs 15.74% to 24.74%. Run your realistic annual card
  spend against the $100,000 waiver before applying, because that single
  comparison decides whether this card makes sense.
