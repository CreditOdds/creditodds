our_take: >
  The Truist Business Premium is aimed at high-spending businesses: a flat 2%
  cash back on every purchase and a $1,000 bonus after $15,000 in spend within
  three months. The $299 annual fee is waived the first year, and it is also
  waived in any year you put $100,000 or more on the card, which makes the fee
  a nonissue for the businesses it targets. Redeeming into an eligible Truist
  business deposit account adds a 10% bonus on rewards. The catch is that
  below that $100,000 threshold, you are paying $299 a year for a flat 2% rate
  with few other perks, and plenty of no-fee cards earn the same. It makes
  sense if your annual spend clears the waiver and you already bank with
  Truist.
