our_take: >
  The Truist Business Premium pays a flat 2% cash back on every purchase and
  offers a $1,000 bonus after $15,000 in spending within the first three
  months, which is a strong return for a business with meaningful card volume.
  The $299 annual fee is waived for the first year, and again in any year the
  business charges $100,000 or more in eligible purchases. The tradeoff is
  that below that threshold, the fee takes a real bite out of a 2% earn rate:
  at $50,000 in annual spending, for example, it consumes roughly 30% of the
  $1,000 you would earn. Redeeming into an eligible Truist business deposit
  account adds a 10% loyalty bonus, and employee cards come at no extra
  charge. This card makes the most sense for businesses that can reliably
  clear $100,000 a year in card spending and want simple flat-rate rewards
  without categories.
