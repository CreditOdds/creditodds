our_take: >
  The case for the Inspire is that it bundles enough Disney-specific credits
  to cover its own $149 annual fee if you actually use them: a $100 statement
  credit after $200 in annual spending on U.S. Disney park tickets, and up to
  $120 a year in monthly streaming credits when you spend at least $10 each
  month on Disney+, Hulu, or ESPN+ (enrollment required each year). The signup
  bonus is also front-loaded at $500 total, a $300 Disney eGift Card on
  approval plus a $200 statement credit after $1,000 of spending in the first
  3 months. Everyday earning is where it thins out: 3% on gas, 2% on groceries
  and dining, and 1% on everything else, while the headline 10% streaming rate
  applies only to Disney+, Hulu, and ESPN+ purchases and the 3% entertainment
  rate only at most U.S. Disney locations. There's no foreign transaction fee,
  and the resort bonus of 200 Disney Rewards Dollars requires $2,000 in annual
  spending at U.S. Disney Resorts and Disney Cruise Line. This is a card for
  households who take Disney trips regularly, not a general rewards card, and
  the rewards come back as Disney Rewards Dollars rather than cash.
