our_take: >
  The Disney Inspire Visa makes sense mainly for households already spending
  heavily on Disney, where the annual credits can cover most of the $149 fee.
  You get up to $120 a year back at $10 a month on Disney+, Hulu, or ESPN+
  (with annual enrollment), plus a $100 credit after spending $200 on U.S.
  Disney theme park tickets each anniversary year, and those subscriptions
  also earn 10% back. The earn rates outside Disney are more modest: 3% on gas
  and at most U.S. Disney locations, 2% on groceries and dining, and 1% on
  everything else. The welcome offer is generous at a $300 Disney eGift Card
  on approval plus a $200 statement credit after $1,000 in spending in the
  first 3 months. The catch is that rewards come as Disney Rewards Dollars and
  most of the value is tied to Disney spending, so if you are not a regular at
  the parks or on its streaming services, a no-fee cash back card will do
  better. Park dining and merchandise discounts, no foreign transaction fee,
  and purchase protection round out the package.
