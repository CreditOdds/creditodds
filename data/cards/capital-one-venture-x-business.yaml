our_take: >
  The Venture X Business pairs 2 miles per dollar on all spending with premium
  travel perks, and the $300 annual travel credit plus 10,000 anniversary
  miles can go a long way toward offsetting the $395 annual fee if you already
  book through Capital One Business Travel. Portal bookings earn 10x on hotels
  and rental cars and 5x on flights and vacation rentals, and the primary
  cardholder gets Capital One Lounge, Capital One Landings, and Priority Pass
  access along with Hertz President's Circle status. The welcome offer is
  large at 150,000 miles, but it requires $30,000 in spend within 3 months and
  is not available to existing or previous Capital One business cardholders,
  so it only suits businesses with substantial spend. Guest lounge access also
  only unlocks after $75,000 in annual spend, which is a meaningful hurdle. If
  your team flies often and can route bookings through the portal, the math
  works well; if not, the fee is harder to justify.
