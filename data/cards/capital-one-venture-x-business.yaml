our_take: >
  The Venture X Business pairs 2 miles per dollar on everything with a $300
  annual travel credit and 10,000 anniversary miles, which together can more
  than cover the $395 annual fee for a business that books trips through
  Capital One Business Travel. The portal rates are strong too, at 10 miles on
  hotels and rental cars and 5 miles on flights and vacation rentals. The
  welcome offer is large at 150,000 miles, but it requires $30,000 in spend
  within 3 months and is off limits to existing or previous Capital One
  business cardholders, so check both before applying. The primary cardholder
  gets Capital One Lounge and Priority Pass access, though complimentary
  guests only unlock after $75,000 in annual spend, a real catch for teams
  that travel together. Unlimited free employee and virtual cards that also
  earn 2x make it practical for a growing business that travels often and can
  use the portal credit every year.
