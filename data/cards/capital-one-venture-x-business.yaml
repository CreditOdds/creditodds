our_take: >
  Venture X Business is aimed squarely at high-spend companies: 10x miles on
  hotels and rental cars and 5x on flights and vacation rentals booked through
  Capital One Business Travel, 2x on everything else, and 150,000 bonus miles
  after $30,000 of spend in the first 3 months. The $395 annual fee is largely
  answered by a $300 annual travel credit for Business Travel bookings and
  10,000 anniversary miles, with Capital One Lounge, Capital One Landings, and
  Priority Pass access for the primary cardholder on top. Two catches deserve
  attention. The bonus is not available to existing or previous Capital One
  business cardholders, and complimentary guest lounge access only unlocks
  after $75,000 in annual spend, so the lounge perk is thinner than it first
  reads if you travel with colleagues. Unlimited free employee and virtual
  cards that also earn 2x make it practical to concentrate company spend in
  one account, but the $30,000 bonus threshold means this card only makes
  sense at real scale.
