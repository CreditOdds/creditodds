our_take: >
  The headline right now is the welcome offer, which just doubled from 150,000
  to 300,000 miles, but read the fine print: the first 150,000 takes $40,000
  in spend within 4 months, and the rest, along with a $1,000 Capital One
  Business Travel credit, requires $120,000 in that same window. That
  limited-time offer is only realistic for businesses with very large monthly
  spending, and it excludes existing or previous Capital One business
  cardholders. Beyond the bonus, the card earns 2 miles per dollar on
  everything, 10 miles on hotels and rental cars and 5 miles on flights and
  vacation rentals booked through Capital One Business Travel. The $395 annual
  fee is largely offset by the $300 annual travel credit and 10,000
  anniversary miles, provided you book through the portal. Lounge access,
  Hertz President's Circle status, and free employee cards earning 2x make it
  a strong premium pick, but guests only get into lounges free once you hit
  $75,000 in annual spend.
