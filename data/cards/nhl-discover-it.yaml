our_take: >
  This is the standard Discover it rotating cash back card in NHL clothing: 5%
  back in quarterly categories on up to $1,500 in spending each quarter after
  you activate, which through Q3 2026 covers gas, EV charging, transit,
  airlines and drugstores. There is no annual fee and no foreign transaction
  fee, and the intro window is a genuine 15 months at 0% on both purchases and
  balance transfers, which is long enough to finance something meaningful or
  clear a balance. The work is on you, though: the categories change every
  quarter, activation is required each time, and spending past the $1,500 cap
  drops to 1%, the same rate everything outside the bonus categories earns.
  Discover acceptance is also thinner than Visa or Mastercard, which matters
  more abroad. Maxing the cap all four quarters is worth $300, so treat it as
  a second card you rotate in, not your main one.
