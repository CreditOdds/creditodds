our_take: >
  The NHL Discover it pairs a long interest-free runway with rotating 5% cash
  back. You get 0% intro APR on both purchases and balance transfers for 15
  months, and each quarter you can earn 5% on up to $1,500 in activated
  categories, which for Q4 2026 are dining, entertainment, and utilities. That
  makes it a good fit if you want to finance a purchase or move a balance
  while still earning meaningful rewards on rotating spend, all with no annual
  fee and no foreign transaction fee. The catch is the work involved: you have
  to activate the categories every quarter, the 5% rate drops to 1% past the
  cap, and everything else earns just 1%. Hockey fans get the NHL branding,
  but the value comes from the intro APR and how well the quarterly categories
  match your spending.
