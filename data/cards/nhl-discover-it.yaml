our_take: >
  The NHL Discover it offers 5% cash back in rotating quarterly categories,
  which for Q4 2026 are dining, entertainment, and utilities, on up to $1,500
  in spending per quarter after you activate. It also comes with a 0% intro
  APR on both purchases and balance transfers for 15 months and no annual fee,
  so it works as a financing card and a rewards card at once. The catch is the
  effort: you have to activate the 5% categories every quarter, the bonus
  stops at $1,500 in quarterly spending, and everything else earns just 1%. No
  foreign transaction fees are a plus for travel. It's a good fit for hockey
  fans willing to track the calendar, but anyone who wants set-and-forget
  rewards will find a flat-rate card easier to live with.
