our_take: >
  The NHL Discover it offers one of the longer no-fee runways around: 15
  months of 0% intro APR on both purchases and balance transfers. It also
  earns 5% cash back on rotating quarterly categories, which for Q4 2026 cover
  dining, entertainment, and utilities, on up to $1,500 in spending per
  quarter. The catch is that you must activate those categories every quarter,
  the 5% rate drops to 1% after the cap, and all other spending earns only 1%.
  There is no annual fee and no foreign transaction fee, so it is cheap to
  keep. It suits hockey fans who will track the quarterly categories, while
  anyone wanting a simpler earn rate should look at a flat-rate card.
