our_take: >
  The NHL Discover it pairs 5% cash back on rotating quarterly categories with
  a 15-month 0% intro APR on both purchases and balance transfers, all with no
  annual fee. For Q3 2026 the 5% categories cover gas, EV charging, transit,
  airlines and drugstores, which is a useful mix for many households. The
  catch is the work involved: you have to activate the bonus every quarter,
  and the 5% rate applies only to the first $1,500 in category spending each
  quarter before dropping to 1%. Everything outside the rotating categories
  earns just 1%, so it rewards people who track the calendar and shift their
  spending to match. No foreign transaction fees and the long intro window
  make it a solid all-around option, and the hockey branding is the main thing
  separating it from other Discover it cards.
