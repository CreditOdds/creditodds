our_take: >
  The Omni Rewards American Express is Credit One's play for customers with
  excellent credit, and on paper it is surprisingly competitive: unlimited 2%
  cash back on everything, no annual fee, a $200 bonus after $1,000 in spend,
  and credit lines starting at $5,000. That matches the headline math of the
  Citi Double Cash and similar flat-rate leaders while adding American
  Express Offers through the Amex network. The catch is the issuer: a 29.74%
  APR leaves no room to carry a balance, and Credit One's customer service
  reputation trails the major banks by a wide margin. If you qualify for this
  card, you almost certainly qualify for a mainstream 2% card too, so choose
  it only if the bonus or an existing Credit One relationship tips the scale.
