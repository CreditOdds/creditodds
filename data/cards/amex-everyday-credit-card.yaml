our_take: >
  American Express is no longer accepting applications for the Everyday, so
  this is a card you can keep rather than one you can sign up for today. If
  you already carry it, the case for holding on is simple: there is no annual
  fee, so it costs nothing to leave the account open and let it keep adding
  age to your credit history, and it still earns points. Anyone shopping for a
  new points card will need to look at Amex's current lineup instead, because
  applying here is not an option. Treat the Everyday as a legacy account worth
  maintaining, not a target to chase.
