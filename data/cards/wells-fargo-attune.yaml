our_take: >
  Wells Fargo no longer accepts applications for the Attune, so this take is
  mainly for existing cardholders. Its strength was 4% cash back across a
  lifestyle mix: gyms and self-care, entertainment and sporting events,
  streaming, pet supplies, gardening, public transit, EV charging, and
  secondhand stores, all with no annual fee. If your spending lines up with
  those buckets, it is still worth keeping and using there. The tradeoff is
  that everything outside those categories earns only 1%, so it works best
  paired with a flat-rate card. If you are shopping for something new, Wells
  Fargo points former applicants toward the Autograph for 3x on dining,
  travel, gas, transit, streaming, and phone plans, or the Active Cash for a
  flat 2% on everything.
