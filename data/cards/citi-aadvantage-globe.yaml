our_take: >
  The Globe sits between Citi's entry-level and premium American Airlines
  cards, offering a mix of travel perks for a $350 annual fee: four Admirals
  Club Globe Passes a year, a first checked bag free on domestic American
  itineraries, preferred boarding, and a companion certificate for a domestic
  main cabin round trip starting at your first renewal. Earning is solid for
  an airline card, with 3x on American Airlines purchases, 6x on hotels booked
  through aadvantagehotels.com, and 2x on dining and on transit including
  rideshares and public transit. Be aware that the welcome offer was recently
  cut from 90,000 to 60,000 miles, now earned after $4,000 in spend within
  three months. Getting your money's worth also depends on using a stack of
  specific credits, including up to $240 on Turo rentals, $100 on inflight
  purchases, and a $100 splurge credit limited to a short list of merchants.
  If you fly American a few times a year and will actually use the lounge
  passes and companion certificate, the fee pays for itself, but otherwise the
  1x base rate leaves little reason to put everyday spending here.
