our_take: >
  The Globe sits between American's entry and premium cards, pairing a $350
  annual fee with travel perks a regular American flyer can actually use:
  first checked bag free on domestic itineraries, preferred boarding, four
  Admirals Club Globe Passes a year, and a domestic main cabin companion
  certificate starting on your first renewal. The credits help offset the fee
  if they fit your habits, including up to $240 in Turo rentals, $100 on
  inflight purchases, a $100 splurge credit across a short merchant list, and
  a Global Entry or TSA PreCheck credit. Earning is 6x on hotels booked
  through AAdvantage Hotels, 3x on eligible American Airlines purchases, and
  2x on dining and transit, with 1x on everything else. The welcome offer
  recently dropped from 90,000 to 60,000 miles after $4,000 in three months,
  which makes the first year less compelling than it was over the summer. It
  makes sense if you fly American a few times a year and will use the passes
  and companion certificate, but the credits require effort and the base earn
  is ordinary.
