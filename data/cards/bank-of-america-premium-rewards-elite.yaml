our_take: >
  The Premium Rewards Elite earns 2 points per dollar on travel and dining and
  a solid 1.5 points on everything else, backed by up to $300 a year in
  airline incidental credits and a $150 lifestyle credit for airlines,
  rideshare, or streaming. Priority Pass Select memberships for you and up to
  three authorized users are a genuine draw for families or teams who travel
  together, and you save 20% on airfare when paying with points through BofA
  Travel or the Concierge. The 75,000-point welcome bonus requires $5,000 in
  spend within three months. The catch is the $550 annual fee: the two annual
  credits cover $450 of it only if you actually use them, both require
  enrollment, and the earn rates are modest for a card at this price. It makes
  the most sense for travelers who will reliably burn the credits and value
  the shared lounge access.
