our_take: >
  The Premium Rewards Elite earns a flat 1.5 points per dollar on everything
  and 2 points per dollar on travel and dining, backed by a 75,000-point
  welcome offer after $5,000 in spend within 3 months. Its case rests on the
  credits: a $300 airline incidental credit and a $150 lifestyle credit for
  airlines, rideshare, or streaming, both of which require enrollment, plus up
  to $120 toward Global Entry or TSA PreCheck. Priority Pass Select
  memberships for you and up to three authorized users add genuine lounge
  value for families who travel together, and paying with points through BofA
  Travel saves 20% on airfare. The tradeoff is a $550 annual fee, which only
  nets out if you reliably use both annual credits, and the 2x travel and
  dining rate is modest for a premium card. It fits a travel-heavy cardholder
  who values lounge access for a household more than high bonus-category
  earning.
