our_take: >
  The credits are the argument for this card: $300 a year toward airline
  incidentals, a $150 lifestyle credit good for airlines, rideshare, or
  streaming, up to $120 back on Global Entry or TSA PreCheck every four years,
  and Priority Pass Select lounge access for you and up to three authorized
  users. Layered on the 75,000-point bonus after $5,000 in three months, that
  can cover the $550 annual fee in year one with room to spare. The earn rates
  are the weak spot: 2x on travel and dining and 1.5x on everything else is
  unremarkable for a card at this price, so the value depends almost entirely
  on you actually using the credits, both of which require enrollment. Paying
  with points through BofA Travel or the Concierge does save 20% on airfare in
  any class, which softens the mediocre multipliers. Run the math on the
  credits honestly before you commit, because without them the fee is hard to
  justify.
