our_take: >
  The first thing to know about the Free Spirit Travel More World Elite
  Mastercard is that Bank of America is no longer accepting applications, so
  this take is for existing cardholders deciding whether to keep it. For
  frequent Spirit flyers the case was always the airline perks: two free
  checked bags on Spirit flights, shortcut boarding, and a 25% rebate on
  inflight food and drinks can easily outweigh the $79 annual fee on their
  own. Earning is modest, with 3 points per dollar only on Spirit tickets and
  inflight purchases, 2 points on dining and groceries, and 1 point on
  everything else. The $100 companion voucher requires $5,000 in spend over
  the prior anniversary year and doesn't cover taxes and fees, so treat it as
  a bonus rather than a reason to carry the card. If you've stopped flying
  Spirit regularly, the bag benefit is the only thing holding up the fee, and
  without it there's little reason to keep paying.
