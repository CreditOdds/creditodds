our_take: >
  The Free Spirit Travel More World Elite earned 3x on Spirit tickets and
  inflight purchases only, with 2x at dining and groceries and 1x elsewhere,
  which at least gave it some life away from the airport. The perks were where
  it justified its $79 annual fee, waived for the first 12 months: two free
  checked bags on Spirit flights, shortcut boarding, a 25% inflight food and
  beverage rebate, and a $100 companion flight voucher at each anniversary
  after $5,000 of prior-year spending. Points pooling with up to eight friends
  or family was a useful extra for households that flew Spirit together. The
  catch was always that almost all of the value sat inside one low-cost
  airline, so if your Spirit flying dropped off, the fee stopped covering
  itself quickly. It is also no longer accepting applications, so it is now a
  keep-or-cancel decision for current cardholders rather than an option for
  new ones.
