our_take: >
  The Free Spirit Travel More World Elite Mastercard is no longer accepting
  applications, so this take is mainly for people who already carry it. For
  loyal Spirit flyers it still pulls its weight: two free checked bags on
  Spirit flights can cover the $79 annual fee in a single trip, and you also
  get shortcut boarding and a 25% rebate on inflight food and drinks. Earning
  is 3 points per dollar on Spirit tickets and inflight purchases only, 2
  points on dining and groceries, and 1 point on everything else, with no
  foreign transaction fee. The $100 companion flight voucher requires $5,000
  in spend each anniversary year and doesn't cover taxes and fees, so it's a
  modest reward for steady use. If you rarely fly Spirit, the bags and
  boarding perks go unused and a flat-rate card will earn more on everyday
  spending.
