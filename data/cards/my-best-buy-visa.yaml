our_take: >
  The My Best Buy Visa is built for regular Best Buy shoppers, earning 5% back
  on Best Buy purchases in store and online with no annual fee. The catch is
  that those rewards post as My Best Buy points that redeem only as Best Buy
  certificates, not cash, so their value depends on returning to shop there.
  Outside Best Buy it is respectable but not standout, with 3% on gas, 2% on
  dining and groceries, and 1% on everything else. Qualifying Best Buy
  purchases can also be financed with deferred interest instead of earning
  rewards, which helps for big-ticket electronics if you are confident you can
  pay the balance off within the promotional window. New cardmembers get 10%
  back on the first day of purchases made within 14 days of opening. Treat it
  as a store card for frequent Best Buy customers rather than an everyday
  rewards card.
