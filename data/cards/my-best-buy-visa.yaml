our_take: >
  The My Best Buy Visa earns 5% back on Best Buy purchases in store and
  online, but that reward posts as My Best Buy points redeemable only as Best
  Buy certificates, not cash. Outside the store it is a more general card than
  you might expect, earning 3% on gas, 2% on dining and groceries, and 1% on
  everything else, with no annual fee and no foreign transaction fees. The
  catch is that the headline rate locks your rewards into one retailer, so it
  only pays off if you shop at Best Buy often enough to spend those
  certificates. Deferred interest financing on qualifying Best Buy purchases
  is an alternative to earning rewards on the same purchase, and deferred
  interest can be costly if you do not pay the balance in full before the
  promo ends. It makes sense for frequent Best Buy shoppers; everyone else
  will do better with a card that pays cash.
