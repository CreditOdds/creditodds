our_take: >
  The My Best Buy Visa is built for frequent Best Buy shoppers, earning 5%
  back on Best Buy purchases in store and on BestBuy.com with no annual fee.
  The catch is that those rewards post as My Best Buy points and redeem only
  as Best Buy certificates, not cash, so they are only worth as much as your
  next trip to Best Buy. Outside the store it is more useful than most
  retailer cards, with 3% on gas, 2% on dining and groceries, 1% on everything
  else and no foreign transaction fees. Be aware that Best Buy's deferred
  interest financing replaces rewards on the same purchase, so you have to
  choose between earning 5% and financing the item. It works best as a second
  card for someone who buys electronics regularly, not as a primary everyday
  card.
