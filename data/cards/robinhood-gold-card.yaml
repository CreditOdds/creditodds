name: "Robinhood Gold"
bank: "Robinhood"
slug: "robinhood-gold-card"
accepting_applications: true
image: "robinhood-gold-card.png"
release_date: "2024-03-26"
# The $50 annual_fee models the required Robinhood Gold membership ($5/mo or
# $50/yr) you must hold to get this card. The card page itself lists a $0 annual
# fee, so card-page-check keeps proposing 50 -> 0. The $50 is an intentional
# modeling decision (#1494); ignore annual_fee for this card.
check_ignore:
  - annual_fee
annual_fee: 50
benefits:
  - name: "Travel Insurance"
    value: 0
    description: "Trip cancellation, trip delay, and lost luggage protection"
    frequency: "ongoing"
    category: "travel"
  - name: "Cell Phone Protection"
    value: 0
    description: "Cell phone damage and theft protection when you pay your bill with the card"
    frequency: "ongoing"
    category: "other"
tags:
  - cashback
  - rewards
reward_type: "cashback"
rewards:
  - category: travel_portal
    value: 5
    unit: percent
    note: "Travel booked through Robinhood travel portal"
  - category: everything_else
    value: 3
    unit: percent
apr:
  regular:
    min: 29.99
    max: 29.99
apply_link: https://robinhood.com/creditcard/
# The 3% foreign transaction fee applies to accounts opened on or after
# 2026-07-01; accounts opened before that date are grandfathered with no fee.
foreign_transaction_fee: true
our_take: >
  The pitch here is unusually simple: a flat 3% back on everything, which is
  higher than almost any no-category card asks you to think about, plus 5% on
  travel booked through Robinhood's own portal. The $50 annual fee means you
  need roughly $5,000 of yearly spending to come out ahead of a plain 2% card,
  so this only works if it becomes your default for most purchases. Two
  catches matter. There is a foreign transaction fee, which makes it a poor
  travel companion despite the portal rate, and the APR is a flat 29.99% with
  no intro period, so carrying a balance erases the rewards fast. Travel
  insurance and cell phone protection when you pay your bill with the card are
  useful but secondary reasons to hold it.
