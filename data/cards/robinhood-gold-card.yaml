name: "Robinhood Gold"
bank: "Robinhood"
slug: "robinhood-gold-card"
accepting_applications: true
image: "robinhood-gold-card.png"
release_date: "2024-03-26"
# The $50 annual_fee models the required Robinhood Gold membership ($5/mo or
# $50/yr) you must hold to get this card. The card page itself lists a $0 annual
# fee, so card-page-check keeps proposing 50 -> 0. The $50 is an intentional
# modeling decision (#1494); ignore annual_fee for this card.
check_ignore:
  - annual_fee
annual_fee: 50
benefits:
  - name: "Travel Insurance"
    value: 0
    description: "Trip cancellation, trip delay, and lost luggage protection"
    frequency: "ongoing"
    category: "travel"
  - name: "Cell Phone Protection"
    value: 0
    description: "Cell phone damage and theft protection when you pay your bill with the card"
    frequency: "ongoing"
    category: "other"
tags:
  - cashback
  - rewards
reward_type: "cashback"
rewards:
  - category: travel_portal
    value: 5
    unit: percent
    note: "Travel booked through Robinhood travel portal"
  - category: everything_else
    value: 3
    unit: percent
apr:
  regular:
    min: 29.99
    max: 29.99
apply_link: https://robinhood.com/creditcard/
# The 3% foreign transaction fee applies to accounts opened on or after
# 2026-07-01; accounts opened before that date are grandfathered with no fee.
foreign_transaction_fee: true
our_take: >
  The Robinhood Gold card's big draw is a flat 3% cash back on everything,
  rising to 5% on travel booked through the Robinhood travel portal, which is
  an unusually high base rate. That earn rate can easily outweigh the $50
  annual fee for anyone who puts meaningful spending on the card, and travel
  insurance plus cell phone protection round out the package. The catches are
  real, though: the card charges a foreign transaction fee, which undercuts
  its travel appeal abroad, and the 29.99% APR makes carrying a balance
  costly. There's also no signup bonus listed, so the value builds slowly
  through everyday spending. If you pay in full each month and spend mostly
  domestically, it's a compelling single-card setup.
