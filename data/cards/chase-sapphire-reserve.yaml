our_take: >
  The Sapphire Reserve is a luxury travel card built around big earning on
  travel, with 8 points per dollar on Chase Travel, 4 on flights and hotels
  booked directly, and 3 on dining, plus Sapphire Lounge and Priority Pass
  Select access. The signup bonus was recently cut from 150,000 to 100,000
  points after $6,000 in spending within three months, though it still ranks
  #3 on our Best Credit Card Signup Bonuses list. The real catch is the $795
  annual fee, which you can only justify by using a stack of credits: $300 for
  travel, up to $500 for The Edit hotel bookings, up to $300 for dining at
  Sapphire Exclusive Tables restaurants, and up to $300 for StubHub, along
  with DoorDash, Lyft, and Peloton perks. Several of those are split into
  semiannual or monthly pieces, so they reward people who track them closely.
  Everything else earns just 1 point per dollar, so it suits frequent
  travelers far more than casual spenders.
