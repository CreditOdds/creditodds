our_take: >
  The Credit One Bank Vegas Golden Knights Visa is a fan card first and a
  rewards card second. It earns 1% back on gas, groceries, mobile phone, and
  TV services, nothing elsewhere, and its annual fee ranges from $0 to $99
  depending on creditworthiness, with rebuilding-tier applicants paying the
  most. What you are really buying is the Vegas Born card design and access
  to team deals and experiences, which is a fair trade only for the
  committed faithful. The card's one structural virtue is accessibility: it
  accepts applicants across the credit spectrum, from rebuilding through
  excellent. As with every Credit One product, the 29.74% APR means pay in
  full or pay dearly. Non-fans, and even most fans, will get more from the
  NHL Discover it, which donates its rewards logic to the whole league.
