our_take: >
  The Pathfinder Rewards is at its best for PenFed Honors Advantage members,
  meaning military members or those with Access America checking, who earn 4
  points per dollar on travel and 3 on dining; everyone else gets 3x and 2x.
  Its everyday rate of 1.5 points per dollar is stronger than many travel
  cards, and the 50,000-point bonus after $3,000 in spend over three months is
  easy to reach. The $95 annual fee is largely offset by up to $100 a year in
  domestic airline incidental credits, covering baggage fees, ticket changes
  and in-flight purchases, plus up to $120 toward Global Entry or $85 toward
  TSA PreCheck every four years. The catch is that the Priority Pass
  membership doesn't include free visits, so lounge access still costs you per
  entry. If you can't qualify for Honors Advantage, the reduced earn rates
  make the fee harder to justify, but for eligible members it is a
  well-rounded travel card with no foreign transaction fees.
