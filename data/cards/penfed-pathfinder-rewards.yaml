our_take: >
  The Pathfinder makes the most sense for PenFed Honors Advantage members,
  current or former military or Access America checking customers, because
  that status both waives the $95 annual fee and lifts earning to 4 points per
  dollar on travel and 3 on dining, versus 3x and 2x for everyone else. On top
  of that it carries $100 a year in statement credits for domestic airline
  incidental fees, up to $120 back on Global Entry or $85 on TSA PreCheck once
  every 5 years, and a complimentary Priority Pass membership, though
  per-visit lounge fees still apply. The signup bonus is 50,000 points after
  $3,000 in purchases within 3 months, and there is no foreign transaction
  fee. Non-Honors applicants get a distinctly worse version: the fee stands,
  both bonus categories drop a tier, and the 1.5 points per dollar base rate
  is the only thing that stays put. The APR is a flat 17.99%, fine as far as
  it goes, but this is not a card to carry a balance on.
