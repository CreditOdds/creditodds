our_take: >
  The PenFed Pathfinder Rewards delivers strong travel value for a $95 annual
  fee, earning up to 4 points per dollar on travel and 3 on dining, along with
  a solid 1.5 points per dollar on everything else. The catch is that the top
  rates require PenFed Honors Advantage status through military service or an
  Access America checking account; without it, travel drops to 3x and dining
  to 2x. New cardholders can earn 50,000 points after spending $3,000 in three
  months. The perks go further than most cards at this price: up to $100 a
  year in domestic airline incidental credits, a Global Entry or TSA PreCheck
  credit every four years, and a complimentary Priority Pass membership,
  though per-visit lounge fees apply. With no foreign transaction fees, it is
  a good fit for frequent travelers, especially those who qualify for Honors
  Advantage.
