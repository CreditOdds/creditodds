our_take: >
  The Pathfinder's draw is the benefit stack for a $95 annual fee: up to $100
  a year in airline incidental credits, a Global Entry or TSA PreCheck credit
  every four years, and a complimentary Priority Pass membership, which is
  unusual at this price. Earn rates are best if you qualify for PenFed Honors
  Advantage through military service or an Access America checking account,
  which lifts travel to 4x and dining to 3x; without it those drop to 3x and
  2x. Even at the lower tier the 1.5 points per dollar base rate on everything
  else is respectable, and there is no foreign transaction fee. The
  50,000-point bonus after $3,000 in three months is the largest single reason
  to apply. Note that Priority Pass here charges per visit rather than
  including them, and the regular APR is a flat 17.99%, so the math only works
  if you pay in full and actually use the travel credits.
