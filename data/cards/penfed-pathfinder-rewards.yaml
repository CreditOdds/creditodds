our_take: >
  The PenFed Pathfinder Rewards is a well-rounded travel card that earns 1.5
  points per dollar on everything, a strong floor for a travel card, plus
  elevated rates on travel and dining. The best version goes to PenFed Honors
  Advantage members (military or Access America checking), who earn 4x on
  travel and 3x on dining; everyone else gets 3x and 2x. The $95 annual fee
  comes back with an annual credit of up to $100 for domestic airline
  incidental fees like baggage and change fees, plus a Global Entry or TSA
  PreCheck credit every four years. A 50,000-point bonus after $3,000 in
  spending within three months and no foreign transaction fees add to the
  case. The catch is that the included Priority Pass membership still charges
  per-visit fees, so don't count it as free lounge access, and the card is
  noticeably stronger if you qualify for Honors Advantage.
