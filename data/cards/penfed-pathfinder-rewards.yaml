our_take: >
  The Pathfinder Rewards is a travel card whose value hinges on PenFed Honors
  Advantage status: members who qualify through military service or Access
  America checking earn 4 points per dollar on travel and 3 on dining, versus
  3 and 2 for everyone else. A 1.5-point base rate on all other spending keeps
  non-travel purchases from being dead weight, and the 50,000-point bonus
  after $3,000 in spending in the first three months gives you a solid start.
  The $95 annual fee is offset by up to $100 a year in domestic airline
  incidental credits and a Global Entry or TSA PreCheck credit every four
  years. The Priority Pass membership is less generous than it sounds, since
  per-visit fees still apply. If you qualify for Honors Advantage and fly
  domestically a few times a year, it's a strong value, but without that
  status the earn rates are ordinary for the fee.
