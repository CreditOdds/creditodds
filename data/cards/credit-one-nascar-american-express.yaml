our_take: >
  The Credit One Bank NASCAR American Express is functionally the issuer's
  Premier American Express wearing a firesuit: an unlimited 1% back on all
  purchases, an annual fee of $0 to $39 depending on creditworthiness, and
  Amex network extras like Retail Protection and American Express Offers.
  The NASCAR branding is the actual product here, with racing card designs
  for fans; past versions carried NASCAR.com discounts, so check current
  terms if that matters to you. The rewards math is thin once any fee
  applies, and the 29.74% APR rules out carrying a balance. Fans of the
  sport with average credit get a serviceable card with the right logo on
  it; everyone else should compare Credit One's own no-fee Omni card or a
  mainstream starter card first.
