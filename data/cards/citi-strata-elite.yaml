our_take: >
  At $595 a year, the Strata Elite leans on credits and lounge access rather
  than broad earning: unlimited Priority Pass Select, four Admirals Club
  passes, up to $300 off a single hotel stay of two or more nights booked
  through Citi Travel, $200 a year with Blacklane, $200 split across two of
  five splurge brands, and a Global Entry or TSA PreCheck credit every four
  years. Used in full those cover the fee, but nearly all of them require
  booking through a specific channel or brand, which is the honest catch. Earn
  rates are strongest inside Citi Travel at 12x on hotels, car rentals and
  attractions and 6x on flights, while dining pays 3x and rises to 6x on Citi
  Nights between 6PM and 6AM Friday and Saturday. Everything else earns 1.5x,
  a respectable base for a premium card and better than most of its peers
  offer. The signup bonus is 75,000 points after $6,000 in three months, and
  the card sits at #7 on our Best Travel Credit Cards list.
