our_take: >
  The Citi Strata Elite is Citi's premium travel card, and its value comes
  from stacking credits against the $595 annual fee: up to $300 off a hotel
  stay of two or more nights booked through Citi Travel, a $200 Splurge Credit
  at up to two brands such as American Airlines or Best Buy, $200 in Blacklane
  chauffeur credits split by half-year, and a Global Entry or TSA PreCheck
  credit every four years. Add unlimited Priority Pass lounge access and four
  Admirals Club passes a year, and frequent travelers can come out ahead,
  which is why it ranks #8 on our Best Travel Credit Cards list. The earn
  rates are strongest through the portal, with 12x on hotels, car rentals, and
  attractions and 6x on flights booked via Citi Travel, plus 3x on dining (6x
  during Citi Nights on Friday and Saturday evenings) and 1.5x on everything
  else. The catch is that much of that value depends on using specific
  channels and merchants, and if you would not naturally book through Citi
  Travel or use Blacklane, the effective fee climbs quickly. The 75,000 point
  bonus also requires a steep $6,000 in spend within three months.
