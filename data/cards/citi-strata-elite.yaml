our_take: >
  The Citi Strata Elite earns at an unusually high clip on travel booked
  through Citi Travel: 12x on hotels, car rentals, and attractions and 6x on
  flights, plus 3x on dining (6x during Citi Nights, Friday and Saturday 6PM
  to 6AM ET) and a solid 1.5x on everything else. The 75,000-point bonus after
  $6,000 in spend over 3 months and unlimited Priority Pass access add to the
  appeal, and it ranks #4 on our list of the best travel cards. The real catch
  is the $595 annual fee, which you only offset by actually using the credits:
  up to $300 on a single 2+ night hotel stay through cititravel.com, $200 at
  your choice of up to two brands such as American Airlines or Best Buy, and
  $200 in Blacklane chauffeur rides split into two $100 halves. Four Admirals
  Club passes a year and a Global Entry or TSA PreCheck credit round out the
  package. If you would not naturally book through Citi's portal or use those
  specific credits, the math gets hard to justify, so be honest about your
  habits before applying.
