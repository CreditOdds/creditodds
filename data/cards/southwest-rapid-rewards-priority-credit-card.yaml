our_take: >
  The Rapid Rewards Priority is the most rewarding personal Southwest card,
  ranking #5 on our Best Airline Credit Cards list thanks to perks that go
  well beyond the cheaper tiers: unlimited Extra Legroom seat upgrades within
  48 hours of departure when available, complimentary Preferred seat selection
  at booking, a $75 annual Southwest travel credit, and 7,500 anniversary
  points. A free first checked bag for you and up to eight passengers rounds
  out the travel benefits. The $75 credit and anniversary points take a real
  bite out of the $229 annual fee. Be aware that the welcome offer was
  recently cut from 90,000 to 60,000 points after $2,000 in spending within
  three months. Earning is 4 points per dollar on Southwest, 2 on gas and
  dining, and 1 on everything else, so this is a card for loyal Southwest
  flyers rather than a general rewards workhorse.
