our_take: >
  The Ritz-Carlton card makes sense for Marriott loyalists who will use its
  credits: up to $300 a year on airline incidentals such as baggage fees, seat
  upgrades, and lounge passes, plus an annual free night worth up to 85,000
  points, together go a long way toward offsetting the $450 annual fee. It
  earns 6 points per dollar at participating Marriott Bonvoy hotels, 3 points
  on dining, airlines, and car rentals, and 2 points on everything else. Perks
  include automatic Gold Elite status, 15 elite night credits each year,
  Priority Pass Select with access to Chase Sapphire Lounges, and a Global
  Entry or TSA PreCheck credit. The catch is that the value depends on
  Marriott: the 6x rate applies only at Marriott properties, points are tied
  to Bonvoy, and the $100 property credit requires stays of two nights or more
  at Ritz-Carlton or St. Regis. There's no foreign transaction fee, but if you
  don't stay with Marriott regularly, a flexible-points card will serve you
  better.
