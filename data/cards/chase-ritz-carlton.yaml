our_take: >
  The Ritz-Carlton card is built for loyal Marriott guests, earning 6 points
  per dollar at participating Marriott Bonvoy hotels, 3 on dining, airlines,
  and car rentals, and a solid 2 on everything else. The $450 annual fee is
  offset by up to $300 a year in airline incidental credits for things like
  bag fees and seat upgrades, plus an annual free night award worth up to
  85,000 points. Automatic Gold Elite status, 15 elite night credits each
  year, and Priority Pass Select with access to Chase Sapphire Lounges add
  real value for frequent travelers. The catch is that the airline credit only
  covers specific incidental charges, and the free night and hotel perks only
  pay off if you actually stay within the Marriott family. There is no foreign
  transaction fee, but if you do not travel regularly enough to use the credit
  and free night, the fee is hard to justify.
