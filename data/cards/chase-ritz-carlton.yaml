our_take: >
  The Ritz-Carlton card is a premium Marriott play whose value rests on its
  credits: up to $300 a year toward airline incidentals like bag fees, seat
  upgrades, and lounge passes, plus an annual free night certificate good for
  a room at up to 85,000 points. Those two alone can cover most of the $450
  annual fee for anyone who travels regularly and stays with Marriott. It also
  includes automatic Gold Elite status, 15 elite night credits each year,
  Priority Pass Select with access to Chase Sapphire Lounges, and a Global
  Entry or TSA PreCheck credit. Earning is decent, with 6 points per dollar at
  participating Marriott hotels, 3 on dining, airlines, and car rentals, and 2
  on everything else. The catch is that it only pays off if you will actually
  use the airline credit and the free night, and Marriott points are less
  flexible than transferable bank points.
