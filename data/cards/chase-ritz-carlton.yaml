our_take: >
  The anniversary free night award, good for a standard room at a redemption
  level up to 85,000 points, is the core of this card, and on the right
  Marriott property it can justify most of the $450 annual fee by itself. Add
  the $300 annual credit on airline charges like bag fees, seat upgrades, and
  lounge day passes, and the fee is largely defused before you count Priority
  Pass Select access, automatic Gold Elite status, 15 elite night credits a
  year, and a $120 Global Entry credit every four years. Earning is solid
  rather than exceptional: 6x at participating Marriott hotels, 3x on dining,
  airlines, and car rentals, 2x on everything else, and no foreign transaction
  fees. The catch is that this is a card you have to work, since the airline
  credit and the $100 property credit on two night stays at Ritz-Carlton and
  St. Regis only pay out if your travel actually looks like that. There is
  also no signup bonus attached, so year one value has to come from the
  credits and the free night rather than a welcome haul.
