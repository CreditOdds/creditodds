our_take: >
  The Ritz-Carlton card has been closed to new applications since 2018, so the
  only way in is a product change from a Chase Marriott Bonvoy card you have
  held for at least a year, which is why it keeps turning up in upgrade threads
  rather than application ones. What makes it worth the detour is the annual
  free night award at up to 85,000 points, a full 50,000 above what Boundless
  gives you, which is the difference between a mid-tier property and a genuinely
  aspirational one. Add the $300 airline credit and the $450 fee is mostly
  covered before you count anything else, and the rest is real: Priority Pass
  Select with Chase Sapphire Lounge access, a $120 Global Entry credit, 15
  elite nights, automatic Gold Elite, and a $100 property credit on two-night
  stays at Ritz-Carlton and St. Regis hotels. Earning is the weak spot at 6x on
  Marriott stays, 3x on dining, airfare, and car rentals, and 2x on everything
  else, so this is a card you hold for the certificate and the credits rather
  than one you put daily spend on. If you already have a Boundless sitting at a
  $10,000 credit line, the upgrade math is straightforward.
