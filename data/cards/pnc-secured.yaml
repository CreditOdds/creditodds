our_take: >
  The PNC Secured is a plain credit-building card, and it is priced like one:
  no annual fee, so the only money at stake is the security deposit itself and
  any interest you let accrue. That makes it a reasonable option if you are
  establishing or rebuilding credit and want a card that does not charge you
  for the privilege, particularly if you already bank with PNC. Be clear about
  what it is not: there are no rewards of any kind, no intro APR, and no
  listed benefits, so there is nothing here to keep it in your wallet once
  your credit qualifies you for something better. The standard APR is a fixed
  25.49% and there is a foreign transaction fee, so pay the full statement
  balance every month and keep purchases small. Use it to build a payment
  history, then graduate.
