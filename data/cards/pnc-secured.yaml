our_take: >
  The PNC Secured is a basic credit-building tool: it charges no annual fee,
  so the only cost of using it responsibly is the deposit that secures the
  line. That makes it a reasonable starting point if you are new to credit or
  rebuilding and want to establish a payment history with PNC. Do not expect
  anything beyond that, since the card earns no rewards and lists no perks.
  The 25.49% APR is high, so pay the balance in full each month, and the
  foreign transaction fee makes it a poor choice for use abroad. Use it to
  build a track record, then graduate to a rewards card once your credit
  allows.
