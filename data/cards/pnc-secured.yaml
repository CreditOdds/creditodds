our_take: >
  The PNC Secured is a basic credit-building tool with one clear advantage: it
  carries no annual fee, so building a payment history doesn't cost you
  anything beyond the deposit. That makes it a reasonable starting point if
  you're new to credit or rebuilding and want a card from a major bank. Be
  realistic about what it offers, though: there are no rewards, no listed
  benefits, and a 25.49% APR that makes carrying a balance expensive. It also
  charges a foreign transaction fee, so it's not one to take overseas. Use it
  for small purchases you pay off in full each month, and plan to graduate to
  a rewards card once your credit improves.
