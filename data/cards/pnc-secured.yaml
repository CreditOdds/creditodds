our_take: >
  The PNC Secured is a no-annual-fee secured Visa aimed squarely at building
  or rebuilding credit, and that is its main reason to exist. Charging no
  annual fee is the most important feature in this category, since it means
  every dollar you put in works toward your credit history rather than
  covering costs. The tradeoffs are real, though: the card earns no rewards,
  carries a 25.49% APR, and charges a foreign transaction fee. Use it for
  small, regular purchases that you pay off in full each month, and treat it
  as a stepping stone toward an unsecured card with rewards once your credit
  improves.
