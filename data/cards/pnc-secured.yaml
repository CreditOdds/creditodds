our_take: >
  The PNC Secured is a basic credit-building card with no annual fee, which
  keeps the cost of establishing a payment history low. That makes it a
  reasonable starting point for someone with limited or damaged credit,
  particularly if you already bank with PNC. The catch is that it offers
  nothing beyond the credit line itself: there are no rewards and no listed
  perks. The 25.49% regular APR is high, so pay the balance in full each
  month, and the foreign transaction fee makes it a poor choice for purchases
  abroad. Use it to build a track record, then move on to a rewards card once
  your credit improves.
