our_take: >
  The Savor Student gives students an unusually strong earn rate for a
  no-annual-fee card: 3% cash back on dining, entertainment, streaming, and
  groceries, plus 5% on hotels and rental cars booked through Capital One
  Travel. That covers most of where student budgets actually go, and there is
  no foreign transaction fee for study abroad. Capital One recently trimmed
  the signup bonus back from $100 to $50, though the $100 spend requirement in
  the first 3 months is still easy to hit. The catch is the 1% base rate on
  everything else, so purchases outside those categories earn little. For a
  student who eats out, buys groceries, and pays for streaming, it is a solid
  first card to grow with.
