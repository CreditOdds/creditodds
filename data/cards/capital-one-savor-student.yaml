our_take: >
  The Savor Student gives students an unusually rich earn structure for a
  no-annual-fee card: 3% cash back on dining, entertainment, streaming, and
  groceries, plus 5% on hotels and rental cars booked through Capital One
  Travel. Those categories line up well with how many students actually spend,
  and no foreign transaction fees makes it a sensible pick for study abroad.
  Capital One recently cut the signup bonus from $100 to $50, still earned on
  just $100 of spending in the first 3 months, so it is now a small sweetener
  rather than a reason to apply. Everything outside the bonus categories earns
  only 1%, so it works best paired with a flat-rate card for other purchases.
  There is no intro APR, and the regular APR runs as high as 28.49%, so pay
  the balance in full.
