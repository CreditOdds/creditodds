our_take: >
  The Spark Classic is a business credit builder: no annual fee, unlimited 1%
  cash back with no minimum to redeem, and no foreign transaction fee. It
  gives a newer or credit-challenged business owner a way to establish a
  business card history while still earning a little on every purchase. Free
  employee cards with customizable limits, a selectable due date, and year-end
  spending summaries exportable to QuickBooks are practical extras for
  managing cash flow. The catch is the low 1% earn rate and a steep 28.99%
  APR, so carrying a balance would quickly cost more than the rewards return.
  Use it to build credit, pay in full monthly, and move up to a stronger
  rewards card once your profile allows.
