our_take: >
  The Spark Classic is a business credit builder first: it has no annual fee
  and is aimed at owners still establishing credit, while still paying an
  unlimited 1% cash back on every purchase with no minimum to redeem and no
  expiration while the account is open. Free employee cards, virtual card
  numbers, a choose-your-due-date option, and exportable year-end spending
  summaries make it more useful for day-to-day operations than a typical
  starter card. The tradeoff is that 1% is a low earn rate, with no bonus
  categories, no signup bonus, and no intro APR. The 28.99% APR also makes
  carrying a balance expensive, so pay in full. Use it to build the business's
  credit profile and plan to upgrade to a richer rewards card once you
  qualify.
