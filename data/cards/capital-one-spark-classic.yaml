our_take: >
  The Spark Classic is a no-annual-fee business card aimed at owners who are
  still building credit, earning a flat 1% cash back on everything with no
  minimum to redeem and no expiration while the account is open. Free employee
  cards, virtual card numbers, and the ability to choose your due date make it
  a practical tool for separating business expenses from personal ones. The
  catch is that 1% is a thin return, and the 28.99% regular APR makes carrying
  a balance expensive. There is no signup bonus or intro APR either. Use it to
  establish your business credit history with full monthly payments, then
  graduate to a card with a stronger earn rate.
