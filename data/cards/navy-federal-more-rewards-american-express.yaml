our_take: >
  The More Rewards stands out for how much everyday spending it covers at 3
  points per dollar: dining (including food delivery), groceries, gas, and
  transit, all with no annual fee. That lineup makes it one of the more
  practical no-fee cards for a household that spends most of its budget in
  those four areas. The signup bonus adds 20,000 points, worth $200, after
  $2,000 in spending in the first three months for applications through
  1/3/2027. The catch is the 1 point per dollar on everything outside those
  categories, so it pays to keep a flat-rate card for the rest. No foreign
  transaction fees and no balance transfer fees are nice extras, but the real
  reason to carry it is that broad 3x core.
