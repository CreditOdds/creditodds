our_take: >
  The More Rewards Amex earns 3 points per dollar across four of the biggest
  everyday categories at once, dining including food delivery, groceries, gas
  and transit, and it does that with no annual fee and no foreign transaction
  fee. That breadth is rare at $0, and the regular APR range of 14.15% to 18%
  is well below what most rewards cards charge if you ever carry a balance.
  The opening offer is modest but easy to clear: 20,000 points worth $200
  after $2,000 in the first three months, on applications through 1/3/2027.
  The catch is everything outside those four categories earns just 1 point per
  dollar, so this is a supporting card for routine spending rather than a
  single-card solution. No balance transfer fees and car rental discounts with
  loss and damage coverage round it out.
