our_take: >
  The More Rewards American Express stands out for earning 3 points per dollar
  across four everyday categories at once: dining including food delivery,
  groceries, gas, and transit, all with no annual fee. New cardholders can
  earn 20,000 points worth $200 after spending $2,000 in three months, with
  the offer running through January 3, 2027. That combination makes it one of
  the more practical no-fee cards for households whose budgets center on food
  and getting around. The catch is the 1 point per dollar on everything else,
  and running on the American Express network means some merchants may not
  accept it. No foreign transaction fees and no balance transfer fees are
  welcome extras for Navy Federal members.
