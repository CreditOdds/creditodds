our_take: >
  More Rewards packs an unusually wide spread of 3x categories into a
  no-annual-fee card: 3 points per dollar on dining and food delivery,
  groceries, gas and transit. For a household whose budget runs mostly through
  those four buckets, that is a lot of earning power for no cost, and the
  20,000-point bonus, worth $200 after $2,000 in spend over three months, is a
  reasonable welcome. The tradeoff is that everything else earns just 1 point
  per dollar, and because it runs on the American Express network, you may run
  into merchants that don't accept it. The regular APR of 14.15% to 18% is low
  for a rewards card, and Navy Federal charges no balance transfer fees. No
  foreign transaction fees and car rental discounts with included coverage are
  nice extras on a card that earns its spot through its everyday categories.
