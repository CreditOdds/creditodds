our_take: >
  A flat 1.5% cash back on everything, no annual fee, and no foreign
  transaction fees is the whole offer, and it is an honest one if you want a
  single card and no categories to think about. The 0% intro APR runs 12
  months on both purchases and balance transfers, so it can double as a modest
  payoff tool before the regular 18.74% to 27.74% rate takes over. The gap is
  that there is no signup bonus at all, so nothing offsets the first year and
  the 1.5% has to stand entirely on its own. The 10% to 50% bonus for
  redeeming into an eligible Truist deposit account can push the effective
  rate past 1.5%, but the tier is set by your combined Truist balances, so the
  top of that range belongs to established customers. If you do not bank with
  Truist, 1.5% is the full return here, and higher flat rates are available
  without a fee.
