our_take: >
  The Truist Enjoy Cash 1.5% is a simple, no-annual-fee card that earns 1.5%
  cash back on every purchase, with 0% intro APR on both purchases and balance
  transfers for 12 months. It also charges no foreign transaction fees, so it
  works on trips abroad too. The main limitation is that 1.5% is a modest base
  rate, and there is no signup bonus listed to sweeten the deal for new
  cardholders. The card becomes more competitive if you already bank with
  Truist, since redeeming into an eligible Truist deposit account adds a 10%
  to 50% loyalty bonus depending on your combined balances. After the intro
  period, the regular APR runs 18.74% to 27.74%, so it works best as a
  pay-in-full everyday card for existing Truist customers.
