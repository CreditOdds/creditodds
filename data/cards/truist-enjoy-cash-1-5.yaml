our_take: >
  The Enjoy Cash 1.5% keeps things simple: a flat 1.5% cash back on every
  purchase with no annual fee and no foreign transaction fee. It also opens
  with 12 months of 0% intro APR on both purchases and balance transfers,
  which gives it some use as a short payoff runway. The real hook is for
  existing Truist customers, since the Loyalty Cash Bonus adds 10% to 50% to
  rewards redeemed into an eligible Truist deposit account, with the tier set
  by your combined Truist balances. Without that banking relationship, though,
  1.5% is a fairly ordinary flat rate and there are no categories to push it
  higher. It makes the most sense as a low-effort everyday card for people who
  already keep meaningful money at Truist.
