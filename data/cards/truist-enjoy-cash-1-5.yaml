our_take: >
  The Enjoy Cash 1.5% is a simple flat-rate card: 1.5% cash back on
  everything, no annual fee, no foreign transaction fee, and a 12-month 0%
  intro APR on both purchases and balance transfers. The real twist is the
  Loyalty Cash Bonus, which adds 10% to 50% on rewards redeemed into an
  eligible Truist deposit account, with the tier set by your combined Truist
  balances. That means existing Truist banking customers can push the
  effective rate meaningfully above 1.5%, while everyone else is left with a
  plain flat-rate card. Without that relationship, 1.5% is an ordinary return,
  and there are no bonus categories or signup bonus to make up the difference.
  It makes the most sense if you already bank with Truist and want one no-fee
  card that rewards keeping your money there.
