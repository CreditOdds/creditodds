our_take: >
  The NFL Extra Points American Express is a fan card first: it earns 3% back
  on NFLShop.com, NFL stadium purchases, and NFL game tickets bought through
  team ticket offices, Ticketmaster, SeatGeek, and Sports Illustrated Tickets,
  and it pairs that with 25% off NFLShop.com purchases. It's more useful day
  to day than most team cards too, with 2% on dining and food delivery,
  groceries, sporting goods, and gym and fitness purchases, and there's no
  annual fee. The $100 bonus after $500 in spending within 90 days is easy to
  reach, though NFL purchases don't count toward it. The catches are real: the
  3% rate applies only at those specific NFL merchants, the base rate is 1%,
  there's a foreign transaction fee, and the APR runs as high as 31.49%. Pick
  it if you regularly buy NFL tickets and gear and want team card art, and pay
  the balance in full.
benefits:
  - name: "25% Off NFLShop.com"
    value: 25
    value_unit: "percent"
    description: "25% off NFLShop.com purchases made with the card using code EXTRAPOINTS4. Excludes gift cards, discounted items, trading cards and certain specialty items such as autographed collectibles."
    frequency: "per_purchase"
    category: "shopping"
  - name: "Special Financing on NFL Tickets"
    value: 0
    description: "Promotional financing on single NFL ticket purchases of $250 or more at NFL team ticket offices, Ticketmaster, SeatGeek and Sports Illustrated Tickets. Minimum payments required, and the purchases still earn points."
