  - name: "Special Financing on NFL Tickets"
    value: 0
    description: "Promotional financing on single NFL ticket purchases of $250 or more at NFL team ticket offices, Ticketmaster, SeatGeek and Sports Illustrated Tickets. Minimum payments required, and the purchases still earn points."
    frequency: "per_purchase"
