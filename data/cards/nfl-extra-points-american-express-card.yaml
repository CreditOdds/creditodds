    category: "other"
  - name: "Points Do Not Expire for 5 Years"
    value: 0
    description: "Points expire 5 years after the date they post to the balance. Redeem for statement credits at 1 cent per point, game tickets, NFL experiences, gift cards or memorabilia."
    category: "rewards"
