our_take: >
  The Platinum Secured is a bare-bones credit builder: a secured card with no
  annual fee, so the only cost of using it to establish or repair a credit
  history is the deposit you put down. It sits at #6 on our Best Secured
  Credit Cards list, and the lack of a foreign transaction fee is a small
  bonus if you travel abroad. The catch is that it earns no rewards at all,
  and the 28.99% regular APR is steep, so carrying a balance would undercut
  the whole point of the card. Use it for small purchases you pay off in full
  every month, and plan to move on to a rewards card once your credit is in
  better shape.

