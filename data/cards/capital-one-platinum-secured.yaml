our_take: >
  The Platinum Secured is a plain credit builder: no annual fee, no rewards,
  and a security deposit standing in for the credit history you do not have
  yet. That stripped down simplicity is the point, and it is enough to place
  it at #6 on our Best Secured Credit Cards list, but it also means nothing
  here will hold your interest once your file is established. The APR is a
  flat 28.99% with no intro period, so this card only works if you pay in full
  every month; carrying a balance costs far more than the deposit is worth.
  The absence of foreign transaction fees is a small and unexpected plus on a
  starter card. Use it to build a payment record, then move your spending to
  something that actually earns.

