our_take: >
  The Platinum Secured exists to do one job: help you build or rebuild credit
  with no annual fee, so the account costs nothing to keep open while your
  history ages. It sits at #6 on our Best Secured Credit Cards list, and the
  lack of a foreign transaction fee is a small bonus if you travel. The
  tradeoff is that it earns no rewards at all, so every purchase is purely
  about establishing a payment record. The 28.99% APR is also steep, which
  makes carrying a balance a costly mistake on a card meant to improve your
  finances. Use it for a few small charges, pay in full every month, and treat
  it as a stepping stone rather than a long-term wallet card.

