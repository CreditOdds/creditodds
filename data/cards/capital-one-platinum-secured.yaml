our_take: >
  The Platinum Secured is a straightforward credit-building tool: a secured
  card with no annual fee, so the only cost of using it to establish or repair
  a payment history is the deposit you put down. It also skips foreign
  transaction fees, which is uncommon at this tier. The tradeoff is that it
  earns no rewards at all, so every purchase is purely about building your
  file. The 28.99% APR is also steep, which makes carrying a balance a bad
  idea; use it for small purchases you pay off in full each month. Think of it
  as a stepping stone to a better card rather than something you keep for its
  own sake.

