our_take: >
  The Samsung Galaxy Card is aimed at people deep in the Samsung ecosystem: it
  earns 5% back on purchases made directly from Samsung and 3% on any purchase
  paid through Samsung Wallet, with no annual fee and no foreign transaction
  fees. That Samsung Wallet rate is the real draw, but it only applies when
  you pay through Samsung Wallet, so purchases with the physical card or
  anywhere else fall to a 1% base rate. Streaming services like Netflix and
  Spotify earn 2%. The $200 bonus after $2,000 in spending within 90 days is a
  solid welcome offer for a no-fee card, and 20% off the Samsung VIP Advantage
  membership adds some value if you buy Samsung devices regularly. If you use
  an iPhone or rarely tap to pay with Samsung Wallet, a flat-rate cash back
  card will serve you better.
