our_take: >
  The pitch is straightforward: 5% back on purchases made directly from
  Samsung in the U.S., in store or online, with no annual fee and a $200 bonus
  after $2,000 of spend in the first 90 days. The 3% rate is more conditional
  than it looks, because it applies only to purchases paid through Samsung
  Wallet; swipe the physical card or pay any other way and you are back to the
  1% base rate. Streaming services like Netflix, Disney+ and Spotify earn 2%,
  and there are no foreign transaction fees. The card also takes 20% off the
  $149.99 Samsung VIP Advantage annual membership when you pay with it,
  applied at checkout, and that membership purchase itself earns 5%. It is a
  sensible pickup if you are buying a phone or TV from Samsung and are willing
  to live inside Samsung Wallet, and not much of a card if you aren't.
