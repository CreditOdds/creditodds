our_take: >
  The Samsung Galaxy Card makes the most sense for buyers of Samsung gear: 5%
  cash back on purchases made directly from Samsung, plus 20% off the Samsung
  VIP Advantage membership when you pay with the card, all for no annual fee.
  It also earns 3% on any purchase paid through Samsung Wallet, but that rate
  only applies when you tap with Samsung Wallet; use the physical card or pay
  any other way and you earn 1%, which is the card's real base rate. Streaming
  services earn 2%. The $200 bonus after $2,000 in spending within 90 days is
  a respectable welcome offer for a no-fee card, and there are no foreign
  transaction fees. If you don't own a Samsung phone and rarely buy from
  Samsung, the rewards collapse to an ordinary 1% card.
