our_take: >
  The Samsung Galaxy Card is built for people who buy Samsung gear and pay
  with Samsung Wallet: it earns 5% on purchases made directly from Samsung and
  3% on any purchase paid through Samsung Wallet, with no annual fee and no
  foreign transaction fees. New cardholders can earn $200 after spending
  $2,000 in the first 90 days, and the card takes 20% off the Samsung VIP
  Advantage membership. The catch is that the 3% only applies when you tap
  through Samsung Wallet; use the physical card or any other payment method
  and you earn just 1%, which is the card's true base rate. Streaming earns
  2%, a minor extra. If you carry a Samsung phone and use its wallet for most
  purchases, this is a reasonable everyday card; if you do not, it offers
  little beyond Samsung's own store.
