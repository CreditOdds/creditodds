name: "Chase Freedom"
bank: "Chase"
slug: "chase-freedom"
image: "chase-freedom.png"
accepting_applications: false
# Not from a news article: the original Freedom was retired before this site
# covered it, so the copy below is written against the successors' current
# YAML terms rather than reused.
replacement_cards:
  - slug: "chase-freedom-flex"
    reason: "The direct successor: 5% on rotating quarterly categories up to $1,500, plus 3% on dining and drugstores, no annual fee."
  - slug: "chase-freedom-unlimited"
    reason: "Flat 1.5% on everything with no annual fee, if you would rather not activate categories each quarter."
annual_fee: 0
tags:
  - cashback
  - rewards
reward_type: "cashback"
rewards:
  # Shares the quarterly calendar with the Freedom Flex: Chase announces the
  # categories for "Freedom and Freedom Flex cardmembers" together, so this
  # block must be kept in step with chase-freedom-flex.yaml each quarter.
  - category: "rotating"
    value: 5
    unit: "percent"
    mode: "quarterly_rotating"
    current_categories:
      - category: "groceries"
        note: "Grocery stores, excl. Walmart and Target (Q4 2026 rotation)"
      - category: "dining"
        note: "Dining (Q4 2026 rotation)"
    current_period: "Q4 2026"
    note: "Q4 2026: grocery stores (excluding Walmart and Target), dining, and donations to the American Red Cross"
    spend_cap: 1500
    cap_period: quarterly
    rate_after_cap: 1
  # Deliberately NO travel_portal entry. The permanent 5% on Chase Travel is a
  # Freedom Flex benefit; this card only earns it when Chase Travel happens to
  # be in the quarterly rotation, as it was in Q2 2026. The same goes for the
  # Flex's 3% dining and drugstores and its cell phone protection, none of
  # which this card carries.
  - category: "everything_else"
    value: 1
    unit: "percent"
foreign_transaction_fee: true
network: "visa"
our_take: >
  The original Chase Freedom is no longer open to new applicants, so this take
  is for people who already carry it. For them it remains worth keeping: there
  is no annual fee, and the 5% rotating categories (grocery stores excluding
  Walmart and Target, plus dining, in Q4 2026) pay well on up to $1,500 in
  combined quarterly spend before dropping to 1%. The tradeoff is the 1% base
  rate on everything else and the need to keep track of each quarter's
  categories, plus a foreign transaction fee that rules it out for travel
  abroad. If you are shopping for a new card instead, the Freedom Flex is the
  direct successor with the same rotating 5% structure plus 3% on dining and
  drugstores, and the Freedom Unlimited suits anyone who would rather earn a
  flat 1.5% without activating anything.
