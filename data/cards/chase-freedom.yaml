name: "Chase Freedom"
bank: "Chase"
slug: "chase-freedom"
image: "chase-freedom.png"
accepting_applications: false
# Not from a news article: the original Freedom was retired before this site
# covered it, so the copy below is written against the successors' current
# YAML terms rather than reused.
replacement_cards:
  - slug: "chase-freedom-flex"
    reason: "The direct successor: 5% on rotating quarterly categories up to $1,500, plus 3% on dining and drugstores, no annual fee."
  - slug: "chase-freedom-unlimited"
    reason: "Flat 1.5% on everything with no annual fee, if you would rather not activate categories each quarter."
annual_fee: 0
tags:
  - cashback
  - rewards
reward_type: "cashback"
rewards:
  # Shares the quarterly calendar with the Freedom Flex: Chase announces the
  # categories for "Freedom and Freedom Flex cardmembers" together, so this
  # block must be kept in step with chase-freedom-flex.yaml each quarter.
  - category: "rotating"
    value: 5
    unit: "percent"
    mode: "quarterly_rotating"
    current_categories:
      - category: "gas"
        note: "Gas stations (Q3 2026 rotation)"
      - category: "ev_charging"
        note: "EV charging (Q3 2026 rotation)"
      - category: "transit"
        note: "Public transit (Q3 2026 rotation)"
      - category: "entertainment"
        note: "Select live entertainment (Q3 2026 rotation)"
    current_period: "Q3 2026"
    note: "Q3 2026: gas stations and EV charging, public transit, select live entertainment, and donations to United Way"
    spend_cap: 1500
    cap_period: quarterly
    rate_after_cap: 1
  # Deliberately NO travel_portal entry. The permanent 5% on Chase Travel is a
  # Freedom Flex benefit; this card only earns it when Chase Travel happens to
  # be in the quarterly rotation, as it was in Q2 2026. The same goes for the
  # Flex's 3% dining and drugstores and its cell phone protection, none of
  # which this card carries.
  - category: "everything_else"
    value: 1
    unit: "percent"
foreign_transaction_fee: true
network: "visa"
our_take: >
  The original Chase Freedom is no longer accepting applications, so this take
  is mainly for people who already carry it. Its strength is 5% cash back on
  rotating quarterly categories, up to $1,500 in spending per quarter, with Q3
  2026 covering gas stations and EV charging, public transit, and select live
  entertainment. Outside those categories everything earns just 1%, and you
  have to keep up with each quarter's rotation to get the most from it. With
  no annual fee there is no cost to keeping the account open for its age and
  credit line. If you are shopping for a new card, Chase points you to the
  Freedom Flex, which keeps the 5% rotation and adds 3% on dining and
  drugstores, or the Freedom Unlimited for a flat 1.5% with no activation.
