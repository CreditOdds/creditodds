our_take: >
  The Enjoy Cash Secured is a credit-building card that actually earns
  meaningful rewards: 3% on gas and EV charging, 2% on groceries and
  utilities, and 1% on everything else, with no annual fee. Payment history is
  reported monthly to all three major credit bureaus, which is the core job of
  any secured card. The bonus categories share a combined $1,000 monthly cap
  before dropping to 1%, but that limit is unlikely to bind for most people
  using a secured line. The bigger drawback is the 26.74% APR, so carrying a
  balance would quickly wipe out the cash back. Pay it in full each month, and
  Truist customers can also add a 10% to 50% Loyalty Cash Bonus when redeeming
  into an eligible Truist deposit account.
