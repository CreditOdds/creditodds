our_take: >
  The Enjoy Cash Secured stands out among secured cards because it actually
  earns real rewards: 3% cash back on gas and EV charging and 2% on groceries
  and utilities, with no annual fee. Payment history is reported monthly to
  all three major credit bureaus, which is the core job of any credit-builder
  card. The tradeoff is that those bonus rates share a $1,000 combined monthly
  cap before dropping to 1%, though most people building credit will rarely
  spend past that. The 26.74% APR is steep, so carrying a balance would
  quickly wipe out any cash back you earn. Truist customers get a little extra
  through the Loyalty Cash Bonus, which adds 10% to 50% to rewards redeemed
  into an eligible Truist deposit account. Pay in full each month, let the
  reporting do its work, and this is one of the more rewarding ways to build a
  credit file.
