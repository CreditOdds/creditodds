our_take: >
  The Enjoy Cash Secured stands out among secured cards because it earns real
  rewards while you build credit: 3% cash back on gas and EV charging and 2%
  on groceries and utilities, with no annual fee. Payment history is reported
  monthly to all three major credit bureaus, which is the core job of any
  secured card. The tradeoffs are a combined $1,000 monthly cap on the 3% and
  2% categories, with 1% after that and on everything else, and a fixed 26.74%
  APR that makes carrying a balance expensive. Truist customers can also
  stretch rewards with the Loyalty Cash Bonus of 10% to 50% when redeeming
  into an eligible Truist deposit account. Pay it in full each month and it is
  a credit-builder that actually gives something back.
