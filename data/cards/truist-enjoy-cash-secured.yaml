our_take: >
  Most secured cards pay nothing, so the Enjoy Cash Secured stands out by
  giving credit builders a real earn rate: 3% on gas and EV charging, 2% on
  groceries and utilities, and 1% on everything else, with no annual fee and
  no foreign transaction fee. Payment history is reported monthly to all three
  major bureaus, which is the whole point of a card like this. Two caveats
  matter. The 3% and 2% tiers share a $1,000 combined monthly cap and fall to
  1% after that, and the ongoing APR is a flat 26.74%, so this is a card to
  pay in full every month rather than carry a balance on. If you already bank
  with Truist, the Loyalty Cash Bonus of 10% to 50% on rewards redeemed into
  an eligible deposit account makes the cash back go further while you build
  history.
