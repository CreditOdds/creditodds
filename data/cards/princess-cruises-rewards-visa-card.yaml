our_take: >
  The Princess Rewards Visa only makes sense if you sail with Princess
  Cruises: it earns 2 points per dollar on Princess purchases and 1 point on
  everything else, with no annual fee. The 20,000-point signup bonus after
  $1,000 in spending within three months is an easy one to earn, and there is
  15 months of 0% intro APR on balance transfers. No foreign transaction fee
  is a welcome feature for a card tied to international travel. The catch is
  that the earning is thin outside of Princess, so for most everyday spending
  a general cash back or travel card will earn more. Consider it if you cruise
  with Princess regularly, and skip it otherwise.
