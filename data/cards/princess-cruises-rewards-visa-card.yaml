our_take: >
  The Princess Rewards Visa is only worth considering if you sail with
  Princess Cruises regularly, since its best rate is 2 points per dollar on
  Princess purchases. Everything else earns just 1 point per dollar, which is
  a weak return for a card you might otherwise use day to day. On the plus
  side, there is no annual fee and no foreign transaction fee, and the
  20,000-point bonus after $1,000 in spending within three months is easy to
  reach. A 15-month 0% intro APR on balance transfers adds some value if you
  are carrying debt, though it does not cover new purchases. For most
  travelers, a general travel or cash back card will earn more, so treat this
  as a niche pick for loyal Princess cruisers.
