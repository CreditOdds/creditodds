our_take: >
  The Princess Rewards Visa is really only for loyal Princess Cruises
  passengers, earning 2 points per dollar on Princess Cruises purchases with
  no annual fee and no foreign transaction fee. New cardholders can earn
  20,000 bonus points after $1,000 in spending within three months, and
  there's 15 months of 0% intro APR on balance transfers. The catch is that
  the earning is thin: outside of Princess purchases, every dollar earns just
  1 point, so there's little reason to use it for everyday spending. If you
  sail with Princess regularly and want to put the cruise fare on a no-fee
  card, it can make sense as a secondary card. Everyone else will get more
  from a general travel or cash back card.
