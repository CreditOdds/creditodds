our_take: >
  The Princess Rewards Visa is a niche card for repeat Princess Cruises
  passengers, earning 2 points per dollar on Princess Cruises purchases with
  no annual fee and no foreign transaction fee. The 20,000-point bonus after
  $1,000 in spending within three months is easy to reach, and a 15-month 0%
  intro APR on balance transfers adds some flexibility. The catch is the
  earning outside the cruise line: just 1 point per dollar on everything else,
  which makes it a weak card for everyday spending. The bonus rate also
  applies only to Princess Cruises purchases, not to travel in general. If you
  sail with Princess often, it can make sense as a dedicated card for those
  bookings; otherwise a general-purpose rewards card will earn more.
