our_take: >
  The Princess Rewards Visa's clearest draw is its entry cost: no annual fee,
  no foreign transaction fees, and 20,000 points after just $1,000 of spend in
  the first three months, which is a low bar for a co-branded travel card.
  Barclays also pairs it with 15 months of 0% intro APR on balance transfers,
  an unusual feature on a cruise card and the main reason to look at it
  outside of sailing season. The earning is thin, though: the 2 points per
  dollar applies only to purchases made with Princess Cruises itself, and
  everything else earns a flat 1 point per dollar, which almost any no-fee
  cashback card will beat. Rewards are only worth chasing here if you book
  Princess often enough to use them. Treat it as a cheap loyalty card with a
  useful balance transfer window attached, not as an everyday earner.
