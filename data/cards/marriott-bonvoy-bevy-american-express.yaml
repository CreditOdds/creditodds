our_take: >
  The Bevy's best case is its 4x points at restaurants worldwide and U.S.
  supermarkets, on up to $15,000 a year combined, paired with 6x at Marriott
  Bonvoy hotels and 2x on everything else. It also hands you complimentary
  Gold Elite status, 15 Elite Night Credits a year and 1,000 bonus points per
  eligible paid stay booked directly with Marriott. The catch is the $250
  annual fee, which comes with no automatic free night: the Free Night Award,
  capped at 50,000 points, only unlocks after $15,000 in calendar-year
  spending. The welcome offer was also recently trimmed from 135,000 to
  125,000 points after $5,000 in 6 months. It fits a Marriott loyalist who
  will put heavy dining and grocery spend on it, but casual Marriott guests
  will struggle to justify the fee.
