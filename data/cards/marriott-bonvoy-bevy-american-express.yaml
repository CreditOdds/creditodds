our_take: >
  The Bevy's strongest pitch is its welcome offer, which has swung around
  lately: it jumped from 85,000 to 135,000 points in June, was trimmed to
  125,000 points plus a $150 statement credit in August, and that offer was
  listed as ending September 30, 2026, so check what is live before you apply.
  Ongoing, it earns 6x at Marriott Bonvoy hotels, 4x at restaurants worldwide
  and U.S. supermarkets on up to $15,000 a year combined, and 2x on everything
  else. Complimentary Gold Elite status, 15 Elite Night Credits a year, and
  1,000 bonus points per paid eligible stay make it a reasonable fit for
  regular Marriott guests. The catch is the $250 annual fee paired with a Free
  Night Award that only arrives after you spend $15,000 in a calendar year, so
  unlike Marriott cards that hand you a night at renewal, you have to work for
  it. It makes sense if you will put heavy dining and grocery spend on it;
  otherwise the fee is hard to justify.
