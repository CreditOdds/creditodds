our_take: >
  The Altitude Go earns 4 points per dollar on dining with no annual fee,
  which makes it one of the stronger free cards for people who eat out often.
  Groceries, gas, and streaming earn 2x, and the 20,000-point bonus after
  $1,000 in three months plus 15 months of 0% intro APR on purchases and
  balance transfers round out a solid starter package. The catch is the dining
  rate is capped at $2,000 a quarter before dropping to 1x, and everything
  outside the bonus categories earns just 1x. It also charges foreign
  transaction fees, so it is a poor companion abroad despite showing up on our
  travel list as a beginner pick. Treat the $15 annual streaming credit, which
  takes 11 months of streaming purchases to unlock, as a small bonus rather
  than a reason to apply.
