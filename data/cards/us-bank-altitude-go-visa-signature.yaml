our_take: >
  The Altitude Go pays 4 points per dollar on dining with no annual fee, which
  is the highest uncapped-in-practice restaurant rate most people will find
  without paying for the privilege, and it adds 2 points on groceries, gas,
  and streaming. The dining rate does carry a limit of $2,000 per quarter
  before dropping to 1 point per dollar, though that is $8,000 of restaurant
  spending a year and generous enough that most cardholders will never reach
  it. The opening offer is a straightforward 20,000 points after $1,000 in
  three months, and a 0% intro APR for 15 billing cycles covers purchases and
  balance transfers made within 60 days of opening, with a 5% transfer fee.
  The real catch is foreign transactions: this card charges a fee on them, so
  leave it home when you travel abroad despite its ninth-place spot on our
  Best Travel Credit Cards list, where it carries our Best for Beginners
  badge. Treat the $15 annual streaming credit as a minor extra and the card
  as a dining specialist, which is why it ranks sixth for dining and
  groceries.
