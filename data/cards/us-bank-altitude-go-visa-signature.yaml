our_take: >
  The Altitude Go earns 4x points on dining with no annual fee, which is the
  main reason it shows up as our no-fee pick for dining and groceries.
  Groceries, gas, and streaming earn 2x, everything else earns 1x, and new
  cardholders get a 0% intro APR on purchases and balance transfers for 15
  months plus 20,000 bonus points after $1,000 in spend. It also earns a spot
  as a beginner-friendly option on our travel list, though the foreign
  transaction fee makes it a poor companion abroad. The other catch is a cap:
  the 4x dining rate covers up to $2,000 per quarter, then drops to 1x, which
  only matters if you eat out heavily. The $15 annual streaming credit is a
  small extra that requires 11 months of streaming purchases first. For a
  domestic diner who wants simple rewards without paying a fee, it is a solid
  everyday card.
