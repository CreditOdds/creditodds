our_take: >
  The Altitude Go is a straightforward dining card with no annual fee, earning
  4 points per dollar at restaurants on up to $2,000 in spend each quarter
  before dropping to 1. Groceries, gas, and streaming earn 2 points per
  dollar, and a 20,000-point bonus after $1,000 in spend in three months is an
  easy first win. The 15-month 0% intro APR on purchases and on balance
  transfers made within 60 days adds real flexibility, though transfers carry
  a 5% fee. The catches are a 1 point base rate on everything else and a
  foreign transaction fee, which make it a poor companion for international
  trips despite its spot among our Best Travel Credit Cards picks. The $15
  streaming credit after 11 months of streaming activity is a minor extra that
  requires enrollment.
