our_take: >
  The Altitude Go is a straightforward no-annual-fee dining card: 4x points at
  restaurants on up to $2,000 per quarter, plus 2x on groceries, gas, and
  streaming. A 20,000-point bonus after $1,000 in spend and 15 months of 0%
  intro APR on purchases and balance transfers make the first year easy to
  justify, though balance transfers must be made within 60 days and carry a 5%
  fee. The tradeoff is a foreign transaction fee, which is a drawback if you
  plan to use it abroad. Everything outside the bonus categories earns just
  1x, and the $15 streaming credit requires 11 months of streaming activity,
  so treat it as a minor extra rather than a reason to apply.
