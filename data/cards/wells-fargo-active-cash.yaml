our_take: >
  The Active Cash earns an unlimited 2% cash back on every purchase with no
  annual fee, which makes it one of the simplest high-value default cards
  around and earns it a spot at #4 on our Best Cash Back Credit Cards list. It
  adds 12 months of 0% intro APR on both purchases and balance transfers, plus
  cell phone protection up to $600 per claim when you pay your bill with the
  card, subject to a $25 deductible. The signup bonus was recently cut from
  $200 to $100 after $500 in spending in the first three months, so the
  welcome offer is now modest. It also charges a foreign transaction fee, so
  leave it at home when you travel abroad. For domestic everyday spending,
  though, a flat 2% with no fee is hard to argue with.
