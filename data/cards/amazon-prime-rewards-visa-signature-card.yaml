our_take: >
  For Prime members, the Prime Visa earns 5% back at Amazon, Whole Foods
  Market, and Shopbop, plus 5% on Chase Travel purchases, with no annual fee
  and no foreign transaction fee. That makes it an easy pick if a large share
  of your spending already runs through Amazon, which is why it lands on our
  Best Cash Back Credit Cards list. The welcome offer was recently trimmed
  from a $200 to a $150 Amazon Gift Card, though it still arrives instantly
  upon approval with no spending requirement. The catch is that both 5% rates
  fall to 3% without an eligible Prime membership, so the subscription is
  really part of the card's cost, and everyday earning is modest at 2% on
  dining, gas, and local transit and 1% elsewhere. Purchase protection,
  baggage delay insurance, and lost luggage reimbursement are useful extras.
