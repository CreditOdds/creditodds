our_take: >
  The Truist Business Travel Rewards earns 2 miles per dollar on airlines,
  hotels, and car rentals with no foreign transaction fee, and its $49 annual
  fee is waived for the first year. New cardholders get 20,000 miles after
  $2,000 in spend within three months, plus a Global Entry or TSA PreCheck
  credit of up to $120 per organization every four years. The catch is that
  the earn rates are modest: 2x on travel and 1x on everything else is thin
  compared with many travel cards, so the value depends heavily on your Truist
  relationship. Businesses with Truist deposits can earn a Loyalty Travel
  Bonus of 10%, 25%, or 50% when redeeming miles for travel, which
  meaningfully boosts the return. Without that relationship, it is a fairly
  ordinary card with free employee cards and not much else.
