our_take: >
  A $49 annual fee, waived for the first 12 months, buys a straightforward
  travel earner: 2x miles on airlines, hotels, and car rentals, 1x on
  everything else, and no foreign transaction fees. The $120 Global Entry or
  TSA PreCheck credit every four years covers more than two years of the fee
  by itself, and the 20,000 mile bonus after $2,000 in three months is an easy
  target for most businesses. The loyalty bonus of 10%, 25%, or 50% when miles
  are redeemed for travel is where the real upside sits, but the tier is set
  by your Truist deposit relationship, so plan on the 10% unless you bank
  there heavily. Outside the three travel categories the card earns 1x, which
  is below what a flat-rate card returns, so treat this as a companion for
  travel spend rather than an everything card. Employee cards are free and the
  regular APR runs 15.74% to 24.74%.
