our_take: >
  The Truist Business Travel Rewards card earns 2 miles per dollar on
  airlines, hotels, and car rentals, with no foreign transaction fee and a $49
  annual fee waived the first year. A 20,000 mile bonus after $2,000 in
  spending in the first three months and a Global Entry or TSA PreCheck credit
  of up to $120 every four years round out the package. The tradeoff is that
  2x on travel is modest, and everything else earns just 1 mile per dollar, so
  it won't do much for general business spending. The strongest reason to pick
  it is a Truist deposit relationship, which unlocks a 10%, 25%, or 50% bonus
  when miles are redeemed for travel. For a small business with light travel
  that already banks with Truist, it's a low-cost option; others can likely do
  better elsewhere.
