our_take: >
  The Truist Business Travel Rewards offers modest travel earning for a low
  cost: 2 miles per dollar on airlines, hotels, and car rentals, with no
  foreign transaction fee and a $49 annual fee waived the first year. A Global
  Entry or TSA PreCheck credit of up to $120 every four years, per
  organization, and free employee cards are useful extras. The catch is that
  the rewards are thin: everything outside travel earns 1x, and the 20,000
  mile bonus after $2,000 in spend within three months is small. The loyalty
  bonus, worth 10%, 25%, or 50% when miles are redeemed for travel, depends on
  your Truist deposit relationship, so the card works best for businesses that
  already bank there. Without that relationship, there are stronger business
  travel cards for the same fee.
