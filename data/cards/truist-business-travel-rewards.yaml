our_take: >
  The Truist Business Travel Rewards is a modest travel card that earns 2
  miles per dollar on airlines, hotels, and car rentals and 1 mile on
  everything else, with no foreign transaction fees and a $49 annual fee
  waived for the first year. New cardholders can earn 20,000 bonus miles after
  spending $2,000 in the first three months, and the card includes up to a
  $120 Global Entry or TSA PreCheck credit once every four years, though that
  credit applies per organization rather than per cardholder. The rewards
  ceiling is low: a 2x top rate on travel and 1x on all other spending means a
  business with significant non-travel expenses will earn slowly. Existing
  Truist deposit customers get the most out of it, since redeeming miles for
  travel earns a 10%, 25%, or 50% bonus depending on the relationship. It
  works as an inexpensive card for a small business with occasional travel,
  but heavier travelers will outgrow it quickly.
