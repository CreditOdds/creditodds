our_take: >
  The Savor earns 3% cash back across dining, entertainment, streaming, and
  groceries with no annual fee, which covers a big share of most household
  budgets in one card. Entertainment bookings through Capital One
  Entertainment earn 8%, and hotels and rental cars through Capital One Travel
  earn 5%. The signup bonus was recently trimmed from $250 to $200 after $500
  in spending within 3 months, still a low bar, and a 12-month 0% intro APR on
  purchases and balance transfers is a useful extra. The tradeoff is the 1%
  rate on everything else, so pair it with a strong flat-rate card for
  non-category spending. No foreign transaction fee rounds it out for travel.
