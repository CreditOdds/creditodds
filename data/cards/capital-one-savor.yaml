our_take: >
  The Savor earns 3% cash back across a broad set of everyday categories,
  dining, entertainment, streaming, and groceries, with no annual fee, plus 5%
  on hotels and rental cars booked through Capital One Travel and 8% on
  Capital One Entertainment purchases. That combination makes it a strong
  primary card for households whose spending centers on food and going out.
  Capital One recently trimmed the signup bonus from $250 to $200, still
  earned after a manageable $500 in the first 3 months, and a 12-month 0%
  intro APR on purchases and balance transfers adds some flexibility. The
  catch is the 1% base rate on everything else, so non-category spending is
  better routed to a flat-rate card. No foreign transaction fees is a useful
  extra for travel.
