our_take: >
  Four 3% categories, dining, entertainment, select streaming, and groceries,
  on a card with no annual fee is an unusually broad set of bonus rates to get
  for free, and it makes the Savor a credible single card for anyone whose
  spending clusters around food and going out. Capital One ran the signup
  bonus up to $250 in June and brought it back down to $200 in August, so you
  are applying at the lower end of the recent range, though $500 in three
  months remains a light requirement. Capital One Entertainment bookings earn
  8%, and hotels and rental cars booked through Capital One Travel earn 5%,
  but both rates require going through Capital One's own channels. Everything
  else earns 1%, which trails a flat rate card, so keep something else for
  general spending. The 12 months of 0% intro APR on purchases and balance
  transfers and the absence of foreign transaction fees are useful extras
  rather than reasons to apply on their own.
