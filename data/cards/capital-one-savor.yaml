our_take: >
  The Savor earns 3% cash back across a wide set of everyday categories,
  dining, entertainment, streaming, and groceries, with no annual fee, which
  is a rare mix for a no-fee card. You also get 8% on Capital One
  Entertainment purchases and 5% on hotels and rental cars booked through
  Capital One's travel portal. Capital One recently trimmed the signup bonus
  from $250 to $200, still earned after just $500 in spending in the first 3
  months, and there are 12 months of 0% intro APR on purchases and balance
  transfers. The tradeoff is the 1% rate on everything outside those
  categories, so it works best paired with a flat-rate card for other
  spending. The travel price drop and price match protections only apply to
  Capital One Travel bookings, so treat them as extras.
