our_take: >
  The Savor stands out for its broad 3% cash back on dining, groceries,
  entertainment, and streaming with no annual fee, plus 5% on hotels and
  rental cars booked through Capital One Travel and 8% on Capital One
  Entertainment purchases. Those categories cover a large share of a typical
  household's discretionary spending. The signup bonus recently slipped back
  from $250 to $200 after $500 in spend within 3 months, but that is still an
  easy target, and 12 months of 0% intro APR on purchases and balance
  transfers is a useful extra. The tradeoff is the 1% base rate on everything
  else, so pairing it with a flat-rate card for non-bonus spending makes
  sense. If food and entertainment are your biggest categories, it earns its
  place.
