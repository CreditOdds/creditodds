our_take: >
  The Bank of America Travel Rewards is a simple no-annual-fee travel card
  that earns a flat 1.5 points per dollar on every purchase, with no foreign
  transaction fees, which is why it lands on our Best Travel Credit Cards list
  as the pick for casual travelers. New cardholders get 25,000 points after
  $1,000 in spending within three months, redeemable for a $250 statement
  credit toward travel and dining, plus 15 months of 0% intro APR on purchases
  and balance transfers. The catch is that the earn rate never rises above 1.5
  points, so frequent travelers will get more from a card with bonus
  categories or premium perks. There are also no travel credits, lounge
  access, or airline benefits. It is best for occasional travelers who want an
  easy, fee-free card to use at home and abroad.
