our_take: >
  The pitch is simplicity: 1.5 points per dollar on absolutely everything, no
  annual fee, and no foreign transaction fees, which is a rare combination and
  part of why it sits at #10 on our Best Travel Credit Cards list. The
  25,000-point bonus after just $1,000 of spend in three months converts to a
  $250 statement credit toward travel and dining, an unusually low bar for
  that much value. It also carries 15 months of 0% intro APR on purchases and
  balance transfers, so it can pull double duty while you pay something down.
  The tradeoff is that 1.5x is the whole rewards program: there are no bonus
  categories, no credits, and no travel perks beyond fee-free spending abroad.
  Carry it as the card you use overseas and for spending that nothing else
  covers, not as your highest-earning option.
