our_take: >
  The Bank of America Travel Rewards is a simple, no-annual-fee travel card
  that earns a flat 1.5 points per dollar on everything with no foreign
  transaction fees. The welcome offer of 25,000 points after $1,000 in spend
  within 3 months is redeemable for a $250 statement credit toward travel and
  dining, and 15 months of 0% intro APR on purchases and balance transfers
  adds flexibility rarely seen on a travel card. That combination earns it the
  #10 spot on our Best Travel Credit Cards list. The tradeoff is that there
  are no bonus categories at all, so frequent travelers will earn far more
  with a card that rewards airfare, hotels, or dining at higher rates. It
  suits occasional travelers who want an easy card to use abroad without
  paying a fee to carry it.
