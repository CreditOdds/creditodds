our_take: >
  The Bank of America Travel Rewards keeps things simple: 1.5 points per
  dollar on every purchase, no annual fee, and no foreign transaction fees,
  which makes it an easy card to bring abroad. New cardholders get 25,000
  points after $1,000 in purchases in the first three months, redeemable for a
  $250 statement credit toward travel and dining, plus 15 months of 0% intro
  APR on purchases and balance transfers. It ranks #11 on our Best Travel
  Credit Cards list. The catch is that there are no bonus categories, so you
  earn the same 1.5 points on flights and dining as on everything else, and
  there are no travel perks beyond the fee-free foreign spending. Pick it as a
  low-maintenance, no-fee travel card, but frequent travelers will likely want
  something with higher earn rates or real benefits.
