our_take: >
  The Bank of America Travel Rewards keeps things simple: a flat 1.5 points
  per dollar on every purchase with no annual fee and no foreign transaction
  fees, which makes it an easy card to carry abroad. New cardholders get
  25,000 points after $1,000 in spend within three months, redeemable for a
  $250 statement credit toward travel and dining, plus 15 months of 0% intro
  APR on purchases and balance transfers. It appears on our Best Travel Credit
  Cards list as a no-fee option. The catch is that 1.5 points per dollar is a
  modest ceiling with no bonus categories for travel or dining, so frequent
  travelers will earn more elsewhere. Think of it as a low-maintenance travel
  card for occasional trips rather than a points-maximizing tool.
