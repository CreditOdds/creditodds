our_take: >
  The Hilton Honors American Express Business stands out for its everyday
  earn: 5 points per dollar on the first $100,000 in purchases each calendar
  year, then 3 points, plus 12 points per dollar at Hilton properties. Amex
  recently raised the welcome offer from 130,000 to 150,000 points, plus a
  Free Night Reward, after $8,000 in spend within six months, with the offer
  ending January 13, 2027. The $195 annual fee is offset by up to $240 a year
  in Hilton credits, but they come as $60 per quarter, so you need to stay or
  spend at Hilton regularly to capture them all. Gold status comes with the
  card, and businesses that spend $40,000 a year can upgrade to Diamond. The
  tradeoff is that Hilton points are only valuable if you redeem them for
  Hilton stays, so this card makes sense mainly for business owners who
  already book Hilton often.
