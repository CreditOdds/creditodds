our_take: >
  The Hilton Honors American Express Business card stands out for its everyday
  earning: 5 points per dollar on general purchases on the first $100,000 each
  calendar year, then 3 points, plus 12 points at Hilton properties. Amex
  recently raised the welcome offer from 130,000 to 150,000 points plus a Free
  Night Reward after $8,000 in spend within six months, an offer listed as
  ending January 13, 2027. The $195 annual fee is partly offset by up to $240
  a year in Hilton credits, paid as $60 per quarter for purchases made
  directly with a Hilton property. You also get Gold status, with a path to
  Diamond after $40,000 in calendar-year spend. The tradeoff is that the
  points are only useful if you stay at Hilton, and the quarterly credit takes
  regular Hilton visits to fully use.
