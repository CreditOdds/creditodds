our_take: >
  The Hilton Honors Business card is the rare hotel card with a genuinely
  useful non-hotel rate: 5x on everything else for the first $100,000 of
  purchases each calendar year, dropping to 3x after, alongside 12x on
  purchases made directly with Hilton portfolio properties. American Express
  raised the welcome offer on September 10 to 150,000 points plus a Free Night
  Reward after $8,000 of spending in six months, with the offer scheduled to
  end January 13, 2027. The $195 annual fee is largely covered by up to $240 a
  year in Hilton credits, but those come as $60 per quarter and only on
  purchases made directly with a Hilton property, so you need to be staying
  with Hilton regularly rather than once a year. Complimentary Gold status
  with its food and beverage credit and 80% base points bonus is the steady
  perk; Diamond is available but takes $40,000 of eligible purchases in a
  calendar year. It is a reasonable fit for a business that both travels with
  Hilton and can route ordinary spending through the 5x tier.
