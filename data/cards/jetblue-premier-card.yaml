our_take: >
  The JetBlue Premier is the premium JetBlue card, and the most practical way
  to offset its $499 annual fee is the up to $300 in yearly statement credits
  on TrueBlue Travel purchases like hotels, car rentals, and cruises. The
  welcome bonus was recently cut from 100,000 to 90,000 points and now
  requires $5,000 in spending in three months. On the travel side, you get
  BlueHouse lounge access with an eligible fare, Priority Pass membership, a
  free first checked bag for you and up to three companions, a 25-tile Mosaic
  bonus each year, and 15% of your points back on award flights on JetBlue or
  partner airlines. Earning matches the cheaper Plus card: 6 points per dollar
  on JetBlue and TrueBlue Travel purchases, 2 per dollar on dining and
  groceries, and 1 point everywhere else. The companion pass credits ($500 at
  $15,000 in yearly spending and another $1,500 at $75,000) only pay off for
  heavy spenders. Unless you'll use the $300 credit and the lounges, the $99
  JetBlue Plus is the better deal for most JetBlue flyers.
