our_take: >
  The Cash Back College is no longer accepting applications, so this mainly
  applies to students and graduates who already have one. It's a simple
  no-annual-fee card that earns a flat 1% cash back on everything, with no
  categories to track. That simplicity and the lack of a fee make it a
  reasonable way to build credit history while in school. The catch is that 1%
  is a low return by today's standards, and there are no other rewards or
  perks in the data to make up for it. Keeping it open to protect your credit
  history makes sense, but once your credit is established, a better no-fee
  cash back card should handle your everyday spending.
