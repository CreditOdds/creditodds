our_take: >
  Wells Fargo has closed this one to new applications, so the only question
  left is whether existing holders should keep using it. The answer is that
  there is not much to use: the card earns a flat 1% cash back on everything,
  with no bonus categories and no signup offer. The one thing in its favor is
  the $0 annual fee, which means there is no cost to leaving the account open
  for the sake of your credit history and average account age. If you are
  still spending on it, though, almost any current student card will pay you
  more per dollar. Keep it open, move the spending elsewhere.
