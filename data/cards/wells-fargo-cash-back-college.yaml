our_take: >
  Wells Fargo is no longer accepting applications for the Cash Back College
  card, so it is only relevant if you already have one. It was a simple
  starter card for students: no annual fee and a flat 1% cash back on every
  purchase. That flat rate is low by today's standards, so its real value is
  as a long-standing account that helps your credit history age. If you hold
  it, keep it open and in light use, and look to a card with a higher flat
  rate or bonus categories for your everyday spending once your credit has
  grown.
