our_take: >
  The Cash Back College card is no longer accepting applications, so it only
  matters to students and recent grads who already have one. It earns a flat
  1% cash back on everything with no annual fee, which is simple but thin by
  current standards. Its main value now is as an established, no-cost account
  that helps build credit history over time. Keeping it open and lightly used
  can help the age of your credit file, but it is not worth routing everyday
  spending through. Once your credit is established, a card with a higher flat
  rate or bonus categories will earn noticeably more.
