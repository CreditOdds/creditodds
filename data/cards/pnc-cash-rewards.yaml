our_take: >
  The PNC Cash Rewards earns its keep on everyday categories: 4% cash back on
  gas, 3% on dining, and 2% at grocery stores, with no annual fee. PNC
  recently raised the signup bonus from $200 to $250 after $1,000 in spending
  within three months, which makes this a good time to apply, and there is
  also 15 months of 0% intro APR on balance transfers. The real catch is the
  cap: those bonus rates share a combined $8,000 annual spending limit, after
  which everything drops to 1%, the same rate you earn on all other purchases.
  That cap is fine for a light or moderate spender but will be hit quickly by
  a household that runs gas, dining, and groceries through one card. Cell
  phone protection of up to $800 per claim is a useful extra, but the foreign
  transaction fee means it should stay home when you travel.
