our_take: >
  PNC Cash Rewards leads with 4% back on gas, 3% on dining and 2% on
  groceries, a tiered structure that is generous at the top end for a card
  with no annual fee. The limit to understand is that all three categories
  share a single $8,000 annual cap, after which they drop to 1%, the same as
  everything else, so the practical ceiling on bonus earnings is fixed no
  matter how you split your spending. A $200 bonus after $1,000 in three
  months and 15 months of 0% intro APR on balance transfers give it a solid
  first year. Cell phone protection of up to $800 per claim when you pay your
  wireless bill with the card is a useful ongoing extra. The drawback is a
  foreign transaction fee, so leave it home when you travel abroad, and the
  regular APR of 18.49% to 28.49% means this needs to be paid in full.
