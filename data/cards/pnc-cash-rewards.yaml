our_take: >
  PNC recently raised the Cash Rewards signup bonus from $200 to $250 after
  $1,000 in spending within three months, which is a generous haul for a
  no-annual-fee card. The tiered earn of 4% on gas, 3% on dining, and 2% on
  groceries covers common everyday spending, and a 15-month 0% intro APR on
  balance transfers adds some flexibility. The catch is that all three bonus
  categories share an $8,000 combined annual cap, after which everything drops
  to 1%, the same rate you earn on all other purchases. That cap makes it a
  better fit for moderate spenders than for families with big grocery and gas
  bills. Cell phone protection when you pay your wireless bill with the card
  is a useful extra, but the foreign transaction fee means it should stay home
  when you travel.
