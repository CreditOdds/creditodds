our_take: >
  The JetBlue Plus earns the top spot and our Best Value badge on the Best
  Airline Credit Cards list, largely because its free first checked bag for
  you and up to three companions can repay the $99 annual fee on a single
  family trip. It earns 6 points per dollar on JetBlue purchases and 2 per
  dollar on dining and groceries, and the signup bonus recently rose from
  60,000 to 70,000 points after just $1,000 in spending in the first three
  months. Ongoing extras include 5,000 bonus points every anniversary, 10% of
  points back on JetBlue award flights, 50% off inflight purchases, and a $100
  statement credit once a year on a JetBlue Vacations package. The tradeoff is
  that everything else earns only 1 point per dollar, so this belongs in your
  wallet for JetBlue spending rather than as a daily driver. It also offers a
  12-month 0% intro APR on balance transfers, though Mosaic status requires
  $50,000 in yearly spending.
