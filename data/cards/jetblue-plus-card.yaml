our_take: >
  The JetBlue Plus ranks first on our Best Airline Credit Cards list, and its
  best feature is the free first checked bag for you and up to three
  companions on JetBlue-operated flights when you book with the card, which
  can cover the $99 annual fee on a single family trip. Barclays recently
  raised the signup bonus from 60,000 to 70,000 points after just $1,000 in
  spending over three months, an unusually low bar for a bonus that size.
  Ongoing earn is 6x on JetBlue purchases and 2x on dining and groceries, plus
  5,000 bonus points each anniversary and a 10% points rebate on award
  flights. The catch is the 1x rate on everything else, so this card belongs
  alongside a stronger everyday earner rather than in its place. A $100 annual
  JetBlue Vacations credit, 50% off inflight purchases, and a 12-month 0%
  intro APR on balance transfers round out a solid package for regular JetBlue
  flyers.
