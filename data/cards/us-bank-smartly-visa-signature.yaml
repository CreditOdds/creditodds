our_take: >
  The Smartly Visa Signature earns a flat 2% cash back on every purchase with
  no annual fee, which puts it in line with the better simple cash-back cards
  on the market. There are no categories to choose or caps to track, so it
  works well as a default card for everyday spending. The 12-month 0% intro
  APR on purchases and balance transfers adds a useful cushion if you have a
  large expense or existing balance to work through. The catch is that there
  is no signup bonus and a foreign transaction fee, so it is a weak choice for
  spending abroad. If you want straightforward 2% on everything at home and
  prefer to keep things simple, it does the job well.
