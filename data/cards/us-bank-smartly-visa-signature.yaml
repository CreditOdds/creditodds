our_take: >
  The Smartly Visa Signature is a flat 2% cash back card on every purchase
  with no annual fee, which makes it a reasonable default for spending that
  doesn't fall into anyone's bonus categories. Simplicity is the entire
  appeal: nothing to enroll in, nothing to re-select each quarter, and no cap
  to track. It also carries a 12 month 0% intro APR on purchases and balance
  transfers, a shorter runway than dedicated balance-transfer cards but useful
  if you have a purchase to spread out. The limits are just as plain: there is
  no signup bonus and no elevated rate on anything, so a card with real 3% or
  5% categories will beat it on groceries, gas, or dining. The foreign
  transaction fee also rules it out for spending abroad.
