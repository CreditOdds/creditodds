our_take: >
  The Smartly Visa Signature earns a flat 2% cash back on everything with no
  annual fee, which makes it an easy, no-thinking default card for everyday
  spending. It also comes with 12 months of 0% intro APR on both purchases and
  balance transfers, a useful bonus if you want to float a purchase or move a
  balance while you earn. The catch is that there are no bonus categories, so
  heavy spenders on dining, groceries, or gas can do better with a tiered card
  alongside it. It also charges a foreign transaction fee, so leave it at home
  when you travel abroad. Once the intro window closes, the regular APR of
  18.24% to 28.24% means this works best if you pay in full every month.
