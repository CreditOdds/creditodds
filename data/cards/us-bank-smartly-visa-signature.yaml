our_take: >
  The Smartly Visa Signature keeps things simple: a flat 2% cash back on
  everything, with no annual fee and no categories to track. It also opens
  with 0% intro APR for 12 months on both purchases and balance transfers,
  which gives you a year of breathing room on a big purchase or an existing
  balance. That combination makes it a sensible everyday default for anyone
  who wants solid cash back without managing a card lineup. The catch is the
  foreign transaction fee, so this is a card to leave at home when you travel
  abroad. After the intro period the regular APR runs 18.24% to 28.24%, so pay
  in full once the 12 months are up.
