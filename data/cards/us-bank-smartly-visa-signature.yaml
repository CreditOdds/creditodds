our_take: >
  The Smartly Visa Signature keeps things simple: a flat 2% cash back on
  everything, with no annual fee and no categories to track. It adds a useful
  12 months of 0% intro APR on both purchases and balance transfers, so it can
  double as a short payoff or financing tool while you earn. The catch is that
  2% is the whole story, with no signup bonus and no elevated categories to
  push your return higher. It also charges foreign transaction fees, so leave
  it at home when you travel abroad. Once the intro window closes, the regular
  APR of 18.24% to 28.24% applies, which makes it a card for people who pay in
  full each month.
