our_take: >
  The Coinbase One Card's pitch is a high flat rate on everything: 2% back as
  a floor, rising to 2.5%, 3%, or 4% depending on how much you hold on
  Coinbase, with no annual fee and no foreign transaction fees. That makes it
  interesting as a single-card setup if you already keep meaningful assets on
  the platform, since even the base tier beats most flat-rate cards. Read the
  conditions carefully, though: the card requires a Coinbase One membership,
  and every tier above 2% is capped at $10,000 of eligible purchases per month
  before dropping back to 2%, so the headline 4% is not an unlimited rate.
  Travel booked through the Coinbase One Card Travel portal earns 5% bitcoin
  back and sits outside that cap. There is no signup bonus and no intro APR,
  so the entire case rests on whether your asset balance and spending actually
  land you in a top tier.
