our_take: >
  The Coinbase One card offers a 2% base rate on every purchase with no annual
  fee, and it can climb to 2.5%, 3%, or 4% depending on how much you hold on
  Coinbase. Flights, hotels, and cars booked through the Coinbase One Card
  Travel portal earn 5% bitcoin back, which is not subject to the tier cap,
  and there is no foreign transaction fee. The catch is that the card is tied
  to the Coinbase ecosystem: you need a Coinbase One membership, and the
  higher tiers require keeping assets on the platform. Those boosted rates are
  also capped at $10,000 in eligible purchases per month before dropping back
  to 2%. It's a sensible pick for people already committed to Coinbase, but
  anyone who doesn't want their rewards tied to crypto holdings can get a
  similar flat 2% elsewhere with fewer strings.
