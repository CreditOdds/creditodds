our_take: >
  The Coinbase One card pays a flat 2% back on everyday purchases with no
  annual fee and no foreign transaction fees, and it can climb to 2.5%, 3%, or
  4% depending on how much you hold on Coinbase. Bookings for flights, hotels,
  and cars made through the Coinbase One Card Travel portal earn 5% in
  bitcoin, and that rate is not subject to the tier cap. The catch is that the
  higher tiers apply only to the first $10,000 in eligible purchases each
  month before dropping back to 2%, and reaching them means parking more
  assets on Coinbase. The card also requires a Coinbase One membership. If you
  already keep a meaningful balance on the platform and are comfortable
  earning in crypto, it can beat a standard 2% card; if not, its baseline is
  simply a plain flat-rate card.
