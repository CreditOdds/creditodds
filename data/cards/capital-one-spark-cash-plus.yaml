our_take: >
  The Spark Cash Plus is built for businesses with real volume: a flat 2% cash
  back on everything, 5% on hotels, vacation rentals, and rental cars booked
  through Capital One Business Travel, and a $2,000 bonus after $30,000 of
  spend in the first 3 months, currently paired with a limited-time $500
  Capital One Business Travel credit on that same spend. The $150 annual fee
  is refunded in any year you charge at least $150,000, and every $500,000
  spent in the first year triggers another $2,000 bonus, so the economics
  improve the more you run through it. The catch is the structure: there is no
  preset spending limit, and the balance is due in full each month, so it only
  works if your cash flow can cover the entire statement. Smaller businesses
  that spend nowhere near $150,000 a year will simply pay the $150 and should
  weigh that against a no-fee option. Free employee cards with spending
  limits, virtual card numbers, and year-end summaries that export to
  QuickBooks round it out.
