our_take: >
  The U.S. Bank Secured is a basic credit-building tool with no annual fee.
  Its job is simple: give you a Visa account with a major bank so you can
  establish a payment history. The data shows no rewards or perks, so it
  offers nothing to earn while you build credit. The real catch is the 27.49%
  APR, so pay the balance in full every month rather than carrying debt on it.
  There is also a foreign transaction fee, which makes it a poor choice for
  purchases abroad. Use it to build a track record, then plan to move up to an
  unsecured card with rewards once your credit improves.
