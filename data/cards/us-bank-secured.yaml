our_take: >
  The U.S. Bank Secured is a no-annual-fee way to start building credit from
  scratch or rebuild after a setback, and it ranks #5 on our Best Secured
  Credit Cards list. As a secured card, it's designed to get a thin or damaged
  credit file moving with a major issuer behind it. The tradeoffs are real:
  the card earns no rewards, carries a 27.49% APR, and charges a foreign
  transaction fee. That high rate means you should pay the balance in full
  every month rather than carry debt while you rebuild. Use it to establish a
  clean payment history, then plan to graduate to an unsecured card with
  better rewards.
