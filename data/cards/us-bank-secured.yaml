our_take: >
  The U.S. Bank Secured is a no-frills credit builder from a major bank, with
  no annual fee, which is the main thing to look for in a secured card. It
  appears at #5 on our list of the best secured cards, a reasonable option if
  you want to establish or rebuild a credit history with a familiar issuer.
  The tradeoff is that it earns no rewards and carries a 27.49% APR, so
  carrying a balance would quickly undo any benefit. It also charges foreign
  transaction fees, which rules it out for use abroad. Use it for small
  purchases, pay the statement in full each month, and treat it as a stepping
  stone to a better unsecured card.
