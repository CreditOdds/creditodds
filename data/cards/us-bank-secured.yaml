our_take: >
  The U.S. Bank Secured is a basic credit-building card with no annual fee,
  which is the main reason it earns a spot on our list of the best secured
  cards. It is aimed at people starting out or rebuilding, where steady
  on-time payments are what matter most. The catch is that there are no
  rewards and no extra perks, so its only job is building your credit. The
  27.49% APR is high, which makes carrying a balance costly, so pay the
  statement in full each month. There is also a foreign transaction fee, so it
  is not one to use abroad. Use it as a stepping stone toward an unsecured
  card, then move on once your credit has improved.
