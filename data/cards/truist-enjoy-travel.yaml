our_take: >
  The Enjoy Travel is a no-annual-fee travel card that earns 2 miles per
  dollar on airlines, hotels, and car rentals and 1 mile on everything else,
  with a 20,000-mile bonus after $1,500 in spend in the first 3 months. Its
  most notable perk for a free card is an up to $85 statement credit for
  Global Entry or TSA PreCheck once every four years, and there is no foreign
  transaction fee. Truist depositors can boost value further with the Loyalty
  Travel Bonus, which adds 10% to 50% when miles are redeemed for travel based
  on combined Truist balances. The catch is that the earn rates are modest,
  with only 2 miles on travel and 1 on everyday spending, so the card works
  best as a light travel companion rather than a primary rewards engine. It
  fits best for existing Truist customers who travel occasionally and want a
  fee-free card abroad.
