our_take: >
  The Enjoy Travel is a no-annual-fee travel card that earns 2 miles per
  dollar on airlines, hotels, and car rentals and 1 mile on everything else,
  with no foreign transaction fee. New cardholders can pick up 20,000 bonus
  miles after spending $1,500 in the first 3 months, and the card covers up to
  $85 toward Global Entry or TSA PreCheck once every four years, a perk that
  is rare at this price. Truist depositors get extra value from the Loyalty
  Travel Bonus, which adds 10% to 50% when miles are redeemed for travel based
  on combined Truist balances. The tradeoff is that 2x on core travel
  categories is modest, and with no dining or everyday categories, most of
  your spending earns just 1 mile per dollar. It fits best as a free travel
  companion card for Truist customers rather than a primary rewards earner.
