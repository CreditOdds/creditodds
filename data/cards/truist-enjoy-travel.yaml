our_take: >
  The Enjoy Travel is a no-annual-fee travel card that earns 2 miles per
  dollar on airlines, hotels, and car rentals, plus a 20,000-mile signup bonus
  after $1,500 in spending in the first 3 months. It also covers up to $85
  toward Global Entry or TSA PreCheck once every four years, a perk that is
  uncommon on a card with no annual fee, and it charges no foreign transaction
  fees. The catch is the earning is modest: everything outside those three
  travel categories earns just 1 mile per dollar, and there is no dining or
  everyday bonus to lean on. Truist depositors can stretch redemptions further
  with the Loyalty Travel Bonus, worth 10% to 50% more when miles are redeemed
  for travel based on combined Truist balances. It makes the most sense for an
  existing Truist customer who travels occasionally and wants a fee-free card
  to take abroad.
