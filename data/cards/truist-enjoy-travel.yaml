our_take: >
  The Enjoy Travel is a no-annual-fee travel card that earns 2 miles per
  dollar on airlines, hotels, and car rentals and 1 mile on everything else,
  with no foreign transaction fee. New cardholders can earn 20,000 bonus miles
  after spending $1,500 in the first 3 months, and the card includes up to an
  $85 Global Entry or TSA PreCheck credit once every four years, which is an
  uncommon perk at this price. The catch is that the earn rates are modest,
  and 1 mile per dollar on everyday spending gives you little reason to use it
  outside travel bookings. Truist depositors can stretch redemptions with the
  Loyalty Travel Bonus, which adds 10% to 50% when miles are redeemed for
  travel based on combined deposit balances. It fits best as a light travel
  card for existing Truist customers rather than a primary rewards card.
