our_take: >
  The Enjoy Travel earns 2 miles per dollar on airlines, hotels, and car
  rentals and 1 mile on everything else, and it charges no annual fee and no
  foreign transaction fee, which is an unusual combination for a card that
  also reimburses up to $85 for Global Entry or TSA PreCheck once every four
  years. That credit alone can cover several years of a fee you would
  otherwise pay out of pocket. The signup bonus is modest but easy to clear:
  20,000 miles after $1,500 in the first three months. Be realistic about the
  earn rate, though, since 2x on travel and 1x elsewhere will not keep up with
  cards that pay more on dining or groceries, and the headline Loyalty Travel
  Bonus of 10% to 50% only applies if you hold Truist deposit balances. Treat
  it as a low-commitment travel card for Truist customers rather than a
  primary points engine.
