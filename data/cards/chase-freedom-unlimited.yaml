our_take: >
  The Freedom Unlimited's appeal is a base rate most no-fee cards cannot
  match: 1.5% back on everything, lifted to 3% at restaurants and drugstores
  and 5% on travel booked through Chase Travel, all for no annual fee. A 15
  month 0% intro APR on both purchases and balance transfers gives it a second
  life as a payoff card, and the $200 bonus after $500 of spend in three
  months is one of the easier thresholds on the market to clear. That
  combination is why it sits at #2 on our Best Cash Back list. The catch is
  the foreign transaction fee, which makes it a poor travel companion despite
  the 5% portal rate, and the fact that the top rates all funnel through
  Chase's own booking site. Once the intro window closes the regular APR runs
  18.24% to 27.74%, so this is a card to pay in full.
