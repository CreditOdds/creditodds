our_take: >
  The Freedom Unlimited earns a flat 1.5% back on everything with no annual
  fee, and it layers 3% on dining and drugstores plus 5% on travel booked
  through Chase Travel on top of that floor. Add 15 months of 0% intro APR on
  both purchases and balance transfers, and it is one of the more complete
  no-fee cards around, which is why it ranks as the best no-fee pick on our
  cash back list. The $200 bonus after $500 in spending in the first 3 months
  is modest, but the bar to earn it is low. The catch is the foreign
  transaction fee, so leave it at home when you travel abroad, and know that a
  1.5% base rate trails the 2% flat cards for unbonused spending. The DashPass
  membership is a short-term extra, not a reason to apply.
