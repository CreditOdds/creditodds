our_take: >
  The Autograph Journey is Wells Fargo's travel card, earning 5x points on
  hotels, 4x on airlines, and 3x on dining and other travel, for a $95 annual
  fee. A 60,000-point welcome bonus after $4,000 in spending in the first
  three months gives it a solid start, and a $50 annual statement credit with
  a $50 minimum airline purchase chips away at the fee. The travel protections
  are a real draw, including trip cancellation and interruption coverage up to
  $15,000, lost baggage reimbursement up to $3,000, and no foreign transaction
  fees. The tradeoff is that its strength is narrow: outside of travel and
  dining, everything else earns just 1x. It suits someone who books hotels and
  flights directly several times a year and wants coverage on those trips,
  while a lighter traveler may struggle to earn back the fee.
