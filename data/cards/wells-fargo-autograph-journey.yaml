our_take: >
  The Autograph Journey is Wells Fargo's travel card, earning 5x points on
  hotels, 4x on airlines, and 3x on dining and other travel for a $95 annual
  fee. The welcome offer of 60,000 points after $4,000 in spending in the
  first 3 months is a solid start, and there is no foreign transaction fee. A
  $50 annual statement credit on a $50 minimum airline purchase takes some of
  the sting out of the fee, effectively bringing it closer to $45 if you fly.
  The catch is that everything outside travel and dining earns just 1x, so it
  only pays off if travel is a meaningful share of your spending. The
  protection package is strong for the price, including trip cancellation and
  interruption coverage up to $15,000, lost baggage reimbursement up to
  $3,000, and cell phone protection up to $1,000 per claim.
