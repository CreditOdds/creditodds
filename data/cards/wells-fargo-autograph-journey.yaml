our_take: >
  The Autograph Journey's draw is strong travel earning for a $95 annual fee:
  5x points on hotels, 4x on airlines, and 3x on other travel and dining, plus
  a 60,000-point signup bonus after $4,000 in spending in the first three
  months. The $50 annual statement credit, which triggers on a $50 minimum
  airline purchase, offsets about half the fee for anyone who flies even once
  a year. It also has a solid set of travel protections, including up to
  $15,000 in trip cancellation and interruption coverage, $3,000 in lost
  baggage reimbursement, and no foreign transaction fees. The tradeoff is that
  everything outside travel and dining earns only 1x, so it isn't a good
  everyday card on its own. Cell phone protection of up to $1,000 per claim
  with a $25 deductible is a useful extra. It makes the most sense for someone
  who spends a lot on hotels and flights and wants a mid-tier travel card
  without a premium fee.
