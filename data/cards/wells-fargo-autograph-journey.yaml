our_take: >
  The Autograph Journey is Wells Fargo's travel card, earning 5x points on
  hotels, 4x on airlines, and 3x on dining and other travel for a $95 annual
  fee. The welcome offer of 60,000 points after $4,000 in spending in the
  first 3 months is a solid start. An annual $50 statement credit with a $50
  minimum airline purchase effectively trims the fee to $45 if you fly at
  least once a year. The protections are a real part of the value: trip
  cancellation and interruption coverage up to $15,000, lost baggage
  reimbursement up to $3,000, travel accident insurance, and cell phone
  protection up to $1,000 per claim, with no foreign transaction fees. The
  catch is that everyday spending outside travel and dining earns just 1x, so
  it makes the most sense for people who book hotels and flights regularly
  rather than as an all-purpose card.
