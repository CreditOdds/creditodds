foreign_transaction_fee: false
network: "mastercard"
our_take: >
  The AT&T Points Plus from Citi is really a bill-discount card for AT&T
  customers: enrolling with AutoPay and paperless billing gets $10 per line
  off your monthly wireless bill and $10 off eligible AT&T internet, worth up
  to $120 a year each, with no annual fee. It also pays a $20 statement credit
  in any billing cycle where you spend $1,000 or more, up to $240 a year,
  which rewards heavy users but asks a lot of spending to unlock. Earning is
  decent for a no-fee card at 3 points per dollar on gas and EV charging, 2
  points per dollar on groceries and AT&T purchases, and 1 point per dollar
  elsewhere, and the points can pool with other Citi ThankYou cards. The
  welcome offer recently dropped from $250 to $200, now earned after $1,000 in
  spend in the first 3 months. If you are not an AT&T customer, most of the
  value disappears and a straightforward cash back card will likely serve you
  better.
