our_take: >
  The Intuit Business card's strongest point is a flat 2% cash back on
  everything with no annual fee, which is a solid base rate for business
  spending. It adds 5% back on Intuit products such as QuickBooks, TurboTax,
  and Mailchimp, and a $300 cash bonus after $3,000 in spending in the first
  three months. For QuickBooks users, automatic syncing of transactions and
  receipts plus free virtual and physical employee cards with individual
  limits make bookkeeping simpler. The catch is a foreign transaction fee, so
  it is a poor choice for overseas spending, and the regular APR runs as high
  as 35.24%, so it should be paid in full. Partner discounts on services like
  Google Workspace, Adobe, and FedEx are pleasant extras, but the real reason
  to carry it is the 2% earn plus the QuickBooks integration.
