our_take: >
  The Intuit Business card's strongest pitch is a flat 2% cash back on
  everything with no annual fee, which is a competitive base rate for a small
  business card. QuickBooks users get extra value: 5% back on Intuit products
  like QuickBooks, TurboTax, and Mailchimp, and card transactions and receipts
  sync into QuickBooks automatically. The $300 signup bonus after $3,000 in
  spending over three months is a reasonable sweetener, and unlimited employee
  cards with individual limits and category controls come at no extra cost.
  The catch is the foreign transaction fee, which makes it a poor fit for any
  spending abroad, and an APR range that runs as high as 35.24%, so carrying a
  balance would quickly erase the rewards. The partner discounts on Google
  Workspace, Adobe, LegalZoom, and FedEx are worth a look but should not drive
  the decision.
