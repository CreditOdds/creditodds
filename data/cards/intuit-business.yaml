our_take: >
  The Intuit Business card is aimed at companies already running on
  QuickBooks, TurboTax, or Mailchimp: those purchases earn 5% back, and card
  transactions and receipts flow into QuickBooks automatically rather than
  through a separate bank feed or import. What makes it worth a look beyond
  that niche is the 2% back on everything else with no annual fee, a
  competitive flat rate rather than an afterthought, alongside a $300 bonus
  after $3,000 in the first three months. Unlimited free employee cards with
  their own limits and category controls are a practical add, as are the
  partner discounts, which include 30% off the first year of Google Workspace
  Business Standard and up to $400 a year in LinkedIn Hiring Pro credits. Two
  real catches: the card charges foreign transaction fees, so it's the wrong
  card for overseas spend, and the APR range runs from 14.24% all the way to
  35.24%. Note too that the 5% rate excludes transactional fees such as
  merchant services, so it won't cover your entire Intuit bill.
