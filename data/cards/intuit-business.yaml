our_take: >
  The Intuit Business card's best feature is its flat 2% cash back on
  everything, with no annual fee, which is a solid baseline for any small
  business. QuickBooks users get extra value from 5% back on Intuit products
  such as QuickBooks, TurboTax, and Mailchimp, though transactional fees like
  merchant services are excluded, and from card transactions and receipts
  syncing into QuickBooks automatically. The $300 signup bonus after $3,000 in
  spending in the first three months is a reasonable bonus for a no-fee
  business card. Unlimited employee cards with individual spending limits and
  category controls, an instant virtual card on approval, and partner
  discounts with Google Workspace, Adobe, LegalZoom, FedEx, and LinkedIn round
  out the package. The main drawbacks are a foreign transaction fee, which
  makes it a poor choice for overseas spending, and a wide regular APR range
  of 14.24% to 35.24%. If your books already live in QuickBooks, it is an easy
  card to put to work.
