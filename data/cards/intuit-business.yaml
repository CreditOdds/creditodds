our_take: >
  The Intuit Business card makes the most sense for small businesses already
  running on QuickBooks: it earns 5% cash back on Intuit products like
  QuickBooks, TurboTax, and Mailchimp, and a solid 2% on everything else, with
  no annual fee. The 2% base rate is the real draw, since it means every other
  business expense earns a competitive flat return. There's also a $300 cash
  bonus after $3,000 in spending in the first three months. Transactions and
  receipts sync into QuickBooks automatically, and unlimited employee cards
  with their own spending limits and category controls are included at no
  extra cost. Two catches: the 5% rate covers only Intuit's own products and
  excludes merchant-services fees, and the card charges a foreign transaction
  fee, so it's a poor choice for spending abroad. The partner discounts on
  Google Workspace, Adobe, LegalZoom, and FedEx are nice extras, but the 2%
  everyday earn is what makes the card worth carrying.
