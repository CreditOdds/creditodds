name: "Venmo Credit Card"
bank: "Synchrony"
slug: "venmo-credit-card"
image: "venmo.png"
accepting_applications: true
category: "cashback"
annual_fee: 0
reward_type: "cashback"
tags:
  - cashback
  - rewards
rewards:
  # Venmo replaced the automatic top-category design (3% on your top eligible
  # category, 2% on the second) with fixed rates. The extra 1% on split
  # purchases is conditional on friends paying you back in the app, so it
  # lives in the notes rather than lifting the rate the ranker sees.
  - category: "dining"
    value: 3
    unit: "percent"
    note: "Restaurants, carryout, drive-throughs, delivery, bars, and liquor stores. 4% when you split the purchase in Venmo and friends pay you back within 30 days."
  - category: "entertainment"
    value: 3
    unit: "percent"
    note: "Movie theaters, concerts, amusement parks, digital goods, and gym or golf memberships. 4% when you split the purchase in Venmo and friends pay you back within 30 days."
  - category: "streaming"
    value: 3
    unit: "percent"
    note: "Subscription streaming counts as Entertainment on this card."
  - category: "online_shopping"
    value: 3
    unit: "percent"
    note: "Only when paying through Venmo: checking out with Venmo online, paying a business on Venmo, or paying someone for goods and services on Venmo."
    merchant_specific: true
  - category: "everything_else"
    value: 1
    unit: "percent"
    note: "Includes groceries, gas, travel, and utilities, which earned 3% or 2% under the old top-category design."
apr:
  regular:
    min: 18.74
    max: 30.74
apply_link: https://venmo.com/about/creditcard
foreign_transaction_fee: false
network: "visa"
our_take: >
  The Venmo Credit Card pays 3% cash back on dining and entertainment,
  including streaming, and that rises to 4% when you split the purchase in
  Venmo and friends pay you back within 30 days. It also earns 3% on online
  shopping, but only when you pay through Venmo, such as checking out with
  Venmo online or paying a business on Venmo, not on all online purchases. The
  catch is that everything else, including groceries, gas, travel, and
  utilities, earns just 1%, which makes it a weak everyday card outside its
  core categories. There is no annual fee and no foreign transaction fee, but
  the regular APR of 18.74% to 30.74% runs high. It makes the most sense for
  heavy Venmo users who dine out often and split bills with friends.
