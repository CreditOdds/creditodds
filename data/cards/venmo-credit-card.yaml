our_take: >
  The Venmo Credit Card's appeal is that it does the category tracking for
  you: 3% back on your highest-spend eligible category each statement period
  and 2% on your second-highest, chosen automatically from eight buckets that
  cover transportation, travel, groceries, entertainment, dining and
  nightlife, bills and utilities, health and beauty, and gas. For anyone whose
  spending shifts month to month, that beats remembering which card to pull
  out, and it carries no annual fee and no foreign transaction fee. The
  tradeoff is the floor: everything outside your top two categories earns just
  1%, so a flat 2% card will out-earn this one for most of your spending
  unless your budget is heavily concentrated. There is no signup bonus to
  sweeten the start, and the regular APR runs 18.74% to 30.74%, so this only
  works as a card you pay in full. Good as a low-effort second card, not as
  the one that carries your whole wallet.
