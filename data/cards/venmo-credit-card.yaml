name: "Venmo Credit Card"
bank: "Synchrony"
slug: "venmo-credit-card"
image: "venmo.png"
accepting_applications: true
category: "cashback"
annual_fee: 0
reward_type: "cashback"
tags:
  - cashback
  - rewards
rewards:
  # Venmo replaced the automatic top-category design (3% on your top eligible
  # category, 2% on the second) with fixed rates. The extra 1% on split
  # purchases is conditional on friends paying you back in the app, so it
  # lives in the notes rather than lifting the rate the ranker sees.
  - category: "dining"
    value: 3
    unit: "percent"
    note: "Restaurants, carryout, drive-throughs, delivery, bars, and liquor stores. 4% when you split the purchase in Venmo and friends pay you back within 30 days."
  - category: "entertainment"
    value: 3
    unit: "percent"
    note: "Movie theaters, concerts, amusement parks, digital goods, and gym or golf memberships. 4% when you split the purchase in Venmo and friends pay you back within 30 days."
  - category: "streaming"
    value: 3
    unit: "percent"
    note: "Subscription streaming counts as Entertainment on this card."
  - category: "online_shopping"
    value: 3
    unit: "percent"
    note: "Only when paying through Venmo: checking out with Venmo online, paying a business on Venmo, or paying someone for goods and services on Venmo."
    merchant_specific: true
  - category: "everything_else"
    value: 1
    unit: "percent"
    note: "Includes groceries, gas, travel, and utilities, which earned 3% or 2% under the old top-category design."
apr:
  regular:
    min: 18.74
    max: 30.74
apply_link: https://venmo.com/about/creditcard
foreign_transaction_fee: false
network: "visa"
our_take: >
  The Venmo Credit Card now pays fixed rates instead of picking your top
  category for you: 3% on dining, 3% on entertainment (which Venmo defines
  broadly enough to cover subscription streaming, digital goods, and gym
  memberships), and 3% on anything you pay for through Venmo itself, whether
  that is checking out online, paying a business, or paying someone for goods
  and services. Split a dining or entertainment purchase in the app and get
  paid back within 30 days, and it earns 4%. Everything else, including
  groceries, gas, travel, and utilities, now earns 1%, and that is the real
  cost of the change, since those categories could earn 3% or 2% under the
  old automatic design. It carries no annual fee and no foreign transaction
  fee. With no signup bonus and a regular APR of 18.74% to 30.74%, it works
  best as a pay-in-full second card for someone whose spending already leans
  toward going out and settling up with friends.
