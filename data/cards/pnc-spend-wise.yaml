our_take: >
  The PNC Spend Wise is built for financing, with 18 months of 0% intro APR on
  both purchases and balance transfers and no annual fee. That runway makes it
  a reasonable option for paying down existing debt or spreading out a large
  purchase over a year and a half. It also has an unusual long-term angle:
  spend at least $3,000 in net purchases and make your minimum payments on
  time each 12-billing-cycle review period, and PNC cuts your standard
  purchase APR by 2 percentage points. The catch is that the card earns no
  rewards, so there is little reason to use it for everyday spending once the
  intro period ends, and it charges a foreign transaction fee. Price
  protection, porch piracy protection, cell phone protection, and up to $25 a
  year in Spotify, Netflix, and Disney+ credits are modest extras on top.
