our_take: >
  Spend Wise pairs 18 months of 0% intro APR on both purchases and balance
  transfers with a $0 annual fee, which is a long runway whether you are
  paying down debt or financing something large. What sets it apart from the
  usual balance transfer card is the benefit list: up to $25 a year in credits
  toward Spotify, Netflix and Disney+, price protection up to $1,000 if an
  item drops in price within 60 days, porch piracy coverage up to $10,000 per
  claim, and cell phone protection up to $800 per claim when you pay your bill
  with the card. There is also an APR reduction program that shaves 2
  percentage points off your standard purchase rate for each 12-billing-cycle
  period where you make at least $3,000 in net purchases and pay the minimum
  on time, down to an 8.74% margin floor. The tradeoff is the familiar one:
  this card earns no rewards at all, so once the intro window closes there is
  little reason to keep spending on it. A foreign transaction fee and a 19.49%
  to 27.49% go-to APR seal that. Use the 18 months, then move your spending
  elsewhere.
