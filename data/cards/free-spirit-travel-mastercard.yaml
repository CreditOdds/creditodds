our_take: >
  The Free Spirit Travel Mastercard is no longer accepting new applications,
  so it now matters only to existing cardholders. For them, it still carries
  no annual fee and no foreign transaction fee, earning 2 points per dollar on
  eligible Spirit Airlines purchases and 1 point on everything else. Frequent
  Spirit flyers also get a 25% rebate on inflight food and beverage purchases
  and Zone 2 priority boarding. The 5,000 anniversary bonus points require at
  least $10,000 in spending during the prior year, which is a high bar for a
  card with a 1 point base rate. Keep it if you fly Spirit regularly, but put
  everyday spending on a card with a stronger base rate.
