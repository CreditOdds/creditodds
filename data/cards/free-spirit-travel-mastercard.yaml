our_take: >
  The Free Spirit Travel Mastercard is no longer accepting new applications,
  so it only matters to existing cardholders deciding whether to keep it. Its
  strongest feature for loyal Spirit flyers is the combination of 2 points per
  dollar on eligible Spirit Airlines purchases, a 25% rebate on Spirit
  inflight food and drinks, and Zone 2 priority boarding, all with no annual
  fee. Outside Spirit, the earn drops to 1 point per dollar on everything
  else, so it is a weak everyday card. The 5,000-point anniversary bonus
  requires $10,000 in spending in the prior year, which is a high bar for such
  a modest base rate. With no annual fee and no foreign transaction fee, there
  is little cost to keeping it open for Spirit trips and account history.
