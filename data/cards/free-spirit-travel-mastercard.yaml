our_take: >
  The Free Spirit Travel Mastercard is no longer accepting applications, so it
  only matters to existing cardholders deciding whether to keep it. It earns 2
  points per dollar on eligible Spirit Airlines purchases and 1 point per
  dollar on everything else, with no annual fee and no foreign transaction
  fee. Frequent Spirit flyers get some real perks: Zone 2 priority boarding
  and a 25% rebate on inflight food and beverages paid for with the card.
  There is also a 5,000-point anniversary bonus, but only after spending at
  least $10,000 in the prior year, which is a high bar for a card with a 1
  point base rate. Since it costs nothing to hold, keeping it open can help
  your credit history, but outside of Spirit purchases another card will
  likely earn more.
