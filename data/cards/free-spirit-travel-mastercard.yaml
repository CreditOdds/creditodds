our_take: >
  The Free Spirit Travel Mastercard is no longer accepting applications, so
  this take is for existing cardholders deciding whether to keep it. It
  charges no annual fee and earns 2 points per dollar on eligible Spirit
  Airlines purchases and 1 point on everything else, which is thin unless you
  fly Spirit often. The more useful perks are tied to the airline: a 25%
  rebate on Spirit inflight food and beverage, Zone 2 priority boarding, and
  5,000 bonus points each anniversary after spending at least $10,000 in the
  prior year. No foreign transaction fee makes it painless to carry on
  international trips. With no annual fee there is little cost to keeping it
  open for credit history and the occasional Spirit flight, but it should not
  be your main spending card.
