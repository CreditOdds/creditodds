our_take: >
  The no-annual-fee Free Spirit Travel Mastercard was a narrow card for
  frequent Spirit flyers: 2x points on eligible Spirit Airlines purchases only
  and 1x on everything else, so the headline rate never applied outside
  Spirit's own tickets and ancillaries. The ongoing perks were similarly
  Spirit-specific: Zone 2 shortcut boarding and a 25% rebate on inflight food
  and beverage bought with the card. An anniversary bonus of 5,000 points is
  available, but only after $10,000 of spending in the prior anniversary year,
  which is a lot of 1x purchases to chase. There is no foreign transaction
  fee, a nice touch on a free card. The larger point is that it is no longer
  accepting applications, so existing holders should judge it on the boarding
  and inflight perks alone and put everyday spending somewhere that earns more
  than a point per dollar.
