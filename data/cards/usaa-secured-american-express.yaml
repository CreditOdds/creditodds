our_take: >
  The USAA Secured American Express is a straightforward credit builder with
  no annual fee and no foreign transaction fees, so the only cost of using it
  responsibly is the security deposit that comes with any secured card. The
  main catch is a fixed 26.4% APR, which makes carrying a balance expensive,
  so pay in full each month. It also earns no rewards, which is typical for
  this category but means it offers nothing beyond the credit history it helps
  you build. Because it runs on the American Express network, acceptance can
  be narrower than Visa at some merchants. If you have the choice, USAA's
  Secured Visa Platinum carries a lower APR range, which makes it the safer
  pick for most credit builders.
