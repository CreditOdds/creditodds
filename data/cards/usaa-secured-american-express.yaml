our_take: >
  The USAA Secured American Express is a credit-building card with no annual
  fee and no foreign transaction fee, giving USAA members a low-cost way to
  establish or repair a credit history. As a secured card, it backs your
  credit line with a deposit, which makes approval more accessible when your
  credit is thin or damaged. The catch is the APR: it's a flat 26.4%, so
  carrying a balance on this card gets expensive fast. It also earns no
  rewards, so it has no reason to stay in your wallet once your credit
  improves. Use it for small purchases, pay in full each month, and if you
  want a lower rate, compare it with USAA's Secured Visa Platinum before
  applying.
