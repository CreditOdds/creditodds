our_take: >
  The USAA Secured American Express is a straightforward credit-building tool:
  no annual fee, no foreign transaction fee, and a path to establishing
  payment history. It is a reasonable place to start if you are new to credit
  or rebuilding after a setback. The catch is the flat 26.4% APR, which is
  steep, so carrying a balance would cost you real money. The card also earns
  no rewards, and it runs on the American Express network, which is not
  accepted at every merchant. USAA's own Secured Visa Platinum offers a much
  lower APR range of 11.4% to 21.4%, so compare the two before you choose.
