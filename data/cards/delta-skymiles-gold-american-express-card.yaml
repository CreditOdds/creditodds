name: "Delta SkyMiles Gold American Express"
bank: "American Express"
slug: "delta-skymiles-gold-american-express-card"
image: "amex_delta_skymiles_gold.png"
accepting_applications: true
apply_link: https://www.americanexpress.com/us/credit-cards/card/delta-skymiles-gold-american-express-card/
foreign_transaction_fee: false
network: "amex"
our_take: >
  The Delta Gold is the entry point for Delta flyers who want the core travel
  perks without a premium fee: your first checked bag is free on Delta flights
  for you and up to 8 companions on the same reservation, along with priority
  boarding and 15% off award flights booked on delta.com. At $150 a year, one
  family trip with a couple of checked bags can cover the fee on its own.
  Earning is modest at 2 miles per dollar on Delta purchases, dining, and U.S.
  supermarkets, with 1 mile everywhere else, so this is a card you carry for
  the airline benefits rather than the earn rates. The welcome offer was
  recently trimmed from 90,000 to as high as 80,000 miles after $3,000 in
  spend over 6 months, and it varies by applicant. The $200 Delta Flight
  Credit requires $10,000 in calendar-year spend, so treat it, the up to $100
  Delta Stays credit, and the monthly rideshare credit as extras rather than
  reasons to apply.
annual_fee: 150
reward_type: "miles"
