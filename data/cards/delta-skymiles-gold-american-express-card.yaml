name: "Delta SkyMiles Gold American Express"
bank: "American Express"
slug: "delta-skymiles-gold-american-express-card"
image: "amex_delta_skymiles_gold.png"
accepting_applications: true
apply_link: https://www.americanexpress.com/us/credit-cards/card/delta-skymiles-gold-american-express-card/
foreign_transaction_fee: false
network: "amex"
our_take: >
  The Delta Gold earns its $150 annual fee mostly through the free first
  checked bag on Delta flights for you and up to 8 companions on the same
  reservation, which can pay for itself on a single family trip. It also ranks
  #2 on our Best Airline Credit Cards list, and the welcome offer of up to
  80,000 miles after $3,000 in spend over 6 months is solid, though it was
  recently trimmed from 90,000. The catch is the earn rate: 2x on Delta
  purchases, dining, and U.S. supermarkets with 1x on everything else is
  modest for a $150 card, so it works as a travel-perks card rather than an
  everyday spender. The $200 Delta Flight Credit only arrives after $10,000 in
  calendar-year spend, and the up to $100 Delta Stays credit and $10 monthly
  rideshare credit (enrollment required) help offset the fee only if you use
  them. Get it if you fly Delta a few times a year and check bags, not for the
  points.
annual_fee: 150
reward_type: "miles"
