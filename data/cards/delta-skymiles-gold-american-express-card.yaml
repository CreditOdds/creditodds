our_take: >
  The Gold is the Delta card where the math usually works for casual flyers:
  the free first checked bag on Delta flights worldwide, for you and up to
  eight companions on the same reservation, can cover the $150 annual fee on
  one family trip. It ranks #3 on our Best Airline Credit Cards list and pairs
  Main Cabin 1 boarding with 15% off Delta award flights through TakeOff 15,
  plus 2x miles on Delta, restaurants, and U.S. supermarkets. The welcome
  offer is currently as high as 80,000 miles after $3,000 in six months, back
  down after a run at 90,000 that ended in July, and welcome offers vary by
  applicant so you may not see the top number. The credits attached to it come
  with strings: the $200 Delta flight credit requires $10,000 of spend in a
  calendar year, the $100 Delta Stays credit only applies to prepaid bookings
  on delta.com, and the $10 monthly rideshare credit requires enrollment.
  Everything outside those three categories earns 1x, so it is a benefits card
  more than an earning card.
