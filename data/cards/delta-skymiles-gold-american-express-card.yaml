our_take: >
  The Delta Gold earns its $150 annual fee mostly on the ground at the
  airport: your first checked bag is free on Delta flights worldwide, and the
  second is free on domestic Delta flights, for you and up to 8 companions on
  the same reservation. A family of four checking bags on even one or two
  round trips a year can recover the fee quickly, and Main Cabin 1 priority
  boarding and 15% off award flights through TakeOff 15 add to that. The
  welcome offer is shown as up to 80,000 miles after $3,000 in spending over
  six months, recently back down after a brief bump to 90,000. The catch is
  the earn rate: 2x on Delta purchases, dining, and U.S. supermarkets, with
  everything else at 1x, so this is not a strong everyday spending card. The
  $200 Delta Flight Credit only arrives after $10,000 in calendar-year
  spending, and the up to $100 Delta Stays and $10 monthly rideshare credits
  take some effort to use. It ranks #3 on our Best Airline Credit Cards list,
  and it makes the most sense for travelers who fly Delta a few times a year
  and check bags.
