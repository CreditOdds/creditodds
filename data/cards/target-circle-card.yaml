our_take: >
  The Target Circle Card is about one thing: an instant 5% discount at Target
  stores and Target.com, including in-store Starbucks and Target
  subscriptions, with no annual fee. Add free two-day shipping on eligible
  items, an extra 30 days on returns, and half off the $99 Target Circle 360
  membership, and it is an easy fit for anyone who shops at Target every week.
  The catch is that this version earns nothing meaningful outside Target, and
  Target GiftCards, prescriptions, and some services are excluded even inside
  it; only the Mastercard version issued to well-qualified applicants adds 2%
  on gas and dining and 1% elsewhere. The 27.4% APR also means the 5% discount
  evaporates quickly if you carry a balance. The signup bonus has bounced
  around lately, rising to $100 and then $75 before settling back at $50 in
  Target Circle Rewards after $50 of spend within two months, so it can pay to
  time your application.
