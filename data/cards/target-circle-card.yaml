our_take: >
  If you shop at Target regularly, the Circle Card is about as simple as
  rewards get: an instant 5% discount at Target stores and Target.com,
  including in-store Starbucks and Target subscriptions, with no annual fee
  and no foreign transaction fee. Free two-day shipping on eligible items, an
  extra 30 days on returns, and 50% off the $99 Target Circle 360 membership
  add a bit more for frequent shoppers. The catch is that the discount stops
  at Target's doors, and exclusions include Target GiftCards and
  prescriptions. Only the Mastercard version issued to well-qualified
  applicants earns anything elsewhere: 2% on gas and dining and 1% on
  everything else. Watch the timing on the welcome offer, which has bounced
  between $50, $100, and $75 in Target Circle Rewards since August and
  currently sits at $50 after $50 in spend within two months. With a 27.4%
  regular APR, this card only makes sense if you pay in full.
