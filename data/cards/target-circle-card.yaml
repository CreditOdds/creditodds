our_take: >
  If you shop at Target regularly, the Target Circle Card is about as simple
  as a store card gets: an instant 5% discount at Target stores and
  Target.com, including in-store Starbucks and Target subscriptions, with no
  annual fee. Extras like free two-day shipping on eligible items, an extra 30
  days on returns, and half off the $99 Target Circle 360 membership add a bit
  more value for frequent shoppers. The current welcome offer is $75 in Target
  Circle Rewards with no spending requirement, though it has bounced between
  $50 and $100 over the past few months and this version is set to end October
  10, 2026. The catch is that the standard card does nothing for you outside
  Target; only the Mastercard version, offered to well-qualified applicants,
  adds 2% on gas and dining and 1% elsewhere. With a 27.4% APR, this card only
  makes sense if you pay in full every month, since interest would quickly
  wipe out the 5% savings.
