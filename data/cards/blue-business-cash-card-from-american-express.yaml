our_take: >
  The Blue Business Cash keeps business rewards simple: 2% cash back on all
  purchases with no annual fee and no categories to track. American Express
  recently doubled the welcome bonus from $250 to $500 after $5,000 in spend
  over three months, which makes now a good time to apply. A 0% intro APR on
  purchases for 12 months adds some breathing room for a new business. The
  catch is the cap: the 2% rate applies only to the first $50,000 in purchases
  each year, then drops to 1%, so heavier spenders will want a different card
  for anything above that. It also charges a foreign transaction fee, so leave
  it home when you travel abroad.
