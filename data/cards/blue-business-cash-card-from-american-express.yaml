our_take: >
  The Blue Business Cash is about as simple as small-business cards get: a
  flat 2% cash back on all eligible purchases with no annual fee, and no
  categories to track. American Express just doubled the welcome bonus from
  $250 to $500 after $5,000 in spend within three months, which makes now a
  better time to open it than it has been. A 0% intro APR on purchases for 12
  months adds some breathing room for a new expense or equipment buy. The
  catch is the cap: the 2% rate only applies to the first $50,000 in purchases
  each year, after which you earn just 1%, so higher-spending businesses will
  hit the ceiling. It also charges a foreign transaction fee, which makes it a
  poor choice for spending abroad.
