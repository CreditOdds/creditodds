our_take: >
  A flat 2% back on every business purchase up to $50,000 a year, with no
  annual fee, is the cleanest version of a small-business cash back card:
  nothing to enroll in, no categories to sort your spending into. The $250
  bonus after $3,000 in the first three months is a fair opening, and 12
  months of 0% intro APR on purchases helps if you are buying equipment or
  inventory ahead of revenue. Past the $50,000 annual cap the rate drops to
  1%, which matters if your business spends heavily, so map your yearly volume
  before assuming the 2% applies to all of it. It also charges foreign
  transaction fees, so keep international vendor payments and travel on
  something else. For a business spending under the cap and wanting cash
  rather than points, it is a straightforward default.
