our_take: >
  The Blue Business Cash is about as simple as a business card gets: 2% cash
  back on all eligible purchases with no annual fee and no categories to
  track. That flat rate applies to the first $50,000 in spending each year,
  after which it drops to 1%, so it suits small businesses with moderate
  expenses better than heavy spenders. New cardholders can earn a $250 bonus
  after spending $3,000 in three months, and a 0% intro APR on purchases for
  12 months helps if you need to finance equipment or inventory. The main
  drawbacks are the spending cap and a foreign transaction fee, which makes it
  a poor choice for purchases abroad. For a no-fee, low-effort cash back card
  for domestic business spending, it does the job well.
