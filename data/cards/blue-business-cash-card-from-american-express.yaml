our_take: >
  The Blue Business Cash keeps business rewards simple: a flat 2% cash back on
  all purchases with no annual fee and no categories to track. American
  Express recently doubled the welcome offer from $250 to $500 after $5,000 in
  spend within three months, which makes now a better time than usual to open
  one. A 0% intro APR on purchases for 12 months adds some breathing room for
  a business financing new expenses. The main limit is the cap: the 2% rate
  applies to the first $50,000 in purchases each year, then drops to 1%, so
  heavier spenders will want a different card for spend beyond that. There is
  also a foreign transaction fee, so leave it at home when you travel abroad.
