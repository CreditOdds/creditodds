our_take: >
  The GO BIZ Rewards is a no-annual-fee business card whose main appeal is
  simplicity: one point per dollar on every purchase and free employee cards
  on a single account. That makes it a reasonable way for a small business
  already banking with Navy Federal to separate business expenses and give
  staff cards without paying for the privilege. The tradeoff is that 1 point
  per dollar is a low flat rate, with no bonus categories and no signup bonus
  to sweeten the start. No foreign transaction fees and purchase protection on
  new items are useful extras, but they don't change the math. Pick it for
  convenience and expense tracking, not for rewards.
