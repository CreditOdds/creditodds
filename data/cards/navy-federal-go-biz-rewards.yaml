our_take: >
  GO BIZ Rewards is a no-annual-fee business card built around access rather
  than rewards, issuing cards to multiple employees on one account at no extra
  cost and adding purchase protection on eligible items. Earning is the plain
  limitation: a flat 1 point per dollar, no bonus categories, and no welcome
  offer, so it will not keep pace with business cards that pay more on the
  categories you actually spend in. What it does offer is a low ceiling on
  interest, with a regular APR range of 16.65% to 18%, which matters more than
  rewards if the account ever carries a balance between invoices. There is
  also no foreign transaction fee, so purchases abroad are not shaved down.
  Think of it as a simple operating card for a Navy Federal business member
  rather than part of a points strategy.
