our_take: >
  The GO BIZ Rewards is a no-annual-fee business card with a simple pitch: 1
  point per dollar on every purchase, no foreign transaction fees, and
  employee cards at no extra cost. That makes it a reasonable, low-maintenance
  option for a Navy Federal member who wants to separate business spending and
  keep it on one account. Be realistic about the tradeoff, though: there are
  no bonus categories and no signup bonus, so the earn rate trails what many
  flat-rate business cards offer. The regular APR range of 16.65% to 18% is
  relatively low, which matters more than rewards if your business sometimes
  carries a balance. Purchase protection is the only other perk, so treat this
  as a basic expense card rather than a rewards engine.
