our_take: >
  The GO BIZ Rewards is a simple, no-annual-fee business card from Navy
  Federal that earns a flat 1 point per dollar on everything. Its real appeal
  is practical rather than rewarding: you can issue cards to multiple
  employees at no extra cost, there's no foreign transaction fee, and purchase
  protection covers eligible new items. The catch is that 1 point per dollar
  with no bonus categories and no signup bonus is a thin return, and most
  business owners can earn noticeably more elsewhere. Consider it if you're a
  Navy Federal member who wants a basic, free card to separate business
  expenses and hand out to employees, not if you're trying to maximize rewards
  on business spending.
