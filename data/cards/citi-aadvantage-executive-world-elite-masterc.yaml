our_take: >
  Full Admirals Club membership for you and your authorized users is the
  entire argument for the $595 Executive, and if you fly American often enough
  to use those lounges it is the cleanest way to buy them. Around that sit
  about $360 in annual credits, $120 each toward Lyft at $10 a month after
  three eligible rides, Grubhub at $10 per billing statement, and prepaid Avis
  or Budget rentals, plus a $120 Global Entry or TSA PreCheck credit every
  four years. The current offer is 70,000 miles after $7,000 in three months,
  and frequent flyers can pick up 10,000 bonus Loyalty Points at 50,000 and
  another 10,000 at 90,000 in the same qualification year. Earning is narrow,
  though: 10x on hotels and car rentals booked through American's portals and
  4x on American Airlines purchases only, rising to 5x after $150,000 of spend
  in a calendar year, with everything else at a flat 1x. Most of the credits
  require enrollment and drip out monthly, so the fee really only works if the
  lounge access alone is worth $595 to you.

