our_take: >
  Citi just raised the Executive's annual fee from $595 to $695 and paired the
  increase with a limited time signup bonus jump from 70,000 to 125,000
  AAdvantage miles after $15,000 of spend in five months. The headline benefit
  is full Admirals Club membership for the cardholder and authorized users,
  and that lounge access is the main reason to absorb a fee this size. Around
  it sits a stack of credits that only pay off if you use them: up to $500 a
  year on American Airlines Vacations packages, $180 in Lyft credits at $15 a
  month, $120 on prepaid Avis or Budget rentals, and $100 on inflight and
  Admirals Club purchases. Earning is narrow, with 12x on AAdvantage Hotels
  and Cars bookings, 4x on American Airlines purchases only, and 1x on
  everything else, so treat this as a lounge and perks card rather than a
  spending card. It sits at #10 on our Best Airline Credit Cards list, and the
  $15,000 spend requirement is a real hurdle for anyone not already flying
  American regularly.

