our_take: >
  The Executive is Citi's top-tier American Airlines card, and its standout
  perk is full Admirals Club membership for you and your authorized users,
  which on its own can justify the cost for anyone who passes through American
  hubs regularly. Citi just raised the annual fee from $595 to $695, but it
  paired that with a much bigger welcome offer, recently lifted from 70,000 to
  125,000 miles after $15,000 in spend within five months. Beyond lounges, you
  get 4x miles on American Airlines purchases (5x after $150,000 in a calendar
  year), 12x on AAdvantage Hotels and Cars bookings, a first checked bag free
  on domestic American itineraries, and 10,000 Loyalty Point bonuses at each
  of four status milestones. The catch is that much of the remaining value
  sits in narrow credits: up to $500 on American Airlines Vacations packages
  split into two halves, $180 in Lyft credits at $15 a month, $120 at Avis or
  Budget, and $100 for inflight and Admirals Club purchases, all of which only
  count if you would have spent there anyway. With a 1x base rate on
  everything else, this is a card for committed American loyalists who will
  use the lounges, not a general-purpose rewards card.

