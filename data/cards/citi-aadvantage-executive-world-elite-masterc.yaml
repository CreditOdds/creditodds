our_take: >
  The Executive's core draw is full Admirals Club membership for you and your
  authorized users, the perk that justifies carrying it if you fly American
  often enough to use lounges regularly. Citi just reworked the card, raising
  the annual fee from $595 to $695 while lifting the welcome offer from 70,000
  to 125,000 miles after $15,000 in spending within five months, a
  limited-time bonus with a steep spend requirement. To offset the higher fee,
  you get up to $500 a year toward American Airlines Vacations packages (split
  into two $250 halves), up to $180 in Lyft credits at $15 a month after three
  rides, up to $120 for Avis or Budget prepaid rentals, and up to $100 on
  inflight and Admirals Club purchases. Earning is 4x on eligible American
  Airlines purchases, rising to 5x after $150,000 in a calendar year, and 12x
  on AAdvantage Hotels and Cars bookings, but just 1x on everything else, so
  it is a weak everyday card. Treat it as a lounge and status play: if you
  will not use the Admirals Club and the bundled credits, the $695 fee is hard
  to recover.

