our_take: >
  The Strata's appeal is breadth for nothing: no annual fee, 3x points on
  groceries, transit, and gas including EV charging, plus 3x on one
  self-select category you can change each quarter, with 5x reserved for
  hotels, car rentals, and attractions booked through Citi Travel. A
  20,000-point bonus after $1,000 of spend in three months is easy to clear,
  and the 15 months of 0% intro APR on both purchases and balance transfers
  gives it a second life as a payoff card. The tradeoffs are real, though:
  dining earns only 2x, everything outside the bonus categories drops to 1x,
  and the card charges foreign transaction fees, so it should stay home on
  international trips. The top 5x rate also locks you into Citi's own travel
  portal rather than booking direct. Best used as a no-fee everyday earner for
  domestic spending, not as your primary travel card.
