our_take: >
  The Citi Strata stands out among no-annual-fee cards for how many bonus
  categories it covers: 3x points on groceries, gas and EV charging, and
  transit, plus 3x on one self-selected category such as streaming, fitness
  clubs, or live entertainment that you can switch once per calendar quarter.
  Dining earns 2x, and hotels, car rentals, and attractions booked through
  Citi Travel earn 5x. It also comes with a 15-month 0% intro APR on purchases
  and balance transfers, which adds real value if you are financing a purchase
  or moving a balance. The tradeoffs are a 1x base rate on everything else and
  a foreign transaction fee that rules it out for international trips. The
  20,000-point bonus after $1,000 in spend over three months is modest, but as
  a fee-free card for everyday categories, it pulls its weight.
