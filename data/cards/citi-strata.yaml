our_take: >
  The Citi Strata gives a no-annual-fee card an unusually flexible earning
  structure: 3x points on groceries, gas and EV charging, and transit, plus 3x
  in one self-selected category such as streaming, fitness clubs, or live
  entertainment that you can change once per calendar quarter. Dining earns
  2x, and hotels, car rentals, and attractions booked through Citi Travel earn
  5x. It also offers 15 months of 0% intro APR on purchases and balance
  transfers, which adds real value if you are carrying a balance or planning a
  large purchase. The catch is the 1x base rate on everything else and a
  foreign transaction fee that makes it a poor choice abroad. The 20,000 point
  bonus after $1,000 in spend is modest, but the bar is low, and this card
  works well as an everyday earner for households whose spending lines up with
  its 3x categories.
