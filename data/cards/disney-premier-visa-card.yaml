our_take: >
  The Disney Premier Visa is the middle option for Disney fans, earning 5% on
  Disney+, Hulu, and ESPN+ and 2% on gas, groceries, dining, and at most U.S.
  Disney locations for a $49 annual fee. Those 2% categories cover a lot of
  everyday spending, which makes the fee easy to earn back for a family that
  also streams Disney services. New cardholders get a $200 Disney eGift Card
  on approval plus a $100 statement credit after spending $500 in the first 3
  months. The real limitation is that it has no credits to offset the fee and
  charges foreign transaction fees, so it is a poor travel companion outside
  the U.S. Park perks like 10% off select merchandise and dining and
  cardmember photo locations add value only if you visit Disneyland or Walt
  Disney World.
