our_take: >
  The Disney Premier Visa is a middle-tier option for Disney fans who want
  more than the base card without committing to a large fee. For $49 a year it
  earns 5% on Disney+, Hulu, and ESPN+, plus 2% at most U.S. Disney locations
  and on gas, groceries, and dining, with 1% on everything else. The welcome
  offer of a $200 Disney eGift Card on approval plus a $100 statement credit
  after spending $500 in 3 months covers the first several years of fees on
  its own. The tradeoff is that there are no statement credits to offset the
  ongoing fee, so you need steady streaming and everyday category spending to
  come out ahead, and it charges a foreign transaction fee, which makes it a
  poor travel companion abroad. The park perks, including 10% off select
  merchandise and dining, 15% off select guided tours, and cardmember photo
  locations, add value mainly for frequent Disneyland or Walt Disney World
  visitors.
