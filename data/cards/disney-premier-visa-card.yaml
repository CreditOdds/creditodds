our_take: >
  At a $49 annual fee, the Premier is the middle Disney card, and the math is
  simpler than the Inspire's: no built-in credits to offset the fee, so you
  need the earn rates and the bonus to carry it. The signup bonus is $300
  total, a $200 Disney eGift Card on approval plus a $100 statement credit
  after just $500 of spending in the first 3 months, which is a low bar.
  Ongoing you get 2% back on gas, groceries, dining, and most U.S. Disney
  locations, and 1% on everything else; the 5% headline rate applies only to
  Disney+, Hulu, and ESPN+ purchases, not streaming generally. Two things to
  weigh: the card charges foreign transaction fees, which hurts if you're
  cruising or visiting international parks, and rewards come back as Disney
  Rewards Dollars you spend in the Disney ecosystem rather than as cash. Worth
  it if you visit the parks often enough to spend those dollars; otherwise a
  no-fee 2% card does more.
