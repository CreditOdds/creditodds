our_take: >
  The Eagle Navigator stands out for its everyday earn: 2 points per dollar on
  everything, plus 3 points on travel and transit, including rideshare and
  tolls, which is a strong floor for a travel card. Add a 30,000-point bonus
  after $3,000 in spending in the first three months, up to $120 back for
  Global Entry or TSA PreCheck, and no foreign transaction fees, and it's a
  well-rounded option for USAA members. You can also pick up 10,000 bonus
  points each year by booking a hotel stay or car rental through the USAA
  Rewards Center. The catch is the $95 annual fee, which you'll need to
  justify through spending if you aren't serving, since active duty members
  get the fee waived along with reduced APR under the Servicemembers Civil
  Relief Act. For eligible service members, that waiver makes it an easy card
  to hold.
