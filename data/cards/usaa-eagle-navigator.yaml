our_take: >
  The Eagle Navigator earns 2 points per dollar on everything and 3 points per
  dollar on travel and transit, including rideshare and tolls, which gives it
  a stronger floor than most travel cards at its price. The signup bonus of
  30,000 points after $3,000 in spend in the first three months is a
  reasonable start, and an extra 10,000 points each year after booking a hotel
  stay or car rental through the USAA Rewards Center helps offset the $95
  annual fee. A Global Entry or TSA PreCheck credit of up to $120 every four
  years and no foreign transaction fee add real value for frequent travelers.
  The tradeoff is that the yearly 10,000-point bonus only arrives if you book
  through USAA's portal, so travelers who book direct will feel the $95 fee
  more. Active duty members get the strongest deal, since the annual fee drops
  to $0 and they can receive a reduced APR under the Servicemembers Civil
  Relief Act.
