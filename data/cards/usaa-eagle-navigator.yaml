our_take: >
  The Eagle Navigator earns a solid 2 points per dollar on everything and 3
  points on travel and transit, including rideshare and tolls, which gives it
  a stronger base rate than many travel cards. New cardholders can earn 30,000
  bonus points after spending $3,000 in 3 months, and there is no foreign
  transaction fee. The catch is the $95 annual fee, which you need to justify
  with steady spending; active duty service members get the fee waived. Extras
  help offset the cost: an up to $120 Global Entry or TSA PreCheck credit
  every four years, and 10,000 bonus points each year after booking a hotel
  stay or car rental through the USAA Rewards Center. If you travel enough to
  use those perks, it pays for itself; otherwise a no fee card may serve you
  better.
