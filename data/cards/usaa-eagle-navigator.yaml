our_take: >
  The Eagle Navigator earns 2 points per dollar on everything and 3 points per
  dollar on travel and transit, a definition broad enough to include rideshare
  and tolls, so it holds up as an everyday card rather than a trip-only one.
  The signup bonus is 30,000 points after $3,000 in spending within three
  months, and there is no foreign transaction fee, which matters on a travel
  card. Recurring value comes from a $120 Global Entry or TSA PreCheck credit
  every four years and 10,000 bonus points each year for booking a hotel stay
  or car rental through the USAA Rewards Center, though that second one
  requires you to route a booking through USAA to collect it. The $95 annual
  fee is the hurdle for casual spenders, and it is waived entirely while you
  are on active duty, along with a reduced APR under the Servicemembers Civil
  Relief Act. That active duty carve-out is what tips the value calculation
  for the people this card is actually built for.
