our_take: >
  The Companion Fare is the reason to carry this one: a $99 fare plus taxes
  and fees from $23 each anniversary once you have spent $6,000 in the prior
  year, which is a straightforward way to clear the $95 annual fee if you fly
  Alaska or Hawaiian with someone. Bank of America recently raised the signup
  bonus from 50,000 points to 70,000 after $2,500 in three months, and it
  carries a Companion Fare of its own, so the opening offer is stronger than
  it was. Day to day the 3 points per dollar applies only to Alaska and
  Hawaiian Airlines purchases, and the 2 points per dollar categories of gas,
  EV charging, streaming and transit are useful but narrow, with everything
  else at 1 point per dollar. Free first checked bag and preferred boarding
  for you and up to six guests on the same reservation is the perk that
  quietly does the most work for families. It lands at #11 on our Best Travel
  Credit Cards list, and the reason it is not higher is simple: outside the
  Alaska and Hawaiian network there is not much here.
