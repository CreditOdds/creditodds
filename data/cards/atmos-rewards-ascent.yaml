our_take: >
  The Ascent is a solid pick for Alaska and Hawaiian Airlines flyers, mainly
  because of its annual $99 Companion Fare (plus taxes and fees from $23),
  which you earn each account anniversary after spending $6,000 in the prior
  year. It earns 3 points per dollar on Alaska and Hawaiian purchases and 2
  points on gas, EV charging, streaming, and transit, with a free first
  checked bag and preferred boarding for you and up to six guests on the same
  reservation. The welcome offer briefly rose from 50,000 to 70,000 points
  this summer before dropping back to 50,000 points after $1,500 in spend in
  three months, along with a $99 Companion Fare. The $95 annual fee is easy to
  recoup with the bag benefit alone if you fly these airlines with family, but
  the card offers little if you rarely fly them. It also appears on our list
  of best travel cards, though its value is tightly tied to one airline
  network.
