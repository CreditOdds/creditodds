our_take: >
  Chase recently raised the Premier Business bonus from 60,000 to 80,000
  points after $3,000 in spending in three months, making now a good time for
  a business owner who flies Southwest to apply. For a $149 annual fee you get
  6,000 anniversary points, a 15% flight discount code each year, a free first
  checked bag for you and up to eight passengers, and 10,000 Companion Pass
  qualifying points annually. Employee cards come at no extra cost. The catch
  is modest everyday earning: 3 points per dollar on Southwest, 2 on gas and
  restaurants up to a combined $8,000 a year, and 1 on everything else. It is
  a solid mid-tier pick for businesses with regular Southwest travel, but the
  rewards will not compete with a general business card for non-travel spend.
