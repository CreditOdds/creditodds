our_take: >
  For a small business that books Southwest, the Premier Business covers its
  $149 fee with predictable annual value: 6,000 anniversary points, a 15%
  flight promo code each cardmember year, 10,000 Companion Pass qualifying
  points, and a free first checked bag for the cardmember and up to eight
  passengers on the same reservation. The welcome offer is 60,000 points after
  $3,000 of spend in the first three months, a reachable target on most
  business budgets, and employee cards come at no extra cost with individual
  spending limits. Spending also drives status, at 2,000 tier qualifying
  points toward A-List for every $5,000 charged. The earn rates are the weak
  spot: 3 points per dollar on Southwest purchases, 2 points on gas and
  restaurants up to a combined $8,000 per year, and 1 point on everything
  else, so general business spend belongs on a different card. Worth noting
  that the 10,000 Companion Pass points count only toward the pass, not toward
  flight redemptions.
