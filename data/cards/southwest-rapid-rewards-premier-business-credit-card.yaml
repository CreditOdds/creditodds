our_take: >
  The Southwest Rapid Rewards Premier Business is a mid-tier business option
  at $149 a year, and its welcome offer recently rose from 60,000 to 80,000
  points after $3,000 in spending within three months. It earns 3 points per
  dollar on Southwest purchases and 2 points on gas and restaurants up to a
  combined $8,000 per year, with 1 point on everything else. Ongoing perks
  include 6,000 anniversary points, a 15% off promo code for one flight each
  year, a free first checked bag and Group 5 boarding for up to eight
  passengers, and 10,000 Companion Pass qualifying points annually. The catch
  is that the bonus categories are capped and narrow, so day-to-day business
  spending will mostly earn 1 point. For a small business that flies Southwest
  regularly, the bonus and baggage savings make it worth a look; for heavier
  travelers, the Performance Business adds more perks.
