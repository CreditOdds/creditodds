our_take: >
  The Robinhood Platinum stacks a long list of annual credits against its $695
  fee: up to $500 for hotels booked through the Robinhood Banking app, $300
  for travel, and $250 each for DoorDash, restaurants, and autonomous rides,
  plus unlimited Priority Pass lounge access and a complimentary WHOOP Peak
  membership. Earning is solid where it counts, with 5% back on dining, 10% on
  hotels and car rentals and 5% on flights booked through the Robinhood app,
  and no foreign transaction fees. The catch is that nearly all of that value
  depends on you actually using each credit, several of which are tied to
  Robinhood's own booking channel or specific merchants like DoorDash. Outside
  dining and the app, the card earns just 1%, which is weak for a card at this
  price. It makes sense if you already live in the Robinhood ecosystem and
  will naturally use the hotel, travel, and dining credits; if you would have
  to change your habits to chase them, the fee is hard to justify.

