our_take: >
  This is a financing card rather than a rewards card: 12 months of 0% intro
  APR on purchases, no annual fee, and a regular rate that starts at 13.74%,
  which is low for a business card. That combination fits a business funding
  startup costs, equipment, or inventory that wants a year to pay it down
  without interest, and the low ongoing floor keeps it usable if the payoff
  runs long. Be clear about the tradeoff, though: the card earns nothing at
  all, no cash back and no points, so every dollar you put on it is a dollar
  that would have earned something elsewhere. Free employee cards keep it
  workable for a small team, and the regular rate tops out at 22.74% depending
  on your credit. Open it for the 0% window and the low ongoing rate, then
  move routine spending to a card that pays you back.
