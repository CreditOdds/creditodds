our_take: >
  The Truist Business card is a straightforward financing tool: no annual fee,
  0% intro APR on purchases for 12 months, and a regular APR of 13.74% to
  22.74% once the intro period ends. That makes it a reasonable choice for a
  business that needs to spread out the cost of equipment or other upfront
  expenses over the first year. The tradeoff is that it earns no rewards at
  all, so every dollar you put on it after the intro window is a dollar that
  could be earning cash back on another card. Free employee cards are the only
  ongoing perk listed. Use it to finance purchases interest-free or as a
  lower-rate card for carrying a balance, not as an everyday spending card.
