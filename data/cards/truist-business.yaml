our_take: >
  The Truist Business card is a no-frills option built around a 0% intro APR
  on purchases for 12 months, with no annual fee. That makes it useful for a
  small business that needs to finance equipment or startup costs without
  paying interest for a year, and its regular APR range of 13.74% to 22.74% is
  on the lower side for business cards afterward. The tradeoff is that it
  earns no rewards at all, so there is no cash back or points to make it worth
  using once the intro period ends. Free employee cards are the only ongoing
  perk. Use it for the interest-free runway and a lower ongoing rate, and look
  elsewhere if you want your spending to earn anything.
