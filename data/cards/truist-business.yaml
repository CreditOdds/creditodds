our_take: >
  The Truist Business is a plain financing card: no annual fee, a 12-month 0%
  intro APR on purchases, and a regular APR starting at 13.74%, which is lower
  than most cards. That makes it a reasonable pick if your business needs to
  spread out a large purchase or wants a lower ongoing rate for carrying a
  balance. The tradeoff is that it earns no rewards at all, so there is no
  cash back or points to justify charging regular spending to it. Free
  employee cards are the only listed perk. Use it for the intro window or as a
  low-rate backstop, and keep a rewards card for everyday business spending.
