our_take: >
  The Strata Premier earns 3 points per dollar across an unusually wide set of
  everyday categories: dining, groceries, gas and EV charging, airlines, and
  hotels booked directly, for a $95 annual fee. Hotels, car rentals, and
  attractions booked through Citi Travel earn 10x, and the 60,000-point bonus
  after $4,000 in spend within 3 months is a solid start. The catch is the 1x
  base rate on everything outside those categories, and the $100 annual hotel
  credit only applies to a single stay of $500 or more booked through Citi
  Travel, so it will not offset the fee for everyone. With no foreign
  transaction fee, it works well as a primary card for households that spend
  heavily on food and gas.

