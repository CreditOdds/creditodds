our_take: >
  The Citi Strata Premier is one of the broadest 3x earners for a $95 annual
  fee, covering airlines, hotels booked directly, dining, groceries, and gas
  (including EV charging), plus 10x on hotels, car rentals, and attractions
  booked through Citi Travel. That spread is why it ranks #3 on our list of
  the best cards for dining and groceries and #5 for travel. The 60,000-point
  bonus after $4,000 in spend within 3 months is a strong start, and the
  annual $100 hotel credit can cover the fee on its own, though only on a
  single Citi Travel stay of $500 or more. The tradeoff is a 1x base rate on
  everything outside those categories, so it works best paired with a card
  that earns more on general spending. With no foreign transaction fees, it is
  an easy everyday pick for anyone whose budget leans on food, fuel, and
  travel.

