our_take: >
  The Strata Premier is a rare $95 travel card with a genuinely broad bonus
  structure: 3x on air travel, hotels booked directly, dining, groceries and
  gas including EV charging, which covers most of a normal month of spending.
  Add 10x on hotels, car rentals and attractions booked through Citi Travel
  plus a $100 credit on one hotel stay of $500 or more each year, and a single
  trip can cover the fee outright. The signup bonus is 60,000 points after
  $4,000 in three months, and there is no foreign transaction fee. The
  limitation is the 1x base rate, so anything outside those categories earns
  poorly and belongs on a flat rate card instead. It ranks #4 with the Best
  Value badge on our Best Travel Credit Cards list and #3 for dining and
  groceries, which is about right for what it charges.

