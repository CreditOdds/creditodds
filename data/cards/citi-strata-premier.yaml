our_take: >
  The Citi Strata Premier earns 3x points across a wide spread of everyday
  categories, including dining, groceries, gas and EV charging, airfare, and
  hotels booked directly, for a $95 annual fee. That breadth is why it ranks
  #3 on both our Best Credit Cards for Dining and Groceries and Best Travel
  Credit Cards lists. Hotels, car rentals, and attractions booked through Citi
  Travel jump to 10x, and the annual $100 hotel credit can offset most of the
  fee, though only on a single Citi Travel stay of $500 or more. The tradeoff
  is a 1x base rate on everything outside the bonus categories, so it works
  best as the card for your biggest spending categories rather than a
  catch-all. The current 60,000 point bonus after $4,000 in spend over three
  months adds a solid head start, and there is no foreign transaction fee.

