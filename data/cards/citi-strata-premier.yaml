our_take: >
  The Citi Strata Premier is one of the most well-rounded mid-tier travel
  cards available, earning 3x points on airlines, hotels booked directly,
  dining, groceries, and gas (including EV charging) for a $95 annual fee.
  That broad 3x spread covers most of a typical household budget, which is why
  it ranks #4 on our best travel cards list with a Best Value badge and #3 for
  dining and groceries. Bookings through Citi Travel earn 10x on hotels, car
  rentals, and attractions, and the $100 annual hotel credit on a single stay
  of $500 or more through the same portal can offset most of the fee if you
  take that kind of trip. The tradeoff is a weak 1x base rate on everything
  outside the bonus categories, so it works best paired with a flat-rate card.
  The 60,000-point bonus after $4,000 in spend over three months and no
  foreign transaction fee round out a strong everyday travel pick.

