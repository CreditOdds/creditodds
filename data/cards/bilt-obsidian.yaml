name: "Bilt Obsidian"
bank: "Bilt"
slug: "bilt-obsidian"
image: "bilt_obsidian.png"
accepting_applications: true
apply_link: https://www.biltrewards.com/card/apply
foreign_transaction_fee: false
network: "mastercard"
annual_fee: 95
reward_type: "points"
release_date: "2025-01-15"
our_take: >
  Obsidian is the version of the Bilt card worth paying for if you rent and
  spend meaningfully on food: $95 a year buys 3x on either dining or
  groceries, your choice once a year, plus 4x on Bilt Travel hotels, 3x on
  Bilt Travel flights, 2x on other travel, and 3x on Lyft. Rent still earns up
  to 1.25x with no transaction fee, and a $200 Bilt Cash award lands on
  approval with no minimum spend required, which is unusual. A $100 annual
  hotel credit, paid as two $50 statement credits on qualifying Bilt Travel
  bookings, chews through most of the fee if you book hotels that way. Watch
  the limits: the 3x category is capped at $25,000 a year before dropping to
  1x, the elevated Bilt Dining rate applies only at a limited restaurant
  network, and the rent multiplier depends on the housing track and your
  everyday spend each cycle. The intro rate is a fixed 10% for 12 billing
  cycles rather than 0%, and the ongoing APR of 26.74% to 34.74% means this
  only works if you pay in full.
benefits:
  - name: "Rent Payment Without Fees"
    value: 0
    description: "Pay rent with your credit card and earn points with no transaction fees"
    frequency: "ongoing"
    category: "other"
  - name: "Bilt Travel Hotel Credit"
    value: 100
    description: "Applied twice yearly as $50 statement credits for qualifying Bilt Travel Portal hotel bookings"
    frequency: "annual"
    category: "hotel"
    enrollment_required: false
tags:
  - rewards
  - travel
  - premium
rewards:
  - category: "selected_categories"
    value: 3
    unit: "points_per_dollar"
    choices: 1
    eligible_categories:
      - "dining"
      - "groceries"
    note: "Choose dining (default) or groceries as your 3x category annually (cap applies when groceries is selected). Earn up to 6x at participating Bilt Dining restaurants (limited network) when Dining is the selected category."
    spend_cap: 25000
    cap_period: annual
    rate_after_cap: 1
  - category: "hotels_portal"
    value: 4
    unit: "points_per_dollar"
    note: "Hotels booked through Bilt Travel"
  - category: "flights_portal"
    value: 3
    unit: "points_per_dollar"
    note: "Flights booked through Bilt Travel"
  - category: "travel"
    value: 2
    unit: "points_per_dollar"
    note: "Other travel not booked through Bilt Travel"
  - category: "transit"
    value: 3
    unit: "points_per_dollar"
    note: "On Lyft rides (after linking your Lyft account)"
    merchant_gate: [lyft]
  - category: "rent"
    value: 1.25
    unit: "points_per_dollar"
    note: "Up to 1.25x on rent and mortgage payments with no transaction fee, when the housing-only rewards track is selected. The exact multiplier is set each billing cycle from your everyday spend relative to the housing payment; on the Bilt Cash track housing earns up to 1x instead."
  - category: "everything_else"
    value: 1
    unit: "points_per_dollar"
apr:
