name: "Bilt Obsidian"
bank: "Bilt"
slug: "bilt-obsidian"
image: "bilt_obsidian.png"
accepting_applications: true
apply_link: https://www.biltrewards.com/card/apply
foreign_transaction_fee: false
network: "mastercard"
annual_fee: 95
reward_type: "points"
release_date: "2025-01-15"
our_take: >
  Obsidian is the $95 middle rung of the Bilt lineup, and the reason to pay
  that fee over the free Blue is the 3x category you choose each year: dining
  by default or groceries instead, up to $25,000 of annual spend before it
  drops to 1x, with up to 6x at participating Bilt Dining restaurants when
  dining is selected. Travel earns better here too, at 4x on hotels and 3x on
  flights through Bilt Travel, 2x on other travel, and 3x on Lyft rides after
  you link the account, with no foreign transaction fee. Rent and mortgage
  still pay with no transaction fee at up to 1.25x, though that rate only
  applies on the housing-only track and is reset each billing cycle from your
  everyday spend relative to the housing payment. The $100 hotel credit
  arrives as two separate $50 statement credits and only counts on qualifying
  Bilt Travel Portal bookings, so it is only worth the full amount if you book
  hotels there twice a year. A $200 Bilt Cash welcome award with no minimum
  spend covers the first year's fee on paper, but Bilt Cash spends inside
  Bilt's ecosystem, not in your bank account.
benefits:
  - name: "Rent Payment Without Fees"
    value: 0
    description: "Pay rent with your credit card and earn points with no transaction fees"
    frequency: "ongoing"
    category: "other"
  - name: "Bilt Travel Hotel Credit"
    value: 100
    description: "Applied twice yearly as $50 statement credits for qualifying Bilt Travel Portal hotel bookings"
    frequency: "annual"
    category: "hotel"
    enrollment_required: false
tags:
  - rewards
  - travel
  - premium
rewards:
  - category: "selected_categories"
    value: 3
    unit: "points_per_dollar"
    choices: 1
    eligible_categories:
      - "dining"
      - "groceries"
    note: "Choose dining (default) or groceries as your 3x category annually (cap applies when groceries is selected). Earn up to 6x at participating Bilt Dining restaurants (limited network) when Dining is the selected category."
    spend_cap: 25000
    cap_period: annual
    rate_after_cap: 1
  - category: "hotels_portal"
    value: 4
    unit: "points_per_dollar"
    note: "Hotels booked through Bilt Travel"
  - category: "flights_portal"
    value: 3
    unit: "points_per_dollar"
    note: "Flights booked through Bilt Travel"
  - category: "travel"
    value: 2
    unit: "points_per_dollar"
    note: "Other travel not booked through Bilt Travel"
  - category: "transit"
    value: 3
    unit: "points_per_dollar"
    note: "On Lyft rides (after linking your Lyft account)"
    merchant_gate: [lyft]
  - category: "rent"
    value: 1.25
    unit: "points_per_dollar"
    note: "Up to 1.25x on rent and mortgage payments with no transaction fee, when the housing-only rewards track is selected. The exact multiplier is set each billing cycle from your everyday spend relative to the housing payment; on the Bilt Cash track housing earns up to 1x instead."
  - category: "everything_else"
    value: 1
    unit: "points_per_dollar"
apr:
  purchase_intro:
    rate: 10.00
    months: 12
    note: "Low fixed 10% intro rate on new card purchases for the first 12 billing cycles (unusual: not a 0% intro)"
  regular:
    min: 26.74
    max: 34.74
signup_bonus:
