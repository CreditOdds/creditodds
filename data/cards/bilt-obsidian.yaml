name: "Bilt Obsidian"
bank: "Bilt"
slug: "bilt-obsidian"
image: "bilt_obsidian.png"
accepting_applications: true
apply_link: https://www.biltrewards.com/card/apply
foreign_transaction_fee: false
network: "mastercard"
annual_fee: 95
reward_type: "points"
release_date: "2025-01-15"
our_take: >
  The Bilt Obsidian is built for renters who also spend real money on food:
  you choose dining or groceries as a 3x category each year, keep the ability
  to pay rent or a mortgage with no transaction fee for up to 1.25x, and add
  4x on hotels and 3x on flights booked through Bilt Travel. The $95 annual
  fee is offset on paper by up to $100 a year in Bilt Travel hotel credits,
  issued as two $50 statement credits, plus a $200 Bilt Cash welcome bonus
  deposited on approval with no minimum spend. The tradeoffs are real, though.
  The 3x category is capped at $25,000 a year before dropping to 1x, everyday
  spend outside your chosen category earns only 1x, and the hotel credit only
  pays out if you book through Bilt's portal. The rent multiplier also floats
  each billing cycle based on your other spending, so heavy renters with light
  everyday spend may see less than the headline. Note too that the intro offer
  is a fixed 10% purchase APR for 12 billing cycles, not a 0% window.
benefits:
  - name: "Rent Payment Without Fees"
    value: 0
    description: "Pay rent with your credit card and earn points with no transaction fees"
    frequency: "ongoing"
    category: "other"
  - name: "Bilt Travel Hotel Credit"
    value: 100
    description: "Applied twice yearly as $50 statement credits for qualifying Bilt Travel Portal hotel bookings"
    frequency: "annual"
    category: "hotel"
    enrollment_required: false
tags:
  - rewards
  - travel
  - premium
rewards:
  - category: "selected_categories"
    value: 3
    unit: "points_per_dollar"
    choices: 1
    eligible_categories:
      - "dining"
      - "groceries"
    note: "Choose dining (default) or groceries as your 3x category annually (cap applies when groceries is selected). Earn up to 6x at participating Bilt Dining restaurants (limited network) when Dining is the selected category."
    spend_cap: 25000
    cap_period: annual
    rate_after_cap: 1
  - category: "hotels_portal"
    value: 4
    unit: "points_per_dollar"
    note: "Hotels booked through Bilt Travel"
  - category: "flights_portal"
    value: 3
    unit: "points_per_dollar"
    note: "Flights booked through Bilt Travel"
  - category: "travel"
    value: 2
    unit: "points_per_dollar"
    note: "Other travel not booked through Bilt Travel"
  - category: "transit"
    value: 3
    unit: "points_per_dollar"
    note: "On Lyft rides (after linking your Lyft account)"
    merchant_gate: [lyft]
  - category: "rent"
    value: 1.25
    unit: "points_per_dollar"
    note: "Up to 1.25x on rent and mortgage payments with no transaction fee, when the housing-only rewards track is selected. The exact multiplier is set each billing cycle from your everyday spend relative to the housing payment; on the Bilt Cash track housing earns up to 1x instead."
  - category: "everything_else"
    value: 1
    unit: "points_per_dollar"
apr:
  purchase_intro:
    rate: 10.00
    months: 12
    note: "Low fixed 10% intro rate on new card purchases for the first 12 billing cycles (unusual: not a 0% intro)"
  regular:
    min: 26.74
    max: 34.74
signup_bonus:
  value: 200
  type: "cash"
  spend_requirement: 0
  timeframe_months: 0
  note: "$200 in Bilt Cash deposited upon approval; no minimum spend required"
