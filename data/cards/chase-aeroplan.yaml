our_take: >
  The Air Canada Aeroplan card's biggest draw is automatic Aeroplan 25K status
  for as long as the account is open, which brings priority check-in and
  boarding, eUpgrade credits, and Star Alliance recognition, along with a free
  first checked bag for you and up to eight companions on the same Air Canada
  reservation. The welcome offer just rose to 115,000 points, structured as
  75,000 after $4,000 in 3 months plus 40,000 more after $20,000 in 12 months,
  but the same refresh doubled the annual fee from $95 to $195. Earning is
  solid, with 3x on travel and Air Canada purchases and 2x on dining and
  groceries, which earn 3x through December 31, 2026, and gas also earns 2x.
  Up to $100 a year in Air Canada statement credits, the FLY15OFF award
  discount, and a Global Entry, TSA PreCheck, or NEXUS credit help offset the
  higher fee. It makes sense if you fly Air Canada or Star Alliance regularly,
  but at $195 a year an occasional flyer will struggle to get enough value
  back.
