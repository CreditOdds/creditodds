our_take: >
  Chase recently reworked the Aeroplan card, raising the annual fee from $95
  to $195 while lifting the welcome offer from 60,000 to 115,000 points:
  75,000 after $4,000 in 3 months and another 40,000 after $20,000 in 12
  months. The strongest reason to carry it is automatic Aeroplan 25K status
  for as long as the account is open, along with a free first checked bag for
  you and up to eight others on the same Air Canada reservation and at least
  15% off eligible Air Canada award flights. Earning is solid at 3 points per
  dollar on Air Canada purchases, other travel, dining, and groceries, though
  dining and groceries drop to 2x after December 31, 2026, and everything else
  earns just 1x. Up to $100 a year in Air Canada statement credits helps
  offset the higher fee. If you fly Air Canada regularly, the status and bag
  benefits can easily justify the cost; if not, the $195 fee is hard to
  recoup.
