our_take: >
  The Air Canada Aeroplan card's strongest selling point is automatic Aeroplan
  25K status for as long as the account is open, which brings priority
  check-in and boarding, extra baggage allowance, and eUpgrade credits, plus a
  free first checked bag for you and up to eight companions on the same Air
  Canada reservation. Chase recently raised the annual fee from $95 to $195
  while lifting the welcome offer from 60,000 to 115,000 points, though the
  full bonus requires $20,000 in spend within 12 months, with 75,000 coming
  after $4,000 in the first 3 months. Ongoing perks include up to $100 a year
  in Air Canada statement credits split into two $50 halves, 15% off eligible
  Air Canada award flights, and up to $120 toward Global Entry, TSA PreCheck,
  or NEXUS. Earning is solid at 3x on travel and Air Canada purchases, but the
  3x on dining and groceries drops to 2x after December 31, 2026. It makes
  sense if you fly Air Canada or Star Alliance regularly; otherwise the higher
  fee is hard to justify.
