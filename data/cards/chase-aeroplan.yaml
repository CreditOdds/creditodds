our_take: >
  Chase reworked this card on September 11: the annual fee went from $95 to
  $195, and the signup bonus jumped from 60,000 to 115,000 points, structured
  as 75,000 after $4,000 of spend in the first 3 months plus 40,000 more after
  $20,000 in the first 12 months. The standing draw is automatic Aeroplan 25K
  status for as long as the account is open, a free first checked bag for you
  and up to eight passengers on the same Air Canada reservation, and at least
  15% off the points price of eligible Air Canada award flights. Earning is
  broad for an airline card: 3x on Air Canada purchases, 3x on other travel,
  2x on dining and groceries that runs at 3x on purchases posting through
  December 31, 2026, 2x on gas, and 1x on everything else, with no foreign
  transaction fees. Up to $100 a year in Air Canada statement credits, capped
  at $50 in each half of the calendar year, takes some sting out of the higher
  fee, but only if you actually fly Air Canada. At $195 with the perks pointed
  at one airline, this is now a card you have to use rather than simply hold
  for the status.
