intro: |
  Soothe is an on-demand wellness marketplace that sends licensed massage therapists, and in some cities estheticians, to your home or hotel, booked through soothe.com or its app with dynamic pricing by length and modality.

  Bookings are card-not-present service charges that rarely classify under any bonus category, so a flat 2 percent card is the workhorse. A membership subscription lowers the per-massage price more than any rewards rate will, so optimize the price first and the card second.
