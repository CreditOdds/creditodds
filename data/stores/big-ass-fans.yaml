intro: |
  Big Ass Fans makes oversized ceiling and portable fans, from the residential Haiku line to shop-grade air movers for garages and barns, sold direct from bigassfans.com. A residential fan is a mid-ticket purchase that codes as online retail, with some orders classifying under home improvement.

  For a one-time buy in the several-hundred-dollar range, the category gamble matters: Bank of America Customized Cash can take 3 percent whether you set it to online shopping or home improvement, while a Freedom Flex online-retail quarter at 5 percent is the best case if your timing lines up.
