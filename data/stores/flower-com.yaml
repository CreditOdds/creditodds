intro: |
  Flower.com is an online florist network delivering same-day bouquets, plants, and gift baskets through local partner shops nationwide, competing with 1-800-Flowers on price for birthdays, sympathy arrangements, and holidays. Orders code as online retail or florist services.

  Flower spend spikes at Valentine's Day and Mother's Day, so a Freedom Flex quarter that covers online retail in that window is a 5 percent win. Otherwise this is classic Customized Cash online-shopping territory at 3 percent, and a flat 2 percent card handles the sympathy order you did not plan for.
