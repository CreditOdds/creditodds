intro: |
  Capezio has outfitted dancers since 1887, making ballet slippers, pointe shoes, tights, and dancewear that studios put on their required lists every fall. Direct orders from capezio.com code as online clothing retail, and dance families reorder constantly as kids grow through sizes.

  Recital and back-to-studio season concentrates the spend, so a Freedom Flex quarter covering online retail hits 5 percent on the big replacement order, while Bank of America Customized Cash set to online shopping keeps mid-year size swaps at 3 percent.
