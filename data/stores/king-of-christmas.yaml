intro: |
  King of Christmas sells premium artificial Christmas trees, wreaths, and garlands direct from kingofchristmas.com, competing with Balsam Hill on realism at a lower price point. A flocked eight-footer is a multi-hundred-dollar purchase most households make once a decade.

  Tree buying concentrates in October and November, squarely inside Chase Freedom Flex's fourth-quarter categories in many years, which turns a big tree into 5 percent back. Otherwise Bank of America Customized Cash set to online shopping earns a dependable 3 percent, and off-season clearance in January is the value play.
