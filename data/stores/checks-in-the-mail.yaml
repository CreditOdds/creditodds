intro: |
  Checks In The Mail prints personal and business cheques, deposit slips, cheque
  registers, and related accessories, ordered online and shipped direct. Business cheque
  orders in particular can run to a few hundred dollars.

  Cheque printing normally codes as an office-supply or general online purchase depending
  on the processor. If you hold a card paying a bonus on office supplies, try it here
  first; otherwise a flat-rate cashback card is the dependable option. Worth noting that
  ordering cheques is a purchase of printed goods — it does not code as a cash-equivalent
  transaction the way buying money orders or gift cards can.
