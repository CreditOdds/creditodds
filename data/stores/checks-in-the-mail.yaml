intro: |
  Checks In The Mail prints personal and business checks, deposit slips, check
  registers, and related accessories, ordered online and shipped direct. Business check
  orders in particular can run to a few hundred dollars.

  Check printing normally codes as an office-supply or general online purchase depending
  on the processor. If you hold a card paying a bonus on office supplies, try it here
  first; otherwise a flat-rate cashback card is the dependable option. Worth noting that
  ordering checks is a purchase of printed goods; it does not code as a cash-equivalent
  transaction the way buying money orders or gift cards can.
