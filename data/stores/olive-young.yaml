intro: |
  OLIVE YOUNG is Korea's dominant health-and-beauty chain, and its global site ships the K-beauty brands that fill its Seoul stores, from COSRX to Torriden, direct to US shoppers with frequent sitewide sales. Orders from global.oliveyoung.com code as online retail.

  Orders ship from Korea, so a no-foreign-transaction-fee card is the first filter in case the charge settles abroad. From there, K-beauty hauls are classic online-shopping category spend: Customized Cash at 3 percent always, Freedom Flex at 5 percent in an online-retail quarter.
