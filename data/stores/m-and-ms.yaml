intro: |
  M&M'S sells personalized and bulk candy direct at mms.com: printed candy for weddings,
  parties, and corporate gifts, plus branded merchandise. Personalized orders carry a
  premium over supermarket packs.

  Buying candy online from the brand codes as online retail, not groceries, so a card with
  a grocery bonus will not help here. An online shopping bonus or flat-rate cashback card
  is the right call. For a large party or corporate order, check the free shipping
  threshold first, since it tends to be worth more than any category bonus on an order this
  size.
