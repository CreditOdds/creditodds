intro: |
  Stumptown is the Portland roaster that helped define third-wave coffee, and its web store ships whole-bean subscriptions, cold brew, and brew gear from stumptowncoffee.com. Its cafes code as dining, while web orders code as online retail.

  A bean subscription is textbook recurring online spend for a Customized Cash set to online shopping at 3 percent. Orders at the cafes themselves land in the dining bucket instead, where an Amex Gold's 4x or any dining card outearns every online category.
