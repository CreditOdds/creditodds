intro: |
  E-Z UP invented the pop-up canopy and still sells the instant shelters you see at farmers markets, tailgates, and youth tournaments, plus custom-printed canopies for small businesses, direct from ezup.com. Orders code as online retail, with some charges classifying under sporting goods.

  A canopy is a once-every-few-years purchase in the low hundreds: U.S. Bank Cash+ with sporting-goods selected reaches 5 percent if the charge lands there, and Bank of America Customized Cash set to online shopping is the reliable 3 percent for a custom-print order.
