intro: |
  Felix Gray sells blue-light-filtering computer glasses, prescription eyewear, and sleep glasses direct from felixgray.com, positioning itself as the screen-time eyewear brand for office workers. Orders code as online retail, and prescription pairs are FSA and HSA eligible.

  Before reaching for rewards, spend FSA or HSA dollars here if you have them, since pre-tax beats any cashback. Paying out of pocket, Bank of America Customized Cash set to online shopping earns 3 percent, and a Freedom Flex online-retail quarter covers a two-pair order at 5 percent.
