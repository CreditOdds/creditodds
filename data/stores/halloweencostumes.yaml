intro: |
  HalloweenCostumes.com sells costumes, accessories, and decor year-round, with the
  overwhelming majority of its volume landing in the weeks before 31 October. Group and
  family costume orders can add up quickly.

  Costume orders are ordinary online retail. A card with an online shopping bonus is the
  best fit, and this is one of the clearer cases for a rotating-category card: several
  issuers put online retail or department stores in their Q4 bonus period, which lines up
  almost exactly with when you would be buying. Order early in the quarter if your card
  has a spending cap on the bonus.
