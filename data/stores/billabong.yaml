intro: |
  Billabong is the Australian surf brand behind boardshorts, wetsuits, and beach apparel, now part of the same group as Quiksilver and Roxy. US orders from billabong.com code as online clothing retail, and the brand runs a deep sale section between seasonal drops.

  Apparel here follows the standard playbook: a Freedom Flex quarter covering online retail or department stores hits 5 percent, and Bank of America Customized Cash set to online shopping is the reliable 3 percent for wetsuit or holiday orders outside the quarter.
