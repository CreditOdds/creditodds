intro: |
  Better World Books sells used and new books online and funds global literacy programs with every order, reselling library discards and donated titles with free US shipping. It is the biggest social-enterprise bookseller on the web, and orders from betterworldbooks.com code as online retail.

  Book orders here are small and frequent rather than big-ticket, which favors an always-on rate over quarter-chasing: Bank of America Customized Cash set to online shopping earns 3 percent, and a flat 2 percent card covers gift-heavy months without any category management.
