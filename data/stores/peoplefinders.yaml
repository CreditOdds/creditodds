intro: |
  PeopleFinders is a people-search service offering background reports, reverse phone
  lookups, and public-records searches, sold mainly as a recurring monthly subscription
  rather than per report.

  Subscriptions here code as a general online purchase, so a flat-rate cashback card or
  one with an online shopping bonus is the straightforward choice. Because the billing
  recurs automatically, it is worth putting on a card you monitor, and worth setting a
  reminder, since search subscriptions are among the easier ones to forget about after the
  question that prompted the signup has been answered.
