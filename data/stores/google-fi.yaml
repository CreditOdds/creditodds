intro: |
  Google Fi Wireless is Google's phone carrier, sold online and billed monthly
  through a Google account. It runs on T-Mobile's network in the US and is
  popular with travelers for plans that include international data. There is no
  Google Fi co-brand credit card, so the best angle is a card that earns an
  elevated rate on phone or cell-phone-provider purchases, or a flat-rate
  cashback card if no phone category applies.
