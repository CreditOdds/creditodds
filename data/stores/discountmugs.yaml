intro: |
  DiscountMugs prints custom mugs, water bottles, pens, tote bags, and event swag in bulk, serving weddings, fundraisers, and small businesses that need a few hundred branded pieces at a low unit price. Orders are produced to spec and ship from discountmugs.com, coding as online retail or printing services.

  Bulk swag orders are exactly the kind of lumpy business spend that belongs on a business card: Chase Ink Business Cash covers office-supply-classified charges at 5 percent, and an Ink Unlimited or other flat 2 percent card is the fallback when the charge codes as generic online retail.
