intro: |
  The Oodie is the Australian brand that turned the oversized wearable blanket into a gifting phenomenon, selling hooded blanket-hoodies, sleep tees, and weighted blankets from theoodie.com in constant multi-buy bundle deals.

  Oodie spend is almost entirely Q4 gifting, which lines up with Chase Freedom Flex's holiday-quarter categories for 5 percent when online retail is included. Outside the quarter, a Customized Cash set to online shopping earns 3 percent, and the bundle discounts stack on top of whatever card you use.
