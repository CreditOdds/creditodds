intro: |
  STDCheck sells private STD lab testing: you order a panel online, walk into one of 4,500 partner labs the same day, and get results in a day or two without an insurance claim on file. Charges from stdcheck.com code as lab or online services.

  Testing here is HSA and FSA eligible, and pre-tax dollars beat any cashback rate, so use those funds first. Paying out of pocket, lab charges rarely hit a bonus category, making a flat 2 percent card the practical choice, and the discreet billing descriptor is part of what you are paying for.
