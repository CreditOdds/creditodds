intro: |
  Totes is the umbrella and cold-weather accessories brand found at every department-store checkout, selling umbrellas, rain boots, and winter slippers direct from totes.com under the same corporate roof as Isotoner.

  These are small-ticket practical purchases that cluster before winter and gift season: a Freedom Flex quarter covering online retail or department stores in Q4 reaches 5 percent, and a Customized Cash set to online shopping earns a steady 3 percent on the direct site year-round.
