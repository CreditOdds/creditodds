intro: |
  ArtToFrames is a Brooklyn-based custom framing shop that cuts made-to-order picture frames, mats, and canvas prints in thousands of size and finish combinations, at prices well below strip-mall framers. Orders are produced to spec and ship from arttoframes.com, coding as online retail.

  Framing projects tend to cluster, a gallery wall or a move means several frames at once, so time the batch to a Chase Freedom Flex online-retail quarter for 5 percent, or fall back to a Bank of America Customized Cash set to online shopping at 3 percent.
