intro: |
  QuickBooks is Intuit's small-business accounting platform, sold mostly as a monthly or
  annual subscription covering bookkeeping, invoicing, payroll, and payment processing.
  Most customers pay by card on a recurring plan rather than a one-off purchase.

  Software subscriptions almost never map to a bonus category, so QuickBooks normally
  codes as a general business or online purchase. A flat-rate cashback card is the
  simplest fit, and a business card earning a bonus on software or office spending can do
  better if your issuer lists that category. Because the charge recurs monthly, it is also
  a reliable way to keep a card active or to chip away at a welcome-offer spending
  requirement.
