intro: |
  Vantrue makes dash cams, from single-lens commuters to three-channel rideshare setups with cabin recording, sold direct from vantrue.net. Rideshare drivers are the core customer, and orders code as online electronics retail.

  For a working driver a dash cam is a business expense, so a business card with an electronics-friendly category fits; otherwise U.S. Bank Cash+ with electronics stores selected reaches 5 percent when the charge classifies there, with Customized Cash online shopping at 3 percent as the fallback.
