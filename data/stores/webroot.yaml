intro: |
  Webroot sells lightweight cloud-based antivirus and identity protection subscriptions for consumers and small offices, billed annually from webroot.com. The charge is a recurring digital-services subscription that renews at a higher price than the intro rate.

  Security subscriptions almost never land in a card bonus category, so a flat 2 percent card is the sensible default, or a Customized Cash set to online shopping at 3 percent when the charge codes as online retail. The bigger lever is re-buying at the intro price rather than letting auto-renew reprice you.
