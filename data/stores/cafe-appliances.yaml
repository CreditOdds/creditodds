intro: |
  Café is GE Appliances' customizable premium line, selling matte-finish ranges, wall ovens, refrigerators, and dishwashers with swappable brushed-brass and copper hardware direct from cafeappliances.com, with delivery and haul-away arranged through GE's network.

  An appliance order here runs from several hundred dollars to five figures for a kitchen suite, so treat it as bonus-qualifying spend first: a new card's signup bonus usually beats any category rate. Otherwise a flat 2 percent card is the floor, and direct orders that code as online retail can catch Customized Cash at 3 percent.
