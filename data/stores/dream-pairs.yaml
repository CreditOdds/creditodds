intro: |
  Dream Pairs sells value-priced footwear online, alongside sister brands Bruno Marc for
  men's dress and casual shoes, Nortiv 8 for hiking and work boots, and Allswift for
  performance sneakers. All four ship direct from the same operation.

  Shoe orders code as clothing or general online retail depending on the processor. A card
  paying a bonus on select clothing or online shopping fits best; otherwise a flat-rate
  card is fine. Prices here are low enough that the category bonus matters less than free
  shipping thresholds, so consolidating an order to clear the shipping minimum usually
  saves more than the rewards difference.
