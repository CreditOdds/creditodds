intro: |
  Splash Wines is a family-run online wine club shipping curated 6-to-15-bottle cases at aggressive intro pricing, with flexible subscriptions that let you skip or re-curate each shipment from splashwines.com.

  Wine shipments code as online retail rather than liquor stores, which works in your favor: a Bank of America Customized Cash set to online shopping earns 3 percent on every case, and stacking a Freedom Flex online-retail quarter over a holiday case order reaches 5 percent. Check your state's direct-shipping rules before subscribing.
