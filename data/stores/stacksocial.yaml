intro: |
  StackSocial sells deep-discount lifetime software licenses, online course bundles, and refurbished gadgets, the source of those "lifetime cloud storage for $89" deals that circulate every few months. Purchases from stacksocial.com code as online retail.

  Deal-site spending is impulse-shaped and small-ticket, so an always-on rate fits best: Customized Cash set to online shopping earns 3 percent, and a flat 2 percent card covers it with zero thought. Lifetime-deal fine print matters more than the rewards rate here, so read redemption terms before checkout.
