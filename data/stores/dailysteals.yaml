intro: |
  DailySteals is a daily-deals retailer moving overstock and refurbished electronics, home goods, and gadget accessories at steep markdowns, with inventory that rotates out in days. Orders from dailysteals.com code as online retail.

  Deal-site buys are small and opportunistic, so an always-on rate suits them: Customized Cash set to online shopping earns 3 percent without planning. Refurb warranties here are short, so paying with a card that extends manufacturer warranties matters more than squeezing an extra point of cashback.
