intro: |
  LensDirect sells contact lenses, prescription glasses, and its Lens Replacement service that puts new prescription lenses in frames you already own, shipping from lensdirect.com with aggressive subscription discounts on contacts.

  Contacts are FSA and HSA eligible, so pre-tax dollars come first. Out of pocket, a contacts subscription is steady recurring spend for a Bank of America Customized Cash set to online shopping at 3 percent, and an annual-supply purchase is worth timing to a Freedom Flex online-retail quarter for 5 percent.
