intro: |
  EconomyBookings is a car-rental broker comparing rates across 175 countries, often surfacing local suppliers well below the majors' counters. You prepay the booking at economybookings.com and the charge typically codes as travel or car rental.

  Broker prepayments usually earn travel-category rates: Chase Sapphire Preferred at 2x, Reserve at 3x, and Capital One Venture X's 2x everywhere. One caution outranks rewards here: broker rentals often exclude the primary rental coverage some premium cards provide, so confirm your card's rental collision terms cover third-party bookings before declining the counter's insurance.
