intro: |
  Norma Kamali is the designer label behind the sleeping-bag coat and decades of swim and jersey pieces, sold direct from normakamali.com. Orders code as online clothing retail, and the brand runs a strong archive-sale cadence between collections.

  Designer orders are lumpy spend: a coat-sized charge suits a signup-bonus push, while a Bank of America Customized Cash set to online shopping earns 3 percent on swim-season restocks and a Freedom Flex online-retail quarter lifts a sale haul to 5 percent.
