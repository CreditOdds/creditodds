intro: |
  Renogy sells DIY solar: panels, charge controllers, batteries, and complete kits for RVs, vans, and off-grid cabins, direct from renogy.com. A full van-build kit is a four-figure order, and charges code as online retail or home improvement.

  Solar kits are ideal signup-bonus spend given the order size. Failing that, Bank of America Customized Cash pays 3 percent whether set to online shopping or home improvement, letting you match whichever way Renogy's processor classifies the charge.
