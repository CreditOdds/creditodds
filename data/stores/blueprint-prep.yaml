intro: |
  Blueprint Prep sells test-prep courses and tutoring for the LSAT, MCAT, and nursing and medical board exams, from self-paced subscriptions to live online classes running well over a thousand dollars. Enrollment is a card-not-present education charge from blueprintprep.com that most issuers bucket as online services.

  A course purchase is a single large charge, which makes it ideal spend toward a signup bonus. Absent a bonus to hit, a flat 2 percent card beats guessing categories, since education services rarely land in a 5 percent bucket.
