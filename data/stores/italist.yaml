intro: |
  Italist is a luxury-fashion marketplace that ships current-season designer clothing, bags, and shoes from Italian boutiques directly to US shoppers, often 20 to 30 percent below US retail because of the boutique sourcing. Orders from italist.com code as online retail, and duties are included at checkout.

  Luxury orders here are large single charges, ideal for working toward a signup bonus or an elevated everywhere rate. Note that boutique shipments come from Italy, so use a card with no foreign transaction fee if your issuer processes the charge abroad, though most italist charges settle in USD.
