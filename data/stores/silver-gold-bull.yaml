intro: |
  Silver Gold Bull is an online bullion dealer selling gold and silver coins and bars,
  including sovereign mint products like Canadian Maple Leafs, shipped direct to buyers or
  held in storage.

  Read the payment terms carefully before reaching for a rewards card. Bullion dealers
  frequently add a surcharge on card payments and steer buyers toward bank transfer, and
  some card issuers treat precious-metals purchases as a cash-equivalent transaction,
  which means a cash-advance fee and interest from day one rather than any rewards.
  Confirm both how the dealer surcharges and how your issuer codes bullion before assuming
  a card purchase earns anything.
