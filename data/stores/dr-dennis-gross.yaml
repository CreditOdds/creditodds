intro: |
  Dr. Dennis Gross Skincare is the dermatologist-founded brand behind the Alpha Beta peel pads and the SpectraLite LED masks, sold direct from drdennisgross.com alongside Sephora and Dermstore. Direct orders code as online retail and skew toward auto-replenished peel refills plus the occasional big LED-device purchase.

  Put the recurring refills on a Bank of America Customized Cash set to online shopping for 3 percent, and hold a device purchase, which can run several hundred dollars, for a Freedom Flex online-retail quarter at 5 percent or a signup-bonus push.
