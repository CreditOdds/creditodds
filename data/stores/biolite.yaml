intro: |
  BioLite makes off-grid energy gear for campers and emergency kits: wood-burning stoves that charge your phone, solar panels, headlamps, and power stations, sold direct from bioliteenergy.com with part of revenue funding clean-cooking programs in Africa.

  Direct orders usually code as online retail, though outdoor gear can classify as sporting goods. U.S. Bank Cash+ with sporting-goods selected reaches 5 percent when it does, and Bank of America Customized Cash set to online shopping is the safer 3 percent for a power-station-sized purchase.
