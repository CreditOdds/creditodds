intro: |
  Free Country makes value-priced outerwear, the puffers, softshells, and swim cover-ups long stocked by Costco and department stores, and sells its full line direct from freecountry.com. Direct orders code as online clothing retail.

  Outerwear spend clusters in fall: a Chase Freedom Flex quarter covering online retail or department stores turns a family jacket order into 5 percent, and a Customized Cash set to online shopping earns 3 percent on off-season clearance, which is where this brand's pricing gets genuinely cheap.
