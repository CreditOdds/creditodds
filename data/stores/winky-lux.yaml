intro: |
  Winky Lux makes playful, Instagram-native makeup, flower-embedded lip balms, coffee-scented bronzer, and skincare in collectible packaging, sold direct from winkylux.com and through Target. Direct orders code as online retail.

  The basket is small and giftable, so steady beats optimal: a Customized Cash set to online shopping earns 3 percent on direct orders, holiday sets in a Freedom Flex online-retail quarter reach 5 percent, and picking up the Target-stocked items on a RedCard run earns a flat 5 percent instead.
