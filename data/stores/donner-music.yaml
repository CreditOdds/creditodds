intro: |
  Donner makes budget-friendly musical instruments and gear, from guitar pedals and digital pianos to drum kits and ukuleles, sold direct from donnermusic.com at a fraction of legacy-brand prices. It has become the default first-instrument brand for beginners buying online.

  Instrument orders code as online retail, so Bank of America Customized Cash set to online shopping earns 3 percent on a starter piano, and a Chase Freedom Flex online-retail quarter turns a bundle purchase into 5 percent. There is no co-brand card angle here, just clean category spend.
