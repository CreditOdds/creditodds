intro: |
  Sullen Clothing is the tattoo-culture apparel brand collaborating with ink artists on tees, hats, and art series drops, sold direct from sullenclothing.com and at conventions. Direct orders code as online clothing retail.

  Drop-based buying is impulse-timed, so an always-on rate fits: Customized Cash set to online shopping earns 3 percent on every drop, and a Freedom Flex online-retail quarter reaches 5 percent when a collab lands inside one. Convention-booth purchases code as retail instead, where a flat 2 percent card does the work.
