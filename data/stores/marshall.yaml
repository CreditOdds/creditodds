intro: |
  Marshall sells headphones, earbuds, and Bluetooth speakers styled after the company's
  guitar amplifiers, sold direct from marshallheadphones.com alongside the usual
  electronics retailers. Orders are straightforward online consumer electronics purchases.

  There is no Marshall co-brand card, so the right play is whichever card pays most on
  online shopping or electronics. A rotating-category card can beat a flat-rate one when
  electronics or online retail comes up in the quarter, and because headphones and
  speakers sit at a price point where warranties matter, a card carrying extended warranty
  or purchase protection is worth more here than the extra point or two.
