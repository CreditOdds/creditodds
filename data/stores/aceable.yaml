intro: |
  Aceable runs online licensing and education courses — drivers ed and defensive driving
  under Aceable, real-estate pre-licensing under AceableAgent, and exam prep under
  PrepAgent. Courses are bought online as one-off purchases or bundles.

  Online course providers code as general online purchases, not education, so a
  tuition-specific perk will not apply. A card with an online shopping bonus or a solid
  flat rate is the sensible choice. If you are taking a real-estate pre-licensing bundle,
  the total can run into the hundreds, which makes it a useful charge to park on a card
  you are working toward a welcome bonus on.
