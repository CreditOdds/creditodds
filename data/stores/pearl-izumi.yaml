intro: |
  PEARL iZUMi has made cycling apparel since 1950, and its bib shorts, jerseys, and shoes are the default kit recommendation in most bike shops. Direct orders from pearlizumi.com code as sporting goods or online retail.

  Kit replacement comes in seasonal waves: U.S. Bank Cash+ with sporting goods selected hits 5 percent when the charge classifies under sporting goods, and Bank of America Customized Cash set to online shopping is the reliable 3 percent when a bib order codes as plain online retail.
