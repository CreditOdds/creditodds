intro: |
  TWOPAGES makes made-to-measure curtains and drapery hardware to spec, the online custom-workroom alternative interior designers recommend between big-box ready-mades and to-the-trade pricing. Orders from twopagescurtains.com are sewn to order and code as online retail.

  A whole-room custom order lands in the mid hundreds: time it to a Freedom Flex online-retail quarter for 5 percent, or use a Customized Cash set to online shopping at 3 percent. Measure twice before ordering, since made-to-measure goods have limited return windows.
