intro: |
  Half Price Drapes sells ready-made and custom curtains, roman shades, and hardware direct from halfpricedrapes.com, with a made-to-order workroom for odd sizes at prices far below designer showrooms. Orders code as online retail.

  Window treatments get bought a whole house at a time, so the order lands in the hundreds: time it to a Chase Freedom Flex online-retail quarter for 5 percent, or use a Bank of America Customized Cash set to online shopping for 3 percent when the quarter does not cooperate.
