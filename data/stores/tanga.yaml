intro: |
  Tanga is a long-running daily-deals site selling overstock electronics, home goods, apparel, and the occasional oddball lot at closeout prices, with free shipping baked into most listings on tanga.com. Orders code as online retail.

  Like all deal sites the baskets are small and sporadic, so skip the category planning: a Customized Cash set to online shopping earns 3 percent on whatever the day's deal is, and a flat 2 percent card is a fine zero-thought fallback. Check seller ratings on marketplace listings before assuming Tanga fulfills the order itself.
