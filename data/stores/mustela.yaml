intro: |
  Mustela is a French baby-skincare brand whose gentle cleansers, diaper creams, and maternity oils have been pediatrician-office staples for decades. US orders ship from mustelausa.com and code as online retail, though the same products sit on drugstore and Target shelves.

  Baby-care restocking is steady repeat spend: direct orders fit a Bank of America Customized Cash set to online shopping at 3 percent, while buying the same products at a drugstore instead lets a Chase Freedom Flex drugstore quarter or an everyday drugstore category card do better.
