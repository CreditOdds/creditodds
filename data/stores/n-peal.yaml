intro: |
  N.Peal is a London cashmere house selling sweaters, scarves, and the polo necks it famously supplied to the James Bond films, shipping to the US from npeal.com. A single sweater runs several hundred dollars, coding as online clothing retail.

  Because the London shipper can settle charges outside the US, use a card with no foreign transaction fee to be safe. Beyond that, luxury knitwear is a good signup-bonus vehicle, and a Freedom Flex online-retail quarter at 5 percent beats any flat rate when the timing works.
