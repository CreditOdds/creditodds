intro: |
  APMEX is one of the largest online dealers of gold, silver, platinum, and collectible coins in the US, selling everything from single American Eagles to monster boxes at prices tied to live spot markets. Card orders carry a premium over the wire price and some card issuers treat bullion purchases restrictively, so check terms before a large buy.

  Because bullion margins are thin, APMEX charges more for card payment than for checks or wires, which usually eats any rewards. If you do pay by card for speed, a flat 2 percent card is the sensible cap, and never expect a metals purchase to count toward a bonus category.
