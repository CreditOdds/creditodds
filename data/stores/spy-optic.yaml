intro: |
  SPY Optic makes sunglasses and snow goggles with its Happy Lens tint, a So-Cal action-sports brand worn on mountains and job sites alike. Direct orders from spyoptic.com code as online retail, with some charges classifying as sporting goods.

  Goggle season concentrates the spend in fall: a Freedom Flex online-retail quarter lifts a goggle-and-lens order to 5 percent, U.S. Bank Cash+ with sporting goods selected can match it when the charge classifies that way, and Customized Cash online shopping holds 3 percent otherwise.
