intro: |
  Bulletproof is the brand that popularized butter coffee, selling its coffee beans, MCT and Brain Octane oils, collagen protein, and supplements direct from bulletproof.com, mostly on subscribe-and-save reorders. Direct orders code as online retail rather than groceries, even though it is pantry spend.

  For recurring subscriptions, a steady rate wins: Bank of America Customized Cash set to online shopping earns 3 percent every month, and a Freedom Flex online-retail quarter is the moment to prepay or stock up at 5 percent. Buying Bulletproof products at a grocery store instead unlocks Amex Blue Cash Preferred's 6 percent.
