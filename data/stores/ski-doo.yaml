intro: |
  Ski-Doo is BRP's snowmobile brand, and its online store sells the riding gear, helmets, and OEM parts and accessories that owners order between dealer visits. Gear orders from ski-doo.com code as sporting goods or online retail; the sleds themselves are dealer purchases.

  Pre-season gear-up is the spend spike: U.S. Bank Cash+ with sporting goods selected reaches 5 percent when charges classify there, and a Customized Cash set to online shopping earns 3 percent on a parts order that codes as generic retail.
