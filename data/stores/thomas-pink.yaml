intro: |
  Thomas Pink is the Jermyn Street shirtmaker behind sharply tailored dress shirts and the pink twill that made its name, relaunched direct-to-consumer at thomaspink.com. US orders code as online clothing retail.

  Shirt wardrobes get rebuilt a few at a time, and multi-shirt bundles push the order into the hundreds: a Freedom Flex online-retail quarter lifts that to 5 percent, while Customized Cash set to online shopping earns 3 percent on a single-shirt top-up. UK-routed charges argue for a no-foreign-fee card as a precaution.
