intro: |
  Amorepacific is the flagship luxury line of the Korean beauty giant of the same name, selling green-tea-based serums, cushion foundations, and anti-aging sets direct from us.amorepacific.com. Orders ship from its US web store and code as online retail rather than a department-store or drugstore purchase.

  Premium K-beauty routines mean repeat orders, so a Bank of America Customized Cash set to online shopping at 3 percent is the steady play, and a Chase Freedom Flex online-retail quarter is the time to stock up on full-size replenishments at 5 percent.
