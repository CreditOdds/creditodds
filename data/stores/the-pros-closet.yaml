intro: |
  The Pro's Closet is the largest online used-bike retailer in the US, selling certified pre-owned road, gravel, and mountain bikes with inspection reports and a 30-day return window from theproscloset.com. It also buys and takes trade-ins.

  A used carbon bike is a four-figure charge that codes as sporting goods or online retail: work it toward a signup bonus, or lean on U.S. Bank Cash+ with sporting goods selected for 5 percent when the classification cooperates. Trade-in credit reduces the charge, so decide on the trade before choosing the card.
