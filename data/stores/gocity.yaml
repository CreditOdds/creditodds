intro: |
  Go City sells all-inclusive and build-your-own sightseeing passes for 30-plus destinations, bundling attractions like the Empire State Building or the London Eye at up to half the gate price. Passes are bought online at gocity.com before the trip and typically code as travel or attractions.

  Because pass purchases often classify as travel, the travel-card multipliers apply: Chase Sapphire Preferred earns 2x and Reserve 3x, and Capital One Venture X's flat 2x covers a pass that codes as ticketing instead. Buy the pass with the same card you want the trip's protections on.
