intro: |
  Setapp is a subscription that unlocks 240-plus paid Mac and iOS apps, from CleanMyMac to Ulysses, for one monthly fee, billed by MacPaw from setapp.com. The charge is a recurring digital-services subscription.

  Software subscriptions rarely land in a bonus category, so the goal is a solid always-on rate: a flat 2 percent card or a Customized Cash set to online shopping at 3 percent if the charge codes as online retail. Prepaying the annual plan trims the price further and concentrates the charge for bonus-spend windows.
