# Benefit policy for the weekly card-rewards-and-benefits checker.
#
# When the LLM extracts a proposed benefit from an issuer's apply page, this
# file decides whether to (a) auto-PR it, (b) surface it for manual review, or
# (c) skip silently. See scripts/check-card-rewards-and-benefits.js.
#
# Match is case-insensitive substring on the proposed benefit name (or the
# `match:` patterns where given). Update this list as taste evolves; the system
# is opinionated by design — we never auto-add the kinds of "benefits" the team
# has consistently removed by hand.

# ────────────────────────────────────────────────────────────────────────────
# 1. Skip silently — never propose adding these as a benefit.
#
# These are network-tier perks, federal-law standards, generic platform
# features, financing tools, or "redemption mechanics" that describe how
# rewards work rather than being card-specific perks.
# ────────────────────────────────────────────────────────────────────────────
exclude:
  # Network-tier perks (every Visa Signature / World Elite Mastercard has these)
  - "Visa Signature Concierge"
  - "Visa Infinite Concierge"
  - "Mastercard World Elite Benefits"
  - "World Elite Mastercard"
  - "Visa Signature Luxury Hotel Collection"

  # Federal-law standards (all credit cards have these)
  - "$0 Fraud Liability"
  - "Zero Fraud Liability"
  - "0 Liability"
  - "Fraud Liability Protection"
  - "Fraud Protection"

  # Issuer platform features available to all the issuer's cardholders
  - "Eno Virtual Card Numbers"
  - "Eno Virtual"
  - "CreditWise"
  - "TripIt Pro"
  - "Citi Quick Lock"
  - "Mastercard ID Theft Protection"

  # Financing features (these belong in the `apr` section if anywhere)
  - "Pay Over Time"
  - "Plan It"
  - "ExtendPay Plan"
  - "Chase Pay Over Time"
  - "0% intro APR on Disney Vacations"
  - "0% APR on Disney Vacations"
  - "Citi Flex Pay"                 # buy-now-pay-later financing feature
  - "Flex Pay"
  - "My Chase Plan"

  # Redemption mechanics — describes how rewards are earned/redeemed,
  # not a perk you "get" from holding the card
  - "Points Payback"
  - "Disney Rewards Dollars"
  - "AAdvantage Loyalty Points"
  - "10% Points Back on Award Flights"
  - "Real-Time Rewards"
  - "Cash-Back Deals"
  - "Ultimate Rewards Transfer Bonus"
  - "Points Transfer Partners"      # describes the transfer network, not a perk
  - "Transfer Partners"
  - "Pay with Miles"                # specific Delta-style miles-for-flights mechanic
  - "Pay with Miles Discount"
  - "MileagePlus Pay with Points"
  - "Cash + Points"                 # TrueBlue-style "pay with combo of cash and points"
  - "Cash and Points"
  - "Pay with Points"               # generic "use points toward purchases" mechanic
  - "Flexible Rewards Redemption"   # every cashback card has statement credit/gift card/deposit options
  - "Flexible Redemption"
  - "Rewards Redemption Options"
  - "Redemption Options"
  - "Multiple Redemption Options"
  - "Rotating Bonus"                # rotating category earn rates belong in rewards[]
  - "Rotating Category Bonus"
  - "Limited-Time Bonus Categories"
  - "Limited-Time Offers"           # rotating promo offers vary item-to-item
  - "Limited Time Offers"
  - "Special Limited-Time Offers"

  # Standard travel/purchase insurance coverage.
  #
  # These sat in `borderline` for months, which meant every apply page that
  # mentions them regenerated the same manual-decision item every week. They
  # were declined in four consecutive review issues (#1636, #1666, #1731,
  # #1743) and made up the ENTIRE borderline bucket of #1743's queue (15 of
  # 15 items). The reason they keep getting declined is structural: the
  # benefit model is built on a concrete annual dollar value, and insurance
  # coverage has an expected value of roughly zero in a typical year. A
  # "$10,000 trip cancellation" line would be modeled as $10,000 of value.
  #
  # This only stops the checker from PROPOSING them. Cards that already
  # carry these benefits keep them.
  - "Trip Cancellation/Interruption Insurance"
  - "Trip Cancellation"
  - "Trip Interruption Insurance"
  - "Trip Delay Reimbursement"
  - "Trip Delay Insurance"
  - "Auto Rental Coverage"
  - "Auto Rental Collision Damage Waiver"
  - "Primary Auto Rental Coverage"
  - "Car Rental Loss & Damage Insurance"
  - "Worldwide Car Rental Insurance"
  - "Rental Car Insurance"
  - "Car Rental Insurance"
  - "Purchase Protection"
  # The rest of the same class. These were left behind when the block above
  # was moved out of `borderline`, so they kept regenerating a weekly
  # manual-decision item (Atmos Rewards Business "Travel Accident Insurance"
  # in issue #1774) despite the same reasoning applying to all of them.
  - "Travel Accident Insurance"
  # Issuers name this one inconsistently, and matching is substring-based, so
  # "Insurance" alone does not cover "Coverage". PenFed Power Cash Rewards
  # auto-PRed a "$250,000 Travel Accident Coverage" line through this gap
  # (PR #2088).
  - "Travel Accident Coverage"
  - "Travel Accident Protection"
  - "Travel & Emergency Assistance"
  - "Travel and Emergency Assistance"
  - "Extended Warranty"
  - "Extended Warranty Protection"
  - "Return Protection"
  - "Price Protection"
  - "Roadside Assistance"
  - "Emergency Evacuation"
  - "Emergency Medical"
  - "Lost Luggage Reimbursement"
  - "Lost Baggage Reimbursement"
  - "Lost Baggage"
  - "Baggage Delay Insurance"
  - "Baggage Insurance Plan"
  - "Global Assist Hotline"
  - "Premium Global Assist Hotline"

  # Generic business-card platform features (not card-differentiators)
  - "Free Employee Cards"
  - "Employee Cards"
  - "Year-End Spending Summary"
  - "Vendor Pay by Bill.com"
  - "Vendor Pay"
  - "Expanded Buying Power"
  - "Amex Offers"

  # Misc network/platform features
  - "Group 5 Boarding"   # (Southwest's; default boarding group, not a perk)
  - "Roadside Dispatch"
  - "Emergency Cash Disbursement"
  - "Emergency Cash"
  - "Emergency Card Replacement"
  - "Card Replacement"

  # Card-feature-not-a-benefit. These describe HOW the card works, not a
  # monetary perk you get from holding it. The team has consistently called
  # these out as noise — "benefits are free things you get with VALUE, not
  # just a feature of the card."
  - "Paperless Statements"
  - "Paperless Statement"
  - "Digital Statements"
  - "Online Statements"
  - "eStatements"
  - "No Annual Fee"               # belongs in `annual_fee:`, not benefits[]
  - "$0 Annual Fee"
  - "No Foreign Transaction Fee"  # belongs in `foreign_transaction_fee:`
  - "No Foreign Transaction Fees"
  - "Foreign Transaction Fee"     # the field, never a benefit
  - "Mobile Wallet"
  - "Digital Wallet"
  - "Apple Pay"
  - "Google Pay"
  - "Samsung Pay"
  - "Contactless Payment"
  - "Contactless Pay"
  - "Tap to Pay"
  - "Card Design"
  - "Custom Card Design"
  - "Account Alerts"
  - "Account Manager"
  - "Online Banking"
  - "Mobile Banking"
  - "Mobile App"
  - "Autopay"
  - "Auto Pay"
  - "Online Bill Pay"
  - "Bill Pay"
  - "Refer-a-Friend"
  - "Refer a Friend"
  - "Referral Bonus"                # active recruiting, not a passive benefit
  - "Refer Friends Bonus"
  - "Refer Friends"
  - "Friend Referral"
  - "Automatic Payments Statement Credit"   # one-time enrollment carrot
  - "Autopay Enrollment Credit"
  - "DisneyStore.com Discount"      # store discount, not a free perk
  - "DisneyStore Discount"
  - "Disney Park Merchandise Discount"
  - "Disney Park Dining Discount"
  - "Disney Guided Tour Discount"
  - "The Cultivist Membership Discount"  # discount on a paid membership

  # Issuer-platform "deals" portals — available to all cardholders of that
  # issuer, not card-specific perks. Treated like Amex Offers.
  - "My Wells Fargo Deals"
  - "Wells Fargo Deals"
  - "Chase Offers"
  - "BankAmeriDeals"
  - "Bank of America Deals"
  - "Citi Merchant Offers"
  - "Citi Easy Deals"
  - "Capital One Offers"
  - "Capital One Shopping"
  - "Card Exclusives"          # vague platform-tier marketing perks
  - "Cardmember Exclusives"
  - "Autograph Card Exclusives"
  - "Visa Savings Edge"

  # Credit-monitoring / FICO — available platform-wide on most issuers'
  # apps; not a card-specific perk.
  - "Credit Close-Up"
  - "FICO Score"
  - "Free FICO Score"
  - "FICO Score Access"
  - "Credit Score"
  - "Credit Score Monitoring"
  - "Credit Monitoring"
  - "Free Credit Score"

  # Pay-per-visit lounge programs are not benefits — if you pay to enter
  # the lounge it isn't free, it's just a referral. (Free unlimited Priority
  # Pass, on the other hand, is a real benefit and stays.)
  - "LoungeKey"
  - "LoungeKey Pass"
  - "Pay-as-you-go Lounge"
  - "Pay-Per-Visit Lounge"

  # Welcome/signup bonus belongs in `signup_bonus:`, not `benefits[]`
  - "Welcome Bonus"
  - "Welcome Offer"
  - "Sign-Up Bonus"
  - "Signup Bonus"
  - "New Cardmember Bonus"
  - "New Cardmember Offer"
  - "New Account Bonus"
  - "Introductory Bonus"

# ────────────────────────────────────────────────────────────────────────────
# 2. Borderline — surface in the weekly review issue, do NOT auto-PR.
#
# These are real benefits but are generic Visa/Mastercard "protections" that
# the team has gone both ways on. We log them in the summary so a human can
# decide on a case-by-case basis whether they belong on a given card.
# ────────────────────────────────────────────────────────────────────────────
borderline: []
  # Deliberately empty.
  #
  # This list used to hold the standard travel/purchase insurance names, and
  # its note claimed they had all been moved into `exclude` above. Eight had
  # not been: Extended Warranty, Travel Accident Insurance, Travel & Emergency
  # Assistance, Roadside Assistance, Return Protection, Emergency Evacuation,
  # Emergency Medical, Price Protection. So the note read as done while the
  # queue kept regenerating them — Atmos Rewards Business "Travel Accident
  # Insurance" in issue #1774 was one. They are now all in `exclude`, and the
  # migration this note described is actually finished.
  #
  # Leaving an item borderline means re-litigating it every single week, so
  # add one only when the team genuinely wants a recurring manual decision.
  # If the team decides to start modeling insurance coverage, move the names
  # back here in one edit.

# ────────────────────────────────────────────────────────────────────────────
# 3. Auto-PR — anything not matched above is eligible for an auto-PR.
#
# The extractor is also given a few-shot example showing what "good" looks
# like (pulled at runtime from a hand-picked list of cards), which is why
# there's no explicit `include:` list here — anything that isn't excluded
# or borderline is presumed to be a real card-specific perk worth proposing.
# ────────────────────────────────────────────────────────────────────────────

# Cards used as few-shot examples in the extractor prompt. Their current
# YAML is the ground truth for "what level of granularity I want".
example_cards:
  - chase-sapphire-preferred
  - jetblue-plus-card
  - disney-premier-visa-card
  - wells-fargo-choice-privileges-select-mastercard
  - atmos-rewards-summit
