version: 1
applications:
  - frontend:
      phases:
        preBuild:
          commands:
            # Install dependencies from repo root (monorepo with workspaces)
            # Use subshell to preserve working directory
            - (cd ../.. && npm ci)
            # data/cards.json is gitignored (generated, not committed), so build
            # it here — card/[name]/page.tsx reads it at build time for the
            # benefits fallback. Regenerating also keeps it fresh vs. the old
            # stale committed copy.
            - (cd ../.. && npm run build:cards)
        build:
          commands:
            - env | grep -e NEXT_PUBLIC_ >> .env.production || true
            - npm run build
            # Amplify caps the SSR build output at 220 MB and we hit it from
            # content growth. sharp ships a 9 MB wasm32 build that it only
            # loads if the native linux-x64 binary fails, so drop it after the
            # build, before Amplify traces node_modules into the compute bundle.
            # Safe for caching: preBuild runs a fresh `npm ci` every time.
            - rm -rf ../../node_modules/@img/sharp-wasm32
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
          - .next/cache/**/*
          - ../../node_modules/**/*
    appRoot: apps/web-next
