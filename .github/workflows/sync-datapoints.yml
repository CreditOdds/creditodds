name: Sync Reddit Data Points

# Imports human-approved Reddit data points into the records table whenever a
# merge touches data/reddit-datapoints/ (i.e. an auto-datapoints-* review PR
# was accepted). The full directory is sent every run; the Lambda skips rows
# whose reddit:<source_id> already exists, so re-runs are safe.

on:
  push:
    branches:
      - main
    paths:
      - 'data/reddit-datapoints/**'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build import payload
        run: node scripts/build-datapoints-payload.js

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::953352003729:role/GitHubActions-CreditOdds
          aws-region: us-east-1

      - name: Import data points to database
        run: |
          aws lambda invoke \
            --region us-east-1 \
            --function-name creditodds-import-reddit-records \
            --payload file://.datapoints-payload.json \
            --cli-binary-format raw-in-base64-out \
            response.json
          echo "Lambda response envelope:"
          cat response.json
          # The handler returns an API-Gateway-style envelope {statusCode, body}
          # where body is a JSON string, so parse both layers.
          node -e "
            const fs = require('fs');
            const r = JSON.parse(fs.readFileSync('response.json', 'utf8'));
            if (r.statusCode !== 200) { console.error('Import failed with status', r.statusCode); process.exit(1); }
            const b = JSON.parse(r.body || '{}');
            console.log('Imported:', b.imported, 'Skipped (already imported):', b.skipped);
            if ((b.errors || []).length > 0) {
              console.error('Per-record errors:', JSON.stringify(b.errors, null, 2));
              process.exit(1);
            }
          "
