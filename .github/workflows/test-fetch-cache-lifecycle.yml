name: Test Fetch Cache Lifecycle

on:
  pull_request:
    paths:
      - 'apps/web-next/**'
      - '.nvmrc'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/test-fetch-cache-lifecycle.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  cache-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - run: npm test --workspace=@creditodds/web-next
      - run: npm run test:cache-lifecycle --workspace=@creditodds/web-next
